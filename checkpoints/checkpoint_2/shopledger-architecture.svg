<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
<title id="title">ShopLedger application architecture</title><desc id="desc">ShopLedger UI, Express routes, application modules, configuration, JSON data store, and the successful order placement flow including conditional Khata billing.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#52647a"/></marker><marker id="bluearrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#2563eb"/></marker><style>
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#17253b}.title{font-size:32px;font-weight:750}.sub{font-size:15px;fill:#52647a}.section{font-size:17px;font-weight:700;letter-spacing:.06em;fill:#42536a}.label{font-size:15px;font-weight:700}.small{font-size:12px;fill:#52647a}.tiny{font-size:11px;fill:#52647a}.box{fill:#fff;stroke:#b9c7d8;stroke-width:1.5}.ui{fill:#eef6ff;stroke:#7ba7dd}.route{fill:#f1f5ff;stroke:#8ca5db}.module{fill:#f0faf6;stroke:#80b6a0}.store{fill:#fff7e9;stroke:#d2a253}.cfg{fill:#f8f2ff;stroke:#aa8acb}.flow{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#bluearrow)}.edge{fill:none;stroke:#52647a;stroke-width:1.8;marker-end:url(#arrow)}.dashed{stroke-dasharray:6 5}.lane{fill:#f8fafc;stroke:#dbe3ed;stroke-width:1.2}
</style></defs>
<rect width="1600" height="1120" fill="#f4f7fb"/><text x="54" y="58" class="title">ShopLedger · application architecture</text><text x="56" y="86" class="sub">Express app · browser UI · file-backed JSON store · order placement path</text>
<!-- main order journey -->
<rect x="42" y="112" width="1516" height="350" rx="18" class="lane"/><text x="66" y="144" class="section">ORDER PLACEMENT · successful POST /api/orders path</text>
<rect x="70" y="190" width="230" height="106" rx="12" class="ui"/><text x="90" y="220" class="label">Browser UI</text><text x="90" y="244" class="small">public/index.html · public/js/app.js</text><text x="90" y="267" class="small">cart + customer + payment + coupon</text>
<rect x="358" y="190" width="230" height="106" rx="12" class="route"/><text x="378" y="220" class="label">routes/orders.js</text><text x="378" y="244" class="small">POST /orders</text><text x="378" y="267" class="small">validate input + coordinate order</text>
<rect x="648" y="178" width="270" height="130" rx="12" class="module"/><text x="668" y="208" class="label">Order checks + totals</text><text x="668" y="234" class="small">inventory.js · check sellable stock</text><text x="668" y="256" class="small">coupons.js · validate coupon</text><text x="668" y="278" class="small">pricing.js → tax.js · compute totals</text>
<rect x="978" y="178" width="230" height="130" rx="12" class="module"/><text x="998" y="208" class="label">Order + ledger</text><text x="998" y="234" class="small">orders.js · add order</text><text x="998" y="256" class="small">ledger.js · conditional Khata debit</text><text x="998" y="278" class="small">inventory.js · reduce stock</text>
<rect x="1265" y="190" width="235" height="106" rx="12" class="store"/><text x="1285" y="220" class="label">lib/store.js</text><text x="1285" y="244" class="small">read · append audit · write</text><text x="1285" y="267" class="small">data/db.json</text>
<path d="M300 243H350" class="flow"/><text x="307" y="228" class="tiny">JSON POST</text><path d="M588 243H640" class="flow"/><text x="594" y="228" class="tiny">items + coupon</text><path d="M918 243H970" class="flow"/><text x="924" y="228" class="tiny">valid + totals</text><path d="M1208 243H1257" class="flow"/><text x="1211" y="228" class="tiny">order + stock + audit</text>
<rect x="358" y="335" width="230" height="82" rx="11" class="module"/><text x="378" y="364" class="label">Khata branch</text><text x="378" y="388" class="small">paymentMode === "khata"</text>
<path d="M472 296V327" class="flow"/><text x="481" y="320" class="tiny">if Khata</text><path d="M588 376H738V316" class="edge"/><text x="604" y="364" class="tiny">requires customerId; ledger limit check</text>
<path d="M1382 190V164H185V182" class="edge dashed"/><text x="812" y="158" class="tiny">201 order response · UI clears cart, refreshes products / totals / customers</text>
<!-- app wiring and files -->
<text x="54" y="510" class="section">SERVER · server.js registers these routers at /api</text>
<rect x="54" y="530" width="360" height="222" rx="14" class="lane"/><text x="74" y="562" class="label">routes/</text>
<rect x="74" y="580" width="320" height="34" rx="8" class="route"/><text x="88" y="602" class="small">products.js · /products · /coupons</text>
<rect x="74" y="622" width="320" height="34" rx="8" class="route"/><text x="88" y="644" class="small">orders.js · /orders · create · cancel</text>
<rect x="74" y="664" width="320" height="34" rx="8" class="route"/><text x="88" y="686" class="small">customers.js · /customers · settle</text>
<rect x="74" y="706" width="320" height="34" rx="8" class="route"/><text x="88" y="728" class="small">reports.js · /reports · /pricing/preview</text>
<rect x="450" y="530" width="710" height="352" rx="14" class="lane"/><text x="470" y="562" class="label">lib/</text>
<rect x="470" y="580" width="210" height="56" rx="9" class="module"/><text x="484" y="605" class="label">orders.js</text><text x="484" y="624" class="tiny">add · get · list · cancel</text>
<rect x="700" y="580" width="210" height="56" rx="9" class="module"/><text x="714" y="605" class="label">inventory.js</text><text x="714" y="624" class="tiny">find · stock check · reserve</text>
<rect x="930" y="580" width="210" height="56" rx="9" class="module"/><text x="944" y="605" class="label">pricing.js</text><text x="944" y="624" class="tiny">subtotal · discount · totals</text>
<rect x="470" y="650" width="210" height="56" rx="9" class="module"/><text x="484" y="675" class="label">coupons.js</text><text x="484" y="694" class="tiny">normalize · validate · discount</text>
<rect x="700" y="650" width="210" height="56" rx="9" class="module"/><text x="714" y="675" class="label">tax.js</text><text x="714" y="694" class="tiny">HSN rate · CGST / SGST</text>
<rect x="930" y="650" width="210" height="56" rx="9" class="module"/><text x="944" y="675" class="label">ledger.js</text><text x="944" y="694" class="tiny">customer balance · Khata</text>
<rect x="470" y="720" width="210" height="56" rx="9" class="module"/><text x="484" y="745" class="label">store.js</text><text x="484" y="764" class="tiny">read / write db.json · audit</text>
<rect x="700" y="720" width="210" height="56" rx="9" class="module"/><text x="714" y="745" class="label">dates.js</text><text x="714" y="764" class="tiny">date helpers</text>
<rect x="930" y="720" width="210" height="56" rx="9" class="module"/><text x="944" y="745" class="label">reports.js</text><text x="944" y="764" class="tiny">report calculations</text>
<rect x="470" y="790" width="210" height="56" rx="9" class="module"/><text x="484" y="815" class="label">invoice.js</text><text x="484" y="834" class="tiny">render order invoice</text>
<rect x="1210" y="530" width="340" height="152" rx="14" class="lane"/><text x="1230" y="562" class="label">Application files</text>
<rect x="1230" y="580" width="300" height="38" rx="8" class="cfg"/><text x="1244" y="605" class="small">config.js · port · shop · tax · coupons</text>
<rect x="1230" y="630" width="300" height="38" rx="8" class="store"/><text x="1244" y="655" class="small">data/db.json · products · orders · customers</text>
<path d="M1158 600H1196V649H1222" class="edge"/><text x="1167" y="590" class="tiny">route calls store.read / write</text>
<path d="M910 678H920" class="edge"/><path d="M680 608H692" class="edge"/><path d="M910 678H920" class="edge"/>
<!-- supporting assets / entry -->
<rect x="54" y="790" width="360" height="92" rx="14" class="lane"/><text x="74" y="822" class="label">UI assets</text><text x="74" y="849" class="small">public/index.html · public/js/app.js · public/css/style.css</text>
<rect x="1210" y="710" width="340" height="172" rx="14" class="lane"/><text x="1230" y="742" class="label">server.js</text><text x="1230" y="768" class="small">Express · JSON body parser · static public/</text><text x="1230" y="792" class="small">mounts 4 routers under /api</text><text x="1230" y="816" class="small">GET /orders/:id/invoice → invoice.render</text><text x="1230" y="850" class="tiny">config.js supplies listen port</text>
<text x="54" y="950" class="section">ORDER PATH DETAILS</text>
<rect x="54" y="972" width="1496" height="104" rx="14" fill="#fff" stroke="#dbe3ed"/>
<text x="78" y="1005" class="small">1 · UI posts selected items, customer, payment mode, status and coupon.</text><text x="78" y="1034" class="small">2 · Route reads db.json; resolves product IDs; checks stock; validates coupon; computes subtotal, discount, GST and total.</text><text x="78" y="1063" class="small">3 · For Khata, ledger checks customer credit limit and records debit. Route reduces stock, adds order + audit, writes db.json, then returns 201.</text>
</svg>
