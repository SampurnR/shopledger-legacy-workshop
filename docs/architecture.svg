<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1190" viewBox="0 0 1800 1190" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Architecture map of ShopLedger showing the browser UI, Express server, all route and library modules, configuration, JSON data store, and the sequence for placing an order.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#eef3f9"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#123451"/><stop offset="1" stop-color="#1d5c76"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#19324b" flood-opacity=".09"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#6e879c"/></marker>
    <marker id="blueArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#2476b8"/></marker>
    <style>
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#17324a}
      .title{font-size:34px;font-weight:750;letter-spacing:-.6px;fill:#fff}.subtitle{font-size:15px;fill:#c8d9e7}
      .section{font-size:13px;font-weight:750;letter-spacing:1.6px;fill:#638096}
      .group{fill:#fff;stroke:#d7e1eb;stroke-width:1.3;rx:18;filter:url(#shadow)}
      .heading{font-size:18px;font-weight:750}.small{font-size:12px;fill:#60778a}.body{font-size:13px;fill:#456074}
      .node{fill:#f8fbfd;stroke:#d9e5ee;stroke-width:1.1;rx:11}.nodeTitle{font-size:14px;font-weight:700}.nodeText{font-size:11.5px;fill:#60778a}
      .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:700;fill:#254b66}
      .connector{fill:none;stroke:#7990a4;stroke-width:2;marker-end:url(#arrow)}
      .connectorDash{fill:none;stroke:#93a8b8;stroke-width:1.7;stroke-dasharray:6 6;marker-end:url(#arrow)}
      .flowPanel{fill:#fff;stroke:#d7e1eb;stroke-width:1.3;rx:18;filter:url(#shadow)}
      .step{fill:#f5faff;stroke:#c9deed;stroke-width:1.2;rx:13}.stepTitle{font-size:13px;font-weight:750}.stepText{font-size:11.5px;fill:#5c7489}
      .num{fill:#2476b8}.numText{font-size:12px;font-weight:800;fill:#fff;text-anchor:middle}
      .flowArrow{fill:none;stroke:#2476b8;stroke-width:2.4;marker-end:url(#blueArrow)}
      .tag{font-size:10px;font-weight:700;letter-spacing:.6px;fill:#2476b8}
    </style>
  </defs>
  <rect width="1800" height="1190" fill="url(#bg)"/>
  <rect x="0" y="0" width="1800" height="105" fill="url(#hero)"/>
  <text x="48" y="49" class="title">ShopLedger · Application Architecture</text>
  <text x="50" y="77" class="subtitle">Browser point of sale · Express API · business modules · JSON file storage</text>
  <text x="1750" y="55" text-anchor="end" class="subtitle">Architecture &amp; order placement</text>

  <text x="42" y="137" class="section">APPLICATION MAP</text>

  <!-- Group-to-group architecture connections, placed behind the nodes. -->
  <path d="M275 342H305" class="connector"/>
  <path d="M515 342H545" class="connector"/>
  <path d="M945 342H975" class="connector"/>
  <path d="M1415 342H1445" class="connector"/>
  <text x="279" y="326" class="small">HTTP</text>
  <text x="520" y="326" class="small">mounts</text>
  <text x="949" y="326" class="small">calls</text>

  <!-- Browser UI -->
  <rect x="35" y="158" width="240" height="510" class="group"/>
  <text x="58" y="193" class="heading">Browser UI</text>
  <text x="58" y="215" class="small">public/</text>
  <rect x="55" y="237" width="200" height="95" class="node"/>
  <text x="72" y="264" class="nodeTitle">index.html</text>
  <text x="72" y="286" class="nodeText">POS · Order History</text>
  <text x="72" y="304" class="nodeText">Khata · Inventory &amp; GST Audit</text>
  <rect x="55" y="345" width="200" height="105" class="node"/>
  <text x="72" y="372" class="nodeTitle">js/app.js</text>
  <text x="72" y="394" class="nodeText">XHR requests and UI updates</text>
  <text x="72" y="412" class="nodeText">Cart preview · submits orders</text>
  <rect x="55" y="463" width="200" height="72" class="node"/>
  <text x="72" y="491" class="nodeTitle">css/style.css</text>
  <text x="72" y="513" class="nodeText">Page styling</text>
  <text x="58" y="589" class="small">Static assets served by Express</text>

  <!-- Express entry point -->
  <rect x="305" y="158" width="210" height="510" class="group"/>
  <text x="328" y="193" class="heading">Express app</text>
  <text x="328" y="215" class="small">server.js</text>
  <rect x="325" y="237" width="170" height="88" class="node"/>
  <text x="342" y="264" class="nodeTitle">Static frontend</text>
  <text x="342" y="286" class="nodeText">public/</text>
  <rect x="325" y="338" width="170" height="116" class="node"/>
  <text x="342" y="365" class="nodeTitle">API routers</text>
  <text x="342" y="388" class="nodeText">mounted at /api</text>
  <text x="342" y="407" class="nodeText">invoice route: /orders/:id/invoice</text>
  <text x="328" y="494" class="small">PORT defaults to 3000</text>

  <!-- Route modules -->
  <rect x="545" y="158" width="400" height="510" class="group"/>
  <text x="570" y="193" class="heading">Routers · routes/</text>
  <text x="570" y="215" class="small">Express endpoints, mounted by server.js</text>
  <rect x="567" y="237" width="356" height="85" class="node"/>
  <text x="585" y="264" class="code">orders.js</text>
  <text x="585" y="286" class="nodeText">POST /orders · list/get · cancel</text>
  <rect x="567" y="334" width="356" height="73" class="node"/>
  <text x="585" y="361" class="code">products.js</text>
  <text x="585" y="384" class="nodeText">GET /products · GET /coupons</text>
  <rect x="567" y="419" width="356" height="73" class="node"/>
  <text x="585" y="446" class="code">customers.js</text>
  <text x="585" y="469" class="nodeText">GET /customers · POST settlement</text>
  <rect x="567" y="504" width="356" height="90" class="node"/>
  <text x="585" y="531" class="code">reports.js</text>
  <text x="585" y="554" class="nodeText">Dashboard · GST reconciliation</text>
  <text x="585" y="572" class="nodeText">Pricing preview · admin export</text>

  <!-- Library modules -->
  <rect x="975" y="158" width="440" height="510" class="group"/>
  <text x="1000" y="193" class="heading">Business modules · lib/</text>
  <text x="1000" y="215" class="small">Rules and operations used by routes and server</text>
  <rect x="997" y="237" width="190" height="72" class="node"/>
  <text x="1013" y="263" class="code">orders.js</text><text x="1013" y="286" class="nodeText">Create · cancel · query</text>
  <rect x="1198" y="237" width="195" height="72" class="node"/>
  <text x="1214" y="263" class="code">inventory.js</text><text x="1214" y="286" class="nodeText">Stock check · reserve · release</text>
  <rect x="997" y="321" width="190" height="72" class="node"/>
  <text x="1013" y="347" class="code">pricing.js</text><text x="1013" y="370" class="nodeText">Subtotal · totals · GST lines</text>
  <rect x="1198" y="321" width="195" height="72" class="node"/>
  <text x="1214" y="347" class="code">coupons.js</text><text x="1214" y="370" class="nodeText">Normalize · validate · discount</text>
  <rect x="997" y="405" width="190" height="72" class="node"/>
  <text x="1013" y="431" class="code">tax.js</text><text x="1013" y="454" class="nodeText">HSN rates · CGST/SGST split</text>
  <rect x="1198" y="405" width="195" height="72" class="node"/>
  <text x="1214" y="431" class="code">ledger.js</text><text x="1214" y="454" class="nodeText">Khata · customer settlements</text>
  <rect x="997" y="489" width="190" height="72" class="node"/>
  <text x="1013" y="515" class="code">reports.js</text><text x="1013" y="538" class="nodeText">Dashboard · GST comparison</text>
  <rect x="1198" y="489" width="195" height="72" class="node"/>
  <text x="1214" y="515" class="code">invoice.js</text><text x="1214" y="538" class="nodeText">Printable HTML invoice</text>
  <rect x="997" y="573" width="190" height="72" class="node"/>
  <text x="1013" y="599" class="code">dates.js</text><text x="1013" y="622" class="nodeText">Date formatting and keys</text>
  <rect x="1198" y="573" width="195" height="72" class="node"/>
  <text x="1214" y="599" class="code">store.js</text><text x="1214" y="622" class="nodeText">Read/write JSON · audit log</text>

  <!-- Configuration and persistent data -->
  <rect x="1445" y="158" width="320" height="510" class="group"/>
  <text x="1470" y="193" class="heading">Settings &amp; data</text>
  <rect x="1467" y="223" width="276" height="174" class="node"/>
  <text x="1485" y="252" class="code">config.js</text>
  <text x="1485" y="277" class="nodeText">Shop details · admin key</text>
  <text x="1485" y="298" class="nodeText">Tax rates · inventory defaults</text>
  <text x="1485" y="319" class="nodeText">Coupon definitions</text>
  <text x="1485" y="361" class="small">Used by tax, coupons, inventory, invoice</text>
  <rect x="1467" y="418" width="276" height="174" class="node"/>
  <text x="1485" y="447" class="code">data/db.json</text>
  <text x="1485" y="472" class="nodeText">Products · orders · customers</text>
  <text x="1485" y="493" class="nodeText">Settlements · audit log · ID counters</text>
  <text x="1485" y="535" class="small">Loaded and saved by lib/store.js</text>

  <!-- Valid dependencies: configuration and JSON store -->
  <path d="M1393 433H1422V310H1467" class="connectorDash"/>
  <path d="M1393 609H1422V505H1467" class="connector"/>
  <text x="1399" y="293" class="small">reads settings</text>
  <text x="1398" y="490" class="small">read/write</text>

  <!-- Order placement sequence -->
  <rect x="35" y="710" width="1730" height="438" class="flowPanel"/>
  <text x="62" y="752" class="heading">Order placement flow</text>
  <text x="62" y="776" class="small">POST /api/orders · validations and totals are computed on the server</text>
  <text x="1725" y="752" text-anchor="end" class="tag">NUMBERED REQUEST PATH</text>

  <!-- Top row of flow nodes -->
  <rect x="62" y="812" width="216" height="117" class="step"/>
  <circle cx="84" cy="834" r="13" class="num"/><text x="84" y="838" class="numText">1</text>
  <text x="106" y="839" class="stepTitle">POS gathers cart</text>
  <text x="80" y="869" class="stepText">Items, quantities, customer,</text><text x="80" y="888" class="stepText">payment, status and coupon</text>
  <text x="80" y="912" class="tag">public/js/app.js</text>

  <path d="M278 870H303" class="flowArrow"/>
  <rect x="309" y="812" width="216" height="117" class="step"/>
  <circle cx="331" cy="834" r="13" class="num"/><text x="331" y="838" class="numText">2</text>
  <text x="353" y="839" class="stepTitle">Order route resolves</text>
  <text x="327" y="869" class="stepText">POST /orders looks up products</text><text x="327" y="888" class="stepText">and builds trusted line items</text>
  <text x="327" y="912" class="tag">routes/orders.js</text>

  <path d="M525 870H550" class="flowArrow"/>
  <rect x="556" y="812" width="216" height="117" class="step"/>
  <circle cx="578" cy="834" r="13" class="num"/><text x="578" y="838" class="numText">3</text>
  <text x="600" y="839" class="stepTitle">Checks stock</text>
  <text x="574" y="869" class="stepText">Rejects unknown products or</text><text x="574" y="888" class="stepText">insufficient sellable stock</text>
  <text x="574" y="912" class="tag">lib/inventory.js</text>

  <path d="M772 870H797" class="flowArrow"/>
  <rect x="803" y="812" width="216" height="117" class="step"/>
  <circle cx="825" cy="834" r="13" class="num"/><text x="825" y="838" class="numText">4</text>
  <text x="847" y="839" class="stepTitle">Calculates totals</text>
  <text x="821" y="869" class="stepText">Subtotal, coupon discount,</text><text x="821" y="888" class="stepText">HSN GST and payable total</text>
  <text x="821" y="912" class="tag">pricing · coupons · tax</text>

  <path d="M1019 870H1044" class="flowArrow"/>
  <rect x="1050" y="812" width="216" height="117" class="step"/>
  <circle cx="1072" cy="834" r="13" class="num"/><text x="1072" y="838" class="numText">5</text>
  <text x="1094" y="839" class="stepTitle">Khata, when selected</text>
  <text x="1068" y="869" class="stepText">Requires registered customer;</text><text x="1068" y="888" class="stepText">checks limit and records debit</text>
  <text x="1068" y="912" class="tag">lib/ledger.js</text>

  <path d="M1266 870H1291" class="flowArrow"/>
  <rect x="1297" y="812" width="216" height="117" class="step"/>
  <circle cx="1319" cy="834" r="13" class="num"/><text x="1319" y="838" class="numText">6</text>
  <text x="1341" y="839" class="stepTitle">Commits order</text>
  <text x="1315" y="869" class="stepText">Deducts stock and adds order</text><text x="1315" y="888" class="stepText">with a new ID and date</text>
  <text x="1315" y="912" class="tag">inventory · orders</text>

  <path d="M1513 870H1538" class="flowArrow"/>
  <rect x="1544" y="812" width="194" height="117" class="step"/>
  <circle cx="1566" cy="834" r="13" class="num"/><text x="1566" y="838" class="numText">7</text>
  <text x="1588" y="839" class="stepTitle">Persists changes</text>
  <text x="1562" y="869" class="stepText">Adds audit entry and writes</text><text x="1562" y="888" class="stepText">updated JSON data</text>
  <text x="1562" y="912" class="tag">store.js → db.json</text>

  <path d="M1640 929V977H172V929" class="connectorDash"/>
  <rect x="430" y="957" width="875" height="52" rx="12" fill="#edf7ff" stroke="#c9deed"/>
  <text x="867" y="979" text-anchor="middle" class="stepTitle">201 Created returns the order</text>
  <text x="867" y="997" text-anchor="middle" class="stepText">UI clears cart and refreshes products, dashboard and customer list</text>
  <text x="62" y="1070" class="small">On failure, the route returns an error before saving the order.</text>
  <text x="1738" y="1070" text-anchor="end" class="small">Supporting code labels reflect files present in this repository.</text>
</svg>
