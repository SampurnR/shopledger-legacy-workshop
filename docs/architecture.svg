<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1300" viewBox="0 0 1900 1300" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Architecture map of the ShopLedger browser UI, Express routes, library modules, configuration, JSON store, and the order placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <marker id="flowArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#172033}.title{font-size:34px;font-weight:750}.subtitle{font-size:15px;fill:#64748b}.section{font-size:20px;font-weight:700}.boxhead{font-size:16px;font-weight:700}.label{font-size:14px}.small{font-size:12px;fill:#526174}.flowtext{font-size:13px;font-weight:650;fill:#1d4ed8}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.flow{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#flowArrow)}.soft{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}.ui{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.route{fill:#f5f3ff;stroke:#8b5cf6;stroke-width:2}.lib{fill:#ecfdf5;stroke:#34d399;stroke-width:1.5}.store{fill:#fff7ed;stroke:#fb923c;stroke-width:2}.cfg{fill:#fdf2f8;stroke:#ec4899;stroke-width:1.5}.num{fill:#2563eb}.numtext{fill:#fff;font-size:13px;font-weight:700;text-anchor:middle;dominant-baseline:central}.dashed{stroke-dasharray:7 6}
    </style>
  </defs>
  <rect width="1900" height="1300" fill="#ffffff"/>
  <text x="60" y="62" class="title">ShopLedger · application architecture</text>
  <text x="60" y="91" class="subtitle">Browser POS · Express API · business logic modules · JSON file persistence</text>

  <!-- Order placement flow -->
  <rect x="55" y="120" width="1790" height="295" rx="18" class="soft"/>
  <text x="82" y="157" class="section">Order placement flow</text>
  <text x="1688" y="156" class="small">numbered arrows show request path</text>
  <rect x="85" y="200" width="225" height="145" rx="12" class="ui"/>
  <text x="105" y="232" class="boxhead">Browser UI</text>
  <text x="105" y="258" class="label">public/index.html</text>
  <text x="105" y="281" class="label">public/js/app.js</text>
  <text x="105" y="310" class="small">Cart · customer · coupon</text>
  <circle cx="101" cy="185" r="14" class="num"/><text x="101" y="185" class="numtext">1</text>

  <rect x="365" y="200" width="230" height="145" rx="12" class="route"/>
  <text x="385" y="232" class="boxhead">Express order route</text>
  <text x="385" y="258" class="label">POST /api/orders</text>
  <text x="385" y="283" class="small">routes/orders.js</text>
  <text x="385" y="310" class="small">Resolve product and quantity</text>
  <circle cx="380" cy="185" r="14" class="num"/><text x="380" y="185" class="numtext">2</text>

  <rect x="660" y="190" width="270" height="165" rx="12" class="lib"/>
  <text x="682" y="222" class="boxhead">Validate and calculate</text>
  <text x="682" y="250" class="label">inventory.check</text>
  <text x="682" y="273" class="label">pricing.subtotal / computeTotals</text>
  <text x="682" y="296" class="label">coupons.validate / tax.getRateForItem</text>
  <text x="682" y="325" class="small">lib/inventory · pricing · coupons · tax</text>
  <circle cx="675" cy="175" r="14" class="num"/><text x="675" y="175" class="numtext">3</text>

  <rect x="1000" y="200" width="235" height="145" rx="12" class="lib"/>
  <text x="1020" y="232" class="boxhead">Khata (conditional)</text>
  <text x="1020" y="259" class="label">ledger.findCustomer</text>
  <text x="1020" y="282" class="label">chargeOrderToKhata</text>
  <text x="1020" y="311" class="small">Only for paymentMode=khata</text>
  <circle cx="1015" cy="185" r="14" class="num"/><text x="1015" y="185" class="numtext">4</text>

  <rect x="1300" y="200" width="220" height="145" rx="12" class="lib"/>
  <text x="1320" y="232" class="boxhead">Record order</text>
  <text x="1320" y="259" class="label">inventory.reserve</text>
  <text x="1320" y="282" class="label">orders.add</text>
  <text x="1320" y="311" class="small">Create order + deduct stock</text>
  <circle cx="1315" cy="185" r="14" class="num"/><text x="1315" y="185" class="numtext">5</text>

  <rect x="1580" y="200" width="220" height="145" rx="12" class="store"/>
  <text x="1600" y="232" class="boxhead">Persist and respond</text>
  <text x="1600" y="259" class="label">store.appendAudit</text>
  <text x="1600" y="282" class="label">store.write(db)</text>
  <text x="1600" y="311" class="small">data/db.json → 201 + order</text>
  <circle cx="1595" cy="185" r="14" class="num"/><text x="1595" y="185" class="numtext">6</text>

  <path d="M310 272H360" class="flow"/><path d="M595 272H655" class="flow"/><path d="M930 272H995" class="flow"/><path d="M1235 272H1295" class="flow"/><path d="M1520 272H1575" class="flow"/>
  <text x="82" y="385" class="small">Order lines and totals come from server-side product data; the route optionally charges Khata, then persists the updated store.</text>

  <!-- Runtime architecture -->
  <text x="60" y="465" class="section">Application modules</text>
  <rect x="55" y="490" width="325" height="270" rx="16" class="ui"/>
  <text x="80" y="526" class="boxhead">UI · public/</text>
  <text x="80" y="559" class="label">index.html</text>
  <text x="80" y="585" class="label">js/app.js</text>
  <text x="80" y="611" class="label">css/style.css</text>
  <text x="80" y="652" class="small">Catalog · POS · order register</text>
  <text x="80" y="674" class="small">Khata · audit / GST views</text>

  <rect x="425" y="490" width="330" height="270" rx="16" class="route"/>
  <text x="450" y="526" class="boxhead">Routers · routes/</text>
  <text x="450" y="560" class="label">products.js</text><text x="595" y="560" class="small">products · coupons</text>
  <text x="450" y="591" class="label">orders.js</text><text x="595" y="591" class="small">orders · cancellation</text>
  <text x="450" y="622" class="label">customers.js</text><text x="595" y="622" class="small">Khata settlements</text>
  <text x="450" y="653" class="label">reports.js</text><text x="595" y="653" class="small">dashboard · preview · export</text>
  <text x="450" y="712" class="small">All mounted by server.js under /api</text>

  <rect x="800" y="490" width="655" height="505" rx="16" class="lib"/>
  <text x="825" y="526" class="boxhead">Business modules · lib/</text>
  <rect x="825" y="550" width="280" height="90" rx="10" fill="#fff" stroke="#86efac"/>
  <text x="845" y="579" class="label">orders.js</text><text x="845" y="604" class="small">add · get · cancel · list</text>
  <rect x="1125" y="550" width="300" height="90" rx="10" fill="#fff" stroke="#86efac"/>
  <text x="1145" y="579" class="label">inventory.js</text><text x="1145" y="604" class="small">find · check · reserve · release</text>
  <rect x="825" y="660" width="280" height="90" rx="10" fill="#fff" stroke="#86efac"/>
  <text x="845" y="689" class="label">pricing.js</text><text x="845" y="714" class="small">subtotal · discount · totals</text>
  <rect x="1125" y="660" width="300" height="90" rx="10" fill="#fff" stroke="#86efac"/>
  <text x="1145" y="689" class="label">tax.js · coupons.js</text><text x="1145" y="714" class="small">GST rates · coupon rules</text>
  <rect x="825" y="770" width="280" height="90" rx="10" fill="#fff" stroke="#86efac"/>
  <text x="845" y="799" class="label">ledger.js</text><text x="845" y="824" class="small">Khata · customers · settlements</text>
  <rect x="1125" y="770" width="300" height="90" rx="10" fill="#fff" stroke="#86efac"/>
  <text x="1145" y="799" class="label">reports.js</text><text x="1145" y="824" class="small">dashboard · GST reconciliation</text>
  <rect x="825" y="880" width="280" height="90" rx="10" fill="#fff" stroke="#86efac"/>
  <text x="845" y="909" class="label">invoice.js</text><text x="845" y="934" class="small">invoice figures · HTML rendering</text>
  <rect x="1125" y="880" width="300" height="90" rx="10" fill="#fff" stroke="#86efac"/>
  <text x="1145" y="909" class="label">store.js · dates.js</text><text x="1145" y="934" class="small">JSON persistence · date helpers</text>

  <rect x="1510" y="490" width="335" height="195" rx="16" class="cfg"/>
  <text x="1535" y="526" class="boxhead">config.js</text>
  <text x="1535" y="559" class="label">port · adminKey · shop details</text>
  <text x="1535" y="586" class="label">tax slabs · inventory settings</text>
  <text x="1535" y="613" class="label">coupon definitions</text>
  <text x="1535" y="652" class="small">Read by server and lib modules</text>

  <rect x="1510" y="735" width="335" height="170" rx="16" class="store"/>
  <text x="1535" y="771" class="boxhead">data/db.json</text>
  <text x="1535" y="804" class="label">products · orders · customers</text>
  <text x="1535" y="831" class="label">settlements · auditLog · counters</text>
  <text x="1535" y="870" class="small">Read and written by lib/store.js</text>

  <rect x="55" y="825" width="325" height="170" rx="16" class="soft"/>
  <text x="80" y="861" class="boxhead">server.js</text>
  <text x="80" y="894" class="label">Express app · JSON body parser</text>
  <text x="80" y="921" class="label">static public/ · route mounting</text>
  <text x="80" y="960" class="small">GET /orders/:id/invoice → invoice.render</text>

  <!-- Relationship arrows -->
  <path d="M380 620H420" class="edge"/><text x="384" y="607" class="small">HTTP</text>
  <path d="M755 620H790" class="edge"/>
  <path d="M1090 490V470H380V490" class="edge dashed"/><text x="795" y="460" class="small">routes call lib modules</text>
  <path d="M1455 710H1500" class="edge"/><text x="1458" y="698" class="small">reads</text>
  <path d="M1425 925H1500" class="edge"/><text x="1433" y="913" class="small">store I/O</text>
  <path d="M1510 600H1465V510H1380" class="edge dashed"/><text x="1410" y="497" class="small">configuration</text>
  <path d="M215 760V815" class="edge"/>
  <path d="M380 905H420V750" class="edge dashed"/><text x="388" y="895" class="small">serves / mounts</text>

  <rect x="55" y="1030" width="1790" height="205" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="82" y="1068" class="section">Other request paths</text>
  <text x="90" y="1110" class="label"><tspan font-weight="700">Products:</tspan> GET /api/products, /api/coupons → routes/products.js → store + inventory/tax/coupons</text>
  <text x="90" y="1142" class="label"><tspan font-weight="700">Customers:</tspan> GET /api/customers, POST /api/customers/:id/settle → routes/customers.js → ledger + store</text>
  <text x="90" y="1174" class="label"><tspan font-weight="700">Reports:</tspan> GET /api/reports/dashboard, /api/reports/gst-reconciliation; POST /api/pricing/preview; GET /api/admin/export</text>
  <text x="90" y="1206" class="label"><tspan font-weight="700">Orders:</tspan> GET /api/orders, /api/orders/:id; POST /api/orders/:id/cancel; GET /orders/:id/invoice → invoice.js</text>
</svg>
