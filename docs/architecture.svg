<text x="944" y="529" class="small">GET /customers</text>
<text x="944" y="555" class="small">POST /customers/:id/settle</text>
<text x="944" y="581" class="small">Direct local imports:</text>
<text x="944" y="607" class="small">store · ledger</text>
<rect x="1362" y="464" width="390" height="214" rx="13" fill="white" stroke="#d6dfeb"/><rect x="1362" y="477" width="5" height="188" rx="2" fill="#2563eb"/>
