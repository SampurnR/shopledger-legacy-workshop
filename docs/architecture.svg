<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Architecture map of the ShopLedger browser UI, Express server and routers, library modules, configuration, and JSON data store. The order placement flow is highlighted.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}.title{font-size:32px;font-weight:750}.sub{font-size:15px;fill:#475569}.head{font-size:19px;font-weight:700}.boxhead{font-size:16px;font-weight:700}.body{font-size:13px;fill:#334155}.small{font-size:12px;fill:#475569}.step{font-size:13px;font-weight:650;fill:#1d4ed8}.box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.layer{fill:#f8fafc;stroke:#dbe3ee;stroke-width:1.5}.ui{fill:#eff6ff;stroke:#93c5fd;stroke-width:1.5}.router{fill:#f5f3ff;stroke:#c4b5fd;stroke-width:1.5}.lib{fill:#f0fdf4;stroke:#86efac;stroke-width:1.5}.persist{fill:#fff7ed;stroke:#fdba74;stroke-width:1.5}.flow{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#blueArrow)}.link{fill:none;stroke:#64748b;stroke-width:1.8;marker-end:url(#arrow)}.write{fill:none;stroke:#059669;stroke-width:3;marker-end:url(#greenArrow)}.dash{stroke-dasharray:7 6}
    </style>
  </defs>
  <rect width="1600" height="1200" fill="#f1f5f9"/>
  <text x="55" y="58" class="title">ShopLedger · Application Architecture</text>
  <text x="56" y="88" class="sub">Browser UI · Express API · business logic modules · JSON file persistence</text>

  <!-- Lanes -->
  <rect x="40" y="115" width="310" height="950" rx="18" class="layer"/>
  <rect x="390" y="115" width="350" height="950" rx="18" class="layer"/>
  <rect x="780" y="115" width="465" height="950" rx="18" class="layer"/>
  <rect x="1285" y="115" width="275" height="950" rx="18" class="layer"/>
  <text x="65" y="153" class="head">Browser UI</text>
  <text x="415" y="153" class="head">Express server &amp; routes</text>
  <text x="805" y="153" class="head">lib/ modules</text>
  <text x="1310" y="153" class="head">Settings &amp; data</text>

  <!-- UI -->
  <rect x="65" y="180" width="260" height="130" rx="12" class="ui"/>
  <text x="85" y="210" class="boxhead">public/index.html</text>
  <text x="85" y="237" class="body">POS · Order History</text>
  <text x="85" y="258" class="body">Customer Khata · Audit</text>
  <text x="85" y="283" class="small">Loads browser app and styles</text>
  <rect x="65" y="345" width="260" height="145" rx="12" class="ui"/>
  <text x="85" y="375" class="boxhead">public/js/app.js</text>
  <text x="85" y="402" class="body">Calls /api endpoints</text>
  <text x="85" y="423" class="body">Builds order payload</text>
  <text x="85" y="444" class="body">Renders previews and results</text>
  <text x="85" y="470" class="small">POST /api/orders</text>
  <rect x="65" y="525" width="260" height="100" rx="12" class="ui"/>
  <text x="85" y="558" class="boxhead">public/css/style.css</text>
  <text x="85" y="585" class="body">UI presentation</text>
  <path d="M195 310V338" class="link"/>
  <path d="M195 490V518" class="link"/>

  <!-- Server and routers -->
  <rect x="415" y="180" width="300" height="100" rx="12" class="box"/>
  <text x="437" y="212" class="boxhead">server.js</text>
  <text x="437" y="238" class="body">Express app · serves public/</text>
  <text x="437" y="259" class="body">mounts routers at /api</text>
  <path d="M325 410H385V230H407" class="flow"/>
  <rect x="415" y="325" width="300" height="125" rx="12" class="router"/>
  <text x="437" y="357" class="boxhead">routes/orders.js</text>
  <text x="437" y="383" class="body">POST /orders · GET /orders</text>
  <text x="437" y="404" class="body">GET /orders/:id</text>
  <text x="437" y="425" class="body">POST /orders/:id/cancel</text>
  <rect x="415" y="480" width="300" height="100" rx="12" class="router"/>
  <text x="437" y="512" class="boxhead">routes/products.js</text>
  <text x="437" y="539" class="body">GET /products · GET /coupons</text>
  <rect x="415" y="610" width="300" height="100" rx="12" class="router"/>
  <text x="437" y="642" class="boxhead">routes/customers.js</text>
  <text x="437" y="669" class="body">GET /customers · POST settlement</text>
  <rect x="415" y="740" width="300" height="125" rx="12" class="router"/>
  <text x="437" y="772" class="boxhead">routes/reports.js</text>
  <text x="437" y="799" class="body">Dashboard · GST reconciliation</text>
  <text x="437" y="820" class="body">Pricing preview · admin export</text>
  <rect x="415" y="895" width="300" height="100" rx="12" class="router"/>
  <text x="437" y="927" class="boxhead">server.js invoice route</text>
  <text x="437" y="954" class="body">GET /orders/:id/invoice</text>
  <path d="M565 280V317" class="link"/>

  <!-- Lib modules -->
  <rect x="805" y="180" width="205" height="100" rx="12" class="lib"/>
  <text x="825" y="212" class="boxhead">lib/orders.js</text>
  <text x="825" y="238" class="body">Create, list, cancel</text>
  <rect x="1030" y="180" width="190" height="100" rx="12" class="lib"/>
  <text x="1050" y="212" class="boxhead">lib/store.js</text>
  <text x="1050" y="238" class="body">Read · write · audit</text>
  <rect x="805" y="325" width="205" height="100" rx="12" class="lib"/>
  <text x="825" y="357" class="boxhead">lib/inventory.js</text>
  <text x="825" y="383" class="body">Stock checks · reserve</text>
  <rect x="1030" y="325" width="190" height="100" rx="12" class="lib"/>
  <text x="1050" y="357" class="boxhead">lib/pricing.js</text>
  <text x="1050" y="383" class="body">Subtotal · GST · totals</text>
  <rect x="805" y="470" width="205" height="100" rx="12" class="lib"/>
  <text x="825" y="502" class="boxhead">lib/coupons.js</text>
  <text x="825" y="528" class="body">Normalize · validate</text>
  <rect x="1030" y="470" width="190" height="100" rx="12" class="lib"/>
  <text x="1050" y="502" class="boxhead">lib/tax.js</text>
  <text x="1050" y="528" class="body">HSN rates · CGST/SGST</text>
  <rect x="805" y="615" width="205" height="100" rx="12" class="lib"/>
  <text x="825" y="647" class="boxhead">lib/ledger.js</text>
  <text x="825" y="673" class="body">Khata · settlements</text>
  <rect x="1030" y="615" width="190" height="100" rx="12" class="lib"/>
  <text x="1050" y="647" class="boxhead">lib/reports.js</text>
  <text x="1050" y="673" class="body">Dashboard · reconciliation</text>
  <rect x="805" y="760" width="205" height="100" rx="12" class="lib"/>
  <text x="825" y="792" class="boxhead">lib/invoice.js</text>
  <text x="825" y="818" class="body">Invoice figures · HTML</text>
  <rect x="1030" y="760" width="190" height="100" rx="12" class="lib"/>
  <text x="1050" y="792" class="boxhead">lib/dates.js</text>
  <text x="1050" y="818" class="body">Date helpers</text>
  <path d="M715 385H775V230H797" class="flow"/>
  <path d="M715 385H775V375H797" class="flow"/>
  <path d="M715 385H1022" class="flow"/>
  <path d="M715 385H765V520H797" class="flow"/>
  <path d="M715 385H775V665H797" class="flow"/>
  <path d="M715 790H775V810H797" class="link"/>
  <path d="M1010 375H1022" class="link"/>
  <path d="M1010 520H1022" class="link"/>
  <path d="M1010 665H1022" class="link"/>

  <!-- Config and data -->
  <rect x="1310" y="210" width="225" height="170" rx="12" class="persist"/>
  <text x="1332" y="244" class="boxhead">config.js</text>
  <text x="1332" y="273" class="body">Port · shop details</text>
  <text x="1332" y="296" class="body">Tax slabs · inventory defaults</text>
  <text x="1332" y="319" class="body">Coupons · admin key</text>
  <rect x="1310" y="520" width="225" height="170" rx="12" class="persist"/>
  <text x="1332" y="554" class="boxhead">data/db.json</text>
  <text x="1332" y="583" class="body">Products · orders</text>
  <text x="1332" y="606" class="body">Customers · settlements</text>
  <text x="1332" y="629" class="body">Audit log · next IDs</text>
  <path d="M1220 230H1302" class="link"/>
  <path d="M1220 375H1265V295H1302" class="link"/>
  <path d="M1220 520H1275V330H1302" class="link"/>
  <path d="M1220 665H1302" class="link"/>
  <path d="M1220 810H1270V610H1302" class="link"/>

  <!-- Data store read/write edges -->
  <path d="M1220 230H1260V605H1302" class="write dash"/>
  <path d="M1220 375H1248V630H1302" class="write dash"/>

  <!-- Order flow band -->
  <rect x="55" y="1090" width="1490" height="82" rx="16" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="78" y="1120" class="boxhead" fill="#1d4ed8">Order placement flow</text>
  <text x="78" y="1148" class="step">1 · UI POST /api/orders</text>
  <text x="330" y="1148" class="step">2 · routes/orders.js resolves products</text>
  <text x="680" y="1148" class="step">3 · inventory + coupons + pricing + tax + ledger</text>
  <text x="1120" y="1148" class="step">4 · orders.js creates order</text>
  <text x="78" y="1165" class="small">5 · store.js appends audit and writes data/db.json · 6 · API returns order to UI</text>
  <path d="M325 438V1068H150V1082" class="flow dash"/>
  <path d="M565 450V1070H440V1082" class="flow dash"/>
  <path d="M905 425V1072H845V1082" class="flow dash"/>
  <path d="M905 280V1075H1270V1082" class="flow dash"/>
  <path d="M1130 280V1077H1490V1082" class="write dash"/>
</svg>
