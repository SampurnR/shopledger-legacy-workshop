<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Browser UI, Express server, routers, library modules, configuration and JSON data store. Numbered path shows order placement.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/></marker>
    <marker id="flowArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:14px}
      .title{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#475569}
      .head{font-size:16px;font-weight:700}.node{fill:#fff;stroke:#94a3b8;stroke-width:1.5;rx:10}
      .group{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5;rx:14}
      .muted{font-size:12px;fill:#475569}.file{font-weight:700;font-size:14px}
      .ticket{fill:#fff1f2;stroke:#e11d48;stroke-width:2}.flow{fill:none;stroke:#2563eb;stroke-width:2.6;marker-end:url(#flowArrow)}
      .link{fill:none;stroke:#64748b;stroke-width:1.5;marker-end:url(#arrow)}
      .dashed{stroke-dasharray:6 5}.num{fill:#2563eb;stroke:#fff;stroke-width:2}
      .numtext{fill:#fff;font-size:13px;font-weight:700;text-anchor:middle}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#f1f5f9"/>
  <text x="32" y="42" class="title">ShopLedger · application architecture</text>
  <text x="32" y="66" class="sub">Express POS, Khata ledger, inventory and GST invoice app · order placement flow numbered 1–6</text>

  <!-- Browser -->
  <rect x="30" y="104" width="210" height="152" class="group"/>
  <text x="48" y="131" class="head">Browser UI</text>
  <rect x="48" y="145" width="174" height="42" class="node"/>
  <text x="62" y="163" class="file">public/</text><text x="62" y="180" class="muted">index.html · js/app.js · css/</text>
  <text x="48" y="218" class="muted">POS · order history · Khata</text>
  <text x="48" y="237" class="muted">audit · preview · printable link</text>

  <!-- server -->
  <rect x="280" y="104" width="226" height="152" class="group"/>
  <text x="298" y="131" class="head">HTTP application</text>
  <rect x="298" y="145" width="190" height="42" class="node"/>
  <text x="312" y="164" class="file">server.js</text><text x="312" y="181" class="muted">static files · /api routers</text>
  <text x="298" y="218" class="muted">GET /orders/:id/invoice</text>
  <text x="298" y="237" class="muted">calls orders.get → invoice.render</text>
  <path d="M240 177 H294" class="link"/>

  <!-- routers -->
  <rect x="548" y="104" width="300" height="250" class="group"/>
  <text x="566" y="131" class="head">routes/ · mounted at /api</text>
  <rect x="566" y="146" width="264" height="44" class="node"/>
  <text x="580" y="165" class="file">orders.js</text><text x="580" y="182" class="muted">POST /orders · GET/list · cancel</text>
  <rect x="566" y="198" width="264" height="38" class="node"/>
  <text x="580" y="222" class="file">products.js</text><text x="704" y="222" class="muted">products · coupons</text>
  <rect x="566" y="244" width="264" height="38" class="node"/>
  <text x="580" y="268" class="file">customers.js</text><text x="704" y="268" class="muted">Khata · settle</text>
  <rect x="566" y="290" width="264" height="38" class="node"/>
  <text x="580" y="314" class="file">reports.js</text><text x="704" y="314" class="muted">dashboard · preview · export</text>
  <path d="M506 177 H562" class="link"/>

  <!-- config -->
  <rect x="895" y="104" width="274" height="104" class="group"/>
  <text x="913" y="131" class="head">Configuration</text>
  <rect x="913" y="145" width="238" height="46" class="node"/>
  <text x="927" y="165" class="file">config.js</text><text x="927" y="183" class="muted">shop · tax slabs · coupons · limits</text>

  <!-- library map -->
  <rect x="280" y="388" width="888" height="290" class="group"/>
  <text x="300" y="417" class="head">lib/ · application logic</text>
  <rect x="300" y="438" width="188" height="68" class="node"/>
  <text x="314" y="461" class="file">pricing.js</text><text x="314" y="481" class="muted">subtotal · discount · GST totals</text>
  <rect x="506" y="438" width="188" height="68" class="node"/>
  <text x="520" y="461" class="file">coupons.js</text><text x="520" y="481" class="muted">normalize · validate · calculate</text>
  <rect x="712" y="438" width="188" height="68" class="node"/>
  <text x="726" y="461" class="file">tax.js</text><text x="726" y="481" class="muted">HSN slabs · CGST/SGST split</text>
  <rect x="918" y="438" width="226" height="68" class="node ticket"/>
  <text x="932" y="461" class="file">invoice.js</text><text x="932" y="481" class="muted">computeInvoiceFigures · render</text>

  <rect x="300" y="526" width="188" height="62" class="node"/>
  <text x="314" y="549" class="file">inventory.js</text><text x="314" y="570" class="muted">find · check · reserve · release</text>
  <rect x="506" y="526" width="188" height="62" class="node"/>
  <text x="520" y="549" class="file">orders.js</text><text x="520" y="570" class="muted">add · get · cancel · list</text>
  <rect x="712" y="526" width="188" height="62" class="node"/>
  <text x="726" y="549" class="file">ledger.js</text><text x="726" y="570" class="muted">Khata · customers · settlements</text>
  <rect x="918" y="526" width="104" height="62" class="node"/>
  <text x="932" y="549" class="file">dates.js</text><text x="932" y="570" class="muted">date helpers</text>
  <rect x="1032" y="526" width="112" height="62" class="node"/>
  <text x="1046" y="549" class="file">reports.js</text><text x="1046" y="570" class="muted">summary · recon</text>
  <rect x="506" y="606" width="394" height="48" class="node"/>
  <text x="520" y="628" class="file">store.js</text><text x="600" y="628" class="muted">read · write · appendAudit (synchronous JSON I/O)</text>

  <!-- JSON data -->
  <rect x="30" y="536" width="210" height="118" class="group"/>
  <text x="48" y="565" class="head">Persistent data</text>
  <rect x="48" y="579" width="174" height="50" class="node"/>
  <text x="62" y="600" class="file">data/db.json</text><text x="62" y="618" class="muted">products · orders · ledger · audit</text>
  <path d="M502 630 H244" class="link"/>

  <!-- order path numbers -->
  <path d="M222 165 C360 83 494 85 565 161" class="flow"/>
  <circle cx="266" cy="134" r="13" class="num"/><text x="266" y="139" class="numtext">1</text>
  <path d="M696 168 C740 168 752 211 752 434" class="flow"/>
  <circle cx="750" cy="383" r="13" class="num"/><text x="750" y="388" class="numtext">2</text>
  <path d="M696 472 H692" class="flow"/>
  <circle cx="700" cy="472" r="13" class="num"/><text x="700" y="477" class="numtext">3</text>
  <path d="M488 472 C500 472 495 556 502 556" class="flow"/>
  <circle cx="495" cy="521" r="13" class="num"/><text x="495" y="526" class="numtext">4</text>
  <path d="M600 588 V602" class="flow"/>
  <circle cx="600" cy="596" r="13" class="num"/><text x="600" y="601" class="numtext">5</text>
  <path d="M506 629 H242" class="flow"/>
  <circle cx="380" cy="629" r="13" class="num"/><text x="380" y="634" class="numtext">6</text>

  <!-- config relationships, explanatory -->
  <path d="M1032 208 C1032 335 820 355 820 434" class="link dashed"/>
  <path d="M1060 208 C1110 275 1040 348 1030 434" class="link dashed"/>

  <!-- legend and numbered key -->
  <rect x="30" y="684" width="1138" height="92" class="group"/>
  <text x="48" y="710" class="head">Order placement</text>
  <text x="48" y="736"><tspan font-weight="700">1</tspan><tspan> UI POST /api/orders</tspan></text>
  <text x="270" y="736"><tspan font-weight="700">2</tspan><tspan> routes/orders.js validates and coordinates</tspan></text>
  <text x="625" y="736"><tspan font-weight="700">3</tspan><tspan> pricing.js + coupons.js + tax.js compute</tspan></text>
  <text x="48" y="760"><tspan font-weight="700">4</tspan><tspan> inventory.js checks/reserves; ledger.js charges Khata when selected</tspan></text>
  <text x="625" y="760"><tspan font-weight="700">5</tspan><tspan> orders.js adds order; store.js writes</tspan></text>
  <text x="930" y="760"><tspan font-weight="700">6</tspan><tspan> data/db.json</tspan></text>
  <rect x="955" y="697" width="18" height="18" class="ticket"/>
  <text x="982" y="712" class="muted">Ticket focus: invoice.js</text>
</svg>
