  <path d="M262 487 V550 H202 V628" class="edge"/>
  <path d="M262 550 H468 V628" class="edge"/>
  <path d="M262 550 H734 V628" class="edge"/>
  <path d="M262 550 H1000 V628" class="edge"/>
  <path d="M262 550 H1266 V628" class="edge"/>
  <path d="M262 550 H1552 V628" class="edge"/>

  <path d="M654 487 V548 H202 V628" class="edgeDash"/>
  <path d="M654 548 H1000 V628" class="edgeDash"/>
  <path d="M654 548 H734 V628" class="edgeDash"/>
  <path d="M1046 487 V742 H734 V758" class="edge"/>
  <path d="M1046 742 H1266 V628" class="edge"/>
  <path d="M1438 487 V735 H734 V758" class="edge"/>
  <path d="M1438 735 H202 V758" class="edge"/>
  <path d="M1438 735 H1000 V758" class="edge"/>
  <path d="M1552 723 V758 H468" class="edgeDash"/>
  <path d="M202 723 V758" class="edgeDash"/>
  <path d="M468 723 V758" class="edgeDash"/>
  <path d="M734 723 V758" class="edgeDash"/>

  <path d="M202 853 V917 H1537 V964" class="edge"/>
  <text x="1030" y="911" class="small">read / write via store</text>

  <path d="M470 1017 H740 V884 H1000 V853" class="edgeDash"/>
  <path d="M470 1017 H740 V610 H1000 V628" class="edgeDash"/>
  <path d="M470 1017 H740 V600 H734 V628" class="edgeDash"/>
  <path d="M470 1017 H740 V890 H202 V853" class="edgeDash"/>
  <text x="488" y="1006" class="small">settings used by modules</text>

  <!-- Order placement sequence -->
  <text x="56" y="1113" class="section" fill="#1d4ed8">ORDER PLACEMENT · POST /api/orders</text>
  <rect x="56" y="1130" width="1688" height="96" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4"/>

  <circle cx="91" cy="1162" r="15" fill="#2563eb"/><text x="86.5" y="1167" font-size="13" font-weight="700" fill="#fff">1</text>
  <text x="116" y="1160" class="flowText">Select cart</text><text x="116" y="1181" class="flowDetail">Browser UI</text>
  <path d="M250 1175 H300" class="edgeBlue"/>

  <circle cx="330" cy="1162" r="15" fill="#2563eb"/><text x="325.5" y="1167" font-size="13" font-weight="700" fill="#fff">2</text>
  <text x="355" y="1160" class="flowText">POST /api/orders</text><text x="355" y="1181" class="flowDetail">routes/orders.js</text>
  <path d="M510 1175 H560" class="edgeBlue"/>

  <circle cx="590" cy="1162" r="15" fill="#2563eb"/><text x="585.5" y="1167" font-size="13" font-weight="700" fill="#fff">3</text>
  <text x="615" y="1160" class="flowText">Check stock</text><text x="615" y="1181" class="flowDetail">lib/inventory.js</text>
  <path d="M755 1175 H805" class="edgeBlue"/>

  <circle cx="835" cy="1162" r="15" fill="#2563eb"/><text x="830.5" y="1167" font-size="13" font-weight="700" fill="#fff">4</text>
  <text x="860" y="1160" class="flowText">Validate coupon &amp; calculate GST</text><text x="860" y="1181" class="flowDetail">coupons.js · pricing.js · tax.js</text>
  <path d="M1110 1175 H1160" class="edgeBlue"/>

  <circle cx="1190" cy="1162" r="15" fill="#2563eb"/><text x="1185.5" y="1167" font-size="13" font-weight="700" fill="#fff">5</text>
  <text x="1215" y="1160" class="flowText">Khata check, when selected</text><text x="1215" y="1181" class="flowDetail">lib/ledger.js</text>
  <path d="M1410 1175 H1460" class="edgeBlue"/>

  <circle cx="1490" cy="1162" r="15" fill="#2563eb"/><text x="1485.5" y="1167" font-size="13" font-weight="700" fill="#fff">6</text>
  <text x="1515" y="1160" class="flowText">Create order &amp; persist</text><text x="1515" y="1181" class="flowDetail">orders.js · store.js · data/db.json</text>
</svg>
