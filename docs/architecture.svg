<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">ShopLedger application architecture</title>
<desc id="desc">Architecture diagram showing browser UI, Express server and routers, library modules, configuration and JSON storage, with numbered order placement flow.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#52657a"/></marker>
  <marker id="flowArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#157a68"/></marker>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#172b3a;font-size:13px}
    .title{font-size:26px;font-weight:700}.subtitle{font-size:14px;fill:#52657a}
    .head{font-size:16px;font-weight:700}.label{font-size:13px;font-weight:700}
    .small{font-size:12px}.muted{fill:#52657a}.flowtext{font-size:12px;font-weight:700;fill:#126858}
    .box{fill:#fff;stroke:#9aabba;stroke-width:1.5}.zone{fill:#f3f7fa;stroke:#cbd6df;stroke-width:1.2}
    .focus{fill:#fff1c9;stroke:#cc8a16;stroke-width:2}.flow{fill:none;stroke:#16806c;stroke-width:2.3;marker-end:url(#flowArrow)}
    .link{fill:none;stroke:#66798b;stroke-width:1.5;marker-end:url(#arrow)}
    .num{fill:#157a68;stroke:#fff;stroke-width:2}.numtext{font-size:12px;font-weight:700;fill:#fff;text-anchor:middle}
  </style>
</defs>
<rect width="1200" height="800" fill="#ffffff"/>
<text x="34" y="42" class="title">ShopLedger — application architecture</text>
<text x="35" y="66" class="subtitle">Express POS · Khata ledger · GST invoicing · JSON file storage</text>

<!-- Browser and server -->
<rect x="30" y="95" width="215" height="158" rx="12" class="zone"/>
<text x="48" y="122" class="head">Browser UI</text>
<text x="48" y="145" class="label">public/</text>
<text x="48" y="166" class="small">index.html · js/app.js</text>
<text x="48" y="186" class="small">css/style.css</text>
<text x="48" y="218" class="small muted">POS, order desk, Khata, audit</text>

<rect x="285" y="95" width="255" height="158" rx="12" class="zone"/>
<text x="304" y="122" class="head">Express application</text>
<text x="304" y="146" class="label">server.js</text>
<text x="304" y="168" class="small">bodyParser.json() · static(public/)</text>
<text x="304" y="190" class="small">Mounts routers at /api</text>
<text x="304" y="218" class="small">GET /orders/:id/invoice → invoice.render</text>

<path d="M245 170 H285" class="link"/>
<text x="249" y="158" class="small muted">HTTP</text>

<!-- Routers -->
<rect x="580" y="88" width="590" height="193" rx="12" class="zone"/>
<text x="600" y="116" class="head">routes/ — API routers</text>
<rect x="600" y="130" width="270" height="62" rx="8" class="box"/>
<text x="614" y="151" class="label">orders.js</text>
<text x="614" y="172" class="small">GET/POST /orders · POST /orders/:id/cancel</text>
<rect x="885" y="130" width="265" height="62" rx="8" class="box"/>
<text x="899" y="151" class="label">products.js</text>
<text x="899" y="172" class="small">GET /products · GET /coupons</text>
<rect x="600" y="204" width="270" height="58" rx="8" class="box"/>
<text x="614" y="225" class="label">customers.js</text>
<text x="614" y="246" class="small">GET /customers · POST /customers/:id/settle</text>
<rect x="885" y="204" width="265" height="58" rx="8" class="box"/>
<text x="899" y="225" class="label">reports.js</text>
<text x="899" y="246" class="small">dashboard · GST recon · pricing preview · export</text>
<path d="M540 166 H580" class="link"/>

<!-- Order flow band -->
<rect x="30" y="300" width="1140" height="118" rx="12" fill="#eaf6f2" stroke="#a8d4c8" stroke-width="1.5"/>
<text x="48" y="326" class="head">Order placement flow</text>
<circle cx="62" cy="365" r="13" class="num"/><text x="62" y="369" class="numtext">1</text>
<text x="83" y="359" class="label">UI submits cart</text><text x="83" y="379" class="small">POST /api/orders</text>
<path d="M218 365 H255" class="flow"/>
<circle cx="278" cy="365" r="13" class="num"/><text x="278" y="369" class="numtext">2</text>
<text x="299" y="359" class="label">orders.js</text><text x="299" y="379" class="small">resolve products + validate coupon</text>
<path d="M474 365 H511" class="flow"/>
<circle cx="534" cy="365" r="13" class="num"/><text x="534" y="369" class="numtext">3</text>
<text x="555" y="359" class="label">Pricing + stock</text><text x="555" y="379" class="small">totals · stock check/reserve</text>
<path d="M729 365 H766" class="flow"/>
<circle cx="789" cy="365" r="13" class="num"/><text x="789" y="369" class="numtext">4</text>
<text x="810" y="359" class="label">Khata (if selected)</text><text x="810" y="379" class="small">credit limit + account balance</text>
<path d="M982 365 H1019" class="flow"/>
<circle cx="1042" cy="365" r="13" class="num"/><text x="1042" y="369" class="numtext">5</text>
<text x="1063" y="359" class="label">Persist</text><text x="1063" y="379" class="small">order + audit → db.json</text>

<!-- Libraries -->
<rect x="30" y="445" width="800" height="313" rx="12" class="zone"/>
<text x="50" y="474" class="head">lib/ — application modules</text>
<rect x="50" y="492" width="240" height="76" rx="8" class="box"/>
<text x="64" y="514" class="label">pricing.js</text>
<text x="64" y="535" class="small">subtotal · discount · computeTotals</text>
<text x="64" y="553" class="small muted">calls tax + coupons</text>
<rect x="305" y="492" width="240" height="76" rx="8" class="box"/>
<text x="319" y="514" class="label">inventory.js</text>
<text x="319" y="535" class="small">find · check · reserve · release</text>
<text x="319" y="553" class="small muted">sellable stock helpers</text>
<rect x="560" y="492" width="245" height="76" rx="8" class="box"/>
<text x="574" y="514" class="label">ledger.js</text>
<text x="574" y="535" class="small">chargeOrderToKhata · settlements</text>
<text x="574" y="553" class="small muted">customer balances</text>

<rect x="50" y="581" width="240" height="76" rx="8" class="box"/>
<text x="64" y="603" class="label">coupons.js</text>
<text x="64" y="624" class="small">normalizeCode · validate · discount</text>
<text x="64" y="642" class="small muted">coupon rules from config</text>
<rect x="305" y="581" width="240" height="76" rx="8" class="box"/>
<text x="319" y="603" class="label">tax.js</text>
<text x="319" y="624" class="small">getRateForItem · GST slab split</text>
<text x="319" y="642" class="small muted">used by pricing.js</text>
<rect x="560" y="581" width="245" height="76" rx="8" class="box"/>
<text x="574" y="603" class="label">orders.js (lib)</text>
<text x="574" y="624" class="small">add · get · cancel · list</text>
<text x="574" y="642" class="small muted">order records</text>

<rect x="50" y="670" width="240" height="70" rx="8" class="focus"/>
<text x="64" y="692" class="label">invoice.js  ★ ticket focus</text>
<text x="64" y="713" class="small">computeInvoiceFigures · render</text>
<text x="64" y="730" class="small muted">independent invoice recalculation</text>
<rect x="305" y="670" width="240" height="70" rx="8" class="box"/>
<text x="319" y="692" class="label">store.js</text>
<text x="319" y="713" class="small">read · write · appendAudit</text>
<text x="319" y="730" class="small muted">JSON persistence</text>
<rect x="560" y="670" width="245" height="70" rx="8" class="box"/>
<text x="574" y="692" class="label">reports.js · dates.js</text>
<text x="574" y="713" class="small">GST reconciliation · date helpers</text>
<text x="574" y="730" class="small muted">dashboard and date utilities</text>

<!-- Configuration and data -->
<rect x="870" y="445" width="300" height="125" rx="12" class="zone"/>
<text x="890" y="474" class="head">Configuration + persistence</text>
<rect x="890" y="492" width="260" height="58" rx="8" class="box"/>
<text x="904" y="514" class="label">config.js</text>
<text x="904" y="535" class="small">shop · tax slabs · coupons · inventory</text>
<rect x="870" y="594" width="300" height="100" rx="12" class="zone"/>
<rect x="890" y="612" width="260" height="62" rx="8" class="box"/>
<text x="904" y="635" class="label">data/db.json</text>
<text x="904" y="656" class="small">products · orders · customers · audit</text>

<!-- Connections -->
<path d="M720 281 V292 H730 V300" class="flow"/>
<path d="M414 253 V286 H720 V300" class="link"/>
<path d="M730 418 V432 H170 V445" class="flow"/>
<path d="M730 432 H425 V445" class="flow"/>
<path d="M730 432 H680 V445" class="flow"/>
<path d="M730 432 H1010 V445" class="flow"/>
<path d="M290 530 H305" class="link"/>
<path d="M290 619 H305" class="link"/>
<path d="M430 657 V670" class="link"/>
<path d="M805 705 H870" class="link"/>
<path d="M720 253 V670 H680" class="link"/>
<path d="M1030 550 V594" class="link"/>

<!-- Legend -->
<rect x="870" y="715" width="300" height="43" rx="8" fill="#fff" stroke="#cbd6df"/>
<rect x="885" y="729" width="18" height="15" rx="3" class="focus"/>
<text x="910" y="742" class="small">Ticket focus: lib/invoice.js</text>
<line x1="1050" y1="737" x2="1080" y2="737" class="flow"/>
<text x="1087" y="742" class="small">Order flow</text>
</svg>
