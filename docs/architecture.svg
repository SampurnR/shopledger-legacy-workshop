<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1500" viewBox="0 0 1600 1500" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture</title>
  <desc id="desc">ShopLedger browser interface, Express server, four API routers, ten library modules, configuration, JSON data, source verified dependencies, and order placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#52708e"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#142b45}.title{font-size:32px;font-weight:700}.sub{font-size:15px;fill:#526a81}.head{font-size:17px;font-weight:700;letter-spacing:.5px;fill:#35506a}.name{font-size:16px;font-weight:700}.body{font-size:13px;fill:#526a81}.small{font-size:12px;fill:#526a81}.card{fill:#fff;stroke:#c7d4e1;stroke-width:1.5;rx:12}.blue{fill:#eff6ff;stroke:#8bb9ef;stroke-width:1.6;rx:12}.green{fill:#ecfdf5;stroke:#77c9a9;stroke-width:1.6;rx:12}.amber{fill:#fffbeb;stroke:#e9c65c;stroke-width:1.6;rx:12}.route{fill:#f4f8fc;stroke:#a9bdcf;stroke-width:1.5;rx:10}.edge{fill:none;stroke:#52708e;stroke-width:1.8;marker-end:url(#arrow)}.flow{fill:none;stroke:#2563eb;stroke-width:2.5;marker-end:url(#arrow)}.num{fill:#2563eb}.numtxt{font-size:13px;fill:#fff;font-weight:700;text-anchor:middle;dominant-baseline:middle}
    </style>
  </defs>
  <rect width="1600" height="1500" fill="#f7f9fc"/>
  <text x="52" y="54" class="title">ShopLedger | Application Architecture</text>
  <text x="52" y="82" class="sub">Browser point of sale and bookkeeping | Express API | JSON file persistence</text>

  <text x="52" y="122" class="head">APPLICATION ENTRY AND PERSISTENCE</text>
  <rect x="52" y="142" width="310" height="112" class="blue"/>
  <text x="74" y="176" class="name">Browser UI</text>
  <text x="74" y="201" class="body">public/index.html</text>
  <text x="74" y="222" class="body">public/js/app.js | public/css/style.css</text>
  <rect x="425" y="142" width="370" height="112" class="card"/>
  <text x="449" y="176" class="name">server.js | Express app</text>
  <text x="449" y="201" class="body">Serves public/ and mounts four routers at /api</text>
  <text x="449" y="222" class="body">Invoice endpoint: GET /orders/:id/invoice</text>
  <rect x="858" y="142" width="250" height="112" class="amber"/>
  <text x="882" y="176" class="name">config.js</text>
  <text x="882" y="201" class="body">Port, shop, tax, inventory, coupons</text>
  <text x="882" y="222" class="small">Consumed by listed modules below</text>
  <rect x="1170" y="142" width="378" height="112" class="green"/>
  <text x="1194" y="176" class="name">data/db.json</text>
  <text x="1194" y="201" class="body">products | orders | customers | settlements</text>
  <text x="1194" y="222" class="body">auditLog | nextOrderId | nextSettlementId</text>
  <path d="M362 198H417" class="edge"/><text x="369" y="185" class="small">HTTP</text>
  <path d="M1108 198H1162" class="edge"/><text x="1114" y="185" class="small">store read/write</text>

  <text x="52" y="302" class="head">API ROUTERS | routes/</text>
  <rect x="52" y="323" width="358" height="82" class="route"/>
  <text x="72" y="354" class="name">routes/products.js</text><text x="72" y="380" class="body">Product catalog and active coupon lookup</text>
  <rect x="430" y="323" width="358" height="82" class="blue"/>
  <text x="450" y="354" class="name">routes/orders.js</text><text x="450" y="380" class="body">Place, list, retrieve, and cancel orders</text>
  <rect x="808" y="323" width="358" height="82" class="route"/>
  <text x="828" y="354" class="name">routes/customers.js</text><text x="828" y="380" class="body">Customer accounts and settlements</text>
  <rect x="1186" y="323" width="362" height="82" class="route"/>
  <text x="1206" y="354" class="name">routes/reports.js</text><text x="1206" y="380" class="body">Dashboard, GST reconciliation, preview, export</text>
  <!-- server.js mounts each of these four routers at /api -->
  <path d="M610 254V286H231V315" class="edge"/>
  <path d="M610 286H609V315" class="edge"/>
  <path d="M610 286H987V315" class="edge"/>
  <path d="M610 286H1367V315" class="edge"/>
  <text x="626" y="278" class="small">server.js app.use('/api', router)</text>

  <text x="52" y="452" class="head">SOURCE-VERIFIED DEPENDENCIES | consumer -&gt; imported module or called service</text>
  <rect x="52" y="470" width="1496" height="395" class="card"/>
  <line x1="52" y1="508" x2="1548" y2="508" stroke="#d8e2ec"/>
  <line x1="52" y1="552" x2="1548" y2="552" stroke="#e4ebf2"/>
  <line x1="52" y1="596" x2="1548" y2="596" stroke="#e4ebf2"/>
  <line x1="52" y1="640" x2="1548" y2="640" stroke="#e4ebf2"/>
  <line x1="52" y1="684" x2="1548" y2="684" stroke="#e4ebf2"/>
  <line x1="52" y1="728" x2="1548" y2="728" stroke="#e4ebf2"/>
  <line x1="52" y1="772" x2="1548" y2="772" stroke="#e4ebf2"/>
  <line x1="52" y1="816" x2="1548" y2="816" stroke="#e4ebf2"/>
  <text x="72" y="497" class="name">Source</text><text x="430" y="497" class="name">Imports / calls (arrow points to actual dependency)</text>
  <text x="72" y="537" class="body">server.js</text><text x="430" y="537" class="body">-&gt; config.js, lib/store.js, lib/orders.js, lib/invoice.js; mounts all four routes/*.js at /api</text>
  <text x="72" y="581" class="body">routes/products.js</text><text x="430" y="581" class="body">-&gt; lib/store.js, lib/inventory.js, lib/tax.js, lib/coupons.js</text>
  <text x="72" y="625" class="body">routes/orders.js</text><text x="430" y="625" class="body">-&gt; lib/store.js, lib/inventory.js, lib/pricing.js, lib/coupons.js, lib/orders.js, lib/ledger.js</text>
  <text x="72" y="669" class="body">routes/customers.js</text><text x="430" y="669" class="body">-&gt; lib/store.js, lib/ledger.js</text>
  <text x="72" y="713" class="body">routes/reports.js</text><text x="430" y="713" class="body">-&gt; config.js, lib/store.js, lib/reports.js, lib/pricing.js, lib/coupons.js</text>
  <text x="72" y="757" class="body">lib/orders.js</text><text x="430" y="757" class="body">-&gt; lib/dates.js, lib/inventory.js, lib/ledger.js</text>
  <text x="72" y="801" class="body">lib/pricing.js</text><text x="430" y="801" class="body">-&gt; lib/tax.js, lib/coupons.js</text>
  <text x="72" y="845" class="body">lib/store.js</text><text x="430" y="845" class="body">-&gt; data/db.json (reads and writes); uses Node fs and path</text>

  <text x="52" y="910" class="head">LIBRARY MODULES | lib/</text>
  <text x="52" y="936" class="small">Each arrow below is a source import; data access via the shared db object is shown separately in the workflow.</text>
  <rect x="52" y="954" width="360" height="94" class="blue"/>
  <text x="72" y="983" class="name">orders.js</text><text x="72" y="1008" class="body">Order lifecycle | -&gt; dates.js, inventory.js, ledger.js</text><text x="72" y="1030" class="small">Called by routes/orders.js and server.js invoice route</text>
  <rect x="430" y="954" width="360" height="94" class="card"/>
  <text x="450" y="983" class="name">inventory.js</text><text x="450" y="1008" class="body">Stock checks and changes | -&gt; config.js</text>
  <rect x="808" y="954" width="360" height="94" class="card"/>
  <text x="828" y="983" class="name">pricing.js</text><text x="828" y="1008" class="body">Totals and tax calculation | -&gt; tax.js, coupons.js</text>
  <rect x="1186" y="954" width="362" height="94" class="card"/>
  <text x="1206" y="983" class="name">tax.js</text><text x="1206" y="1008" class="body">HSN GST rates and split | -&gt; config.js</text>

  <rect x="52" y="1062" width="360" height="94" class="card"/>
  <text x="72" y="1091" class="name">coupons.js</text><text x="72" y="1116" class="body">Coupon rules and discounts | -&gt; config.js</text>
  <rect x="430" y="1062" width="360" height="94" class="card"/>
  <text x="450" y="1091" class="name">ledger.js</text><text x="450" y="1116" class="body">Khata and settlements | -&gt; dates.js</text>
  <rect x="808" y="1062" width="360" height="94" class="card"/>
  <text x="828" y="1091" class="name">store.js</text><text x="828" y="1116" class="body">JSON persistence and audit log | -&gt; data/db.json</text>
  <rect x="1186" y="1062" width="362" height="94" class="card"/>
  <text x="1206" y="1091" class="name">dates.js</text><text x="1206" y="1116" class="body">Date formatting and normalization | no local imports</text>

  <rect x="52" y="1170" width="360" height="94" class="card"/>
  <text x="72" y="1199" class="name">invoice.js</text><text x="72" y="1224" class="body">Invoice calculations and HTML | -&gt; config.js</text>
  <rect x="430" y="1170" width="360" height="94" class="card"/>
  <text x="450" y="1199" class="name">reports.js</text><text x="450" y="1224" class="body">Dashboard and reconciliation | -&gt; inventory.js, ledger.js, invoice.js</text>
  <rect x="808" y="1170" width="740" height="94" class="amber"/>
  <text x="832" y="1202" class="name">config.js</text><text x="832" y="1228" class="body">No local module imports. Imported by server.js, routes/reports.js, tax.js, inventory.js, coupons.js, invoice.js.</text>

  <text x="52" y="1312" class="head">ORDER PLACEMENT | POST /api/orders</text>
  <rect x="52" y="1330" width="224" height="104" class="blue"/>
  <circle cx="76" cy="1355" r="13" class="num"/><text x="76" y="1355" class="numtxt">1</text><text x="98" y="1360" class="name">Submit cart</text><text x="72" y="1390" class="small">Product IDs, qty, coupon,</text><text x="72" y="1410" class="small">customer and payment mode</text>
  <rect x="304" y="1330" width="224" height="104" class="blue"/>
  <circle cx="328" cy="1355" r="13" class="num"/><text x="328" y="1355" class="numtxt">2</text><text x="350" y="1360" class="name">Read and resolve</text><text x="324" y="1390" class="small">store.read; find products;</text><text x="324" y="1410" class="small">inventory.check stock</text>
  <rect x="556" y="1330" width="224" height="104" class="blue"/>
  <circle cx="580" cy="1355" r="13" class="num"/><text x="580" y="1355" class="numtxt">3</text><text x="602" y="1360" class="name">Calculate</text><text x="576" y="1390" class="small">pricing + coupon validation;</text><text x="576" y="1410" class="small">tax.js resolves rates via HSN</text>
  <rect x="808" y="1330" width="224" height="104" class="blue"/>
  <circle cx="832" cy="1355" r="13" class="num"/><text x="832" y="1355" class="numtxt">4</text><text x="854" y="1360" class="name">Optional Khata</text><text x="828" y="1390" class="small">ledger validates account</text><text x="828" y="1410" class="small">and charges credit balance</text>
  <rect x="1060" y="1330" width="224" height="104" class="green"/>
  <circle cx="1084" cy="1355" r="13" class="num"/><text x="1084" y="1355" class="numtxt">5</text><text x="1106" y="1360" class="name">Commit</text><text x="1080" y="1390" class="small">reserve stock; add order;</text><text x="1080" y="1410" class="small">append audit; store.write</text>
  <rect x="1312" y="1330" width="236" height="104" class="green"/>
  <circle cx="1336" cy="1355" r="13" class="num"/><text x="1336" y="1355" class="numtxt">6</text><text x="1358" y="1360" class="name">Respond</text><text x="1332" y="1390" class="small">201 with order; browser</text><text x="1332" y="1410" class="small">shows result and refreshes</text>
  <path d="M276 1382H296" class="flow"/><path d="M528 1382H548" class="flow"/><path d="M780 1382H800" class="flow"/><path d="M1032 1382H1052" class="flow"/><path d="M1284 1382H1304" class="flow"/>
  <text x="52" y="1472" class="small">Persistent data is read and written through lib/store.js. The order ID counter advances in lib/orders.js; settlement IDs advance in lib/ledger.js.</text>
</svg>
