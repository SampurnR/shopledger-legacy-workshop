<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1440" viewBox="0 0 1800 1440" role="img" aria-labelledby="title desc">
<title id="title">ShopLedger architecture and order placement</title>
<desc id="desc">CP2 architecture of shopledger-legacy-workshop. UI, server, all four routers, all ten lib modules, config.js and data/db.json. Direct local imports are listed inside cards. Eight numbered steps trace POST /api/orders.</desc>
