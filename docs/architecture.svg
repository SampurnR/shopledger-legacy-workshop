<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">A map of the ShopLedger browser UI, Express server and routes, all library modules, configuration, JSON data store, and numbered order placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:750}.subtitle{font-size:14px;fill:#526176}.section{font-size:16px;font-weight:700;letter-spacing:.5px;fill:#42526b}.name{font-size:16px;font-weight:700}.path{font-size:12px;fill:#526176}.body{font-size:13px;fill:#334155}.small{font-size:11px;fill:#526176}.num{font-size:12px;font-weight:800;fill:white;text-anchor:middle;dominant-baseline:central}.node{stroke-width:1.5}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.orderEdge{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#arrowBlue)}.thin{fill:none;stroke:#94a3b8;stroke-width:1.5;marker-end:url(#arrow)}.dash{stroke-dasharray:6 5}
    </style>
  </defs>
  <rect width="1800" height="1260" fill="#f8fafc"/>
  <text x="54" y="55" class="title">ShopLedger · application architecture</text>
  <text x="55" y="82" class="subtitle">Browser POS → Express routes → business logic → JSON file store. Numbered blue arrows trace order placement.</text>

  <text x="54" y="125" class="section">BROWSER</text>
  <rect x="54" y="143" width="360" height="147" rx="12" fill="#eff6ff" stroke="#60a5fa" class="node"/>
  <text x="76" y="174" class="name">Shop desk UI</text><text x="76" y="196" class="path">public/index.html · public/js/app.js · public/css/style.css</text>
  <text x="76" y="226" class="body">POS · product search · cart preview</text><text x="76" y="248" class="body">Order register · khata · inventory/GST audit</text><text x="76" y="270" class="small">XHR JSON requests to /api/*; invoice opens in browser</text>

  <text x="485" y="125" class="section">EXPRESS APP</text>
  <rect x="485" y="143" width="300" height="147" rx="12" fill="#f1f5f9" stroke="#94a3b8" class="node"/>
  <text x="507" y="174" class="name">server.js</text><text x="507" y="196" class="path">Express · JSON body parser · static public/</text>
  <text x="507" y="226" class="body">Mounts four routers at /api</text><text x="507" y="248" class="body">GET /orders/:id/invoice → invoice.render</text><text x="507" y="270" class="small">Listens on config.port when run directly</text>
  <path d="M414 216 H485" class="edge"/><text x="427" y="204" class="small">HTTP</text>

  <text x="855" y="125" class="section">ROUTES · mounted at /api</text>
  <rect x="855" y="143" width="400" height="91" rx="10" fill="#f0fdf4" stroke="#4ade80" class="node"/>
  <text x="877" y="171" class="name">routes/orders.js</text><text x="877" y="193" class="body">GET /orders · GET /orders/:id · POST /orders</text><text x="877" y="215" class="body">POST /orders/:id/cancel</text>
  <rect x="1275" y="143" width="410" height="91" rx="10" fill="#f0fdf4" stroke="#4ade80" class="node"/>
  <text x="1297" y="171" class="name">routes/products.js</text><text x="1297" y="193" class="body">GET /products · GET /coupons</text>
  <rect x="855" y="251" width="400" height="91" rx="10" fill="#f0fdf4" stroke="#4ade80" class="node"/>
  <text x="877" y="279" class="name">routes/customers.js</text><text x="877" y="301" class="body">GET /customers · POST /customers/:id/settle</text>
  <rect x="1275" y="251" width="410" height="91" rx="10" fill="#f0fdf4" stroke="#4ade80" class="node"/>
  <text x="1297" y="279" class="name">routes/reports.js</text><text x="1297" y="301" class="body">Dashboard · GST reconciliation · pricing preview</text><text x="1297" y="323" class="body">GET /admin/export</text>
  <path d="M785 187 H855" class="edge"/><path d="M785 201 C1000 201 1100 160 1275 180" class="edge"/><path d="M785 230 C810 230 820 296 855 296" class="edge"/><path d="M785 249 C1020 249 1120 298 1275 298" class="edge"/>

  <text x="54" y="366" class="section">BUSINESS LOGIC · lib/</text>
  <!-- Core order flow -->
  <rect x="54" y="390" width="264" height="111" rx="10" fill="#dbeafe" stroke="#3b82f6" class="node"/>
  <circle cx="76" cy="412" r="13" fill="#2563eb"/><text x="76" y="412" class="num">1</text>
  <text x="98" y="417" class="name">inventory.js</text><text x="74" y="447" class="body">Resolve product · check sellable stock</text><text x="74" y="470" class="body">Deduct stock on placement</text>
  <rect x="346" y="390" width="264" height="111" rx="10" fill="#dbeafe" stroke="#3b82f6" class="node"/>
  <circle cx="368" cy="412" r="13" fill="#2563eb"/><text x="368" y="412" class="num">2</text>
  <text x="390" y="417" class="name">pricing.js</text><text x="366" y="447" class="body">Subtotal · discount allocation</text><text x="366" y="470" class="body">Tax per line · order total</text>
  <rect x="638" y="390" width="264" height="111" rx="10" fill="#dbeafe" stroke="#3b82f6" class="node"/>
  <circle cx="660" cy="412" r="13" fill="#2563eb"/><text x="660" y="412" class="num">3</text>
  <text x="682" y="417" class="name">coupons.js</text><text x="658" y="447" class="body">Normalize · validate · calculate</text><text x="658" y="470" class="body">Coupon rules from config.js</text>
  <rect x="930" y="390" width="264" height="111" rx="10" fill="#dbeafe" stroke="#3b82f6" class="node"/>
  <circle cx="952" cy="412" r="13" fill="#2563eb"/><text x="952" y="412" class="num">4</text>
  <text x="974" y="417" class="name">tax.js</text><text x="950" y="447" class="body">HSN slab lookup · 18% fallback</text><text x="950" y="470" class="body">CGST / SGST split</text>
  <rect x="1222" y="390" width="264" height="111" rx="10" fill="#dbeafe" stroke="#3b82f6" class="node"/>
  <circle cx="1244" cy="412" r="13" fill="#2563eb"/><text x="1244" y="412" class="num">5</text>
  <text x="1266" y="417" class="name">ledger.js</text><text x="1242" y="447" class="body">Khata credit limit / debit</text><text x="1242" y="470" class="body">Customer settlements / reversals</text>
  <rect x="1514" y="390" width="232" height="111" rx="10" fill="#dbeafe" stroke="#3b82f6" class="node"/>
  <circle cx="1536" cy="412" r="13" fill="#2563eb"/><text x="1536" y="412" class="num">6</text>
  <text x="1558" y="417" class="name">orders.js</text><text x="1534" y="447" class="body">Create / list / get / cancel</text><text x="1534" y="470" class="body">Uses dates.js</text>

  <path d="M1055 234 C1055 320 190 320 190 390" class="orderEdge"/><circle cx="219" cy="340" r="13" fill="#2563eb"/><text x="219" y="340" class="num">1</text><text x="241" y="345" class="small">POST /orders: validate items &amp; stock</text>
  <path d="M318 445 H346" class="orderEdge"/><path d="M610 445 H638" class="orderEdge"/><path d="M902 445 H930" class="orderEdge"/><path d="M1194 445 H1222" class="orderEdge"/><path d="M1486 445 H1514" class="orderEdge"/>
  <text x="313" y="428" class="small">2</text><text x="605" y="428" class="small">3</text><text x="897" y="428" class="small">4</text><text x="1189" y="428" class="small">5*</text><text x="1481" y="428" class="small">6</text>
  <path d="M1055 234 C1065 365 1354 330 1354 390" class="thin dash"/><text x="1366" y="365" class="small">config.js tax + coupon rules</text>
  <path d="M1055 234 C1090 352 1615 332 1615 390" class="thin"/>

  <!-- Supporting modules -->
  <rect x="54" y="543" width="264" height="105" rx="10" fill="#f5f3ff" stroke="#a78bfa" class="node"/>
  <text x="76" y="574" class="name">store.js</text><text x="76" y="598" class="body">Read / write db.json synchronously</text><text x="76" y="621" class="body">Append capped audit log</text>
  <rect x="346" y="543" width="264" height="105" rx="10" fill="#f5f3ff" stroke="#a78bfa" class="node"/>
  <text x="368" y="574" class="name">dates.js</text><text x="368" y="598" class="body">Today · date key normalization</text><text x="368" y="621" class="body">Fiscal year helper</text>
  <rect x="638" y="543" width="264" height="105" rx="10" fill="#f5f3ff" stroke="#a78bfa" class="node"/>
  <text x="660" y="574" class="name">invoice.js</text><text x="660" y="598" class="body">Invoice figures · escaped HTML render</text><text x="660" y="621" class="body">Printable invoice view</text>
  <rect x="930" y="543" width="264" height="105" rx="10" fill="#f5f3ff" stroke="#a78bfa" class="node"/>
  <text x="952" y="574" class="name">reports.js</text><text x="952" y="598" class="body">Dashboard totals · GST reconciliation</text><text x="952" y="621" class="body">Uses inventory, ledger, invoice</text>
  <rect x="1222" y="543" width="264" height="105" rx="10" fill="#f5f3ff" stroke="#a78bfa" class="node"/>
  <text x="1244" y="574" class="name">config.js</text><text x="1244" y="598" class="body">Shop details · port · admin key</text><text x="1244" y="621" class="body">GST slabs · inventory defaults · coupons</text>
  <path d="M1615 501 V523 H480 V543" class="thin"/><text x="475" y="535" class="small">date helpers</text>
  <path d="M1055 342 V543" class="thin"/><text x="1067" y="531" class="small">dashboard / reports route</text>
  <path d="M1055 342 C1040 465 770 456 770 543" class="thin"/><text x="790" y="527" class="small">invoice figures</text>
  <path d="M1055 342 C1050 470 1060 500 1060 543" class="thin"/>

  <!-- Persistence and lifecycle -->
  <text x="54" y="701" class="section">PERSISTENCE &amp; ORDER LIFECYCLE</text>
  <rect x="54" y="729" width="370" height="118" rx="12" fill="#fff7ed" stroke="#fb923c" class="node"/>
  <text x="78" y="762" class="name">data/db.json</text><text x="78" y="788" class="body">Products · customers · orders · settlements</text><text x="78" y="812" class="body">Counters · audit log</text>
  <path d="M190 501 V683 H238 V729" class="orderEdge"/><text x="251" y="687" class="small">7 · stock deduction</text>
  <path d="M1615 501 V681 H360 V729" class="orderEdge"/><text x="676" y="679" class="small">8 · create order + audit → store.write()</text>
  <path d="M186 648 V729" class="edge"/><text x="198" y="709" class="small">read / write</text>
  <path d="M1380 648 V690 H390 V729" class="thin"/><text x="1180" y="684" class="small">runtime settings / GST / coupon lookup</text>

  <rect x="500" y="729" width="390" height="118" rx="12" fill="#eff6ff" stroke="#60a5fa" class="node"/>
  <text x="524" y="762" class="name">Order response</text><text x="524" y="788" class="body">POST /api/orders returns HTTP 201 + order JSON</text><text x="524" y="812" class="body">Browser refreshes order, stock, khata, dashboard views</text>
  <path d="M1615 501 C1665 620 830 630 830 729" class="orderEdge"/><text x="900" y="698" class="small">9 · return created order</text>
  <path d="M500 785 H424" class="edge"/><text x="435" y="772" class="small">persist</text>

  <rect x="970" y="729" width="350" height="118" rx="12" fill="#f8fafc" stroke="#94a3b8" class="node"/>
  <text x="994" y="762" class="name">Other flows</text><text x="994" y="788" class="body">Cancel → orders.js → inventory.release</text><text x="994" y="812" class="body">Settle → ledger.js → settlement + balance</text>
  <rect x="1400" y="729" width="346" height="118" rx="12" fill="#f8fafc" stroke="#94a3b8" class="node"/>
  <text x="1424" y="762" class="name">Reporting &amp; invoice</text><text x="1424" y="788" class="body">reports.js → dashboard / reconciliation JSON</text><text x="1424" y="812" class="body">GET /orders/:id/invoice → invoice.js → HTML</text>
  <path d="M1200 342 V700 H1145 V729" class="thin"/><path d="M1440 342 V700 H1570 V729" class="thin"/>

  <rect x="54" y="890" width="1692" height="290" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="80" y="928" class="section">ORDER PLACEMENT · END TO END</text>
  <g>
    <circle cx="93" cy="973" r="15" fill="#2563eb"/><text x="93" y="973" class="num">1</text><text x="120" y="969" class="body">Browser POST /api/orders</text><text x="120" y="990" class="small">items, coupon, customer, payment mode</text>
    <circle cx="444" cy="973" r="15" fill="#2563eb"/><text x="444" y="973" class="num">2</text><text x="471" y="969" class="body">orders route resolves catalog</text><text x="471" y="990" class="small">inventory.check validates sellable quantities</text>
    <circle cx="824" cy="973" r="15" fill="#2563eb"/><text x="824" y="973" class="num">3</text><text x="851" y="969" class="body">pricing + coupons + tax</text><text x="851" y="990" class="small">subtotal → discount → GST → total</text>
    <circle cx="1178" cy="973" r="15" fill="#2563eb"/><text x="1178" y="973" class="num">4</text><text x="1205" y="969" class="body">Optional khata debit</text><text x="1205" y="990" class="small">customer + credit limit check</text>
    <path d="M300 973 H418" class="orderEdge"/><path d="M678 973 H798" class="orderEdge"/><path d="M1065 973 H1152" class="orderEdge"/><path d="M1435 973 H1493" class="orderEdge"/>
    <circle cx="1510" cy="973" r="15" fill="#2563eb"/><text x="1510" y="973" class="num">5</text><text x="1537" y="969" class="body">inventory.reserve*</text><text x="1537" y="990" class="small">deduct physical stock</text>
  </g>
  <path d="M1510 995 C1510 1060 1230 1060 1230 1060" class="orderEdge"/>
  <circle cx="1190" cy="1060" r="15" fill="#2563eb"/><text x="1190" y="1060" class="num">6</text><text x="1217" y="1055" class="body">orders.add creates record</text><text x="1217" y="1077" class="small">status defaults to completed</text>
  <path d="M1120 1060 H830" class="orderEdge"/>
  <circle cx="805" cy="1060" r="15" fill="#2563eb"/><text x="805" y="1060" class="num">7</text><text x="832" y="1055" class="body">append audit + write db.json</text><text x="832" y="1077" class="small">store.js serializes the whole file</text>
  <path d="M700 1060 H410" class="orderEdge"/>
  <circle cx="385" cy="1060" r="15" fill="#2563eb"/><text x="385" y="1060" class="num">8</text><text x="412" y="1055" class="body">HTTP 201 returns order</text><text x="412" y="1077" class="small">UI reloads affected views</text>
  <text x="80" y="1140" class="small">* Function name is reserve; its implementation subtracts ordered quantity from product.stock.</text>
  <text x="80" y="1162" class="small">Supporting modules shown above are connected where used; report, settlement, cancellation, and invoice paths are separate from placing an order.</text>

  <g transform="translate(1300 1210)"><path d="M0 0 H50" class="orderEdge"/><text x="62" y="5" class="small">Order placement flow</text><path d="M220 0 H270" class="edge"/><text x="282" y="5" class="small">Other module / data dependency</text></g>
</svg>
