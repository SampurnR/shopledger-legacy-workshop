<text x="48" y="145" class="section">ENTRY POINTS &amp; SHARED DATA</text>
<rect x="48" y="164" width="360" height="224" rx="13" fill="white" stroke="#d6dfeb"/><rect x="48" y="177" width="5" height="198" rx="2" fill="#2563eb"/>
