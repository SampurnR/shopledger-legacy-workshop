<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Architecture map of the ShopLedger UI, Express server, API routers, library modules, configuration, and JSON datastore. A highlighted numbered path shows order placement.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <marker id="orderArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e87932"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity=".08"/></filter>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172033}.title{font-size:32px;font-weight:750}.sub{font-size:15px;fill:#64748b}.section{font-size:13px;font-weight:750;letter-spacing:1.5px;fill:#64748b}.name{font-size:17px;font-weight:700}.desc{font-size:12px;fill:#526176}.small{font-size:11px;fill:#64748b}.step{font-size:12px;font-weight:800;fill:#fff}.edge{fill:none;stroke:#94a3b8;stroke-width:2;marker-end:url(#arrow)}.flow{fill:none;stroke:#e87932;stroke-width:3;marker-end:url(#orderArrow)}.box{filter:url(#shadow)}
    </style>
  </defs>
  <rect width="1600" height="1120" fill="#f6f8fb"/>
  <text x="64" y="60" class="title">ShopLedger · application architecture</text>
  <text x="64" y="88" class="sub">One-page map of the app modules and the order placement path</text>
  <rect x="1220" y="45" width="316" height="42" rx="21" fill="#fff1e7" stroke="#f2c19f"/>
  <circle cx="1245" cy="66" r="11" fill="#e87932"/><text x="1241" y="70" class="step">1</text>
  <text x="1264" y="71" font-size="13" font-weight="700" fill="#9a4b1a">Order placement flow</text>

  <!-- UI -->
  <text x="64" y="137" class="section">BROWSER UI</text>
  <g class="box"><rect x="64" y="153" width="320" height="112" rx="14" fill="#e9f2ff" stroke="#b9d1f3"/>
    <text x="88" y="186" class="name">public/</text><text x="88" y="211" class="desc">index.html · app.js · css/style.css</text><text x="88" y="237" class="small">POS · order history · khata · audit</text></g>
  <g class="box"><rect x="492" y="153" width="300" height="112" rx="14" fill="#edf7f3" stroke="#b8ddcc"/>
    <text x="516" y="186" class="name">server.js</text><text x="516" y="211" class="desc">Express app · static UI · route mounting</text><text x="516" y="237" class="small">Also serves /orders/:id/invoice</text></g>
  <path d="M384 209H485" class="edge"/><text x="407" y="196" class="small">HTTP</text>

  <!-- Routers -->
  <text x="64" y="315" class="section">API ROUTERS · routes/</text>
  <g class="box"><rect x="64" y="333" width="300" height="88" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="86" y="365" class="name">products.js</text><text x="86" y="392" class="desc">products · coupons</text></g>
  <g class="box"><rect x="394" y="333" width="300" height="88" rx="12" fill="#fff1e7" stroke="#efb58c" stroke-width="2"/><text x="416" y="365" class="name">orders.js</text><text x="416" y="392" class="desc">list · create · cancel</text></g>
  <g class="box"><rect x="724" y="333" width="300" height="88" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="746" y="365" class="name">customers.js</text><text x="746" y="392" class="desc">customers · settlements</text></g>
  <g class="box"><rect x="1054" y="333" width="300" height="88" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="1076" y="365" class="name">reports.js</text><text x="1076" y="392" class="desc">dashboard · GST · preview · export</text></g>
  <path d="M642 265V295H214V326" class="edge"/><path d="M642 295H544V326" class="flow"/><path d="M642 295H874V326" class="edge"/><path d="M642 295H1204V326" class="edge"/>

  <!-- Shared modules -->
  <text x="64" y="474" class="section">BUSINESS LOGIC · lib/</text>
  <g class="box"><rect x="64" y="494" width="270" height="88" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="86" y="526" class="name">inventory.js</text><text x="86" y="553" class="desc">stock lookup · check · reserve</text></g>
  <g class="box"><rect x="354" y="494" width="270" height="88" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="376" y="526" class="name">pricing.js</text><text x="376" y="553" class="desc">subtotal · totals · GST lines</text></g>
  <g class="box"><rect x="644" y="494" width="270" height="88" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="666" y="526" class="name">coupons.js</text><text x="666" y="553" class="desc">coupon rules · discounts</text></g>
  <g class="box"><rect x="934" y="494" width="270" height="88" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="956" y="526" class="name">ledger.js</text><text x="956" y="553" class="desc">customer credit · settlements</text></g>
  <g class="box"><rect x="1224" y="494" width="300" height="88" rx="12" fill="#fff1e7" stroke="#efb58c" stroke-width="2"/><text x="1246" y="526" class="name">orders.js</text><text x="1246" y="553" class="desc">add · get · cancel · list</text></g>

  <g class="box"><rect x="64" y="621" width="270" height="78" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="86" y="652" class="name">tax.js</text><text x="86" y="677" class="desc">HSN slab · CGST/SGST split</text></g>
  <g class="box"><rect x="354" y="621" width="270" height="78" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="376" y="652" class="name">dates.js</text><text x="376" y="677" class="desc">today · date key · fiscal year</text></g>
  <g class="box"><rect x="644" y="621" width="270" height="78" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="666" y="652" class="name">invoice.js</text><text x="666" y="677" class="desc">invoice figures · HTML render</text></g>
  <g class="box"><rect x="934" y="621" width="270" height="78" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="956" y="652" class="name">reports.js</text><text x="956" y="677" class="desc">dashboard · GST reconciliation</text></g>
  <g class="box"><rect x="1224" y="621" width="300" height="78" rx="12" fill="#edf7f3" stroke="#b8ddcc"/><text x="1246" y="652" class="name">store.js</text><text x="1246" y="677" class="desc">read · write · appendAudit</text></g>

  <!-- router to module dependencies -->
  <path d="M214 421V458H199V486" class="edge"/><path d="M214 458H779V486" class="edge"/><path d="M214 458H199V613" class="edge"/>
  <path d="M544 421V465H199V486" class="flow"/><path d="M544 465H489V486" class="flow"/><path d="M544 465H779V486" class="flow"/><path d="M544 465H1069V486" class="flow"/><path d="M544 465H1374V486" class="flow"/>
  <path d="M874 421V458H1069V486" class="edge"/>
  <path d="M1204 421V451H199V486" class="edge"/><path d="M1204 451H779V486" class="edge"/><path d="M1204 451H1069V613" class="edge"/><path d="M1204 451H779V613" class="edge"/>
  <!-- helper dependencies -->
  <path d="M489 582V613" class="edge"/><path d="M779 582V613" class="edge"/><path d="M1374 582V613" class="edge"/>

  <!-- Flow numbering along placement path -->
  <circle cx="544" cy="454" r="12" fill="#e87932"/><text x="540" y="458" class="step">1</text>
  <circle cx="199" cy="482" r="12" fill="#e87932"/><text x="195" y="486" class="step">2</text>
  <circle cx="489" cy="482" r="12" fill="#e87932"/><text x="485" y="486" class="step">3</text>
  <circle cx="1069" cy="482" r="12" fill="#e87932"/><text x="1065" y="486" class="step">4</text>
  <circle cx="1374" cy="482" r="12" fill="#e87932"/><text x="1370" y="486" class="step">5</text>

  <!-- persistence and config -->
  <text x="64" y="762" class="section">RUNTIME DATA &amp; SETTINGS</text>
  <g class="box"><rect x="64" y="782" width="510" height="104" rx="14" fill="#f0edff" stroke="#cec5f4"/><text x="90" y="817" class="name">config.js</text><text x="90" y="843" class="desc">port · shop details · tax slabs · inventory defaults · coupons · admin key</text><text x="90" y="865" class="small">Used by app and business logic</text></g>
  <g class="box"><rect x="1026" y="782" width="498" height="104" rx="14" fill="#e7f7ed" stroke="#b6dfc3" stroke-width="2"/><text x="1052" y="817" class="name">data/db.json</text><text x="1052" y="843" class="desc">products · orders · customers · settlements · auditLog · IDs</text><text x="1052" y="865" class="small">Local JSON file read and written by lib/store.js</text></g>
  <path d="M1374 699V742H1275V775" class="edge"/>
  <path d="M574 834H1018" class="edge"/><text x="698" y="822" class="small">settings consumed by modules</text>
  <!-- order write path -->
  <path d="M1374 582V735H1472V775" class="flow"/>
  <circle cx="1472" cy="735" r="12" fill="#e87932"/><text x="1468" y="739" class="step">6</text>
  <path d="M1270 782V744H1186V707" class="edge"/>

  <rect x="64" y="936" width="1472" height="116" rx="16" fill="#fff" stroke="#dbe2ea"/>
  <text x="92" y="971" class="section">ORDER PLACEMENT · POST /api/orders</text>
  <text x="92" y="1005" font-size="14" font-weight="650" fill="#344256">1 UI submits cart</text><text x="270" y="1005" font-size="14" fill="#e87932">→</text>
  <text x="300" y="1005" font-size="14" font-weight="650" fill="#344256">2 orders route resolves products &amp; checks stock</text><text x="692" y="1005" font-size="14" fill="#e87932">→</text>
  <text x="722" y="1005" font-size="14" font-weight="650" fill="#344256">3 pricing + coupons calculate totals</text><text x="1030" y="1005" font-size="14" fill="#e87932">→</text>
  <text x="1060" y="1005" font-size="14" font-weight="650" fill="#344256">4 ledger checks khata when selected</text>
  <text x="92" y="1032" font-size="14" font-weight="650" fill="#344256">5 inventory decrements stock; orders module creates the record</text><text x="618" y="1032" font-size="14" fill="#e87932">→</text>
  <text x="648" y="1032" font-size="14" font-weight="650" fill="#344256">6 store writes updated db.json and audit entry</text>
</svg>
