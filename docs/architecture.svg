<text x="68" y="982" class="small">Add · get · cancel · filter · sort</text>
<text x="68" y="1008" class="small">Imports: dates · inventory · ledger</text>
<rect x="394" y="917" width="320" height="120" rx="13" fill="white" stroke="#d6dfeb"/><rect x="394" y="930" width="5" height="94" rx="2" fill="#0f766e"/>
<text x="414" y="951" class="name">ledger.js</text>
<text x="414" y="982" class="small">Credit limits · debits · settlements</text>
<text x="414" y="1008" class="small">Imports: dates</text>
<rect x="740" y="917" width="320" height="120" rx="13" fill="white" stroke="#d6dfeb"/><rect x="740" y="930" width="5" height="94" rx="2" fill="#0f766e"/>
<text x="760" y="951" class="name">dates.js</text>
<text x="760" y="982" class="small">Today · filter keys · fiscal year</text>
<text x="760" y="1008" class="small">No direct local imports</text>
<rect x="1086" y="917" width="320" height="120" rx="13" fill="white" stroke="#d6dfeb"/><rect x="1086" y="930" width="5" height="94" rx="2" fill="#0f766e"/>
<text x="1106" y="951" class="name">invoice.js</text>
<text x="1106" y="982" class="small">Shared checkout totals · HTML</text>
<text x="1106" y="1008" class="small">Imports: config · pricing</text>
<rect x="1432" y="917" width="320" height="120" rx="13" fill="white" stroke="#d6dfeb"/><rect x="1432" y="930" width="5" height="94" rx="2" fill="#0f766e"/>
<text x="1452" y="951" class="name">reports.js</text>
<text x="1452" y="982" class="small">Dashboard · invoice reconciliation</text>
<text x="1452" y="1008" class="small">Imports: inventory · ledger · invoice</text>
<text x="48" y="1060" class="section">PLACE AN ORDER · execution sequence in routes/orders.js</text>
<text x="48" y="1090" class="small">POST /api/orders → read catalog → validate → compute → mutate in memory → persist → HTTP 201</text>
<rect x="48" y="1120" width="199" height="177" rx="12" fill="#e6eef9" stroke="#c2d3e9"/>
<circle cx="71" cy="1144" r="13" fill="#2563eb"/>
<text x="67" y="1150" class="small" style="fill:white">1</text>
<text x="60" y="1183" class="flowtitle">Browser → server</text>
<text x="60" y="1214" class="flowbody">app.js sends item IDs,</text>
<text x="60" y="1238" class="flowbody">quantities, customer,</text>
<text x="60" y="1262" class="flowbody">payment, status, coupon</text>
<path d="M 248 1200 H 261" class="wire"/>
<rect x="263" y="1120" width="199" height="177" rx="12" fill="#e6eef9" stroke="#c2d3e9"/>
<circle cx="286" cy="1144" r="13" fill="#2563eb"/>
<text x="282" y="1150" class="small" style="fill:white">2</text>
<text x="275" y="1183" class="flowtitle">Read &amp; resolve</text>
<text x="275" y="1214" class="flowbody">store.read() loads JSON;</text>
<text x="275" y="1238" class="flowbody">router resolves catalog</text>
<text x="275" y="1262" class="flowbody">prices and parses qty</text>
<path d="M 463 1200 H 476" class="wire"/>
<rect x="478" y="1120" width="199" height="177" rx="12" fill="#e6eef9" stroke="#c2d3e9"/>
<circle cx="501" cy="1144" r="13" fill="#2563eb"/>
<text x="497" y="1150" class="small" style="fill:white">3</text>
<text x="490" y="1183" class="flowtitle">Stock &amp; coupon</text>
<text x="490" y="1214" class="flowbody">inventory.check();</text>
<text x="490" y="1238" class="flowbody">coupons.validate()</text>
<text x="490" y="1262" class="flowbody">rejects invalid requests</text>
<path d="M 678 1200 H 691" class="wire"/>
<rect x="693" y="1120" width="199" height="177" rx="12" fill="#e6eef9" stroke="#c2d3e9"/>
<circle cx="716" cy="1144" r="13" fill="#2563eb"/>
<text x="712" y="1150" class="small" style="fill:white">4</text>
<text x="705" y="1183" class="flowtitle">Calculate totals</text>
<text x="705" y="1214" class="flowbody">pricing.computeTotals()</text>
<text x="705" y="1238" class="flowbody">uses coupons + tax</text>
<text x="705" y="1262" class="flowbody">for checkout figures</text>
<path d="M 893 1200 H 906" class="wire"/>
<rect x="908" y="1120" width="199" height="177" rx="12" fill="#e6eef9" stroke="#c2d3e9"/>
<circle cx="931" cy="1144" r="13" fill="#2563eb"/>
<text x="927" y="1150" class="small" style="fill:white">5</text>
<text x="920" y="1183" class="flowtitle">Khata, if selected</text>
<text x="920" y="1214" class="flowbody">ledger checks credit limit</text>
<text x="920" y="1238" class="flowbody">and charges the order</text>
<text x="920" y="1262" class="flowbody">to the customer account</text>
<path d="M 1108 1200 H 1121" class="wire"/>
<rect x="1123" y="1120" width="199" height="177" rx="12" fill="#e6eef9" stroke="#c2d3e9"/>
<circle cx="1146" cy="1144" r="13" fill="#2563eb"/>
<text x="1142" y="1150" class="small" style="fill:white">6</text>
<text x="1135" y="1183" class="flowtitle">Commit stock</text>
<text x="1135" y="1214" class="flowbody">inventory.reserve()</text>
<text x="1135" y="1238" class="flowbody">deducts physical stock,</text>
<text x="1135" y="1262" class="flowbody">including pending orders</text>
<path d="M 1323 1200 H 1336" class="wire"/>
<rect x="1338" y="1120" width="199" height="177" rx="12" fill="#e6eef9" stroke="#c2d3e9"/>
<circle cx="1361" cy="1144" r="13" fill="#2563eb"/>
<text x="1357" y="1150" class="small" style="fill:white">7</text>
<text x="1350" y="1183" class="flowtitle">Record &amp; persist</text>
<text x="1350" y="1214" class="flowbody">orders.add() + audit entry;</text>
<text x="1350" y="1238" class="flowbody">store.write() rewrites</text>
<text x="1350" y="1262" class="flowbody">data/db.json</text>
<path d="M 1538 1200 H 1551" class="wire"/>
<rect x="1553" y="1120" width="199" height="177" rx="12" fill="#e6eef9" stroke="#c2d3e9"/>
<circle cx="1576" cy="1144" r="13" fill="#2563eb"/>
<text x="1572" y="1150" class="small" style="fill:white">8</text>
<text x="1565" y="1183" class="flowtitle">Return &amp; refresh</text>
<text x="1565" y="1214" class="flowbody">HTTP 201 → browser;</text>
<text x="1565" y="1238" class="flowbody">refresh stock &amp; balances.</text>
<text x="1565" y="1262" class="flowbody">Invoice opens separately</text>
<text x="48" y="1344" class="body">Invoice flow: invoice.js reuses pricing.js for checkout totals and GST; reports.js checks the stored ledger.</text>
<text x="48" y="1376" class="small">* PORT can override 3000. Arrows show request routing and order sequence; cards document imports.</text>
<text x="48" y="1409" class="small">Documentation only · no application code or database changes</text>
<path d="M 1752 320 H 1779 V 835 H 1752" class="wire" style="marker-start:url(#arrow)"/>
</svg>