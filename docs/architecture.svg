<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Architecture of ShopLedger, showing the browser UI, Express server and routers, library modules, config, JSON data store, and the order placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="flowArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <style>
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}
      .title{font-size:32px;font-weight:750}.sub{font-size:15px;fill:#526078}
      .section{font-size:16px;font-weight:700;letter-spacing:.08em;fill:#526078}
      .label{font-size:16px;font-weight:650}.small{font-size:13px;fill:#526078}
      .box{stroke-width:1.5}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
      .flow{fill:none;stroke:#0f766e;stroke-width:3;marker-end:url(#flowArrow)}
      .dash{stroke-dasharray:7 6}
    </style>
  </defs>
  <rect width="1800" height="1180" fill="#f7f9fc"/>
  <text x="64" y="62" class="title">ShopLedger · Application Architecture</text>
  <text x="64" y="91" class="sub">Browser POS · Express API · JSON file storage</text>

  <!-- Browser UI -->
  <rect x="60" y="135" width="360" height="230" rx="18" fill="#eaf2ff" stroke="#9bbcf1" class="box"/>
  <text x="86" y="171" class="section">BROWSER UI</text>
  <rect x="88" y="195" width="304" height="58" rx="10" fill="#fff" stroke="#c8d8f1" class="box"/>
  <text x="108" y="221" class="label">public/index.html</text><text x="108" y="241" class="small">POS · orders · khata · audit</text>
  <rect x="88" y="270" width="304" height="58" rx="10" fill="#fff" stroke="#c8d8f1" class="box"/>
  <text x="108" y="296" class="label">public/js/app.js</text><text x="108" y="316" class="small">Calls /api endpoints with JSON</text>
  <text x="86" y="350" class="small">public/css/style.css</text>

  <!-- Server -->
  <rect x="485" y="135" width="260" height="230" rx="18" fill="#eef2f6" stroke="#aab5c4" class="box"/>
  <text x="511" y="171" class="section">HTTP SERVER</text>
  <rect x="513" y="204" width="204" height="76" rx="12" fill="#fff" stroke="#c8d0db" class="box"/>
  <text x="535" y="235" class="label">server.js</text><text x="535" y="258" class="small">Express · static files</text>
  <rect x="513" y="298" width="204" height="44" rx="10" fill="#fff" stroke="#c8d0db" class="box"/>
  <text x="535" y="326" class="label">/orders/:id/invoice</text>

  <!-- Routes -->
  <rect x="805" y="125" width="420" height="430" rx="18" fill="#fff4e8" stroke="#e9bd88" class="box"/>
  <text x="833" y="162" class="section">ROUTERS · routes/</text>
  <rect x="835" y="184" width="360" height="68" rx="11" fill="#fff" stroke="#efd1ad" class="box"/>
  <text x="856" y="212" class="label">products.js</text><text x="856" y="235" class="small">GET products · coupons</text>
  <rect x="835" y="265" width="360" height="92" rx="11" fill="#fff" stroke="#efd1ad" class="box"/>
  <text x="856" y="293" class="label">orders.js</text><text x="856" y="316" class="small">GET orders · POST orders · cancel</text><text x="856" y="338" class="small">Order placement flow highlighted</text>
  <rect x="835" y="370" width="360" height="68" rx="11" fill="#fff" stroke="#efd1ad" class="box"/>
  <text x="856" y="398" class="label">customers.js</text><text x="856" y="421" class="small">GET customers · settle khata</text>
  <rect x="835" y="451" width="360" height="78" rx="11" fill="#fff" stroke="#efd1ad" class="box"/>
  <text x="856" y="479" class="label">reports.js</text><text x="856" y="502" class="small">dashboard · GST reconciliation · pricing preview</text><text x="856" y="521" class="small">admin export</text>

  <!-- lib modules -->
  <rect x="1285" y="125" width="455" height="660" rx="18" fill="#eaf8f4" stroke="#8dcbb9" class="box"/>
  <text x="1313" y="162" class="section">BUSINESS LOGIC · lib/</text>
  <rect x="1315" y="185" width="190" height="67" rx="10" fill="#fff" stroke="#b7dfd3" class="box"/><text x="1333" y="214" class="label">orders.js</text><text x="1333" y="237" class="small">create · cancel · list</text>
  <rect x="1520" y="185" width="190" height="67" rx="10" fill="#fff" stroke="#b7dfd3" class="box"/><text x="1538" y="214" class="label">inventory.js</text><text x="1538" y="237" class="small">check · reserve · release</text>
  <rect x="1315" y="267" width="190" height="67" rx="10" fill="#fff" stroke="#b7dfd3" class="box"/><text x="1333" y="296" class="label">pricing.js</text><text x="1333" y="319" class="small">subtotal · GST · totals</text>
  <rect x="1520" y="267" width="190" height="67" rx="10" fill="#fff" stroke="#b7dfd3" class="box"/><text x="1538" y="296" class="label">coupons.js</text><text x="1538" y="319" class="small">validate · discount</text>
  <rect x="1315" y="349" width="190" height="67" rx="10" fill="#fff" stroke="#b7dfd3" class="box"/><text x="1333" y="378" class="label">tax.js</text><text x="1333" y="401" class="small">HSN rate · CGST / SGST</text>
  <rect x="1520" y="349" width="190" height="67" rx="10" fill="#fff" stroke="#b7dfd3" class="box"/><text x="1538" y="378" class="label">ledger.js</text><text x="1538" y="401" class="small">khata balances · settlements</text>
  <rect x="1315" y="431" width="190" height="67" rx="10" fill="#fff" stroke="#b7dfd3" class="box"/><text x="1333" y="460" class="label">reports.js</text><text x="1333" y="483" class="small">dashboard · reconciliation</text>
  <rect x="1520" y="431" width="190" height="67" rx="10" fill="#fff" stroke="#b7dfd3" class="box"/><text x="1538" y="460" class="label">invoice.js</text><text x="1538" y="483" class="small">figures · printable HTML</text>
  <rect x="1315" y="513" width="190" height="67" rx="10" fill="#fff" stroke="#b7dfd3" class="box"/><text x="1333" y="542" class="label">store.js</text><text x="1333" y="565" class="small">read / write db.json · audit</text>
  <rect x="1520" y="513" width="190" height="67" rx="10" fill="#fff" stroke="#b7dfd3" class="box"/><text x="1538" y="542" class="label">dates.js</text><text x="1538" y="565" class="small">date formatting · fiscal year</text>
  <text x="1316" y="624" class="small">Routers call these modules to apply shop rules.</text>
  <text x="1316" y="647" class="small">Order placement uses orders, inventory, pricing,</text>
  <text x="1316" y="670" class="small">coupons, ledger and store.</text>

  <!-- storage and config -->
  <rect x="805" y="625" width="420" height="145" rx="18" fill="#f1edff" stroke="#b9a9e8" class="box"/>
  <text x="833" y="662" class="section">SETTINGS &amp; PERSISTENCE</text>
  <rect x="835" y="680" width="168" height="62" rx="10" fill="#fff" stroke="#d3c8f1" class="box"/><text x="851" y="708" class="label">config.js</text><text x="851" y="729" class="small">shop · tax · coupons</text>
  <rect x="1020" y="680" width="175" height="62" rx="10" fill="#fff" stroke="#d3c8f1" class="box"/><text x="1036" y="708" class="label">data/db.json</text><text x="1036" y="729" class="small">products · orders · customers</text>

  <!-- Order flow strip -->
  <rect x="60" y="835" width="1680" height="285" rx="20" fill="#e9f7f5" stroke="#71b7a9" stroke-width="2"/>
  <text x="90" y="876" class="section" style="fill:#0f766e">PLACE AN ORDER · REQUEST AND COMMIT FLOW</text>
  <g>
    <rect x="92" y="920" width="210" height="108" rx="14" fill="#fff" stroke="#9bcfc3" class="box"/><text x="112" y="953" class="label">1 · POS</text><text x="112" y="979" class="small">Choose items, customer,</text><text x="112" y="999" class="small">coupon and payment</text>
    <rect x="357" y="920" width="210" height="108" rx="14" fill="#fff" stroke="#9bcfc3" class="box"/><text x="377" y="953" class="label">2 · POST /orders</text><text x="377" y="979" class="small">public/js/app.js →</text><text x="377" y="999" class="small">routes/orders.js</text>
    <rect x="622" y="920" width="210" height="108" rx="14" fill="#fff" stroke="#9bcfc3" class="box"/><text x="642" y="953" class="label">3 · Validate</text><text x="642" y="979" class="small">inventory.check · coupon</text><text x="642" y="999" class="small">validation · pricing totals</text>
    <rect x="887" y="920" width="210" height="108" rx="14" fill="#fff" stroke="#9bcfc3" class="box"/><text x="907" y="953" class="label">4 · Credit (if khata)</text><text x="907" y="979" class="small">ledger.chargeOrderToKhata</text><text x="907" y="999" class="small">checks credit limit</text>
    <rect x="1152" y="920" width="210" height="108" rx="14" fill="#fff" stroke="#9bcfc3" class="box"/><text x="1172" y="953" class="label">5 · Commit</text><text x="1172" y="979" class="small">inventory.reserve · orders.add</text><text x="1172" y="999" class="small">append audit entry</text>
    <rect x="1417" y="920" width="260" height="108" rx="14" fill="#fff" stroke="#9bcfc3" class="box"/><text x="1437" y="953" class="label">6 · Save and respond</text><text x="1437" y="979" class="small">store.write(db.json) →</text><text x="1437" y="999" class="small">201 order JSON to POS</text>
    <path d="M302 974 H350" class="flow"/><path d="M567 974 H615" class="flow"/><path d="M832 974 H880" class="flow"/><path d="M1097 974 H1145" class="flow"/><path d="M1362 974 H1410" class="flow"/>
  </g>
  <text x="92" y="1075" class="small">Pricing preview uses POST /pricing/preview in routes/reports.js; final totals are recalculated when the order is placed.</text>
  <text x="92" y="1098" class="small">Arrows above show app relationships; teal arrows show the sequential order placement flow.</text>

  <!-- High-level connections -->
  <path d="M420 250 H477" class="line"/><text x="424" y="236" class="small">HTTP / JSON</text>
  <path d="M745 250 H797" class="line"/><text x="748" y="236" class="small">/api</text>
  <path d="M1225 305 H1277" class="line"/>
  <path d="M1225 710 H1260 V548 H1307" class="line dash"/>
  <path d="M1500 785 V815 H1110 V795" class="line dash"/>
  <path d="M1004 625 V580 H740 V364" class="line dash"/>
  <text x="1017" y="605" class="small">config used by routes and lib</text>
</svg>
