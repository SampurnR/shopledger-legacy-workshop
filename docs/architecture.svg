<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1440" viewBox="0 0 1800 1440" role="img" aria-labelledby="title desc">
<title id="title">ShopLedger architecture and order flow</title>
<desc id="desc">Actual browser, Express routes, all ten library modules, config and JSON store. Highlighted order flow and the existing divergent invoice path selected for ticket one.</desc>
<defs>
 <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dfe4e2"/></pattern>
 <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#526875"/></marker>
 <marker id="gold" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#a86d15"/></marker>
 <style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#172c36}.eyebrow{font-size:16px;letter-spacing:3px;fill:#4a666f;font-weight:700}.heading{font-size:25px;font-weight:700}.file{font-size:21px;font-family:Consolas,monospace;font-weight:700}.body{font-size:18px;fill:#4a626d}.small{font-size:16px;fill:#4a626d}.box{fill:white;stroke:#c7d4d6;stroke-width:1.5}.edge{fill:none;stroke:#526875;stroke-width:2;marker-end:url(#arrow)}.order{fill:none;stroke:#a86d15;stroke-width:3;marker-end:url(#gold)}</style>
</defs>
<rect width="1800" height="1440" fill="#f5f5ef"/><rect width="1800" height="1440" fill="url(#grid)"/>
<rect width="1800" height="190" fill="#122e39"/>
<text x="60" y="48" style="fill:#e9bd6b;font-size:16px;letter-spacing:4px;font-weight:700">SHOPLEDGER / CHECKPOINT 02</text>
<text x="60" y="105" style="fill:white;font-size:46px;font-weight:700">One order. Two calculation paths.</text>
<text x="60" y="147" style="fill:#b7cfd2;font-size:21px">Repository architecture at 68c85a9 · existing modules only · ticket #1 highlights the invoice boundary</text>
<text x="60" y="232" class="eyebrow">01 / BROWSER</text><text x="550" y="232" class="eyebrow">02 / EXPRESS</text><text x="1060" y="232" class="eyebrow">03 / BUSINESS MODULES</text>
<rect x="60" y="255" width="420" height="205" rx="16" class="box"/>
<text x="86" y="293" class="heading">Shop desk interface</text>
<text x="86" y="332" class="file">public/index.html</text><text x="86" y="362" class="file">public/js/app.js</text><text x="86" y="392" class="file">public/css/style.css</text>
<text x="86" y="432" class="body">POS · Orders · Khata · GST Audit</text>
<path d="M480 340H545" class="order"/><text x="489" y="325" class="small">HTTP</text>
<rect x="550" y="255" width="420" height="115" rx="16" class="box"/>
<text x="576" y="294" class="file">server.js</text><text x="576" y="327" class="body">body-parser.json · static public/</text><text x="576" y="353" class="small">mounts four routers at /api</text>
<path d="M760 370V401" class="edge"/>
<rect x="550" y="408" width="420" height="95" rx="12" class="box"/>
<text x="576" y="444" class="file">routes/products.js</text><text x="576" y="476" class="body">GET /products · /coupons</text>
<rect x="550" y="524" width="420" height="105" rx="12" fill="#fff6e4" stroke="#b68332" stroke-width="2"/>
<text x="576" y="561" class="file">routes/orders.js</text><text x="576" y="594" class="body">GET orders · POST create / cancel</text>
<rect x="550" y="650" width="420" height="95" rx="12" class="box"/>
<text x="576" y="686" class="file">routes/customers.js</text><text x="576" y="718" class="body">GET accounts · POST settlement</text>
<rect x="550" y="766" width="420" height="115" rx="12" class="box"/>
<text x="576" y="802" class="file">routes/reports.js</text><text x="576" y="834" class="body">dashboard · GST audit · preview</text><text x="576" y="861" class="small">key-guarded admin export</text>
<rect x="60" y="505" width="420" height="182" rx="16" fill="#fff6e4" stroke="#b68332" stroke-width="2"/>
<text x="86" y="544" class="heading">Printable invoice</text><text x="86" y="580" class="file">GET /orders/:id/invoice</text><text x="86" y="617" class="body">Defined directly in server.js</text><text x="86" y="649" class="body">store.read → orders.get → render</text>
