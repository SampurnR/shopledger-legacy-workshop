<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" role="img" aria-labelledby="title description">
  <title id="title">ShopLedger application architecture</title>
  <desc id="description">Browser UI talks to Express routes. The order route uses pricing, coupons, inventory, orders, ledger, and store modules. The store reads and writes data/db.json.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#426176"/>
    </marker>
    <style>
      text{font-family:Segoe UI,Arial,sans-serif;fill:#183243}
      .title{font-size:30px;font-weight:700}
      .subtitle{font-size:15px;fill:#526b7b}
      .label{font-size:14px;font-weight:700;letter-spacing:.4px;fill:#416176}
      .head{font-size:17px;font-weight:700}
      .body{font-size:14px}
      .small{font-size:12px;fill:#526b7b}
      .panel{fill:#f6fafc;stroke:#b9cbd6;stroke-width:1.5}
      .ui{fill:#e8f5f1;stroke:#63a98f;stroke-width:1.5}
      .route{fill:#edf3fa;stroke:#7095b5;stroke-width:1.5}
      .module{fill:#fff;stroke:#9aafbd;stroke-width:1.4}
      .data{fill:#fff5df;stroke:#d4a54c;stroke-width:1.5}
      .edge{fill:none;stroke:#426176;stroke-width:2;marker-end:url(#arrow)}
      .edge-dash{fill:none;stroke:#7890a0;stroke-width:1.7;stroke-dasharray:6 5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1280" height="820" fill="#fff"/>
  <text x="44" y="54" class="title">ShopLedger architecture</text>
  <text x="44" y="82" class="subtitle">Node.js + Express wholesale and retail POS, inventory, GST invoicing, and Khata ledger</text>

  <text x="48" y="132" class="label">BROWSER UI</text>
  <rect x="44" y="148" width="250" height="182" rx="12" class="ui"/>
  <text x="64" y="181" class="head">public/</text>
  <text x="64" y="211" class="body">index.html — POS screens</text>
  <text x="64" y="238" class="body">js/app.js — API requests + UI</text>
  <text x="64" y="265" class="body">css/style.css — presentation</text>
  <text x="64" y="301" class="small">Served by Express static middleware</text>

  <text x="352" y="132" class="label">EXPRESS APP — server.js</text>
  <rect x="348" y="148" width="264" height="182" rx="12" class="route"/>
  <text x="368" y="181" class="head">Routes</text>
  <text x="368" y="211" class="body">products.js — products, coupons</text>
  <text x="368" y="238" class="body">orders.js — order create/cancel</text>
  <text x="368" y="265" class="body">customers.js — Khata settlement</text>
  <text x="368" y="292" class="body">reports.js — dashboard + GST audit</text>

  <text x="672" y="132" class="label">BUSINESS LOGIC — lib/</text>
  <rect x="668" y="148" width="566" height="220" rx="12" class="panel"/>
  <rect x="688" y="168" width="166" height="64" rx="8" class="module"/>
  <text x="704" y="194" class="head">pricing.js</text><text x="704" y="216" class="small">checkout totals</text>
  <rect x="870" y="168" width="150" height="64" rx="8" class="module"/>
  <text x="884" y="194" class="head">tax.js</text><text x="884" y="216" class="small">HSN + CGST/SGST</text>
  <rect x="1036" y="168" width="176" height="64" rx="8" class="module"/>
  <text x="1050" y="194" class="head">coupons.js</text><text x="1050" y="216" class="small">validation + discount</text>
  <rect x="688" y="250" width="166" height="60" rx="8" class="module"/>
  <text x="704" y="276" class="head">inventory.js</text><text x="704" y="298" class="small">stock checks + reserve</text>
  <rect x="870" y="250" width="150" height="60" rx="8" class="module"/>
  <text x="884" y="276" class="head">orders.js</text><text x="884" y="298" class="small">order records</text>
  <rect x="1036" y="250" width="176" height="60" rx="8" class="module"/>
  <text x="1050" y="276" class="head">ledger.js</text><text x="1050" y="298" class="small">Khata balances</text>
  <text x="688" y="337" class="small">Also: invoice.js (HTML invoices), reports.js (dashboard + GST audit),</text>
  <text x="688" y="355" class="small">store.js (JSON persistence), dates.js (date normalization).</text>

  <path d="M294 237 H348" class="edge"/>
  <path d="M612 237 H668" class="edge"/>

  <text x="48" y="410" class="label">ORDER PLACEMENT — POST /api/orders</text>
  <rect x="44" y="426" width="1190" height="238" rx="12" class="panel"/>
  <g>
    <rect x="68" y="472" width="178" height="112" rx="10" class="ui"/>
    <text x="86" y="504" class="head">1. POS request</text>
    <text x="86" y="532" class="body">items, qty, coupon,</text><text x="86" y="554" class="body">payment + customer</text>

    <rect x="278" y="472" width="188" height="112" rx="10" class="route"/>
    <text x="296" y="504" class="head">2. Resolve + validate</text>
    <text x="296" y="532" class="body">product IDs, quantities,</text><text x="296" y="554" class="body">stock, coupon</text>

    <rect x="498" y="472" width="190" height="112" rx="10" class="module"/>
    <text x="516" y="504" class="head">3. Calculate totals</text>
    <text x="516" y="532" class="body">pricing.js uses tax.js</text><text x="516" y="554" class="body">and coupons.js</text>

    <rect x="720" y="472" width="190" height="112" rx="10" class="module"/>
    <text x="738" y="504" class="head">4. Apply side effects</text>
    <text x="738" y="532" class="body">optional Khata debit;</text><text x="738" y="554" class="body">reserve inventory</text>

    <rect x="942" y="472" width="258" height="112" rx="10" class="data"/>
    <text x="960" y="504" class="head">5. Save + respond</text>
    <text x="960" y="532" class="body">orders.add + appendAudit</text><text x="960" y="554" class="body">store.write → JSON response</text>

    <path d="M246 528 H278" class="edge"/>
    <path d="M466 528 H498" class="edge"/>
    <path d="M688 528 H720" class="edge"/>
    <path d="M910 528 H942" class="edge"/>
  </g>
  <text x="68" y="632" class="small">Invoice: GET /orders/:id/invoice → store.read → orders.get → invoice.render → HTML response</text>

  <text x="48" y="688" class="label">CONFIGURATION + PERSISTENCE</text>
  <rect x="44" y="704" width="535" height="78" rx="10" class="module"/>
  <text x="64" y="736" class="head">config.js</text>
  <text x="64" y="761" class="body">shop details, HSN GST slabs, coupon rules, inventory defaults, port</text>
  <rect x="612" y="704" width="622" height="78" rx="10" class="data"/>
  <text x="632" y="736" class="head">data/db.json via lib/store.js</text>
  <text x="632" y="761" class="body">products, orders, customers, settlements, audit log</text>
</svg>
