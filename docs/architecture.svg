<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture and order flow</title>
  <desc id="desc">Architecture diagram of the ShopLedger browser UI, Express server, API route modules, library modules, configuration, JSON data store, and order placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}
      .title{font-size:34px;font-weight:750;letter-spacing:-.6px}
      .subtitle{font-size:15px;fill:#64748b}
      .section{font-size:15px;font-weight:750;letter-spacing:1.3px;fill:#475569}
      .nodeTitle{font-size:17px;font-weight:700}
      .file{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;fill:#334155}
      .detail{font-size:12px;fill:#64748b}
      .small{font-size:11px;fill:#64748b}
      .flowText{font-size:14px;font-weight:650}
      .flowDetail{font-size:11.5px;fill:#475569}
      .card{fill:#fff;stroke:#cbd5e1;stroke-width:1.4}
      .edge{fill:none;stroke:#64748b;stroke-width:1.7;marker-end:url(#arrow)}
      .edgeBlue{fill:none;stroke:#2563eb;stroke-width:2.6;marker-end:url(#arrowBlue)}
      .edgeDash{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:5 5;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1800" height="1260" fill="#f8fafc"/>
  <text x="56" y="62" class="title">ShopLedger · application architecture</text>
  <text x="58" y="91" class="subtitle">Runtime components, module dependencies, and the order placement path</text>

  <!-- High-level application entry points -->
  <text x="56" y="135" class="section">APPLICATION</text>
  <rect x="56" y="154" width="320" height="116" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="78" y="185" class="nodeTitle">Browser UI</text>
  <text x="78" y="211" class="file">public/index.html</text>
  <text x="78" y="233" class="file">public/js/app.js</text>
  <text x="78" y="253" class="detail">POS · order history · Khata · audit</text>

  <rect x="478" y="154" width="330" height="116" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="502" y="185" class="nodeTitle">Express application</text>
  <text x="502" y="211" class="file">server.js</text>
  <text x="502" y="233" class="detail">serves public/ · mounts API routers</text>
  <text x="502" y="253" class="detail">GET /orders/:id/invoice</text>
  <path d="M376 212 H478" class="edgeBlue"/>
  <text x="398" y="200" class="small">HTTP</text>

  <!-- Routers -->
  <text x="56" y="322" class="section">ROUTERS · routes/</text>
  <rect x="56" y="341" width="1688" height="190" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

  <rect x="82" y="375" width="360" height="112" rx="10" class="card"/>
  <rect x="82" y="375" width="7" height="112" rx="4" fill="#2563eb"/>
  <text x="104" y="405" class="nodeTitle">Orders router</text>
  <text x="104" y="430" class="file">routes/orders.js</text>
  <text x="104" y="454" class="detail">list · get · create · cancel</text>
  <text x="104" y="474" class="detail">POST /api/orders</text>

  <rect x="474" y="375" width="360" height="112" rx="10" class="card"/>
  <rect x="474" y="375" width="7" height="112" rx="4" fill="#0ea5e9"/>
  <text x="496" y="405" class="nodeTitle">Products router</text>
  <text x="496" y="430" class="file">routes/products.js</text>
  <text x="496" y="454" class="detail">product catalog · active coupons</text>

  <rect x="866" y="375" width="360" height="112" rx="10" class="card"/>
  <rect x="866" y="375" width="7" height="112" rx="4" fill="#8b5cf6"/>
  <text x="888" y="405" class="nodeTitle">Customers router</text>
  <text x="888" y="430" class="file">routes/customers.js</text>
  <text x="888" y="454" class="detail">customer balances · settlements</text>

  <rect x="1258" y="375" width="360" height="112" rx="10" class="card"/>
  <rect x="1258" y="375" width="7" height="112" rx="4" fill="#14b8a6"/>
  <text x="1280" y="405" class="nodeTitle">Reports router</text>
  <text x="1280" y="430" class="file">routes/reports.js</text>
  <text x="1280" y="454" class="detail">dashboard · GST reconciliation</text>
  <text x="1280" y="474" class="detail">POST /api/pricing/preview</text>

  <path d="M643 270 V310 H262 V375" class="edge"/>
  <path d="M643 310 H654 V375" class="edge"/>
  <path d="M643 310 H1046 V375" class="edge"/>
  <path d="M643 310 H1438 V375" class="edge"/>
  <text x="670" y="302" class="small">mounts routes</text>

  <!-- Libraries -->
  <text x="56" y="578" class="section">MODULES · lib/</text>
  <rect x="56" y="596" width="1688" height="302" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- Order path modules -->
  <rect x="82" y="628" width="240" height="95" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="100" y="657" class="nodeTitle">inventory.js</text>
  <text x="100" y="679" class="file">lib/inventory.js</text>
  <text x="100" y="701" class="detail">find · check · deduct · release</text>

  <rect x="348" y="628" width="240" height="95" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="366" y="657" class="nodeTitle">pricing.js</text>
  <text x="366" y="679" class="file">lib/pricing.js</text>
  <text x="366" y="701" class="detail">subtotal · GST · totals</text>

  <rect x="614" y="628" width="240" height="95" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="632" y="657" class="nodeTitle">coupons.js</text>
  <text x="632" y="679" class="file">lib/coupons.js</text>
  <text x="632" y="701" class="detail">validate · calculate discount</text>

  <rect x="880" y="628" width="240" height="95" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="898" y="657" class="nodeTitle">tax.js</text>
  <text x="898" y="679" class="file">lib/tax.js</text>
  <text x="898" y="701" class="detail">HSN GST slab · CGST/SGST</text>

  <rect x="1146" y="628" width="240" height="95" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="1164" y="657" class="nodeTitle">ledger.js</text>
  <text x="1164" y="679" class="file">lib/ledger.js</text>
  <text x="1164" y="701" class="detail">Khata charge · reverse · settle</text>

  <rect x="1412" y="628" width="280" height="95" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="1430" y="657" class="nodeTitle">orders.js</text>
  <text x="1430" y="679" class="file">lib/orders.js</text>
  <text x="1430" y="701" class="detail">add · get · list · cancel</text>

  <!-- Supporting library modules -->
  <rect x="82" y="758" width="240" height="95" rx="10" class="card"/>
  <text x="100" y="787" class="nodeTitle">store.js</text>
  <text x="100" y="809" class="file">lib/store.js</text>
  <text x="100" y="831" class="detail">read · write · audit log</text>

  <rect x="348" y="758" width="240" height="95" rx="10" class="card"/>
  <text x="366" y="787" class="nodeTitle">dates.js</text>
  <text x="366" y="809" class="file">lib/dates.js</text>
  <text x="366" y="831" class="detail">today · date normalization</text>

  <rect x="614" y="758" width="240" height="95" rx="10" class="card"/>
  <text x="632" y="787" class="nodeTitle">reports.js</text>
  <text x="632" y="809" class="file">lib/reports.js</text>
  <text x="632" y="831" class="detail">dashboard · GST reconciliation</text>

  <rect x="880" y="758" width="240" height="95" rx="10" class="card"/>
  <text x="898" y="787" class="nodeTitle">invoice.js</text>
  <text x="898" y="809" class="file">lib/invoice.js</text>
  <text x="898" y="831" class="detail">compute figures · render HTML</text>

  <!-- Persistence and configuration -->
  <text x="56" y="945" class="section">CONFIGURATION &amp; PERSISTENCE</text>
  <rect x="56" y="964" width="414" height="104" rx="11" fill="#fff7ed" stroke="#fdba74" stroke-width="1.4"/>
  <text x="80" y="995" class="nodeTitle">config.js</text>
  <text x="80" y="1018" class="file">config.js</text>
  <text x="80" y="1042" class="detail">shop · tax slabs · inventory · coupons · port</text>

  <rect x="1330" y="964" width="414" height="104" rx="11" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4"/>
  <text x="1354" y="995" class="nodeTitle">JSON data file</text>
  <text x="1354" y="1018" class="file">data/db.json</text>
  <text x="1354" y="1042" class="detail">products · orders · customers · settlements · auditLog</text>

