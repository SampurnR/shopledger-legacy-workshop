<text x="506" y="555" class="small">POST /orders · POST /orders/:id/cancel</text>
<text x="506" y="581" class="small">Direct local imports:</text>
<text x="506" y="607" class="small">store · inventory · pricing</text>
<text x="506" y="633" class="small">coupons · orders · ledger</text>
<rect x="924" y="464" width="412" height="214" rx="13" fill="white" stroke="#d6dfeb"/><rect x="924" y="477" width="5" height="188" rx="2" fill="#2563eb"/>
