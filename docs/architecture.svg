<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture and order flow</title>
  <desc id="desc">Architecture diagram of the ShopLedger browser UI, Express server, routers, libraries, config, and JSON storage, with the numbered order placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker>
    <marker id="flowArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:13px}
      .title{font-size:24px;font-weight:700}.sub{font-size:13px;fill:#475569}
      .zone{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}.zoneTitle{font-size:15px;font-weight:700;fill:#334155}
      .box{fill:#fff;stroke:#94a3b8;stroke-width:1.4}.focus{fill:#fff1e8;stroke:#ea7a32;stroke-width:2}
      .head{font-weight:700;font-size:14px}.small{font-size:12px;fill:#475569}.tiny{font-size:12px}
      .edge{fill:none;stroke:#64748b;stroke-width:1.5;marker-end:url(#arrow)}
      .flow{fill:none;stroke:#2563eb;stroke-width:2.4;marker-end:url(#flowArrow)}
      .flowbox{fill:#eff6ff;stroke:#60a5fa;stroke-width:1.4}.flowNum{font-size:14px;font-weight:700;fill:#1d4ed8}
      .legend{font-size:12px;fill:#334155}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="30" y="38" class="title">ShopLedger · application architecture</text>
  <text x="30" y="60" class="sub">Observed modules and order placement path · solid gray arrows show module dependencies · blue numbered path shows POST /api/orders</text>

  <!-- Browser -->
  <rect x="25" y="82" width="215" height="300" rx="10" class="zone"/>
  <text x="42" y="108" class="zoneTitle">Browser UI · public/</text>
  <rect x="42" y="124" width="180" height="70" rx="7" class="box"/>
  <text x="54" y="147" class="head">index.html</text><text x="54" y="168" class="small">POS page and views</text>
  <rect x="42" y="207" width="180" height="70" rx="7" class="box"/>
  <text x="54" y="230" class="head">js/app.js</text><text x="54" y="251" class="small">cart · preview · submit</text>
  <rect x="42" y="290" width="180" height="58" rx="7" class="box"/>
  <text x="54" y="314" class="head">css/style.css</text><text x="54" y="334" class="small">interface styling</text>

  <!-- Server and routers -->
  <rect x="258" y="82" width="278" height="300" rx="10" class="zone"/>
  <text x="275" y="108" class="zoneTitle">HTTP layer</text>
  <rect x="276" y="124" width="242" height="66" rx="7" class="box"/>
  <text x="290" y="148" class="head">server.js · Express</text><text x="290" y="170" class="small">static public · mounts /api routers</text>
  <rect x="276" y="203" width="113" height="68" rx="7" class="box"/>
  <text x="288" y="225" class="head">routes/</text><text x="288" y="246" class="small">products.js</text><text x="288" y="262" class="small">GET products, coupons</text>
  <rect x="400" y="203" width="118" height="68" rx="7" class="box"/>
  <text x="412" y="225" class="head">routes/</text><text x="412" y="246" class="small">orders.js</text><text x="412" y="262" class="small">POST /orders</text>
  <rect x="276" y="284" width="113" height="68" rx="7" class="box"/>
  <text x="288" y="306" class="head">routes/</text><text x="288" y="327" class="small">customers.js</text><text x="288" y="343" class="small">customers · settle</text>
  <rect x="400" y="284" width="118" height="68" rx="7" class="box"/>
  <text x="412" y="306" class="head">routes/</text><text x="412" y="327" class="small">reports.js</text><text x="412" y="343" class="small">reports · preview</text>

  <!-- Lib modules -->
  <rect x="554" y="82" width="412" height="460" rx="10" class="zone"/>
  <text x="572" y="108" class="zoneTitle">Business logic · lib/</text>
  <rect x="572" y="124" width="178" height="75" rx="7" class="box"/>
  <text x="584" y="147" class="head">orders.js</text><text x="584" y="169" class="small">add · get · cancel · list</text>
  <rect x="764" y="124" width="184" height="75" rx="7" class="box"/>
  <text x="776" y="147" class="head">inventory.js</text><text x="776" y="169" class="small">find · check · reserve · release</text>
  <rect x="572" y="211" width="178" height="88" rx="7" class="box"/>
  <text x="584" y="234" class="head">pricing.js</text><text x="584" y="256" class="small">subtotal · computeTotals</text><text x="584" y="276" class="small">rounds lines; calls tax.js</text>
  <rect x="764" y="211" width="184" height="88" rx="7" class="focus"/>
  <text x="776" y="234" class="head">tax.js · highlighted</text><text x="776" y="256" class="small">getRateForItem · HSN slab</text><text x="776" y="276" class="small">splitCgstSgst</text>
  <rect x="572" y="311" width="178" height="74" rx="7" class="box"/>
  <text x="584" y="334" class="head">coupons.js</text><text x="584" y="356" class="small">normalize · validate · discount</text>
  <rect x="764" y="311" width="184" height="74" rx="7" class="box"/>
  <text x="776" y="334" class="head">ledger.js</text><text x="776" y="356" class="small">Khata charge · settlement</text>
  <rect x="572" y="397" width="178" height="74" rx="7" class="box"/>
  <text x="584" y="420" class="head">store.js</text><text x="584" y="442" class="small">read · write · appendAudit</text>
  <rect x="764" y="397" width="184" height="74" rx="7" class="focus"/>
  <text x="776" y="420" class="head">invoice.js · highlighted</text><text x="776" y="442" class="small">computeInvoiceFigures · render</text>
  <rect x="572" y="483" width="178" height="43" rx="7" class="box"/>
  <text x="584" y="510" class="head">reports.js</text>
  <rect x="764" y="483" width="184" height="43" rx="7" class="box"/>
  <text x="776" y="510" class="head">dates.js</text>

  <!-- Config/data -->
  <rect x="984" y="82" width="191" height="300" rx="10" class="zone"/>
  <text x="1002" y="108" class="zoneTitle">Settings and persistence</text>
  <rect x="1002" y="130" width="155" height="83" rx="7" class="box"/>
  <text x="1014" y="155" class="head">config.js</text><text x="1014" y="177" class="small">shop · GST slabs</text><text x="1014" y="196" class="small">coupons · defaults</text>
  <path d="M 1002 265 h 155 v 80 h -155 z" class="box"/>
  <text x="1014" y="290" class="head">data/db.json</text><text x="1014" y="312" class="small">products · orders</text><text x="1014" y="331" class="small">customers · settlements</text>

  <!-- Dependencies -->
  <path d="M222 240 C245 240 250 157 276 157" class="edge"/>
  <path d="M518 237 C542 237 546 160 572 160" class="edge"/>
  <path d="M518 237 C542 237 548 255 572 255" class="edge"/>
  <path d="M518 237 C542 237 548 348 572 348" class="edge"/>
  <path d="M750 255 L764 255" class="edge"/>
  <path d="M750 348 C758 348 758 348 764 348" class="edge"/>
  <path d="M750 434 C758 434 758 434 764 434" class="edge"/>
  <path d="M948 434 C973 434 974 186 1002 186" class="edge"/>
  <path d="M750 434 C874 455 930 312 1002 312" class="edge"/>
  <path d="M750 505 C766 505 754 470 764 470" class="edge"/>

  <!-- Invoice endpoint -->
  <rect x="984" y="407" width="191" height="94" rx="10" class="focus"/>
  <text x="1000" y="432" class="head">Printable invoice</text><text x="1000" y="454" class="small">GET /orders/:id/invoice</text><text x="1000" y="476" class="small">server.js → invoice.render</text>
  <path d="M 536 156 C 800 82 930 410 984 450" class="edge"/>

  <!-- Order flow strip -->
  <rect x="25" y="565" width="1150" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="44" y="592" class="zoneTitle">Order placement · numbered request path</text>
  <rect x="44" y="611" width="158" height="105" rx="8" class="flowbox"/>
  <text x="58" y="637" class="flowNum">1 · Browser</text><text x="58" y="660" class="tiny">app.js submits cart</text><text x="58" y="681" class="tiny">POST /api/orders</text>
  <rect x="230" y="611" width="176" height="105" rx="8" class="flowbox"/>
  <text x="244" y="637" class="flowNum">2 · Validate</text><text x="244" y="660" class="tiny">orders route resolves items</text><text x="244" y="681" class="tiny">inventory.check stock</text>
  <rect x="434" y="611" width="180" height="105" rx="8" class="flowbox"/>
  <text x="448" y="637" class="flowNum">3 · Price + GST</text><text x="448" y="660" class="tiny">pricing.computeTotals</text><text x="448" y="681" class="tiny">coupons.js + tax.js</text>
  <rect x="642" y="611" width="168" height="105" rx="8" class="flowbox"/>
  <text x="656" y="637" class="flowNum">4 · Khata (if used)</text><text x="656" y="660" class="tiny">ledger.chargeOrderToKhata</text><text x="656" y="681" class="tiny">credit limit checked</text>
  <rect x="838" y="611" width="150" height="105" rx="8" class="flowbox"/>
  <text x="852" y="637" class="flowNum">5 · Commit</text><text x="852" y="660" class="tiny">inventory.reserve</text><text x="852" y="681" class="tiny">orders.add</text>
  <rect x="1016" y="611" width="140" height="105" rx="8" class="flowbox"/>
  <text x="1030" y="637" class="flowNum">6 · Persist</text><text x="1030" y="660" class="tiny">audit + store.write</text><text x="1030" y="681" class="tiny">data/db.json</text>
  <path d="M202 663 L226 663" class="flow"/><path d="M406 663 L430 663" class="flow"/><path d="M614 663 L638 663" class="flow"/><path d="M810 663 L834 663" class="flow"/><path d="M988 663 L1012 663" class="flow"/>

  <!-- Legend -->
  <rect x="44" y="733" width="15" height="15" rx="3" class="focus"/>
  <text x="67" y="746" class="legend">Ticket focus: invoice.js (print/reconciliation figures) · tax.js (checkout GST rate and CGST/SGST split used by pricing.js)</text>
</svg>
