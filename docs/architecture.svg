<text x="1382" y="529" class="small">GET /reports/dashboard</text>
<text x="1382" y="555" class="small">GET /reports/gst-reconciliation</text>
<text x="1382" y="581" class="small">POST /pricing/preview · GET /admin/export</text>
<text x="1382" y="607" class="small">Imports: config · store · reports</text>
<text x="1382" y="633" class="small">pricing · coupons</text>
<text x="48" y="722" class="section">BUSINESS MODULES · every file in lib/</text>
<text x="48" y="752" class="small">Router cards above list their module dependencies; module cards below list their own direct local imports.</text>
<rect x="48" y="775" width="320" height="120" rx="13" fill="white" stroke="#d6dfeb"/><rect x="48" y="788" width="5" height="94" rx="2" fill="#0f766e"/>
<text x="68" y="809" class="name">inventory.js</text>
<text x="68" y="840" class="small">Sellable stock · check · deduct/release</text>
<text x="68" y="866" class="small">Stock summary | imports: config</text>
<rect x="394" y="775" width="320" height="120" rx="13" fill="white" stroke="#d6dfeb"/><rect x="394" y="788" width="5" height="94" rx="2" fill="#0f766e"/>
<text x="414" y="809" class="name">pricing.js</text>
<text x="414" y="840" class="small">Checkout totals · discount allocation</text>
<text x="414" y="866" class="small">Imports: tax · coupons</text>
<rect x="740" y="775" width="320" height="120" rx="13" fill="white" stroke="#d6dfeb"/><rect x="740" y="788" width="5" height="94" rx="2" fill="#0f766e"/>
<text x="760" y="809" class="name">coupons.js</text>
<text x="760" y="840" class="small">Normalize · validate · discount caps</text>
<text x="760" y="866" class="small">Imports: config</text>
<rect x="1086" y="775" width="320" height="120" rx="13" fill="white" stroke="#d6dfeb"/><rect x="1086" y="788" width="5" height="94" rx="2" fill="#0f766e"/>
<text x="1106" y="809" class="name">tax.js</text>
<text x="1106" y="840" class="small">HSN rate lookup · CGST / SGST</text>
<text x="1106" y="866" class="small">Imports: config</text>
<rect x="1432" y="775" width="320" height="120" rx="13" fill="white" stroke="#d6dfeb"/><rect x="1432" y="788" width="5" height="94" rx="2" fill="#0f766e"/>
<text x="1452" y="809" class="name">store.js</text>
<text x="1452" y="840" class="small">JSON read/write · audit entries</text>
<text x="1452" y="866" class="small">Uses: fs · path → data/db.json</text>
<rect x="48" y="917" width="320" height="120" rx="13" fill="white" stroke="#d6dfeb"/><rect x="48" y="930" width="5" height="94" rx="2" fill="#0f766e"/>
