<text x="342" y="117" class="small">Express · bodyParser.json() · static(public/)</text>
<text x="342" y="134" class="small">Mounts all four routers under /api</text>
<text x="342" y="151" class="small">/orders/:id/invoice → store.read(),</text>
<text x="342" y="168" class="small">orders.get(), invoice.render()</text>
