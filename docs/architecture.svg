<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">ShopLedger architecture</title>
<desc id="desc">ShopLedger browser, Express routes, business logic, configuration and JSON storage, with numbered order placement flow.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker>
  <marker id="blueArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2563eb"/></marker>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:14px}
    .title{font-size:25px;font-weight:700}.sub{fill:#475569}
    .head{font-size:15px;font-weight:700}.small{font-size:12px;fill:#475569}
    .box{stroke-width:1.5;rx:9}.ui{fill:#eff6ff;stroke:#3b82f6}.server{fill:#f1f5f9;stroke:#334155;stroke-width:2}
    .route{fill:#f8fafc;stroke:#64748b}.lib{fill:#f0fdf4;stroke:#22a06b}.data{fill:#fff7ed;stroke:#ea580c}.config{fill:#faf5ff;stroke:#8b5cf6}
    .focus{fill:#fff1f2;stroke:#e11d48;stroke-width:2.5}.link{fill:none;stroke:#64748b;stroke-width:1.6;marker-end:url(#arrow)}
    .flow{fill:none;stroke:#2563eb;stroke-width:2.6;marker-end:url(#blueArrow)}
    .num{fill:#2563eb;stroke:#fff;stroke-width:2}.numtext{font-size:12px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:middle}
  </style>
</defs>
<rect width="1200" height="800" fill="#f8fafc"/>
<text x="32" y="40" class="title">ShopLedger · application architecture</text>
<text x="32" y="64" class="sub">Node / Express POS · Khata credit ledger · GST billing · file-backed JSON</text>

<rect x="32" y="84" width="260" height="100" class="box ui"/>
<text x="50" y="109" class="head">Browser UI · public/</text><text x="50" y="133">index.html · js/app.js</text><text x="50" y="156">css/style.css</text><text x="50" y="176" class="small">POS, orders, customers, reports</text>
<rect x="350" y="84" width="420" height="100" class="box server"/>
<text x="370" y="109" class="head">server.js · Express app</text><text x="370" y="133">JSON body parser · static public/ · mounts routers at /api</text><text x="370" y="156">GET /orders/:id/invoice → lib/invoice.js render()</text><text x="370" y="176" class="small">PDF endpoint is only a comment (unfinished)</text>
<rect x="828" y="84" width="340" height="100" class="box config"/>
<text x="848" y="109" class="head">config.js</text><text x="848" y="133">shop details · HSN GST slabs · coupons</text><text x="848" y="156">inventory defaults · port · adminKey</text>
<path d="M292 134H350" class="link"/><text x="302" y="124" class="small">HTTP</text>
<path d="M828 135H770" class="link"/>

<text x="32" y="218" class="head">Routers · server.js mounts each at /api</text>
<rect x="32" y="230" width="268" height="80" class="box route"/><text x="48" y="254" class="head">routes/products.js</text><text x="48" y="277">GET /products · GET /coupons</text><text x="48" y="298" class="small">catalogue and active coupons</text>
<rect x="324" y="230" width="268" height="80" class="box route"/><text x="340" y="254" class="head">routes/orders.js</text><text x="340" y="277">GET /orders · POST /orders</text><text x="340" y="298" class="small">detail · cancel</text>
<rect x="616" y="230" width="268" height="80" class="box route"/><text x="632" y="254" class="head">routes/customers.js</text><text x="632" y="277">GET /customers</text><text x="632" y="298" class="small">POST /customers/:id/settle</text>
<rect x="908" y="230" width="260" height="80" class="box route"/><text x="924" y="254" class="head">routes/reports.js</text><text x="924" y="277">dashboard · GST reconciliation</text><text x="924" y="298" class="small">pricing preview · admin export</text>
<path d="M490 184V209H166V230M490 209H458V230M490 209H750V230M490 209H1038V230" class="link"/>

<text x="32" y="342" class="head">Order placement · POST /api/orders</text>
<rect x="32" y="357" width="165" height="66" class="box ui"/><text x="47" y="382" class="head">1 · Cart request</text><text x="47" y="405">items, coupon, buyer</text>
<rect x="223" y="357" width="165" height="66" class="box lib"/><text x="238" y="382" class="head">2 · Inventory</text><text x="238" y="405">find() · check()</text>
<rect x="414" y="357" width="184" height="66" class="box lib"/><text x="429" y="382" class="head">3 · Price + coupon</text><text x="429" y="405">validate · computeTotals</text>
<rect x="624" y="357" width="175" height="66" class="box lib"/><text x="639" y="382" class="head">4 · Khata (optional)</text><text x="639" y="405">chargeOrderToKhata</text>
<rect x="825" y="357" width="170" height="66" class="box lib"/><text x="840" y="382" class="head">5 · Record order</text><text x="840" y="405">add() · reserve()</text>
<rect x="1021" y="357" width="147" height="66" class="box data"/><text x="1036" y="382" class="head">6 · Persist</text><text x="1036" y="405">store.write()</text>
<path d="M197 390H223M388 390H414M598 390H624M799 390H825M995 390H1021" class="flow"/>
<circle cx="210" cy="390" r="11" class="num"/><text x="210" y="390" class="numtext">1</text><circle cx="401" cy="390" r="11" class="num"/><text x="401" y="390" class="numtext">2</text><circle cx="611" cy="390" r="11" class="num"/><text x="611" y="390" class="numtext">3</text><circle cx="812" cy="390" r="11" class="num"/><text x="812" y="390" class="numtext">4</text><circle cx="1008" cy="390" r="11" class="num"/><text x="1008" y="390" class="numtext">5</text>
<text x="32" y="450" class="small">Route sequence: inventory.find/check → pricing.subtotal/computeTotals + coupons.validate → ledger.chargeOrderToKhata (if khata) → inventory.reserve + orders.add → appendAudit + store.write</text>

<text x="32" y="487" class="head">lib/ · modules and key exports</text>
<rect x="32" y="500" width="215" height="76" class="box lib"/><text x="47" y="524" class="head">lib/inventory.js</text><text x="47" y="547">find · check · reserve · release</text><text x="47" y="567" class="small">summarize · sellable stock</text>
<rect x="263" y="500" width="215" height="76" class="box lib"/><text x="278" y="524" class="head">lib/pricing.js</text><text x="278" y="547">subtotal · discount · computeTotals</text><text x="278" y="567" class="small">calls tax.js + coupons.js</text>
<rect x="494" y="500" width="215" height="76" class="box lib"/><text x="509" y="524" class="head">lib/coupons.js</text><text x="509" y="547">normalizeCode · validate</text><text x="509" y="567" class="small">calculateDiscount · listActive</text>
<rect x="725" y="500" width="215" height="76" class="box lib"/><text x="740" y="524" class="head">lib/orders.js</text><text x="740" y="547">add · get · cancel · list</text><text x="740" y="567" class="small">uses dates, inventory, ledger</text>
<rect x="956" y="500" width="212" height="76" class="box lib"/><text x="971" y="524" class="head">lib/ledger.js</text><text x="971" y="547">Khata charge / reverse</text><text x="971" y="567" class="small">customers · settlements</text>

<rect x="32" y="594" width="215" height="76" class="box lib"/><text x="47" y="618" class="head">lib/store.js</text><text x="47" y="641">read · write · appendAudit</text><text x="47" y="661" class="small">sync JSON file operations</text>
<rect x="263" y="594" width="215" height="76" class="box lib"/><text x="278" y="618" class="head">lib/tax.js</text><text x="278" y="641">getRateForItem · getSlabPercent</text><text x="278" y="661" class="small">splitCgstSgst</text>
<rect x="494" y="594" width="215" height="76" class="box lib"/><text x="509" y="618" class="head">lib/dates.js</text><text x="509" y="641">today · normalizeDateKey</text><text x="509" y="661" class="small">getFiscalYear</text>
<rect x="725" y="594" width="215" height="76" class="box lib"/><text x="740" y="618" class="head">lib/reports.js</text><text x="740" y="641">getDashboardSummary</text><text x="740" y="661" class="small">getGstReconciliation</text>
<rect x="956" y="594" width="212" height="76" class="box focus"/><text x="971" y="618" class="head">lib/invoice.js · ticket focus</text><text x="971" y="641">computeInvoiceFigures · render</text><text x="971" y="661" class="small">recalculates printable invoice</text>

<rect x="32" y="694" width="500" height="72" class="box data"/><text x="48" y="720" class="head">data/db.json</text><text x="48" y="744">products · orders · customers · settlements · auditLog · IDs</text>
<rect x="552" y="694" width="360" height="72" class="box config"/><text x="568" y="720" class="head">config.js</text><text x="568" y="744">shop metadata · GST slabs · coupon rules · defaults</text>
<rect x="932" y="694" width="236" height="72" fill="#fff" stroke="#cbd5e1" rx="8"/><rect x="948" y="710" width="18" height="18" class="focus"/><text x="975" y="724" class="small">Ticket focus</text><path d="M949 747H977" class="flow"/><text x="986" y="752" class="small">Numbered order flow</text>

<!-- Core module and storage relationships -->
<path d="M305 423V476H139V500M505 423V500M711 423V476H832V500M910 423V476H1060V500" class="flow"/>
<path d="M370 576V594M370 594V584H600V594M832 576V584H600V594M832 584H139V594M832 584H1060V594" class="link"/>
<path d="M139 670V694" class="link"/>
<path d="M370 594V582H370V576" class="link"/>
<path d="M1060 594V184" class="link"/>
<path d="M370 670V683H732V694" class="link"/>
<path d="M600 670V683H1060V594" class="link"/>
<path d="M600 670V684H832V594" class="link"/>
<path d="M832 670V683H600V670" class="link"/>
</svg>
