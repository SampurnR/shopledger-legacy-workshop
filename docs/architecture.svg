<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="desc">Browser UI, Express server, four route modules, ten library modules, configuration, JSON data, and the numbered order-placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#475569"/></marker>
    <marker id="flowArrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#0f766e"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}.title{font-size:26px;font-weight:700}.group{fill:#f8fafc;stroke:#2563eb;stroke-width:1.5}.groupname{font-size:17px;font-weight:700;fill:#1d4ed8}.box{fill:#fff;stroke:#64748b;stroke-width:1.25}.ticket{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.label{font-size:13px;font-weight:700}.function{font-size:12px;fill:#475569}.tiny{font-size:12px;fill:#475569}.flowline{fill:none;stroke:#0f766e;stroke-width:2.5;marker-end:url(#flowArrow)}.link{fill:none;stroke:#64748b;stroke-width:1.5;marker-end:url(#arrow)}.step{fill:#ccfbf1;stroke:#14b8a6;stroke-width:1}.steptext{font-size:12px;font-weight:700;fill:#115e59}.legend{font-size:12px}.cancel{fill:#ffedd5;stroke:#ea580c;stroke-width:1}.canceltext{font-size:12px;font-weight:700;fill:#9a3412}
    </style>
  </defs>
  <rect width="1200" height="800" fill="white"/>
  <text x="600" y="35" text-anchor="middle" class="title">ShopLedger architecture</text>

  <!-- public -->
  <rect x="25" y="70" width="190" height="185" rx="9" class="group"/>
  <text x="42" y="97" class="groupname">Browser UI · public/</text>
  <rect x="43" y="112" width="154" height="31" rx="4" class="box"/><text x="120" y="133" text-anchor="middle" class="label">index.html</text>
  <rect x="43" y="153" width="154" height="31" rx="4" class="box"/><text x="120" y="174" text-anchor="middle" class="label">js/app.js</text>
  <rect x="43" y="194" width="154" height="31" rx="4" class="box"/><text x="120" y="215" text-anchor="middle" class="label">css/style.css</text>

  <!-- server and config -->
  <rect x="420" y="70" width="180" height="53" rx="8" class="box" fill="#dbeafe"/>
  <text x="510" y="102" text-anchor="middle" class="label">server.js</text>
  <rect x="930" y="70" width="180" height="53" rx="8" class="box" fill="#fef3c7"/>
  <text x="1020" y="102" text-anchor="middle" class="label">config.js</text>
  <path d="M215 128H420" class="link"/>

  <!-- routes -->
  <rect x="300" y="155" width="610" height="111" rx="9" class="group"/>
  <text x="318" y="181" class="groupname">routes/</text>
  <rect x="320" y="197" width="130" height="46" rx="5" class="box"/><text x="385" y="217" text-anchor="middle" class="label">products.js</text><text x="385" y="234" text-anchor="middle" class="function">GET /products, /coupons</text>
  <rect x="465" y="197" width="130" height="46" rx="5" class="box"/><text x="530" y="217" text-anchor="middle" class="label">orders.js</text><text x="530" y="234" text-anchor="middle" class="function">GET/POST /orders</text>
  <rect x="610" y="197" width="130" height="46" rx="5" class="box"/><text x="675" y="217" text-anchor="middle" class="label">customers.js</text><text x="675" y="234" text-anchor="middle" class="function">GET /customers, settle</text>
  <rect x="755" y="197" width="135" height="46" rx="5" class="box"/><text x="822" y="217" text-anchor="middle" class="label">reports.js</text><text x="822" y="234" text-anchor="middle" class="function">dashboard, preview, export</text>
  <path d="M510 123V155" class="link"/>

  <!-- data -->
  <rect x="950" y="680" width="185" height="60" rx="8" class="box" fill="#e0f2fe"/>
  <text x="1042" y="716" text-anchor="middle" class="label">data/db.json</text>

  <!-- lib -->
  <rect x="245" y="305" width="695" height="360" rx="9" class="group"/>
  <text x="263" y="332" class="groupname">lib/</text>
  <rect x="265" y="350" width="125" height="57" rx="5" class="box"/><text x="327" y="371" text-anchor="middle" class="label">store.js</text><text x="327" y="390" text-anchor="middle" class="function">read(), write(),</text><text x="327" y="402" text-anchor="middle" class="function">appendAudit()</text>
  <rect x="405" y="350" width="125" height="57" rx="5" class="ticket"/><text x="467" y="371" text-anchor="middle" class="label">inventory.js</text><text x="467" y="390" text-anchor="middle" class="function">check(), reserve(),</text><text x="467" y="402" text-anchor="middle" class="function">release()</text>
  <rect x="545" y="350" width="125" height="57" rx="5" class="box"/><text x="607" y="371" text-anchor="middle" class="label">pricing.js</text><text x="607" y="390" text-anchor="middle" class="function">subtotal(),</text><text x="607" y="402" text-anchor="middle" class="function">computeTotals()</text>
  <rect x="685" y="350" width="125" height="57" rx="5" class="box"/><text x="747" y="371" text-anchor="middle" class="label">coupons.js</text><text x="747" y="390" text-anchor="middle" class="function">normalizeCode(),</text><text x="747" y="402" text-anchor="middle" class="function">validate()</text>
  <rect x="825" y="350" width="95" height="57" rx="5" class="box"/><text x="872" y="371" text-anchor="middle" class="label">tax.js</text><text x="872" y="390" text-anchor="middle" class="function">getRateForItem()</text>

  <rect x="265" y="430" width="125" height="57" rx="5" class="box"/><text x="327" y="451" text-anchor="middle" class="label">orders.js</text><text x="327" y="470" text-anchor="middle" class="function">add(), get(), list()</text><rect x="281" y="476" width="92" height="18" rx="3" class="cancel"/><text x="327" y="489" text-anchor="middle" class="canceltext">cancel() only</text>
  <rect x="405" y="430" width="125" height="57" rx="5" class="box"/><text x="467" y="451" text-anchor="middle" class="label">ledger.js</text><text x="467" y="470" text-anchor="middle" class="function">chargeOrderToKhata(),</text><text x="467" y="482" text-anchor="middle" class="function">reverseOrderDebit()</text>
  <rect x="545" y="430" width="125" height="57" rx="5" class="box"/><text x="607" y="451" text-anchor="middle" class="label">invoice.js</text><text x="607" y="470" text-anchor="middle" class="function">computeInvoiceFigures(),</text><text x="607" y="482" text-anchor="middle" class="function">render()</text>
  <rect x="685" y="430" width="125" height="57" rx="5" class="box"/><text x="747" y="451" text-anchor="middle" class="label">reports.js</text><text x="747" y="470" text-anchor="middle" class="function">getDashboardSummary(),</text><text x="747" y="482" text-anchor="middle" class="function">getGstReconciliation()</text>
  <rect x="825" y="430" width="95" height="57" rx="5" class="box"/><text x="872" y="451" text-anchor="middle" class="label">dates.js</text><text x="872" y="470" text-anchor="middle" class="function">today()</text>

  <!-- ordinary dependency links -->
  <path d="M930 96H900V378H810" class="link"/><path d="M930 106H890V378H670" class="link"/><path d="M930 116H880V378H530" class="link"/>
  <text x="858" y="290" class="tiny">settings</text>
  <path d="M390 378H405" class="link"/><path d="M670 378H685" class="link"/><path d="M810 378H825" class="link"/>

  <!-- numbered order flow -->
  <text x="45" y="290" class="groupname">Place-order flow</text>
  <rect x="25" y="305" width="185" height="30" rx="5" class="step"/><text x="118" y="325" text-anchor="middle" class="steptext">1. POST /api/orders</text>
  <path d="M120 255V305" class="flowline"/>
  <path d="M210 320H465" class="flowline"/>
  <rect x="305" y="280" width="145" height="25" rx="5" class="step"/><text x="377" y="297" text-anchor="middle" class="steptext">2. router.post('/orders')</text>
  <path d="M530 243V350H390" class="flowline"/>
  <rect x="420" y="315" width="125" height="25" rx="5" class="step"/><text x="482" y="332" text-anchor="middle" class="steptext">3. store.read()</text>
  <path d="M390 378H405" class="flowline"/>
  <rect x="400" y="410" width="135" height="25" rx="5" class="step"/><text x="467" y="427" text-anchor="middle" class="steptext">4. inventory.check()</text>
  <path d="M530 378H545" class="flowline"/>
  <rect x="545" y="410" width="165" height="25" rx="5" class="step"/><text x="627" y="427" text-anchor="middle" class="steptext">5. pricing.computeTotals()</text>
  <path d="M670 378H685" class="flowline"/><path d="M810 378H825" class="flowline"/>
  <path d="M670 378V458H530" class="flowline"/>
  <rect x="535" y="500" width="170" height="25" rx="5" class="step"/><text x="620" y="517" text-anchor="middle" class="steptext">6. ledger.chargeOrderToKhata()</text>
  <path d="M530 458H390V407" class="flowline"/>
  <rect x="270" y="505" width="190" height="25" rx="5" class="step"/><text x="365" y="522" text-anchor="middle" class="steptext">7. inventory.reserve(); orders.add()</text>
  <path d="M390 458V550H327V407" class="flowline"/>
  <path d="M327 407V610H1042V680" class="flowline"/>
  <rect x="750" y="620" width="205" height="25" rx="5" class="step"/><text x="852" y="637" text-anchor="middle" class="steptext">8. appendAudit(); store.write()</text>

  <!-- legend -->
  <rect x="25" y="700" width="505" height="65" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="43" y="724" class="label">Legend</text>
  <rect x="110" y="710" width="18" height="18" class="ticket"/><text x="136" y="724" class="legend">Ticket module: inventory.js</text>
  <rect x="300" y="710" width="18" height="18" class="cancel"/><text x="326" y="724" class="legend">Ticket function: orders.cancel()</text>
  <path d="M110 747H145" class="flowline"/><text x="153" y="751" class="legend">numbered order flow</text>
</svg>
