<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Architecture map of ShopLedger UI, Express server, API routers, library modules, configuration and JSON data store. The highlighted path traces placing an order.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8292a7"/></marker>
    <marker id="hotArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ed7a37"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172b4d}
      .title{font-size:30px;font-weight:750;letter-spacing:-.5px}.sub{font-size:14px;fill:#64748b}
      .section{font-size:12px;font-weight:750;letter-spacing:1.25px;fill:#64748b}
      .name{font-size:14px;font-weight:700}.detail{font-size:11px;fill:#64748b}
      .box{fill:#fff;stroke:#d8e1ed;stroke-width:1.5}.ui{fill:#eef6ff;stroke:#9bc6fa;stroke-width:1.5}
      .router{fill:#f2efff;stroke:#c5b8fa;stroke-width:1.5}.module{fill:#f8fafc;stroke:#d8e1ed;stroke-width:1.5}
      .cfg{fill:#fff6e8;stroke:#f3ca82;stroke-width:1.5}.data{fill:#effaf4;stroke:#9bd5b2;stroke-width:1.5}
      .flow{fill:none;stroke:#ed7a37;stroke-width:3;marker-end:url(#hotArrow)}
      .link{fill:none;stroke:#91a0b3;stroke-width:1.5;marker-end:url(#arrow)}
      .soft{fill:none;stroke:#b7c2d0;stroke-width:1.3;stroke-dasharray:5 5;marker-end:url(#arrow)}
      .pill{fill:#fff0e6;stroke:#f0a477}.pilltext{font-size:11px;font-weight:700;fill:#a54815}
    </style>
  </defs>
  <rect width="1600" height="1120" fill="#f6f8fb"/>
  <text x="64" y="62" class="title">ShopLedger · Application Architecture</text>
  <text x="64" y="88" class="sub">Browser POS, Express API, application modules, configuration and JSON persistence</text>
  <rect x="1300" y="42" width="236" height="34" rx="17" class="pill"/><text x="1418" y="64" text-anchor="middle" class="pilltext">ORDER PLACEMENT FLOW</text>

  <text x="64" y="136" class="section">BROWSER</text>
  <rect x="64" y="154" width="330" height="205" rx="14" class="ui"/>
  <text x="86" y="183" class="name">ShopLedger UI</text>
  <text x="86" y="205" class="detail">public/index.html · public/js/app.js · public/css/style.css</text>
  <rect x="86" y="224" width="136" height="28" rx="7" class="box"/><text x="154" y="243" text-anchor="middle" class="detail">Product catalog</text>
  <rect x="234" y="224" width="136" height="28" rx="7" class="box"/><text x="302" y="243" text-anchor="middle" class="detail">Current bill desk</text>
  <rect x="86" y="262" width="136" height="28" rx="7" class="box"/><text x="154" y="281" text-anchor="middle" class="detail">Order history</text>
  <rect x="234" y="262" width="136" height="28" rx="7" class="box"/><text x="302" y="281" text-anchor="middle" class="detail">Khata &amp; audit</text>
  <text x="86" y="323" class="detail">POST /api/orders · preview via /api/pricing/preview</text>

  <text x="458" y="136" class="section">SERVER</text>
  <rect x="458" y="154" width="280" height="205" rx="14" class="box"/>
  <text x="480" y="183" class="name">Express app · server.js</text>
  <text x="480" y="207" class="detail">Serves public/ assets</text>
  <text x="480" y="229" class="detail">Mounts all routers at /api</text>
  <text x="480" y="251" class="detail">GET /orders/:id/invoice</text>
  <text x="480" y="273" class="detail">Uses body-parser · config.port</text>
  <text x="480" y="323" class="detail">Routes requests to API handlers</text>
  <path d="M394 257H458" class="link"/><text x="426" y="246" text-anchor="middle" class="detail">HTTP</text>

  <text x="810" y="136" class="section">ROUTERS · routes/</text>
  <rect x="810" y="154" width="310" height="74" rx="12" class="router"/><text x="830" y="182" class="name">orders.js</text><text x="830" y="205" class="detail">POST /orders · GET /orders · cancel</text>
  <rect x="810" y="244" width="310" height="62" rx="12" class="router"/><text x="830" y="270" class="name">products.js</text><text x="830" y="291" class="detail">GET /products · GET /coupons</text>
  <rect x="810" y="322" width="310" height="62" rx="12" class="router"/><text x="830" y="348" class="name">customers.js</text><text x="830" y="369" class="detail">GET /customers · settle</text>
  <rect x="810" y="400" width="310" height="74" rx="12" class="router"/><text x="830" y="428" class="name">reports.js</text><text x="830" y="451" class="detail">dashboard · GST reconciliation · pricing preview</text>
  <path d="M738 257H780V190H810" class="flow"/><path d="M780 190V275H810" class="link"/><path d="M780 275V353H810" class="link"/><path d="M780 353V437H810" class="link"/>

  <text x="1190" y="136" class="section">PERSISTENCE &amp; CONFIGURATION</text>
  <rect x="1190" y="154" width="346" height="104" rx="12" class="cfg"/><text x="1212" y="185" class="name">config.js</text><text x="1212" y="208" class="detail">port · shop details · tax slabs · coupons</text><text x="1212" y="232" class="detail">inventory defaults · admin key</text>
  <rect x="1190" y="286" width="346" height="112" rx="12" class="data"/><text x="1212" y="318" class="name">data/db.json</text><text x="1212" y="341" class="detail">products · orders · customers · settlements</text><text x="1212" y="365" class="detail">auditLog · ID counters</text>

  <text x="64" y="423" class="section">APPLICATION MODULES · lib/</text>
  <rect x="64" y="444" width="200" height="82" rx="12" class="module"/><text x="82" y="474" class="name">orders.js</text><text x="82" y="498" class="detail">create · list · cancel</text>
  <rect x="282" y="444" width="200" height="82" rx="12" class="module"/><text x="300" y="474" class="name">inventory.js</text><text x="300" y="498" class="detail">find · check · reserve</text>
  <rect x="500" y="444" width="200" height="82" rx="12" class="module"/><text x="518" y="474" class="name">pricing.js</text><text x="518" y="498" class="detail">subtotal · totals · tax</text>
  <rect x="718" y="444" width="200" height="82" rx="12" class="module"/><text x="736" y="474" class="name">coupons.js</text><text x="736" y="498" class="detail">normalize · validate</text>
  <rect x="936" y="444" width="200" height="82" rx="12" class="module"/><text x="954" y="474" class="name">ledger.js</text><text x="954" y="498" class="detail">customer · Khata ledger</text>
  <rect x="1154" y="444" width="174" height="82" rx="12" class="module"/><text x="1172" y="474" class="name">tax.js</text><text x="1172" y="498" class="detail">HSN slabs · GST split</text>
  <rect x="1346" y="444" width="190" height="82" rx="12" class="module"/><text x="1364" y="474" class="name">store.js</text><text x="1364" y="498" class="detail">read · write · audit</text>

  <rect x="282" y="550" width="200" height="74" rx="12" class="module"/><text x="300" y="579" class="name">dates.js</text><text x="300" y="601" class="detail">today · date normalization</text>
  <rect x="500" y="550" width="200" height="74" rx="12" class="module"/><text x="518" y="579" class="name">reports.js</text><text x="518" y="601" class="detail">dashboard · reconciliation</text>
  <rect x="718" y="550" width="200" height="74" rx="12" class="module"/><text x="736" y="579" class="name">invoice.js</text><text x="736" y="601" class="detail">render HTML invoice</text>
  <path d="M264 485H282" class="soft"/><path d="M264 485H270V639H1335V485H1346" class="soft"/>
  <path d="M482 485H500" class="soft"/><path d="M700 485H718" class="soft"/><path d="M700 485H1154" class="soft"/>
  <path d="M482 485V587H282" class="soft"/><path d="M264 485V637H500V624" class="soft"/><path d="M700 587H718" class="soft"/>
  <path d="M918 485H936" class="soft"/><path d="M1136 485H1154" class="soft"/>
  <path d="M1360 258V422H811V444" class="soft"/><path d="M1360 258V286" class="soft"/>
  <path d="M1360 398V422" class="soft"/>

  <rect x="64" y="680" width="1472" height="378" rx="18" fill="#fff" stroke="#f0c3a4" stroke-width="1.5"/>
  <text x="90" y="718" class="section" style="fill:#a54815">PLACE AN ORDER · POST /api/orders</text>
  <text x="90" y="744" class="sub">Highlighted arrows trace the request through validation, calculation, persistence and the UI response.</text>
  <rect x="90" y="782" width="220" height="96" rx="12" class="ui"/><text x="110" y="813" class="name">1 · Bill desk</text><text x="110" y="839" class="detail">Select products, quantities,</text><text x="110" y="857" class="detail">coupon, customer &amp; payment</text>
  <rect x="365" y="782" width="220" height="96" rx="12" class="router"/><text x="385" y="813" class="name">2 · routes/orders.js</text><text x="385" y="839" class="detail">Resolve products &amp; items</text><text x="385" y="857" class="detail">Check stock and coupon</text>
  <rect x="640" y="782" width="220" height="96" rx="12" class="module"/><text x="660" y="813" class="name">3 · Calculate</text><text x="660" y="839" class="detail">pricing.js + coupons.js</text><text x="660" y="857" class="detail">tax.js computes GST totals</text>
  <rect x="915" y="782" width="220" height="96" rx="12" class="module"/><text x="935" y="813" class="name">4 · Apply order</text><text x="935" y="839" class="detail">inventory.js reserves stock</text><text x="935" y="857" class="detail">ledger.js charges Khata if used</text>
  <rect x="1190" y="782" width="300" height="96" rx="12" class="data"/><text x="1210" y="813" class="name">5 · Save &amp; respond</text><text x="1210" y="839" class="detail">orders.js adds order · store.js writes db</text><text x="1210" y="857" class="detail">audit entry · HTTP 201 JSON response</text>
  <path d="M310 830H365" class="flow"/><path d="M585 830H640" class="flow"/><path d="M860 830H915" class="flow"/><path d="M1135 830H1190" class="flow"/>
  <path d="M1340 878V944H200V878" class="flow"/><text x="770" y="969" text-anchor="middle" class="detail">Browser shows placed order and invoice link; refreshes products, bill preview, dashboard and customer list</text>
  <path d="M1360 398V652H1370V782" class="soft"/><text x="1390" y="666" class="detail">JSON file</text>
  <text x="90" y="1027" class="detail">Other existing modules: lib/reports.js · lib/dates.js · lib/invoice.js</text>
</svg>
