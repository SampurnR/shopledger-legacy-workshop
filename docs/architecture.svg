  <!-- Path labels -->
  <rect x="294" y="700" width="114" height="24" rx="12" fill="#fff1eb"/><text x="351" y="717" text-anchor="middle" class="small" style="fill:#c2410c;font-weight:700">POST /api/orders</text>
  <rect x="1216" y="805" width="105" height="24" rx="12" fill="#fff1eb"/><text x="1268" y="822" text-anchor="middle" class="small" style="fill:#c2410c;font-weight:700">read / write</text>

  <!-- legend -->
  <line x1="64" y1="920" x2="125" y2="920" class="hotedge"/><text x="140" y="925" class="small">Order placement request and processing</text>
  <line x1="430" y1="920" x2="491" y2="920" class="edge"/><text x="506" y="925" class="small">Other module/API dependency</text>
  <line x1="760" y1="920" x2="821" y2="920" class="edge dashed"/><text x="836" y="925" class="small">Configuration dependency</text>
  <text x="64" y="982" class="small">Invoice page is served directly by server.js; routers and modules shown are the files present in this repository.</text>
  <text x="64" y="1007" class="small">Arrows show code-level calls/data dependencies. The highlighted path covers request handling through persisted order data.</text>
</svg>
