<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="desc">Architecture diagram of the browser UI, Express server, routes, libraries, configuration, JSON database, and the numbered order placement flow.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="flowArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <style>
      .bg { fill:#f8fafc; }
      .title { font:700 24px sans-serif; fill:#0f172a; }
      .subtitle { font:400 13px sans-serif; fill:#475569; }
      .group { fill:#ffffff; stroke:#cbd5e1; stroke-width:1.5; }
      .group-title { font:700 15px sans-serif; fill:#0f172a; }
      .box { fill:#ffffff; stroke:#94a3b8; stroke-width:1.25; }
      .ui { fill:#e0f2fe; stroke:#0284c7; stroke-width:1.5; }
      .server { fill:#e0e7ff; stroke:#4f46e5; stroke-width:1.5; }
      .route { fill:#fef3c7; stroke:#d97706; stroke-width:1.25; }
      .lib { fill:#f1f5f9; stroke:#64748b; stroke-width:1.15; }
      .ticket { fill:#fae8ff; stroke:#a21caf; stroke-width:2; }
      .data { fill:#dcfce7; stroke:#16a34a; stroke-width:1.5; }
      .config { fill:#ffedd5; stroke:#ea580c; stroke-width:1.5; }
      .flow { fill:#ecfdf5; stroke:#0f766e; stroke-width:1.5; }
      .node { font:700 13px sans-serif; fill:#0f172a; }
      .small { font:400 12px sans-serif; fill:#334155; }
      .note { font:400 12px sans-serif; fill:#475569; }
      .flowtext { font:600 12px sans-serif; fill:#134e4a; }
      .num { font:700 12px sans-serif; fill:#ffffff; text-anchor:middle; }
      .line { fill:none; stroke:#475569; stroke-width:1.4; marker-end:url(#arrow); }
      .dash { fill:none; stroke:#64748b; stroke-width:1.2; stroke-dasharray:5 4; marker-end:url(#arrow); }
      .flowline { fill:none; stroke:#0f766e; stroke-width:1.7; marker-end:url(#flowArrow); }
      .legend { font:400 12px sans-serif; fill:#334155; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="800"/>
  <text class="title" x="24" y="34">ShopLedger — Node/Express POS, Khata &amp; GST Invoice Architecture</text>
  <text class="subtitle" x="24" y="56">Verified file and function names only · highlighted module is the invoice ticket focus</text>

  <!-- Browser -->
  <rect class="group" x="20" y="82" width="198" height="250" rx="9"/>
  <text class="group-title" x="34" y="108">Browser</text>
  <rect class="ui" x="34" y="122" width="170" height="148" rx="7"/>
  <text class="node" x="46" y="147">public/</text>
  <text class="small" x="46" y="170">index.html</text>
  <text class="small" x="46" y="190">js/app.js</text>
  <text class="small" x="46" y="210">css/style.css</text>
  <text class="note" x="46" y="240">POS · orders · Khata</text>
  <text class="note" x="46" y="257">GST reconciliation UI</text>
  <text class="note" x="34" y="304">HTTP JSON + invoice links</text>

  <!-- Server -->
  <rect class="group" x="246" y="82" width="190" height="250" rx="9"/>
  <text class="group-title" x="260" y="108">Express entry point</text>
  <rect class="server" x="260" y="122" width="162" height="140" rx="7"/>
  <text class="node" x="273" y="148">server.js</text>
  <text class="small" x="273" y="172">bodyParser.json()</text>
  <text class="small" x="273" y="192">express.static(public/)</text>
  <text class="small" x="273" y="212">app.use('/api', routers)</text>
  <text class="small" x="273" y="232">GET /orders/:id/invoice</text>
  <text class="note" x="260" y="304">Boots only when main module</text>

  <!-- Routes -->
  <rect class="group" x="464" y="82" width="226" height="468" rx="9"/>
  <text class="group-title" x="478" y="108">routes/ (mounted at /api)</text>
  <rect class="route" x="478" y="122" width="198" height="88" rx="6"/>
  <text class="node" x="490" y="146">products.js</text>
  <text class="small" x="490" y="168">GET /products</text>
  <text class="small" x="490" y="188">GET /coupons</text>
  <rect class="route" x="478" y="222" width="198" height="112" rx="6"/>
  <text class="node" x="490" y="246">orders.js</text>
  <text class="small" x="490" y="268">GET /orders · GET /orders/:id</text>
  <text class="small" x="490" y="288">POST /orders</text>
  <text class="small" x="490" y="308">POST /orders/:id/cancel</text>
  <rect class="route" x="478" y="346" width="198" height="88" rx="6"/>
  <text class="node" x="490" y="370">customers.js</text>
  <text class="small" x="490" y="392">GET /customers</text>
  <text class="small" x="490" y="412">POST /customers/:id/settle</text>
  <rect class="route" x="478" y="446" width="198" height="90" rx="6"/>
  <text class="node" x="490" y="470">reports.js</text>
  <text class="small" x="490" y="492">dashboard · GST reconciliation</text>
  <text class="small" x="490" y="512">pricing preview · admin export</text>

  <!-- Libraries -->
  <rect class="group" x="718" y="82" width="272" height="468" rx="9"/>
  <text class="group-title" x="732" y="108">lib/</text>
  <rect class="lib" x="732" y="122" width="112" height="58" rx="5"/>
  <text class="node" x="742" y="145">store.js</text><text class="small" x="742" y="166">read · write · audit</text>
  <rect class="lib" x="854" y="122" width="122" height="58" rx="5"/>
  <text class="node" x="864" y="145">inventory.js</text><text class="small" x="864" y="166">find · check · reserve</text>
  <rect class="lib" x="732" y="190" width="112" height="58" rx="5"/>
  <text class="node" x="742" y="213">orders.js</text><text class="small" x="742" y="234">add · get · cancel</text>
  <rect class="lib" x="854" y="190" width="122" height="58" rx="5"/>
  <text class="node" x="864" y="213">ledger.js</text><text class="small" x="864" y="234">Khata · settlements</text>
  <rect class="lib" x="732" y="258" width="112" height="58" rx="5"/>
  <text class="node" x="742" y="281">pricing.js</text><text class="small" x="742" y="302">subtotal · totals</text>
  <rect class="lib" x="854" y="258" width="122" height="58" rx="5"/>
  <text class="node" x="864" y="281">coupons.js</text><text class="small" x="864" y="302">validate · discount</text>
  <rect class="lib" x="732" y="326" width="112" height="58" rx="5"/>
  <text class="node" x="742" y="349">tax.js</text><text class="small" x="742" y="370">rate · CGST/SGST</text>
  <rect class="ticket" x="854" y="326" width="122" height="58" rx="5"/>
  <text class="node" x="864" y="349">invoice.js</text><text class="small" x="864" y="370">figures · render</text>
  <rect class="lib" x="732" y="394" width="112" height="58" rx="5"/>
  <text class="node" x="742" y="417">reports.js</text><text class="small" x="742" y="438">dashboard · GST recon</text>
  <rect class="lib" x="854" y="394" width="122" height="58" rx="5"/>
  <text class="node" x="864" y="417">dates.js</text><text class="small" x="864" y="438">today · date keys</text>
  <text class="note" x="732" y="486">invoice.js is highlighted: ticket focus</text>

  <!-- Configuration and data -->
  <rect class="group" x="1018" y="82" width="162" height="468" rx="9"/>
  <text class="group-title" x="1032" y="108">Local state</text>
  <rect class="config" x="1032" y="122" width="134" height="136" rx="7"/>
  <text class="node" x="1044" y="148">config.js</text>
  <text class="small" x="1044" y="172">shop / GSTIN</text>
  <text class="small" x="1044" y="192">HSN slabs</text>
  <text class="small" x="1044" y="212">coupons</text>
  <text class="small" x="1044" y="232">port / adminKey</text>
  <rect class="data" x="1032" y="294" width="134" height="160" rx="7"/>
  <text class="node" x="1044" y="320">data/db.json</text>
  <text class="small" x="1044" y="344">products · orders</text>
  <text class="small" x="1044" y="364">customers</text>
  <text class="small" x="1044" y="384">settlements</text>
  <text class="small" x="1044" y="404">auditLog · next IDs</text>

  <!-- Architecture lines -->
  <path class="line" d="M204 196 H260"/>
  <path class="line" d="M422 190 H478"/>
  <path class="dash" d="M676 278 H732"/>
  <path class="dash" d="M676 484 H732"/>
  <path class="line" d="M422 232 C590 232 684 355 854 355"/>
  <path class="dash" d="M844 151 H1032"/>
  <path class="dash" d="M844 287 H1032"/>
  <path class="dash" d="M976 355 H1032"/>
  <path class="line" d="M844 151 H966 V374 H1032"/>
  <text class="note" x="605" y="264">uses</text>
  <text class="note" x="934" y="343">reads config</text>

  <!-- Numbered flow -->
  <rect class="group" x="20" y="574" width="1160" height="202" rx="9"/>
  <text class="group-title" x="34" y="602">Numbered order-placement flow — POST /api/orders</text>
  <rect class="flow" x="34" y="622" width="168" height="116" rx="7"/>
  <circle cx="52" cy="641" r="11" fill="#0f766e"/><text class="num" x="52" y="645">1</text>
  <text class="flowtext" x="70" y="645">public/js/app.js</text>
  <text class="small" x="46" y="671">Builds payload, sends</text><text class="small" x="46" y="690">POST /api/orders</text>
  <rect class="flow" x="224" y="622" width="168" height="116" rx="7"/>
  <circle cx="242" cy="641" r="11" fill="#0f766e"/><text class="num" x="242" y="645">2</text>
  <text class="flowtext" x="260" y="645">routes/orders.js</text>
  <text class="small" x="236" y="671">store.read(); item lookup</text><text class="small" x="236" y="690">inventory.find/check()</text>
  <rect class="flow" x="414" y="622" width="168" height="116" rx="7"/>
  <circle cx="432" cy="641" r="11" fill="#0f766e"/><text class="num" x="432" y="645">3</text>
  <text class="flowtext" x="450" y="645">pricing + coupons</text>
  <text class="small" x="426" y="671">validate(); computeTotals()</text><text class="small" x="426" y="690">uses tax.getRateForItem()</text>
  <rect class="flow" x="604" y="622" width="168" height="116" rx="7"/>
  <circle cx="622" cy="641" r="11" fill="#0f766e"/><text class="num" x="622" y="645">4</text>
  <text class="flowtext" x="640" y="645">ledger.js (Khata)</text>
  <text class="small" x="616" y="671">Conditional credit-limit</text><text class="small" x="616" y="690">charge + balance update</text>
  <rect class="flow" x="794" y="622" width="168" height="116" rx="7"/>
  <circle cx="812" cy="641" r="11" fill="#0f766e"/><text class="num" x="812" y="645">5</text>
  <text class="flowtext" x="830" y="645">inventory + orders</text>
  <text class="small" x="806" y="671">reserve() stock; add()</text><text class="small" x="806" y="690">creates order object</text>
  <rect class="flow" x="984" y="622" width="182" height="116" rx="7"/>
  <circle cx="1002" cy="641" r="11" fill="#0f766e"/><text class="num" x="1002" y="645">6</text>
  <text class="flowtext" x="1020" y="645">store.js → db.json</text>
  <text class="small" x="996" y="671">appendAudit(); write()</text><text class="small" x="996" y="690">persists whole database</text>
  <path class="flowline" d="M202 680 H224"/><path class="flowline" d="M392 680 H414"/><path class="flowline" d="M582 680 H604"/><path class="flowline" d="M772 680 H794"/><path class="flowline" d="M962 680 H984"/>

  <!-- Legend -->
  <rect x="24" y="754" width="14" height="14" class="ticket" rx="2"/><text class="legend" x="44" y="766">Ticket focus: lib/invoice.js</text>
  <rect x="230" y="754" width="14" height="14" class="route" rx="2"/><text class="legend" x="250" y="766">API router</text>
  <rect x="340" y="754" width="14" height="14" class="data" rx="2"/><text class="legend" x="360" y="766">Persisted JSON data</text>
  <path class="flowline" d="M510 761 H542"/><text class="legend" x="550" y="766">numbered checkout flow</text>
  <path class="dash" d="M720 761 H750"/><text class="legend" x="758" y="766">dependency / configuration</text>
</svg>
