<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement</title>
  <desc id="desc">Browser, Express entry point, four API routers, ten library modules, configuration, and JSON storage. Eight numbered steps show successful order placement. Purple marks the invoice module.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#526980"/>
    </marker>
    <style>
      text { font-family: system-ui, sans-serif; fill: #182c40; font-size: 13px }
      .title { font-size: 32px; font-weight: 750 }
      .heading { font-size: 18px; font-weight: 700 }
      .name { font-size: 15px; font-weight: 700 }
      .muted { fill: #435b72 }
      .panel { fill: #eef4f9; stroke: #c2d1df }
      .card { fill: #fff; stroke: #9fb5ca }
      .ticket { fill: #f0e6ff; stroke: #8052b0; stroke-width: 1.5 }
      .ticket-text { fill: #512783 }
      .edge { fill: none; stroke: #526980; stroke-width: 1.5; marker-end: url(#arrow) }
      .both { marker-start: url(#arrow) }
      .number { fill: #fff; font-weight: 700; text-anchor: middle }
    </style>
  </defs>
  <rect width="1200" height="800" fill="#f9fbfd"/>
  <text class="title" x="32" y="52">ShopLedger architecture</text>
  <text class="muted" x="33" y="77">Point of sale, Khata credit ledger and GST invoicing</text>

  <rect class="panel" x="30" y="100" width="598" height="632" rx="14"/>
  <text class="heading" x="48" y="129">Application modules</text>
  <rect class="card" x="48" y="144" width="248" height="61" rx="8"/>
  <text class="name" x="62" y="168">Browser UI · public/</text>
  <text class="muted" x="62" y="189">index.html · js/app.js · css/style.css</text>
  <path class="edge" d="M296 174H346"/>
  <rect class="card" x="346" y="144" width="264" height="61" rx="8"/>
  <text class="name" x="360" y="168">server.js</text>
  <text class="muted" x="360" y="189">Static UI · /api · printable invoice</text>

  <path class="edge" d="M478 205V226"/>
  <rect class="card" x="48" y="226" width="562" height="72" rx="8"/>
  <text class="name" x="62" y="250">routes/ · mounted at /api</text>
  <text x="62" y="277">products.js</text>
  <text x="199" y="277">orders.js</text>
  <text x="324" y="277">customers.js</text>
  <text x="475" y="277">reports.js</text>

  <path class="edge" d="M272 298V326"/>
  <path class="edge" d="M610 175H619V398H610"/>
  <rect class="card" x="48" y="326" width="562" height="285" rx="8"/>
  <text class="name" x="62" y="351">lib/ · application logic</text>
  <path d="M322 366V596" stroke="#d7e1eb"/>
  <rect class="ticket" x="336" y="369" width="274" height="54" rx="7"/>
  <text class="name ticket-text" x="348" y="390">invoice.js</text>
  <text class="ticket-text" x="348" y="410">render() · computeInvoiceFigures()</text>
  <text class="name" x="62" y="387">inventory.js</text>
  <text class="muted" x="62" y="405">Product lookup and stock</text>
  <text class="name" x="62" y="433">pricing.js</text>
  <text class="muted" x="62" y="451">Checkout totals and line breakdowns</text>
  <text class="name" x="62" y="479">coupons.js</text>
  <text class="muted" x="62" y="497">Coupon validation and discounts</text>
  <text class="name" x="62" y="525">tax.js</text>
  <text class="muted" x="62" y="543">Checkout GST rates and split</text>
  <text class="name" x="62" y="571">ledger.js</text>
  <text class="muted" x="62" y="589">Khata charges and settlements</text>
  <text class="name" x="348" y="443">reports.js</text>
  <text class="muted" x="348" y="461">Dashboard and GST reconciliation</text>
  <text class="name" x="348" y="485">orders.js</text>
  <text class="muted" x="348" y="503">Order records and cancellation</text>
  <text class="name" x="348" y="527">dates.js</text>
  <text class="muted" x="348" y="545">Order and settlement dates</text>
  <text class="name" x="348" y="571">store.js</text>
  <text class="muted" x="348" y="589">JSON reads, writes and audit entries</text>

  <path class="edge" d="M172 648V611"/>
  <path class="edge both" d="M478 611V648"/>
  <rect class="card" x="48" y="648" width="248" height="65" rx="8"/>
  <text class="name" x="62" y="672">config.js</text>
  <text class="muted" x="62" y="694">Shop, GST, coupons and defaults</text>
  <rect class="card" x="346" y="648" width="264" height="65" rx="8"/>
  <text class="name" x="360" y="672">data/db.json</text>
  <text class="muted" x="360" y="694">Orders, stock, Khata and audit log</text>

  <rect class="panel" x="646" y="100" width="524" height="632" rx="14"/>
  <text class="heading" x="666" y="129">Placing an order</text>
  <path d="M682 166V675" stroke="#a3b8cc" stroke-width="2"/>
  <g fill="#2c587d">
    <circle cx="682" cy="166" r="14"/><circle cx="682" cy="232" r="14"/>
    <circle cx="682" cy="298" r="14"/><circle cx="682" cy="364" r="14"/>
    <circle cx="682" cy="451" r="14"/><circle cx="682" cy="517" r="14"/>
    <circle cx="682" cy="604" r="14"/><circle cx="682" cy="675" r="14"/>
  </g>
  <g class="number">
    <text class="number" x="682" y="171">1</text><text class="number" x="682" y="237">2</text>
    <text class="number" x="682" y="303">3</text><text class="number" x="682" y="369">4</text>
    <text class="number" x="682" y="456">5</text><text class="number" x="682" y="522">6</text>
    <text class="number" x="682" y="609">7</text><text class="number" x="682" y="680">8</text>
  </g>
  <text class="name" x="710" y="165">Submit cart</text>
  <text class="muted" x="710" y="186">public/js/app.js → POST /api/orders → routes/orders.js</text>
  <text class="name" x="710" y="231">Load catalog and resolve items</text>
  <text class="muted" x="710" y="252">store.read() → inventory.find() → inventory.check()</text>
  <text class="name" x="710" y="297">Validate coupon against the pre-tax subtotal</text>
  <text class="muted" x="710" y="318">pricing.subtotal() → coupons.normalizeCode() → coupons.validate()</text>
  <text class="name" x="710" y="363">Calculate the checkout total</text>
  <text class="muted" x="710" y="384">pricing.computeTotals() → coupons.calculateDiscount()</text>
  <text class="muted" x="710" y="403">Apportion discount, then apply tax.getRateForItem() per line.</text>
  <text class="name" x="710" y="450">Charge a Khata sale to the customer account</text>
  <text class="muted" x="710" y="471">ledger.chargeOrderToKhata() checks credit and updates the balance.</text>
  <text class="name" x="710" y="516">Deduct stock and record the order</text>
  <text class="muted" x="710" y="537">inventory.reserve() → orders.add()</text>
  <text class="muted" x="710" y="556">Save item snapshots, coupon, subtotal, discount, GST and total.</text>
  <text class="name" x="710" y="603">Persist the changes</text>
  <text class="muted" x="710" y="624">store.appendAudit() → store.write() → data/db.json</text>
  <text class="name" x="710" y="674">Return HTTP 201 with the saved order</text>
  <text class="muted" x="710" y="695">The printable invoice is a separate GET /orders/:id/invoice.</text>

  <rect class="ticket" x="32" y="752" width="18" height="18" rx="4"/>
  <text x="59" y="766">Ticket scope</text>
  <path class="edge" d="M162 761H194"/>
  <text x="204" y="766">Request, call or data flow</text>
  <circle cx="409" cy="761" r="10" fill="#2c587d"/>
  <text class="number" x="409" y="766">1</text>
  <text x="428" y="766">Order placement step</text>
</svg>
