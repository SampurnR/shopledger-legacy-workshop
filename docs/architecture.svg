<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1120" viewBox="0 0 1680 1120" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Architecture diagram showing the browser UI, Express server, four route modules, all library modules, configuration, JSON data store, and the order placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
    <marker id="orderArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0f766e"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172033}.title{font-size:32px;font-weight:700}.subtitle{font-size:15px;fill:#526078}.section{font-size:15px;font-weight:700;letter-spacing:1px;fill:#526078}.label{font-size:16px;font-weight:650}.small{font-size:13px;fill:#526078}.tiny{font-size:12px;fill:#526078}.box{rx:12;stroke-width:1.5}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.order{fill:none;stroke:#0f766e;stroke-width:3;marker-end:url(#orderArrow)}.orderThin{fill:none;stroke:#0f766e;stroke-width:2;marker-end:url(#orderArrow)}.dataEdge{fill:none;stroke:#94a3b8;stroke-width:1.8;stroke-dasharray:6 5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1680" height="1120" fill="#f8fafc"/>
  <text x="64" y="62" class="title">ShopLedger architecture</text>
  <text x="64" y="91" class="subtitle">Express app · JSON file storage · order placement path highlighted in teal</text>

  <!-- Browser UI -->
  <rect x="55" y="140" width="300" height="858" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="80" y="179" class="section">BROWSER UI</text>
  <rect class="box" x="83" y="220" width="244" height="110" fill="#ffffff" stroke="#93c5fd"/>
  <text x="107" y="255" class="label">public/index.html</text>
  <text x="107" y="281" class="small">ShopLedger screens</text>
  <text x="107" y="304" class="small">POS · orders · Khata · reports</text>
  <rect class="box" x="83" y="365" width="244" height="100" fill="#ffffff" stroke="#93c5fd"/>
  <text x="107" y="401" class="label">public/js/app.js</text>
  <text x="107" y="428" class="small">UI actions and API calls</text>
  <rect class="box" x="83" y="500" width="244" height="72" fill="#ffffff" stroke="#93c5fd"/>
  <text x="107" y="543" class="label">public/css/style.css</text>
  <path class="edge" d="M205 330 V357"/>
  <text x="218" y="349" class="tiny">loads</text>

  <!-- server / routes region -->
  <rect x="390" y="140" width="755" height="858" rx="18" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="416" y="179" class="section">NODE / EXPRESS SERVER</text>
  <rect class="box" x="420" y="215" width="695" height="82" fill="#ffffff" stroke="#94a3b8"/>
  <text x="446" y="249" class="label">server.js</text>
  <text x="446" y="274" class="small">JSON body parser · static public/ · mounts routers · GET /orders/:id/invoice</text>
  <path class="edge" d="M327 414 H379 V256 H410"/>
  <text x="335" y="401" class="tiny">HTTP / API</text>

  <text x="420" y="337" class="section">ROUTES</text>
  <rect class="box" x="420" y="360" width="320" height="100" fill="#fff7ed" stroke="#fdba74"/>
  <text x="444" y="396" class="label">routes/orders.js</text>
  <text x="444" y="423" class="small">orders · cancellation</text>
  <rect class="box" x="775" y="360" width="320" height="100" fill="#fff7ed" stroke="#fdba74"/>
  <text x="799" y="396" class="label">routes/products.js</text>
  <text x="799" y="423" class="small">products · active coupons</text>
  <rect class="box" x="420" y="490" width="320" height="100" fill="#fff7ed" stroke="#fdba74"/>
  <text x="444" y="526" class="label">routes/customers.js</text>
  <text x="444" y="553" class="small">customers · settlements</text>
  <rect class="box" x="775" y="490" width="320" height="100" fill="#fff7ed" stroke="#fdba74"/>
  <text x="799" y="526" class="label">routes/reports.js</text>
  <text x="799" y="553" class="small">dashboard · pricing preview · GST · export</text>
  <path class="edge" d="M767 297 V325 H580 V350"/>
  <path class="edge" d="M767 325 H935 V350"/>
  <path class="edge" d="M580 325 V480"/>
  <path class="edge" d="M935 325 V480"/>

  <!-- Libraries -->
  <text x="420" y="636" class="section">LIBRARY MODULES</text>
  <rect class="box" x="420" y="661" width="210" height="90" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="440" y="696" class="label">lib/orders.js</text><text x="440" y="722" class="small">create · list · cancel</text>
  <rect class="box" x="654" y="661" width="210" height="90" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="674" y="696" class="label">lib/inventory.js</text><text x="674" y="722" class="small">stock checks and updates</text>
  <rect class="box" x="888" y="661" width="210" height="90" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="908" y="696" class="label">lib/pricing.js</text><text x="908" y="722" class="small">subtotal · discount · GST totals</text>
  <rect class="box" x="420" y="779" width="210" height="90" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="440" y="814" class="label">lib/coupons.js</text><text x="440" y="840" class="small">validate · calculate</text>
  <rect class="box" x="654" y="779" width="210" height="90" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="674" y="814" class="label">lib/tax.js</text><text x="674" y="840" class="small">HSN GST rate · CGST / SGST</text>
  <rect class="box" x="888" y="779" width="210" height="90" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="908" y="814" class="label">lib/ledger.js</text><text x="908" y="840" class="small">Khata · settlements</text>
  <rect class="box" x="420" y="897" width="210" height="72" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="440" y="927" class="label">lib/store.js</text><text x="440" y="951" class="small">read · write · audit</text>
  <rect class="box" x="654" y="897" width="210" height="72" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="674" y="927" class="label">lib/reports.js</text><text x="674" y="951" class="small">dashboard · reconciliation</text>
  <rect class="box" x="888" y="897" width="210" height="72" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="908" y="927" class="label">lib/invoice.js</text><text x="908" y="951" class="small">figures · HTML rendering</text>

  <!-- route calls and module dependencies -->
  <path class="order" d="M580 460 V620 H525 V651"/>
  <text x="535" y="613" class="tiny" fill="#0f766e">place order</text>
  <path class="edge" d="M610 460 V630 H760 V651"/>
  <path class="edge" d="M640 460 V625 H993 V651"/>
  <path class="edge" d="M580 590 V615 H525 V887"/>
  <path class="edge" d="M935 590 V615 H760 V887"/>
  <path class="edge" d="M935 590 V625 H993 V887"/>
  <path class="edge" d="M580 751 V770"/>
  <path class="edge" d="M630 706 H644"/>
  <path class="edge" d="M864 706 H878"/>
  <path class="edge" d="M993 751 V770"/>
  <path class="edge" d="M993 869 V887"/>
  <path class="edge" d="M525 869 V887"/>

  <!-- data and config -->
  <rect x="1180" y="140" width="445" height="858" rx="18" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="1206" y="179" class="section">SETTINGS &amp; DATA</text>
  <rect class="box" x="1220" y="245" width="365" height="145" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="1250" y="283" class="label">config.js</text>
  <text x="1250" y="313" class="small">port · shop details · tax slabs</text>
  <text x="1250" y="339" class="small">inventory settings · coupon definitions</text>
  <rect class="box" x="1220" y="585" width="365" height="166" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="1250" y="625" class="label">data/db.json</text>
  <text x="1250" y="656" class="small">products · orders · customers</text>
  <text x="1250" y="682" class="small">settlements · auditLog · ID counters</text>
  <path class="dataEdge" d="M1115 256 H1208"/>
  <path class="dataEdge" d="M1098 933 H1160 V685 H1208"/>
  <text x="1167" y="803" class="tiny" transform="rotate(-90 1167 803)">read / write JSON</text>
  <path class="edge" d="M1115 256 H1165 V318 H1210"/>

  <!-- order flow annotation -->
  <rect x="1206" y="810" width="382" height="130" rx="12" fill="#ecfdf5" stroke="#5eead4" stroke-width="1.5"/>
  <text x="1230" y="844" class="label" fill="#0f766e">Order placement</text>
  <text x="1230" y="873" class="small">UI → orders route → stock / pricing</text>
  <text x="1230" y="897" class="small">→ optional Khata → order + audit → JSON</text>
  <text x="1230" y="921" class="small">→ order result → UI → invoice link</text>
  <path class="orderThin" d="M1098 706 H1152 V867 H1195"/>
  <text x="1111" y="699" class="tiny" fill="#0f766e">order flow</text>
</svg>
