<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Architecture map of the ShopLedger browser UI, Express routers, library modules, configuration, and JSON data file, with the order placement flow highlighted.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Segoe UI,Arial,sans-serif;fill:#172554}.title{font-size:34px;font-weight:700}.sub{font-size:16px;fill:#475569}.head{font-size:20px;font-weight:700}.label{font-size:16px;font-weight:650}.small{font-size:13px;fill:#475569}.tiny{font-size:12px;fill:#475569}.node{fill:#fff;stroke:#94a3b8;stroke-width:2}.ui{fill:#eff6ff;stroke:#60a5fa}.route{fill:#f5f3ff;stroke:#8b5cf6}.lib{fill:#f0fdf4;stroke:#4ade80}.data{fill:#fff7ed;stroke:#fb923c}.config{fill:#fdf2f8;stroke:#f472b6}.order{fill:none;stroke:#2563eb;stroke-width:4;marker-end:url(#blueArrow)}.flow{fill:none;stroke:#64748b;stroke-width:2.2;marker-end:url(#arrow)}.dash{stroke-dasharray:7 6}.box{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.step{fill:#dbeafe;stroke:#60a5fa;stroke-width:1.5}.num{fill:#2563eb}.numtext{font-size:13px;font-weight:700;fill:white;text-anchor:middle;dominant-baseline:middle}
    </style>
  </defs>
  <rect width="1800" height="1160" fill="#f8fafc"/>
  <text x="52" y="58" class="title">ShopLedger — application architecture</text>
  <text x="52" y="88" class="sub">Browser POS and bookkeeping app · order placement path highlighted in blue</text>

  <!-- Main application layers -->
  <rect x="40" y="120" width="1720" height="500" rx="18" class="box"/>
  <text x="65" y="156" class="head">Application modules</text>

  <!-- UI -->
  <rect x="70" y="205" width="300" height="205" rx="14" class="node ui"/>
  <text x="94" y="241" class="head">Browser UI</text>
  <text x="94" y="274" class="label">public/index.html</text>
  <text x="94" y="301" class="label">public/js/app.js</text>
  <text x="94" y="328" class="label">public/css/style.css</text>
  <text x="94" y="369" class="small">POS · order history · Khata · audit</text>

  <!-- Server -->
  <rect x="455" y="185" width="270" height="74" rx="12" class="node"/>
  <text x="480" y="216" class="label">server.js · Express app</text>
  <text x="480" y="240" class="small">serves UI · mounts /api routers</text>
  <path d="M370 270 L455 225" class="flow"/>
  <text x="382" y="226" class="tiny">HTTP / JSON</text>

  <!-- Routers -->
  <rect x="420" y="290" width="365" height="280" rx="14" class="node route"/>
  <text x="445" y="326" class="head">routes/</text>
  <rect x="445" y="345" width="315" height="46" rx="8" class="node route"/><text x="462" y="374" class="label">orders.js</text>
  <rect x="445" y="402" width="315" height="46" rx="8" class="node route"/><text x="462" y="431" class="label">products.js</text>
  <rect x="445" y="459" width="315" height="46" rx="8" class="node route"/><text x="462" y="488" class="label">customers.js</text>
  <rect x="445" y="516" width="315" height="38" rx="8" class="node route"/><text x="462" y="542" class="label">reports.js</text>
  <path d="M590 259 L590 290" class="flow"/>

  <!-- Libraries -->
  <rect x="835" y="185" width="535" height="385" rx="14" class="node lib"/>
  <text x="860" y="221" class="head">lib/</text>
  <rect x="860" y="244" width="226" height="53" rx="9" class="node lib"/><text x="876" y="276" class="label">orders.js</text>
  <rect x="1100" y="244" width="244" height="53" rx="9" class="node lib"/><text x="1116" y="276" class="label">inventory.js</text>
  <rect x="860" y="309" width="226" height="53" rx="9" class="node lib"/><text x="876" y="341" class="label">pricing.js</text>
  <rect x="1100" y="309" width="244" height="53" rx="9" class="node lib"/><text x="1116" y="341" class="label">tax.js</text>
  <rect x="860" y="374" width="226" height="53" rx="9" class="node lib"/><text x="876" y="406" class="label">coupons.js</text>
  <rect x="1100" y="374" width="244" height="53" rx="9" class="node lib"/><text x="1116" y="406" class="label">ledger.js</text>
  <rect x="860" y="439" width="226" height="53" rx="9" class="node lib"/><text x="876" y="471" class="label">reports.js</text>
  <rect x="1100" y="439" width="244" height="53" rx="9" class="node lib"/><text x="1116" y="471" class="label">invoice.js</text>
  <rect x="860" y="504" width="484" height="43" rx="9" class="node lib"/><text x="876" y="532" class="label">dates.js</text>

  <path d="M785 365 L835 365" class="flow"/>
  <text x="789" y="350" class="tiny">calls</text>

  <!-- Config and store -->
  <rect x="1450" y="210" width="260" height="115" rx="14" class="node config"/>
  <text x="1475" y="249" class="head">config.js</text>
  <text x="1475" y="278" class="small">port · shop · GST slabs</text>
  <text x="1475" y="301" class="small">coupons · inventory defaults</text>
  <path d="M1370 267 L1450 267" class="flow dash"/>
  <text x="1383" y="250" class="tiny">settings</text>

  <rect x="1450" y="390" width="260" height="125" rx="14" class="node data"/>
  <text x="1475" y="430" class="head">lib/store.js</text>
  <text x="1475" y="459" class="small">read · write · audit log</text>
  <text x="1475" y="486" class="small">synchronous file access</text>
  <rect x="1450" y="535" width="260" height="62" rx="12" class="node data"/>
  <text x="1475" y="573" class="label">data/db.json</text>
  <path d="M1370 475 L1450 455" class="flow"/>
  <path d="M1580 515 L1580 535" class="flow"/>

  <!-- Highlighted order flow overlays -->
  <path d="M370 350 C400 380 405 380 445 368" class="order"/>
  <path d="M760 368 C808 368 812 270 860 270" class="order"/>
  <path d="M1086 270 C1098 270 1088 335 1100 335" class="order"/>
  <path d="M1086 335 L1100 400" class="order"/>
  <path d="M1344 400 C1390 400 1398 445 1450 445" class="order"/>
  <path d="M1580 515 L1580 535" class="order"/>
  <circle cx="397" cy="365" r="13" class="num"/><text x="397" y="365" class="numtext">1</text>
  <circle cx="810" cy="365" r="13" class="num"/><text x="810" y="365" class="numtext">2</text>
  <circle cx="1095" cy="287" r="13" class="num"/><text x="1095" y="287" class="numtext">3</text>
  <circle cx="1400" cy="424" r="13" class="num"/><text x="1400" y="424" class="numtext">4</text>

  <!-- Order flow narrative -->
  <rect x="40" y="655" width="1720" height="455" rx="18" class="box"/>
  <text x="65" y="695" class="head">Order placement flow</text>
  <text x="65" y="721" class="small">The highlighted path runs through the same modules shown above.</text>

  <g>
    <rect x="75" y="775" width="270" height="150" rx="14" class="step"/>
    <circle cx="105" cy="805" r="16" class="num"/><text x="105" y="805" class="numtext">1</text>
    <text x="132" y="811" class="label">Browser submits order</text>
    <text x="98" y="849" class="small">POST /api/orders</text>
    <text x="98" y="875" class="small">items · customer · payment</text>
    <text x="98" y="901" class="small">status · coupon</text>

    <rect x="420" y="775" width="300" height="150" rx="14" class="step"/>
    <circle cx="450" cy="805" r="16" class="num"/><text x="450" y="805" class="numtext">2</text>
    <text x="477" y="811" class="label">orders.js route validates</text>
    <text x="443" y="849" class="small">resolves product records</text>
    <text x="443" y="875" class="small">checks stock and coupon</text>
    <text x="443" y="901" class="small">selects Khata behavior if needed</text>

    <rect x="795" y="775" width="350" height="150" rx="14" class="step"/>
    <circle cx="825" cy="805" r="16" class="num"/><text x="825" y="805" class="numtext">3</text>
    <text x="852" y="811" class="label">Libraries calculate and update</text>
    <text x="818" y="849" class="small">pricing.js → tax.js + coupons.js</text>
    <text x="818" y="875" class="small">inventory.js deducts stock</text>
    <text x="818" y="901" class="small">ledger.js charges Khata when selected</text>

    <rect x="1220" y="775" width="475" height="150" rx="14" class="step"/>
    <circle cx="1250" cy="805" r="16" class="num"/><text x="1250" y="805" class="numtext">4</text>
    <text x="1277" y="811" class="label">Persist order and return response</text>
    <text x="1243" y="849" class="small">orders.js creates order + audit entry</text>
    <text x="1243" y="875" class="small">store.js writes data/db.json</text>
    <text x="1243" y="901" class="small">HTTP 201 returns the created order</text>

    <path d="M345 850 L420 850" class="order"/>
    <path d="M720 850 L795 850" class="order"/>
    <path d="M1145 850 L1220 850" class="order"/>
  </g>

  <rect x="75" y="970" width="1620" height="80" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="100" y="1002" class="label">Other routes</text>
  <text x="255" y="1002" class="small">products.js → catalog and coupons · customers.js → customer list and settlements</text>
  <text x="255" y="1030" class="small">reports.js → dashboard, GST reconciliation, pricing preview, admin export · server.js → printable invoice route</text>
  <text x="75" y="1080" class="tiny">Arrows show code calls and persistence represented in this repository; the order path is numbered and highlighted.</text>
</svg>
