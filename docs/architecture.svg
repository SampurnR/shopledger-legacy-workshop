<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Architecture diagram showing the browser UI, Express server, four API routers, all library modules, config, JSON data store, and the order placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <marker id="flowArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172033}
      .title{font-size:34px;font-weight:750;letter-spacing:-.5px}.subtitle{font-size:15px;fill:#64748b}
      .section{font-size:13px;font-weight:750;letter-spacing:1.4px;fill:#64748b}
      .box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.ui{fill:#eff6ff;stroke:#93c5fd}.server{fill:#f1f5f9;stroke:#94a3b8}
      .route{fill:#f5f3ff;stroke:#c4b5fd}.lib{fill:#ecfdf5;stroke:#86efac}.data{fill:#fff7ed;stroke:#fdba74}
      .config{fill:#fefce8;stroke:#fde047}.file{font-size:16px;font-weight:700}.detail{font-size:12.5px;fill:#475569}
      .small{font-size:12px;fill:#475569}.arrow{fill:none;stroke:#64748b;stroke-width:1.7;marker-end:url(#arrow)}
      .flow{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#flowArrow)}.flowtext{font-size:12px;font-weight:700;fill:#1d4ed8}
      .num{fill:#2563eb;stroke:#fff;stroke-width:2}.numtext{font-size:12px;font-weight:800;fill:#fff;text-anchor:middle;dominant-baseline:central}
      .rule{stroke:#e2e8f0;stroke-width:1}
    </style>
  </defs>
  <rect width="1600" height="1120" fill="#f8fafc"/>
  <text x="64" y="66" class="title">ShopLedger · Application Architecture</text>
  <text x="64" y="94" class="subtitle">Express app · browser POS · JSON file storage</text>

  <!-- UI and server entry -->
  <text x="64" y="137" class="section">CLIENT</text>
  <rect x="64" y="154" width="300" height="145" rx="14" class="box ui"/>
  <text x="86" y="184" class="file">Browser UI</text>
  <text x="86" y="210" class="detail">public/index.html · public/js/app.js</text>
  <text x="86" y="233" class="detail">public/css/style.css</text>
  <text x="86" y="266" class="small">POS · order history · Khata · inventory / GST audit</text>
  <rect x="462" y="154" width="278" height="145" rx="14" class="box server"/>
  <text x="486" y="184" class="file">Express application</text>
  <text x="486" y="210" class="detail">server.js</text>
  <text x="486" y="233" class="detail">JSON body parsing · static public/</text>
  <text x="486" y="266" class="small">Mounts routers at /api</text>
  <path d="M364 225H452" class="arrow"/><text x="374" y="213" class="small">HTTP / JSON</text>

  <!-- Routers -->
  <text x="64" y="346" class="section">ROUTERS · routes/</text>
  <rect x="64" y="365" width="300" height="100" rx="12" class="box route"/>
  <text x="84" y="395" class="file">products.js</text>
  <text x="84" y="421" class="detail">GET /products · GET /coupons</text>
  <rect x="64" y="484" width="300" height="120" rx="12" class="box route"/>
  <text x="84" y="514" class="file">orders.js</text>
  <text x="84" y="540" class="detail">GET /orders · POST /orders</text>
  <text x="84" y="561" class="detail">GET /orders/:id · POST cancel</text>
  <rect x="64" y="623" width="300" height="100" rx="12" class="box route"/>
  <text x="84" y="653" class="file">customers.js</text>
  <text x="84" y="679" class="detail">GET /customers · POST settle</text>
  <rect x="64" y="742" width="300" height="120" rx="12" class="box route"/>
  <text x="84" y="772" class="file">reports.js</text>
  <text x="84" y="798" class="detail">dashboard · GST reconciliation</text>
  <text x="84" y="819" class="detail">pricing preview · admin export</text>
  <path d="M601 299V328H385V415H374" class="arrow"/>
  <path d="M601 328V544H374" class="arrow"/>
  <path d="M601 328V673H374" class="arrow"/>
  <path d="M601 328V802H374" class="arrow"/>

  <!-- Libraries -->
  <text x="450" y="346" class="section">BUSINESS LOGIC · lib/</text>
  <rect x="450" y="365" width="290" height="100" rx="12" class="box lib"/>
  <text x="470" y="395" class="file">inventory.js</text>
  <text x="470" y="421" class="detail">Product lookup · sellable stock</text>
  <text x="470" y="442" class="detail">Stock checks · reserve / release</text>
  <rect x="450" y="484" width="290" height="100" rx="12" class="box lib"/>
  <text x="470" y="514" class="file">pricing.js · tax.js · coupons.js</text>
  <text x="470" y="540" class="detail">Subtotal · coupon discount · HSN GST</text>
  <text x="470" y="561" class="detail">Tax splits · active coupons</text>
  <rect x="450" y="603" width="290" height="100" rx="12" class="box lib"/>
  <text x="470" y="633" class="file">orders.js · ledger.js</text>
  <text x="470" y="659" class="detail">Create / list / cancel orders</text>
  <text x="470" y="680" class="detail">Customer balances · settlements</text>
  <rect x="450" y="722" width="290" height="100" rx="12" class="box lib"/>
  <text x="470" y="752" class="file">reports.js · invoice.js</text>
  <text x="470" y="778" class="detail">Dashboard · GST reconciliation</text>
  <text x="470" y="799" class="detail">Printable HTML invoice</text>
  <rect x="450" y="841" width="290" height="75" rx="12" class="box lib"/>
  <text x="470" y="871" class="file">store.js · dates.js</text>
  <text x="470" y="895" class="detail">JSON read/write + audit · date helpers</text>

  <!-- Router to library associations -->
  <path d="M364 415H440" class="arrow"/>
  <path d="M364 544H420V415H440" class="arrow"/>
  <path d="M420 544H440" class="arrow"/>
  <path d="M420 544V653H440" class="arrow"/>
  <path d="M364 673H440" class="arrow"/>
  <path d="M364 802H440" class="arrow"/>
  <path d="M740 415H790V878H750" class="arrow"/>
  <path d="M740 534H790V878H750" class="arrow"/>
  <path d="M740 653H790V878H750" class="arrow"/>
  <path d="M740 772H790V878H750" class="arrow"/>

  <!-- Config and data -->
  <text x="850" y="137" class="section">SETTINGS &amp; PERSISTENCE</text>
  <rect x="850" y="154" width="310" height="170" rx="14" class="box config"/>
  <text x="876" y="188" class="file">config.js</text>
  <text x="876" y="216" class="detail">Port · shop details · GST / HSN slabs</text>
  <text x="876" y="240" class="detail">Inventory settings · coupon definitions</text>
  <text x="876" y="280" class="small">Read by server and business logic modules</text>
  <rect x="850" y="380" width="310" height="170" rx="14" class="box data"/>
  <text x="876" y="414" class="file">data/db.json</text>
  <text x="876" y="442" class="detail">Products · orders · customers</text>
  <text x="876" y="466" class="detail">Settlements · audit log · ID counters</text>
  <text x="876" y="506" class="small">Whole file read and rewritten by lib/store.js</text>
  <path d="M740 878H812V465H840" class="arrow"/>
  <path d="M850 465H800V878H750" class="arrow"/>
  <path d="M850 239H800V878H750" class="arrow"/>

  <!-- Order placement sequence -->
  <rect x="1210" y="154" width="326" height="762" rx="16" fill="#fff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="1238" y="190" class="section" style="fill:#1d4ed8">PLACE AN ORDER</text>
  <text x="1238" y="218" class="small">POST /api/orders</text>
  <line x1="1238" y1="238" x2="1508" y2="238" class="rule"/>
  <g><circle cx="1257" cy="279" r="15" class="num"/><text x="1257" y="279" class="numtext">1</text><text x="1282" y="275" class="file" style="font-size:14px">Browser UI</text><text x="1282" y="296" class="small">Sends cart, customer, coupon, payment</text></g>
  <path d="M1257 296V325" class="flow"/>
  <g><circle cx="1257" cy="351" r="15" class="num"/><text x="1257" y="351" class="numtext">2</text><text x="1282" y="347" class="file" style="font-size:14px">routes/orders.js</text><text x="1282" y="368" class="small">Resolves product data and quantities</text></g>
  <path d="M1257 368V397" class="flow"/>
  <g><circle cx="1257" cy="423" r="15" class="num"/><text x="1257" y="423" class="numtext">3</text><text x="1282" y="419" class="file" style="font-size:14px">inventory.js</text><text x="1282" y="440" class="small">Checks stock availability</text></g>
  <path d="M1257 440V469" class="flow"/>
  <g><circle cx="1257" cy="495" r="15" class="num"/><text x="1257" y="495" class="numtext">4</text><text x="1282" y="491" class="file" style="font-size:14px">pricing · coupons · tax</text><text x="1282" y="512" class="small">Computes discount and GST totals</text></g>
  <path d="M1257 512V541" class="flow"/>
  <g><circle cx="1257" cy="567" r="15" class="num"/><text x="1257" y="567" class="numtext">5</text><text x="1282" y="563" class="file" style="font-size:14px">ledger.js (Khata only)</text><text x="1282" y="584" class="small">Checks limit and charges customer</text></g>
  <path d="M1257 584V613" class="flow"/>
  <g><circle cx="1257" cy="639" r="15" class="num"/><text x="1257" y="639" class="numtext">6</text><text x="1282" y="635" class="file" style="font-size:14px">inventory.js + orders.js</text><text x="1282" y="656" class="small">Deducts stock and creates the order</text></g>
  <path d="M1257 656V685" class="flow"/>
  <g><circle cx="1257" cy="711" r="15" class="num"/><text x="1257" y="711" class="numtext">7</text><text x="1282" y="707" class="file" style="font-size:14px">store.js → data/db.json</text><text x="1282" y="728" class="small">Adds audit entry and saves JSON</text></g>
  <path d="M1257 728V757" class="flow"/>
  <g><circle cx="1257" cy="783" r="15" class="num"/><text x="1257" y="783" class="numtext">8</text><text x="1282" y="779" class="file" style="font-size:14px">Browser UI</text><text x="1282" y="800" class="small">Shows order; refreshes dashboard data</text></g>
  <rect x="1238" y="839" width="270" height="46" rx="9" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="1252" y="858" class="small" style="font-weight:700;fill:#1d4ed8">Invoice: GET /orders/:id/invoice</text>
  <text x="1252" y="876" class="small">server.js → orders.js + invoice.js</text>

  <text x="64" y="1020" class="small">Solid grey arrows show app/module dependencies. Blue numbered path shows the order placement sequence.</text>
  <text x="64" y="1044" class="small">UI assets: public/ · API routers: routes/ · application logic: lib/</text>
</svg>
