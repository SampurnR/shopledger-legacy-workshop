<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger system architecture</title>
  <desc id="desc">Architecture of ShopLedger, its browser, Express routes, library modules, configuration and JSON data, including the numbered order placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#526174"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172638; }
      .title { font-size: 24px; font-weight: 700; }
      .subtitle { font-size: 14px; fill: #526174; }
      .section { font-size: 15px; font-weight: 700; fill: #27415d; }
      .label { font-size: 13px; font-weight: 700; }
      .small { font-size: 12px; }
      .muted { font-size: 12px; fill: #526174; }
      .panel { fill: #f5f8fc; stroke: #9aacc0; stroke-width: 1.5; }
      .box { fill: #fff; stroke: #8ca0b5; stroke-width: 1.3; }
      .ticket { fill: #fff4d9; stroke: #d49724; stroke-width: 2; }
      .edge { fill: none; stroke: #526174; stroke-width: 1.6; marker-end: url(#arrow); }
      .flowedge { fill: none; stroke: #176b8c; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="850" fill="#ffffff"/>
  <text x="30" y="36" class="title">ShopLedger | System architecture</text>
  <text x="30" y="59" class="subtitle">Verified repository modules, dependencies, storage, and order placement flow</text>

  <!-- Browser layer -->
  <rect x="25" y="82" width="190" height="310" rx="10" class="panel"/>
  <text x="42" y="108" class="section">Browser UI</text>
  <rect x="42" y="123" width="156" height="67" rx="7" class="box"/>
  <text x="55" y="147" class="label">public/</text>
  <text x="55" y="167" class="small">index.html · js/app.js</text>
  <text x="55" y="183" class="small">css/style.css</text>
  <text x="42" y="220" class="small">XHR GET / POST</text>
  <text x="42" y="241" class="small">POS · orders · Khata</text>
  <text x="42" y="260" class="small">reports · invoice links</text>
  <path d="M198 155 C224 155 224 187 245 187" class="edge"/>

  <!-- Express and routers -->
  <rect x="235" y="82" width="235" height="310" rx="10" class="panel"/>
  <text x="252" y="108" class="section">Express server</text>
  <rect x="252" y="123" width="200" height="57" rx="7" class="box"/>
  <text x="265" y="147" class="label">server.js</text>
  <text x="265" y="167" class="small">static public/ · mounts /api</text>
  <text x="252" y="205" class="small">Routers (mounted at /api)</text>
  <rect x="252" y="216" width="200" height="35" rx="5" class="box"/>
  <text x="264" y="239" class="small">routes/products.js</text>
  <rect x="252" y="258" width="200" height="35" rx="5" class="box"/>
  <text x="264" y="281" class="small">routes/orders.js</text>
  <rect x="252" y="300" width="200" height="35" rx="5" class="box"/>
  <text x="264" y="323" class="small">routes/customers.js</text>
  <rect x="252" y="342" width="200" height="35" rx="5" class="box"/>
  <text x="264" y="365" class="small">routes/reports.js</text>

  <!-- Lib modules -->
  <rect x="490" y="82" width="450" height="526" rx="10" class="panel"/>
  <text x="508" y="108" class="section">Business logic modules · lib/</text>
  <text x="508" y="131" class="muted">Route handlers call these modules; internal links shown where relevant.</text>

  <rect x="508" y="147" width="200" height="65" rx="7" class="box"/>
  <text x="521" y="170" class="label">lib/inventory.js</text>
  <text x="521" y="190" class="small">find · check · reserve · release</text>
  <rect x="721" y="147" width="200" height="65" rx="7" class="box"/>
  <text x="734" y="170" class="label">lib/pricing.js</text>
  <text x="734" y="190" class="small">subtotal · computeTotals</text>

  <rect x="508" y="225" width="200" height="65" rx="7" class="box"/>
  <text x="521" y="248" class="label">lib/coupons.js</text>
  <text x="521" y="268" class="small">normalizeCode · validate</text>
  <rect x="721" y="225" width="200" height="65" rx="7" class="ticket"/>
  <text x="734" y="248" class="label">lib/tax.js</text>
  <text x="734" y="268" class="small">getRateForItem · GST slabs</text>

  <rect x="508" y="303" width="200" height="65" rx="7" class="box"/>
  <text x="521" y="326" class="label">lib/orders.js</text>
  <text x="521" y="346" class="small">add · get · cancel · list</text>
  <rect x="721" y="303" width="200" height="65" rx="7" class="box"/>
  <text x="734" y="326" class="label">lib/ledger.js</text>
  <text x="734" y="346" class="small">findCustomer · chargeOrderToKhata</text>

  <rect x="508" y="381" width="200" height="65" rx="7" class="box"/>
  <text x="521" y="404" class="label">lib/reports.js</text>
  <text x="521" y="424" class="small">getDashboardSummary · GST reconcile</text>
  <rect x="721" y="381" width="200" height="65" rx="7" class="box"/>
  <text x="734" y="404" class="label">lib/dates.js</text>
  <text x="734" y="424" class="small">today · normalizeDateKey</text>

  <rect x="508" y="459" width="200" height="65" rx="7" class="box"/>
  <text x="521" y="482" class="label">lib/store.js</text>
  <text x="521" y="502" class="small">read · write · appendAudit</text>
  <rect x="721" y="459" width="200" height="65" rx="7" class="ticket"/>
  <text x="734" y="482" class="label">lib/invoice.js</text>
  <text x="734" y="502" class="small">computeInvoiceFigures · render</text>
  <text x="734" y="518" class="muted">calls lib/tax.js for GST</text>

  <!-- Data/config -->
  <rect x="960" y="82" width="215" height="310" rx="10" class="panel"/>
  <text x="977" y="108" class="section">Config &amp; storage</text>
  <rect x="977" y="123" width="181" height="75" rx="7" class="box"/>
  <text x="990" y="147" class="label">config.js</text>
  <text x="990" y="167" class="small">shop · tax · coupons</text>
  <text x="990" y="184" class="small">inventory defaults · port</text>
  <rect x="977" y="224" width="181" height="60" rx="7" class="box"/>
  <text x="990" y="248" class="label">data/db.json</text>
  <text x="990" y="269" class="small">products · orders · customers</text>
  <text x="977" y="313" class="small">JSON read/write via</text>
  <text x="977" y="333" class="small">lib/store.js</text>
  <path d="M452 276 C474 276 484 180 508 180" class="edge"/>
  <path d="M452 276 C474 276 487 337 508 337" class="edge"/>
  <path d="M452 359 C476 359 483 413 508 413" class="edge"/>
  <path d="M708 257 L721 257" class="edge"/>
  <path d="M821 225 L821 212" class="edge"/>
  <path d="M821 446 L821 459" class="edge"/>
  <path d="M708 491 C840 550 936 350 977 255" class="edge"/>
  <path d="M921 491 C950 491 950 175 977 175" class="edge"/>
  <path d="M977 255 C950 255 950 491 921 491" class="edge"/>

  <!-- Invoice route and ticket highlight legend -->
  <rect x="25" y="414" width="445" height="81" rx="9" class="panel"/>
  <text x="42" y="439" class="section">Printable invoice route</text>
  <text x="42" y="462" class="small">server.js GET /orders/:id/invoice → lib/orders.js get →</text>
  <text x="42" y="481" class="small">lib/invoice.js render → HTML response (uses lib/tax.js)</text>
  <path d="M470 455 C600 455 608 491 721 491" class="edge"/>

  <rect x="960" y="414" width="215" height="81" rx="9" class="panel"/>
  <rect x="978" y="430" width="22" height="18" rx="3" class="ticket"/>
  <text x="1010" y="444" class="small">Ticket focus</text>
  <text x="978" y="470" class="small">lib/invoice.js + lib/tax.js</text>
  <text x="978" y="488" class="muted">Tax highlighted: invoice dependency</text>

  <!-- Numbered order flow -->
  <rect x="25" y="535" width="1150" height="285" rx="10" fill="#f2f8fb" stroke="#7ba6b8" stroke-width="1.5"/>
  <text x="45" y="563" class="section">Order placement flow · POST /api/orders</text>
  <text x="45" y="585" class="muted">Numbered sequence follows routes/orders.js router.post('/orders')</text>

  <g>
    <circle cx="68" cy="633" r="15" fill="#176b8c"/><text x="64" y="638" font-size="13" font-weight="700" fill="#fff">1</text>
    <rect x="91" y="608" width="220" height="59" rx="7" class="box"/>
    <text x="104" y="632" class="label">Read request + data</text>
    <text x="104" y="653" class="small">store.read() · validate items</text>

    <circle cx="352" cy="633" r="15" fill="#176b8c"/><text x="348" y="638" font-size="13" font-weight="700" fill="#fff">2</text>
    <rect x="375" y="608" width="220" height="59" rx="7" class="box"/>
    <text x="388" y="632" class="label">Resolve product + stock</text>
    <text x="388" y="653" class="small">inventory.find() · check()</text>

    <circle cx="636" cy="633" r="15" fill="#176b8c"/><text x="632" y="638" font-size="13" font-weight="700" fill="#fff">3</text>
    <rect x="659" y="608" width="220" height="59" rx="7" class="box"/>
    <text x="672" y="632" class="label">Validate promo + calculate</text>
    <text x="672" y="653" class="small">coupons.validate() · pricing.computeTotals()</text>

    <circle cx="920" cy="633" r="15" fill="#176b8c"/><text x="916" y="638" font-size="13" font-weight="700" fill="#fff">4</text>
    <rect x="943" y="608" width="205" height="59" rx="7" class="box"/>
    <text x="956" y="632" class="label">Charge Khata if selected</text>
    <text x="956" y="653" class="small">ledger.findCustomer() · chargeOrderToKhata()</text>
  </g>
  <path d="M311 638 L335 638" class="flowedge"/>
  <path d="M595 638 L619 638" class="flowedge"/>
  <path d="M879 638 L903 638" class="flowedge"/>

  <g>
    <circle cx="68" cy="733" r="15" fill="#176b8c"/><text x="64" y="738" font-size="13" font-weight="700" fill="#fff">5</text>
    <rect x="91" y="708" width="220" height="59" rx="7" class="box"/>
    <text x="104" y="732" class="label">Commit stock + order</text>
    <text x="104" y="753" class="small">inventory.reserve() · orders.add()</text>

    <circle cx="352" cy="733" r="15" fill="#176b8c"/><text x="348" y="738" font-size="13" font-weight="700" fill="#fff">6</text>
    <rect x="375" y="708" width="220" height="59" rx="7" class="box"/>
    <text x="388" y="732" class="label">Audit + persist</text>
    <text x="388" y="753" class="small">store.appendAudit() · store.write()</text>

    <circle cx="636" cy="733" r="15" fill="#176b8c"/><text x="632" y="738" font-size="13" font-weight="700" fill="#fff">7</text>
    <rect x="659" y="708" width="220" height="59" rx="7" class="box"/>
    <text x="672" y="732" class="label">Save to JSON file</text>
    <text x="672" y="753" class="small">data/db.json · order, stock, ledger, audit</text>

    <circle cx="920" cy="733" r="15" fill="#176b8c"/><text x="916" y="738" font-size="13" font-weight="700" fill="#fff">8</text>
    <rect x="943" y="708" width="205" height="59" rx="7" class="box"/>
    <text x="956" y="732" class="label">Return created order</text>
    <text x="956" y="753" class="small">HTTP 201 JSON response</text>
  </g>
  <path d="M1145 667 C1158 688 1100 694 1090 708" class="flowedge"/>
  <path d="M311 738 L335 738" class="flowedge"/>
  <path d="M595 738 L619 738" class="flowedge"/>
  <path d="M879 738 L903 738" class="flowedge"/>

  <text x="45" y="800" class="muted">Data path: routes/orders.js → lib modules → lib/store.js → data/db.json</text>
</svg>
