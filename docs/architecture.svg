<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Architecture of ShopLedger with browser UI, Express server, routers, library modules, JSON data store, configuration, and six numbered steps for placing an order.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4 L0,8 z" fill="#65758b"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4 L0,8 z" fill="#c1652b"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #1e293b; }
      .title { font-size: 26px; font-weight: 700; }
      .section { font-size: 16px; font-weight: 700; letter-spacing: .3px; }
      .body { font-size: 13px; }
      .small { font-size: 12px; }
      .mono { font-family: Menlo, Consolas, monospace; font-size: 12px; }
      .muted { fill: #526174; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; }
      .subcard { fill: #f8fafc; stroke: #d7e0ea; stroke-width: 1; }
      .accent { fill: #fff1e6; stroke: #cf7740; stroke-width: 1.5; }
      .line { fill: none; stroke: #65758b; stroke-width: 1.8; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #96a3b4; stroke-width: 1.4; stroke-dasharray: 5 5; }
    </style>
  </defs>

  <rect width="1200" height="820" fill="#f3f6fa"/>
  <text x="24" y="37" class="title">ShopLedger · application architecture</text>
  <text x="24" y="60" class="body muted">Browser POS → Express routes → business modules → JSON file store</text>
  <rect x="779" y="22" width="397" height="48" rx="10" fill="#ffffff" stroke="#d7e0ea"/>
  <rect x="793" y="34" width="18" height="18" rx="4" class="accent"/>
  <text x="819" y="48" class="small">Ticket focus: lib/invoice.js</text>
  <rect x="1005" y="34" width="18" height="18" rx="4" class="accent"/>
  <text x="1031" y="48" class="small">lib/tax.js dependency</text>

  <rect x="24" y="83" width="1152" height="200" rx="14" fill="#eaf0f6" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="42" y="108" class="section">Placing an order · POST /api/orders</text>
  <g>
    <rect x="40" y="125" width="174" height="139" rx="10" class="panel"/>
    <circle cx="59" cy="146" r="13" fill="#245d82"/><text x="55" y="151" font-size="13" font-weight="700" fill="#fff">1</text>
    <text x="80" y="150" class="body" font-weight="700">Browser UI</text>
    <text x="52" y="177" class="small">app.js place handler</text>
    <text x="52" y="198" class="mono">POST /api/orders</text>
    <text x="52" y="224" class="small muted">Sends cart + payment data</text>
  </g>
  <path d="M216 194 H229" class="line"/>
  <g>
    <rect x="233" y="125" width="174" height="139" rx="10" class="panel"/>
    <circle cx="252" cy="146" r="13" fill="#245d82"/><text x="248" y="151" font-size="13" font-weight="700" fill="#fff">2</text>
    <text x="273" y="150" class="body" font-weight="700">server.js</text>
    <text x="245" y="177" class="small">Parses JSON body</text>
    <text x="245" y="198" class="small">Dispatches under</text>
    <text x="245" y="218" class="mono">/api → orders router</text>
  </g>
  <path d="M409 194 H422" class="line"/>
  <g>
    <rect x="426" y="125" width="174" height="139" rx="10" class="panel"/>
    <circle cx="445" cy="146" r="13" fill="#245d82"/><text x="441" y="151" font-size="13" font-weight="700" fill="#fff">3</text>
    <text x="466" y="150" class="body" font-weight="700">routes/orders.js</text>
    <text x="438" y="177" class="small">Reads store; resolves items</text>
    <text x="438" y="198" class="small">Checks stock + coupon</text>
    <text x="438" y="224" class="small muted">Rejects invalid requests</text>
  </g>
  <path d="M602 194 H615" class="line"/>
  <g>
    <rect x="619" y="125" width="174" height="139" rx="10" class="panel"/>
    <circle cx="638" cy="146" r="13" fill="#245d82"/><text x="634" y="151" font-size="13" font-weight="700" fill="#fff">4</text>
    <text x="659" y="150" class="body" font-weight="700">Business logic</text>
    <text x="631" y="177" class="small">pricing.computeTotals</text>
    <text x="631" y="198" class="small">Optional ledger charge</text>
    <text x="631" y="219" class="small">reserve inventory; orders.add</text>
  </g>
  <path d="M795 194 H808" class="line"/>
  <g>
    <rect x="812" y="125" width="174" height="139" rx="10" class="panel"/>
    <circle cx="831" cy="146" r="13" fill="#245d82"/><text x="827" y="151" font-size="13" font-weight="700" fill="#fff">5</text>
    <text x="852" y="150" class="body" font-weight="700">Persist order</text>
    <text x="824" y="177" class="small">appendAudit + write</text>
    <text x="824" y="198" class="mono">data/db.json</text>
    <text x="824" y="224" class="small muted">via lib/store.js</text>
  </g>
  <path d="M988 194 H1001" class="line"/>
  <g>
    <rect x="1005" y="125" width="154" height="139" rx="10" class="panel"/>
    <circle cx="1024" cy="146" r="13" fill="#245d82"/><text x="1020" y="151" font-size="13" font-weight="700" fill="#fff">6</text>
    <text x="1045" y="150" class="body" font-weight="700">Response</text>
    <text x="1017" y="180" class="mono">201 + order JSON</text>
    <text x="1017" y="204" class="small">Returns to browser</text>
    <text x="1017" y="230" class="small muted">UI refreshes order view</text>
  </g>

  <text x="24" y="316" class="section">Runtime components</text>

  <rect x="24" y="330" width="205" height="344" rx="12" class="panel"/>
  <text x="42" y="358" class="section">Browser UI</text>
  <text x="42" y="381" class="small muted">Express serves public/</text>
  <rect x="40" y="398" width="173" height="54" rx="7" class="subcard"/>
  <text x="51" y="420" class="mono">public/index.html</text><text x="51" y="439" class="small muted">POS screen markup</text>
  <rect x="40" y="461" width="173" height="66" rx="7" class="subcard"/>
  <text x="51" y="483" class="mono">public/js/app.js</text><text x="51" y="502" class="small muted">place handler · AJAX</text><text x="51" y="519" class="small muted">catalog · orders · tabs</text>
  <rect x="40" y="536" width="173" height="54" rx="7" class="subcard"/>
  <text x="51" y="558" class="mono">public/css/style.css</text><text x="51" y="577" class="small muted">UI styles</text>
  <text x="42" y="624" class="small muted">Browser calls JSON API</text>
  <text x="42" y="646" class="mono">/api/*</text>

  <rect x="250" y="330" width="190" height="214" rx="12" class="panel"/>
  <text x="268" y="358" class="section">server.js</text>
  <text x="268" y="384" class="small">Express app + JSON body</text>
  <text x="268" y="405" class="small">Static public/ hosting</text>
  <text x="268" y="426" class="small">Mounts all routers at /api</text>
  <rect x="266" y="444" width="158" height="78" rx="7" class="subcard"/>
  <text x="277" y="465" class="small" font-weight="700">Invoice HTML route</text>
  <text x="277" y="485" class="mono">GET /orders/:id/invoice</text>
  <text x="277" y="507" class="small">orders.get → invoice.render</text>

  <rect x="250" y="557" width="190" height="117" rx="12" class="panel"/>
  <text x="268" y="585" class="section">config.js</text>
  <text x="268" y="609" class="small">Shared app settings</text>
  <text x="268" y="630" class="small">port · tax · coupons</text>
  <text x="268" y="651" class="small muted">Used by server + libraries</text>

  <rect x="460" y="330" width="250" height="344" rx="12" class="panel"/>
  <text x="478" y="358" class="section">routes/</text>
  <text x="478" y="379" class="small muted">Express handlers mounted at /api</text>
  <rect x="476" y="392" width="218" height="57" rx="7" class="subcard"/>
  <text x="488" y="414" class="mono" font-weight="700">products.js</text><text x="488" y="435" class="small">GET /products · GET /coupons</text>
  <rect x="476" y="457" width="218" height="65" rx="7" class="subcard"/>
  <text x="488" y="479" class="mono" font-weight="700">orders.js</text><text x="488" y="500" class="small">GET/POST /orders · cancel order</text><text x="488" y="516" class="small muted">GET /orders/:id</text>
  <rect x="476" y="530" width="218" height="57" rx="7" class="subcard"/>
  <text x="488" y="552" class="mono" font-weight="700">customers.js</text><text x="488" y="573" class="small">GET /customers · settle</text>
  <rect x="476" y="595" width="218" height="63" rx="7" class="subcard"/>
  <text x="488" y="617" class="mono" font-weight="700">reports.js</text><text x="488" y="638" class="small">dashboard · GST · pricing preview</text><text x="488" y="654" class="small muted">admin export</text>

  <rect x="730" y="330" width="446" height="344" rx="12" class="panel"/>
  <text x="748" y="358" class="section">lib/ · application modules</text>
  <text x="748" y="379" class="small muted">Routers and server call these modules</text>

  <rect x="746" y="392" width="200" height="48" rx="7" class="subcard"/>
  <text x="758" y="412" class="mono" font-weight="700">coupons.js</text><text x="758" y="430" class="small muted">normalizeCode · validate</text>
  <rect x="958" y="392" width="202" height="48" rx="7" class="subcard"/>
  <text x="970" y="412" class="mono" font-weight="700">dates.js</text><text x="970" y="430" class="small muted">today · getFiscalYear</text>

  <rect x="746" y="447" width="200" height="48" rx="7" class="subcard"/>
  <text x="758" y="467" class="mono" font-weight="700">inventory.js</text><text x="758" y="485" class="small muted">check · reserve · release</text>
  <rect x="958" y="447" width="202" height="48" rx="7" class="accent"/>
  <text x="970" y="467" class="mono" font-weight="700">invoice.js</text><text x="970" y="485" class="small">computeInvoiceFigures · render</text>

  <rect x="746" y="502" width="200" height="48" rx="7" class="subcard"/>
  <text x="758" y="522" class="mono" font-weight="700">ledger.js</text><text x="758" y="540" class="small muted">chargeOrderToKhata · settlement</text>
  <rect x="958" y="502" width="202" height="48" rx="7" class="subcard"/>
  <text x="970" y="522" class="mono" font-weight="700">orders.js</text><text x="970" y="540" class="small muted">add · get · cancel · list</text>

  <rect x="746" y="557" width="200" height="48" rx="7" class="subcard"/>
  <text x="758" y="577" class="mono" font-weight="700">pricing.js</text><text x="758" y="595" class="small muted">subtotal · computeTotals</text>
  <rect x="958" y="557" width="202" height="48" rx="7" class="subcard"/>
  <text x="970" y="577" class="mono" font-weight="700">reports.js</text><text x="970" y="595" class="small muted">getDashboardSummary · GST</text>

  <rect x="746" y="612" width="200" height="48" rx="7" class="subcard"/>
  <text x="758" y="632" class="mono" font-weight="700">store.js</text><text x="758" y="650" class="small muted">read · write · appendAudit</text>
  <rect x="958" y="612" width="202" height="48" rx="7" class="accent"/>
  <text x="970" y="632" class="mono" font-weight="700">tax.js</text><text x="970" y="650" class="small">getRateForItem · splitCgstSgst</text>

  <rect x="460" y="690" width="716" height="90" rx="12" class="panel"/>
  <text x="480" y="720" class="section">Persistent data</text>
  <rect x="650" y="704" width="504" height="57" rx="8" fill="#f1f5f9" stroke="#b9c7d7"/>
  <text x="670" y="728" class="mono" font-weight="700">data/db.json</text>
  <text x="670" y="749" class="small muted">products · orders · customers · settlements · auditLog</text>

  <path d="M230 490 H244" class="line"/>
  <path d="M441 420 H454" class="line"/>
  <path d="M711 502 H724" class="line"/>
  <path d="M1058 675 V685" class="line"/>
  <path d="M345 545 V552" class="dash"/>
  <text x="352" y="553" class="small muted">settings</text>
  <text x="24" y="805" class="small muted">Order creation path is numbered above; accent modules are the invoice calculation/render path (pricing.js → tax.js).</text>
</svg>
