<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="desc">Architecture map of the ShopLedger UI, Express routers, library modules, config, and JSON data store, with the order placement path highlighted.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#059669"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:750}.subtitle{font-size:14px;fill:#64748b}.section{font-size:16px;font-weight:700;letter-spacing:.08em;fill:#475569}.head{font-size:15px;font-weight:700}.file{font-size:12px;fill:#475569}.small{font-size:12px;fill:#334155}.tiny{font-size:11px;fill:#475569}.box{rx:12;stroke-width:1.5}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.orderline{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#blueArrow)}.savel{fill:none;stroke:#059669;stroke-width:3;marker-end:url(#greenArrow)}
    </style>
  </defs>
  <rect width="1600" height="1120" fill="#f8fafc"/>
  <text x="48" y="52" class="title">ShopLedger · application architecture</text>
  <text x="48" y="78" class="subtitle">Express app · module relationships and the POST /api/orders path</text>

  <!-- UI -->
  <text x="48" y="126" class="section">BROWSER UI</text>
  <rect x="48" y="145" width="300" height="126" class="box" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="70" y="175" class="head">ShopLedger POS &amp; screens</text>
  <text x="70" y="198" class="file">public/index.html · public/js/app.js</text>
  <text x="70" y="220" class="small">New Order · Order History · Customer Khata</text>
  <text x="70" y="240" class="small">Inventory &amp; GST Audit · printable invoice link</text>
  <text x="70" y="259" class="tiny">Cart preview: POST /api/pricing/preview</text>

  <!-- Server -->
  <rect x="410" y="145" width="230" height="126" class="box" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="435" y="178" class="head">Express application</text>
  <text x="435" y="203" class="file">server.js</text>
  <text x="435" y="227" class="small">Serves public/ · mounts /api routes</text>
  <text x="435" y="249" class="tiny">GET /orders/:id/invoice</text>
  <path d="M348 208H405" class="line"/>

  <!-- Routers -->
  <text x="710" y="126" class="section">ROUTERS · routes/</text>
  <rect x="710" y="145" width="190" height="126" class="box" fill="#fff7ed" stroke="#fdba74"/>
  <text x="730" y="177" class="head">orders.js</text><text x="730" y="201" class="small">GET /orders</text><text x="730" y="221" class="small">POST /orders</text><text x="730" y="241" class="small">POST cancel</text>
  <rect x="920" y="145" width="190" height="126" class="box" fill="#fff7ed" stroke="#fdba74"/>
  <text x="940" y="177" class="head">products.js</text><text x="940" y="201" class="small">GET /products</text><text x="940" y="221" class="small">GET /coupons</text>
  <rect x="1130" y="145" width="190" height="126" class="box" fill="#fff7ed" stroke="#fdba74"/>
  <text x="1150" y="177" class="head">customers.js</text><text x="1150" y="201" class="small">GET /customers</text><text x="1150" y="221" class="small">POST settle</text>
  <rect x="1340" y="145" width="212" height="126" class="box" fill="#fff7ed" stroke="#fdba74"/>
  <text x="1360" y="177" class="head">reports.js</text><text x="1360" y="201" class="small">dashboard · GST reconciliation</text><text x="1360" y="221" class="small">pricing preview · admin export</text>
  <path d="M640 208H700" class="line"/>

  <!-- order flow panel -->
  <rect x="48" y="310" width="1504" height="232" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="72" y="344" class="section" fill="#1d4ed8">ORDER PLACEMENT FLOW · POST /api/orders</text>
  <g>
    <rect x="72" y="374" width="196" height="112" rx="10" fill="#fff" stroke="#93c5fd"/>
    <text x="90" y="402" class="head">1 · Request</text><text x="90" y="426" class="small">UI submits items, qty,</text><text x="90" y="446" class="small">customer, mode, status,</text><text x="90" y="466" class="small">and coupon</text>
    <rect x="310" y="374" width="196" height="112" rx="10" fill="#fff" stroke="#93c5fd"/>
    <text x="328" y="402" class="head">2 · Resolve items</text><text x="328" y="426" class="small">orders.js reads products</text><text x="328" y="446" class="small">via store.js and validates</text><text x="328" y="466" class="small">product IDs and stock</text>
    <rect x="548" y="374" width="196" height="112" rx="10" fill="#fff" stroke="#93c5fd"/>
    <text x="566" y="402" class="head">3 · Price &amp; tax</text><text x="566" y="426" class="small">pricing.js + coupons.js</text><text x="566" y="446" class="small">tax.js applies HSN slab</text><text x="566" y="466" class="small">and computes totals</text>
    <rect x="786" y="374" width="196" height="112" rx="10" fill="#fff" stroke="#93c5fd"/>
    <text x="804" y="402" class="head">4 · Khata (if selected)</text><text x="804" y="426" class="small">ledger.js checks credit</text><text x="804" y="446" class="small">limit and charges the</text><text x="804" y="466" class="small">customer account</text>
    <rect x="1024" y="374" width="196" height="112" rx="10" fill="#fff" stroke="#93c5fd"/>
    <text x="1042" y="402" class="head">5 · Commit</text><text x="1042" y="426" class="small">inventory.js deducts stock</text><text x="1042" y="446" class="small">orders.js creates order ID</text><text x="1042" y="466" class="small">and audit entry</text>
    <rect x="1262" y="374" width="252" height="112" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="1280" y="402" class="head">6 · Persist &amp; respond</text><text x="1280" y="426" class="small">store.js writes db.json</text><text x="1280" y="446" class="small">UI receives order; invoice route</text><text x="1280" y="466" class="small">uses invoice.js to render HTML</text>
    <path d="M268 430H303" class="orderline"/><path d="M506 430H541" class="orderline"/><path d="M744 430H779" class="orderline"/><path d="M982 430H1017" class="orderline"/><path d="M1220 430H1255" class="savel"/>
  </g>

  <!-- library modules -->
  <text x="48" y="594" class="section">APPLICATION MODULES · lib/</text>
  <rect x="48" y="615" width="350" height="104" class="box" fill="#f0fdf4" stroke="#86efac"/>
  <text x="70" y="646" class="head">orders.js</text><text x="70" y="670" class="small">Create, get, list, and cancel orders</text><text x="70" y="692" class="file">uses dates.js · inventory.js · ledger.js</text>
  <rect x="418" y="615" width="350" height="104" class="box" fill="#f0fdf4" stroke="#86efac"/>
  <text x="440" y="646" class="head">inventory.js</text><text x="440" y="670" class="small">Find products · check and change stock</text><text x="440" y="692" class="file">uses config.js</text>
  <rect x="788" y="615" width="350" height="104" class="box" fill="#f0fdf4" stroke="#86efac"/>
  <text x="810" y="646" class="head">pricing.js · coupons.js · tax.js</text><text x="810" y="670" class="small">Subtotal, discount, GST, and totals</text><text x="810" y="692" class="file">pricing.js uses coupons.js and tax.js</text>
  <rect x="1158" y="615" width="394" height="104" class="box" fill="#f0fdf4" stroke="#86efac"/>
  <text x="1180" y="646" class="head">ledger.js</text><text x="1180" y="670" class="small">Customer accounts, credit and settlements</text><text x="1180" y="692" class="file">uses dates.js</text>
  <rect x="48" y="743" width="350" height="104" class="box" fill="#f0fdf4" stroke="#86efac"/>
  <text x="70" y="774" class="head">store.js</text><text x="70" y="798" class="small">Read/write JSON database · append audit log</text><text x="70" y="820" class="file">data/db.json</text>
  <rect x="418" y="743" width="350" height="104" class="box" fill="#f0fdf4" stroke="#86efac"/>
  <text x="440" y="774" class="head">reports.js</text><text x="440" y="798" class="small">Dashboard summary · GST reconciliation</text><text x="440" y="820" class="file">uses inventory.js · ledger.js · invoice.js</text>
  <rect x="788" y="743" width="350" height="104" class="box" fill="#f0fdf4" stroke="#86efac"/>
  <text x="810" y="774" class="head">invoice.js</text><text x="810" y="798" class="small">Invoice figures and printable HTML</text><text x="810" y="820" class="file">uses config.js</text>
  <rect x="1158" y="743" width="394" height="104" class="box" fill="#f0fdf4" stroke="#86efac"/>
  <text x="1180" y="774" class="head">dates.js</text><text x="1180" y="798" class="small">Today · date normalization · fiscal year</text>

  <!-- shared config and storage -->
  <rect x="48" y="887" width="460" height="120" rx="14" fill="#fefce8" stroke="#fde047" stroke-width="1.5"/>
  <text x="72" y="921" class="head">config.js</text><text x="72" y="947" class="small">Port · shop details · tax slabs · inventory defaults</text><text x="72" y="970" class="small">Coupon definitions · admin key</text>
  <rect x="570" y="887" width="460" height="120" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="594" y="921" class="head">data/db.json</text><text x="594" y="947" class="small">Products · orders · customers · settlements</text><text x="594" y="970" class="small">Audit log · next IDs</text>
  <rect x="1092" y="887" width="460" height="120" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1116" y="921" class="head">Supporting files</text><text x="1116" y="947" class="small">lib/store.js reads/writes data/db.json</text><text x="1116" y="970" class="small">public/css/style.css styles the UI</text>
  <path d="M230 847V878" class="line"/><path d="M398 666H400V805H398" class="line"/>
  <path d="M800 847V878" class="line"/><path d="M1240 847V878" class="line"/>
  <text x="48" y="1064" class="tiny">Blue arrows show order processing; green arrow shows persistence and response. Gray arrows show supporting relationships.</text>
</svg>
