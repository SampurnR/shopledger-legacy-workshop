<text x="36" y="396" class="label">lib/inventory.js</text>
<text x="36" y="417" class="small">find() · getSellableStock() · check()</text>
<text x="36" y="434" class="small">reserve() · release() · summarize()</text>
<text x="36" y="451" class="small">Uses config</text>
<rect x="257" y="373" width="218" height="87" rx="8" class="box"/>
<text x="269" y="396" class="label">lib/orders.js</text>
<text x="269" y="417" class="small">add() · get() · list()</text>
<text x="269" y="434" class="small">Uses dates, inventory, ledger</text>
<rect x="258" y="433" width="216" height="26" rx="5" fill="#fff2df" stroke="#c66a0a"/>
<text x="269" y="451" class="small">cancel() · ticket scope</text>
<rect x="490" y="373" width="218" height="87" rx="8" class="box"/>
<text x="502" y="396" class="label">lib/pricing.js</text>
<text x="502" y="417" class="small">subtotal() · discount() · round2()</text>
<text x="502" y="434" class="small">computeTotals()</text>
<text x="502" y="451" class="small">Uses tax, coupons</text>
<rect x="723" y="373" width="218" height="87" rx="8" class="box"/>
<text x="735" y="396" class="label">lib/coupons.js</text>
<text x="735" y="417" class="small">normalizeCode() · validate()</text>
<text x="735" y="434" class="small">getCoupon() · calculateDiscount()</text>
<text x="735" y="451" class="small">listActive() · uses config</text>
<rect x="956" y="373" width="218" height="87" rx="8" class="box"/>
<text x="968" y="396" class="label">lib/tax.js</text>
<text x="968" y="417" class="small">getRateForItem() · getSlabPercent()</text>
<text x="968" y="434" class="small">splitCgstSgst() · round2()</text>
<text x="968" y="451" class="small">Uses config</text>
<rect x="24" y="472" width="218" height="87" rx="8" class="box"/>
<text x="36" y="495" class="label">lib/ledger.js</text>
<text x="36" y="516" class="small">findCustomer() · listCustomers()</text>
<text x="36" y="533" class="small">chargeOrderToKhata()</text>
<text x="36" y="550" class="small">reverseOrderDebit()</text>
<text x="36" y="567" class="small">recordSettlement() · uses dates</text>
<rect x="257" y="472" width="218" height="87" rx="8" class="box"/>
<text x="269" y="495" class="label">lib/dates.js</text>
<text x="269" y="516" class="small">today() · normalizeDateKey()</text>
<text x="269" y="533" class="small">getFiscalYear()</text>
<rect x="490" y="472" width="218" height="87" rx="8" class="box"/>
<text x="502" y="495" class="label">lib/invoice.js</text>
<text x="502" y="516" class="small">computeInvoiceFigures() · render()</text>
<text x="502" y="533" class="small">Uses config</text>
<rect x="723" y="472" width="218" height="87" rx="8" class="box"/>
<text x="735" y="495" class="label">lib/reports.js</text>
<text x="735" y="516" class="small">getDashboardSummary()</text>
<text x="735" y="533" class="small">getGstReconciliation()</text>
<text x="735" y="550" class="small">Uses inventory, ledger, invoice</text>
<rect x="956" y="472" width="218" height="87" rx="8" class="box"/>
<text x="968" y="495" class="label">lib/store.js</text>
<text x="968" y="516" class="small">read() · write() · appendAudit()</text>
<text x="968" y="533" class="small">Synchronous JSON file persistence</text>
<rect x="24" y="575" width="1152" height="149" rx="8" class="box"/>
<text x="38" y="596" class="label">PLACE ORDER · routes/orders.js orchestrates steps 2–8</text>
<text x="38" y="618" class="small">1  UI post() → server.js → POST /api/orders</text>
<text x="38" y="641" class="small">2  store.read() → inventory.find() → build items</text>
<text x="38" y="664" class="small">3  inventory.check() → reject qty &gt;= stock − reserved</text>
<text x="38" y="687" class="small">4  coupons.normalizeCode(), validate(); pricing.computeTotals()</text>
<text x="630" y="618" class="small">5  ledger.findCustomer(); chargeOrderToKhata() if Khata</text>
<text x="630" y="641" class="small">6  inventory.reserve() → product.stock -= qty</text>
<text x="630" y="664" class="small">7  orders.add() → nextOrderId++, date, order + totals</text>
<text x="630" y="687" class="small">8  store.appendAudit(), write() → db.json → HTTP 201</text>
<text x="38" y="711" class="small">Saved line fields  id · sku · name · hsn · price · qty     |     Product inventory fields  id · stock · reserved</text>
<rect x="24" y="736" width="1152" height="48" rx="8" class="ticket"/>
<text x="38" y="755" class="small">CANCEL · orders.cancel() → inventory.release(); ledger.reverseOrderDebit() for Khata. Route audits and saves.</text>
<text x="38" y="774" class="small">release() looks for line.productId, but saved lines use id. It reduces reserved only; physical stock is never restored.</text>
</svg>
