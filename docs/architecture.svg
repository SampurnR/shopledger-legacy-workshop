<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1120" viewBox="0 0 1500 1120" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Architecture diagram of the ShopLedger browser UI, Express app, API routers, library modules, configuration, JSON store, and order placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172033}
      .title{font-size:30px;font-weight:750}.subtitle{font-size:14px;fill:#64748b}
      .section{font-size:15px;font-weight:700;letter-spacing:.08em;fill:#526176}
      .node{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.nodeBlue{fill:#eff6ff;stroke:#93c5fd;stroke-width:1.5}
      .nodeGreen{fill:#ecfdf5;stroke:#86efac;stroke-width:1.5}.nodeGold{fill:#fffbeb;stroke:#fcd34d;stroke-width:1.5}
      .nodeTitle{font-size:16px;font-weight:700}.small{font-size:12px;fill:#526176}.tiny{font-size:11px;fill:#64748b}
      .edge{fill:none;stroke:#64748b;stroke-width:1.8;marker-end:url(#arrow)}
      .order{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#blueArrow)}
      .persist{fill:none;stroke:#059669;stroke-width:2.4;marker-end:url(#greenArrow)}
      .dash{stroke-dasharray:6 5}
    </style>
  </defs>
  <rect width="1500" height="1120" fill="#f8fafc"/>
  <text x="48" y="52" class="title">ShopLedger · application architecture</text>
  <text x="49" y="78" class="subtitle">Express app · browser-based POS · JSON-file persistence</text>

  <!-- Browser UI -->
  <rect x="42" y="112" width="1416" height="132" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="62" y="140" class="section">BROWSER UI · public/</text>
  <rect x="64" y="158" width="310" height="62" rx="10" class="nodeBlue"/>
  <text x="84" y="184" class="nodeTitle">public/index.html</text>
  <text x="84" y="204" class="small">POS · Order History · Khata · Audit</text>
  <rect x="414" y="158" width="310" height="62" rx="10" class="nodeBlue"/>
  <text x="434" y="184" class="nodeTitle">public/js/app.js</text>
  <text x="434" y="204" class="small">UI events · API requests · rendering</text>
  <rect x="764" y="158" width="270" height="62" rx="10" class="nodeBlue"/>
  <text x="784" y="184" class="nodeTitle">public/css/style.css</text>
  <text x="784" y="204" class="small">Page styles</text>
  <path d="M374 189 H406" class="edge"/>

  <!-- app/server -->
  <rect x="520" y="278" width="460" height="84" rx="12" class="node"/>
  <text x="750" y="311" text-anchor="middle" class="nodeTitle">server.js · Express app</text>
  <text x="750" y="336" text-anchor="middle" class="small">Serves public/ · mounts /api routers · serves HTML invoice</text>
  <path d="M570 220 C570 252 650 252 680 278" class="edge"/>
  <path d="M790 278 C820 252 950 252 950 220" class="edge"/>

  <!-- Routes -->
  <rect x="42" y="395" width="1416" height="194" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="62" y="423" class="section">API ROUTERS · routes/</text>
  <rect x="66" y="443" width="300" height="72" rx="10" class="node"/>
  <text x="86" y="470" class="nodeTitle">products.js</text>
  <text x="86" y="492" class="small">GET /products · GET /coupons</text>
  <rect x="394" y="443" width="300" height="72" rx="10" class="nodeGold"/>
  <text x="414" y="470" class="nodeTitle">orders.js</text>
  <text x="414" y="492" class="small">GET /orders · POST /orders · cancel</text>
  <rect x="722" y="443" width="300" height="72" rx="10" class="node"/>
  <text x="742" y="470" class="nodeTitle">customers.js</text>
  <text x="742" y="492" class="small">GET /customers · POST settlement</text>
  <rect x="1050" y="443" width="350" height="72" rx="10" class="node"/>
  <text x="1070" y="470" class="nodeTitle">reports.js</text>
  <text x="1070" y="492" class="small">Dashboard · GST reconciliation · pricing preview · export</text>
  <path d="M750 362 V383 H216 V443" class="edge"/>
  <path d="M750 383 H544 V443" class="order"/>
  <path d="M750 383 H872 V443" class="edge"/>
  <path d="M750 383 H1225 V443" class="edge"/>
  <text x="759" y="380" class="tiny">mounts routes at /api</text>

  <!-- Library modules -->
  <rect x="42" y="626" width="1416" height="310" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="62" y="654" class="section">BUSINESS LOGIC · lib/ AND ROOT CONFIG</text>
  <rect x="66" y="676" width="226" height="68" rx="10" class="nodeGold"/>
  <text x="84" y="703" class="nodeTitle">orders.js</text><text x="84" y="724" class="small">create · lookup · cancel</text>
  <rect x="316" y="676" width="226" height="68" rx="10" class="nodeGold"/>
  <text x="334" y="703" class="nodeTitle">inventory.js</text><text x="334" y="724" class="small">find · stock check · update</text>
  <rect x="566" y="676" width="226" height="68" rx="10" class="nodeGold"/>
  <text x="584" y="703" class="nodeTitle">pricing.js</text><text x="584" y="724" class="small">subtotal · discount · totals</text>
  <rect x="816" y="676" width="226" height="68" rx="10" class="nodeGold"/>
  <text x="834" y="703" class="nodeTitle">coupons.js</text><text x="834" y="724" class="small">normalize · validate · discount</text>
  <rect x="1066" y="676" width="226" height="68" rx="10" class="nodeGold"/>
  <text x="1084" y="703" class="nodeTitle">tax.js</text><text x="1084" y="724" class="small">HSN rates · CGST / SGST</text>
  <rect x="1316" y="676" width="118" height="68" rx="10" class="node"/>
  <text x="1334" y="703" class="nodeTitle">store.js</text><text x="1334" y="724" class="small">JSON I/O</text>

  <rect x="170" y="790" width="226" height="68" rx="10" class="node"/>
  <text x="188" y="817" class="nodeTitle">ledger.js</text><text x="188" y="838" class="small">customers · Khata · settlement</text>
  <rect x="420" y="790" width="226" height="68" rx="10" class="node"/>
  <text x="438" y="817" class="nodeTitle">reports.js</text><text x="438" y="838" class="small">dashboard · GST reconciliation</text>
  <rect x="670" y="790" width="226" height="68" rx="10" class="node"/>
  <text x="688" y="817" class="nodeTitle">invoice.js</text><text x="688" y="838" class="small">invoice figures · HTML render</text>
  <rect x="920" y="790" width="226" height="68" rx="10" class="node"/>
  <text x="938" y="817" class="nodeTitle">dates.js</text><text x="938" y="838" class="small">today · normalize · fiscal year</text>
  <rect x="1170" y="790" width="226" height="68" rx="10" class="node"/>
  <text x="1188" y="817" class="nodeTitle">config.js · root</text><text x="1188" y="838" class="small">port · shop · tax · inventory · coupons</text>

  <!-- route to module associations -->
  <path d="M544 515 V615 H179 V676" class="order"/>
  <path d="M544 515 V625 H429 V676" class="order"/>
  <path d="M544 515 V635 H679 V676" class="order"/>
  <path d="M544 515 V645 H929 V676" class="order"/>
  <path d="M544 515 V655 H1179 V676" class="order"/>
  <path d="M544 515 V660 H1280 V758 H283 V790" class="edge"/>
  <path d="M872 515 V614 H283 V790" class="edge"/>
  <path d="M1225 515 V620 H533 V790" class="edge"/>
  <path d="M1225 515 V630 H783 V790" class="edge"/>
  <path d="M750 362 V770 H783 V790" class="edge dash"/>
  <path d="M179 744 V764 H1033 V790" class="edge"/>
  <path d="M429 744 V772 H1033 V790" class="edge"/>
  <path d="M679 744 V780 H1033 V790" class="edge"/>
  <path d="M929 744 V786 H1283 V790" class="edge"/>
  <path d="M1179 744 V782 H1283 V790" class="edge"/>
  <path d="M1283 858 V970" class="persist"/>

  <!-- Data -->
  <rect x="42" y="974" width="1416" height="105" rx="14" fill="#ecfdf5" stroke="#86efac"/>
  <text x="62" y="1002" class="section">PERSISTENCE</text>
  <rect x="550" y="1008" width="400" height="52" rx="10" class="nodeGreen"/>
  <text x="750" y="1030" text-anchor="middle" class="nodeTitle">data/db.json</text>
  <text x="750" y="1048" text-anchor="middle" class="small">products · orders · customers · settlements · auditLog</text>

  <!-- Order flow ribbon -->
  <rect x="42" y="1090" width="1416" height="1" fill="#cbd5e1"/>
  <text x="52" y="1110" class="tiny">Highlighted blue path: browser submits order → routes/orders.js → inventory check → pricing / coupon / tax → Khata ledger when selected → create order → JSON write.</text>
</svg>
