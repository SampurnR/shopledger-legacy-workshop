<text x="68" y="281" class="small">public/js/app.js</text>
<text x="68" y="307" class="small">POS · history · khata · GST audit</text>
<text x="68" y="333" class="small">XMLHttpRequest → JSON API</text>
<rect x="452" y="164" width="430" height="224" rx="13" fill="white" stroke="#d6dfeb"/><rect x="452" y="177" width="5" height="198" rx="2" fill="#2563eb"/>
<text x="472" y="198" class="name">server.js</text>
<text x="472" y="229" class="small">Express + body-parser · port 3000*</text>
<text x="472" y="255" class="small">Serves public/ · mounts /api routers</text>
<text x="472" y="281" class="small">GET /orders/:id/invoice</text>
<text x="472" y="307" class="small">Invoice handler uses:</text>
<text x="472" y="333" class="small">store → orders.get → invoice.render</text>
<rect x="926" y="164" width="370" height="224" rx="13" fill="white" stroke="#d6dfeb"/><rect x="926" y="177" width="5" height="198" rx="2" fill="#8b5cf6"/>
<text x="946" y="198" class="name">config.js</text>
<text x="946" y="229" class="small">Shop details · HSN GST slabs</text>
<text x="946" y="255" class="small">Coupon rules · inventory defaults</text>
<text x="946" y="281" class="small">Port · admin export key</text>
<text x="946" y="307" class="small">Imported by server.js, tax, coupons,</text>
<text x="946" y="333" class="small">inventory, invoice, reports router</text>
<rect x="1340" y="164" width="412" height="224" rx="13" fill="white" stroke="#d6dfeb"/><rect x="1340" y="177" width="5" height="198" rx="2" fill="#0f766e"/>
<text x="1360" y="198" class="name">data/db.json</text>
<text x="1360" y="229" class="small">Products · orders · customers</text>
<text x="1360" y="255" class="small">Settlements · auditLog · counters</text>
<text x="1360" y="281" class="small">Read / written by lib/store.js</text>
<text x="1360" y="307" class="small">Synchronous whole-file persistence</text>
<text x="1360" y="333" class="small">No external database</text>
