<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">ShopLedger architecture and order flow</title>
<desc id="desc">Architecture diagram showing browser UI, Express server, routers, library modules, configuration, JSON storage, and numbered order placement flow.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker>
  <marker id="flowArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:24px;font-weight:700}.subtitle{font-size:13px;fill:#526078}.head{font-size:15px;font-weight:700}.label{font-size:13px}.small{font-size:12px}.tiny{font-size:12px;fill:#526078}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.cluster{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}.ticket{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.flow{fill:none;stroke:#2563eb;stroke-width:2.5;marker-end:url(#flowArrow)}.edge{fill:none;stroke:#64748b;stroke-width:1.5;marker-end:url(#arrow)}.dash{stroke-dasharray:5 4}.number{fill:#2563eb;stroke:#fff;stroke-width:2}.ntext{font-size:12px;font-weight:bold;fill:#fff;text-anchor:middle;dominant-baseline:central}
  </style>
</defs>
<rect width="1200" height="800" fill="#f1f5f9"/>
<text x="36" y="42" class="title">ShopLedger | application architecture</text>
<text x="36" y="65" class="subtitle">Express POS, Khata ledger, GST pricing and printable invoices — numbered path shows order placement</text>

<!-- browser -->
<rect x="30" y="98" width="210" height="650" rx="12" class="cluster"/>
<text x="48" y="126" class="head">Browser UI</text><text x="48" y="146" class="small">public/</text>
<rect x="48" y="162" width="174" height="74" rx="8" class="box"/><text x="62" y="188" class="label">index.html</text><text x="62" y="211" class="small">POS · orders · Khata · audit</text>
<rect x="48" y="255" width="174" height="82" rx="8" class="box"/><text x="62" y="281" class="label">js/app.js</text><text x="62" y="302" class="small">cart + API requests</text><text x="62" y="321" class="small">step 1: POST order</text>
<rect x="48" y="356" width="174" height="54" rx="8" class="box"/><text x="62" y="388" class="label">css/style.css</text>
<path d="M135 236 V255" class="edge"/>

<!-- server -->
<rect x="275" y="98" width="230" height="650" rx="12" class="cluster"/>
<text x="295" y="126" class="head">Application server</text>
<rect x="295" y="162" width="190" height="120" rx="8" class="box"/><text x="312" y="189" class="head">server.js</text><text x="312" y="211" class="small">Express · JSON body parser</text><text x="312" y="231" class="small">serves public/</text><text x="312" y="251" class="small">mounts routers at /api</text><text x="312" y="270" class="small">GET invoice HTML</text>
<rect x="295" y="320" width="190" height="80" rx="8" class="box"/><text x="312" y="348" class="label">config.js</text><text x="312" y="370" class="small">shop · HSN slabs · coupons</text><text x="312" y="389" class="small">port · inventory defaults</text>
<path d="M240 296 H285" class="flow"/><circle cx="261" cy="282" r="12" class="number"/><text x="261" y="282" class="ntext">1</text>

<!-- routes -->
<rect x="540" y="98" width="250" height="650" rx="12" class="cluster"/>
<text x="558" y="126" class="head">routes/ (mounted /api)</text>
<rect x="560" y="155" width="210" height="90" rx="8" class="ticket"/><text x="576" y="181" class="label">orders.js</text><text x="576" y="203" class="small">POST /orders · cancel</text><text x="576" y="224" class="small">steps 2–6: validate, price, save</text>
<rect x="560" y="263" width="210" height="58" rx="8" class="box"/><text x="576" y="288" class="label">products.js</text><text x="576" y="309" class="small">GET products, coupons</text>
<rect x="560" y="337" width="210" height="58" rx="8" class="box"/><text x="576" y="362" class="label">customers.js</text><text x="576" y="383" class="small">GET customers · settle</text>
<rect x="560" y="411" width="210" height="75" rx="8" class="box"/><text x="576" y="436" class="label">reports.js</text><text x="576" y="457" class="small">dashboard · preview · GST audit</text><text x="576" y="477" class="small">admin export</text>
<path d="M485 218 H550" class="flow"/><circle cx="516" cy="203" r="12" class="number"/><text x="516" y="203" class="ntext">2</text>

<!-- lib -->
<rect x="825" y="98" width="345" height="650" rx="12" class="cluster"/>
<text x="845" y="126" class="head">lib/</text>
<rect x="845" y="151" width="145" height="62" rx="8" class="box"/><text x="858" y="178" class="label">inventory.js</text><text x="858" y="198" class="small">find · check · reserve</text>
<rect x="1005" y="151" width="145" height="62" rx="8" class="box"/><text x="1018" y="178" class="label">pricing.js</text><text x="1018" y="198" class="small">subtotal · totals</text>
<rect x="845" y="230" width="145" height="62" rx="8" class="box"/><text x="858" y="257" class="label">coupons.js</text><text x="858" y="277" class="small">validate · discount</text>
<rect x="1005" y="230" width="145" height="62" rx="8" class="box"/><text x="1018" y="257" class="label">tax.js</text><text x="1018" y="277" class="small">HSN rate · CGST/SGST</text>
<rect x="845" y="309" width="145" height="62" rx="8" class="box"/><text x="858" y="336" class="label">orders.js</text><text x="858" y="356" class="small">add · get · cancel</text>
<rect x="1005" y="309" width="145" height="62" rx="8" class="box"/><text x="1018" y="336" class="label">ledger.js</text><text x="1018" y="356" class="small">Khata · settlements</text>
<rect x="845" y="388" width="145" height="62" rx="8" class="box"/><text x="858" y="415" class="label">store.js</text><text x="858" y="435" class="small">read · write · audit</text>
<rect x="1005" y="388" width="145" height="62" rx="8" class="ticket"/><text x="1018" y="415" class="label">invoice.js</text><text x="1018" y="435" class="small">computeInvoiceFigures</text>
<rect x="845" y="467" width="145" height="62" rx="8" class="box"/><text x="858" y="494" class="label">reports.js</text><text x="858" y="514" class="small">summary · reconciliation</text>
<rect x="1005" y="467" width="145" height="62" rx="8" class="box"/><text x="1018" y="494" class="label">dates.js</text><text x="1018" y="514" class="small">today · date keys</text>
<path d="M770 199 H815" class="flow"/><circle cx="792" cy="185" r="12" class="number"/><text x="792" y="185" class="ntext">3</text>

<!-- storage -->
<rect x="295" y="447" width="190" height="85" rx="8" class="box"/><text x="312" y="475" class="label">data/db.json</text><text x="312" y="498" class="small">products · customers · orders</text><text x="312" y="518" class="small">settlements · audit log</text>
<path d="M920 450 V566 H495 V490" class="edge"/><circle cx="713" cy="566" r="12" class="number"/><text x="713" y="566" class="ntext">6</text>
<text x="550" y="590" class="tiny">store.read() before processing; store.write() after order + audit entry</text>

<!-- numbered flow notes -->
<rect x="275" y="620" width="515" height="108" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
<text x="295" y="646" class="head">Order placement flow</text>
<text x="295" y="670" class="small">1 UI sends cart → 2 orders route resolves product + checks stock</text>
<text x="295" y="692" class="small">3 inventory.check → pricing.computeTotals → coupons + tax</text>
<text x="295" y="714" class="small">4 Khata charge if selected → 5 inventory.reserve + orders.add</text>
<path d="M685 218 H805 V338 H995" class="flow dash"/><circle cx="805" cy="260" r="12" class="number"/><text x="805" y="260" class="ntext">4</text>
<path d="M770 232 H820 V420 H835" class="flow dash"/><circle cx="820" cy="326" r="12" class="number"/><text x="820" y="326" class="ntext">5</text>
<path d="M485 250 H525 V492 H550" class="edge dash"/><text x="495" y="482" class="tiny">invoice request</text>
<path d="M1010 420 H795 V282 H495" class="edge dash"/><text x="795" y="410" class="tiny">HTML</text>

<!-- legend -->
<rect x="825" y="620" width="345" height="108" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="845" y="646" class="head">Legend</text>
<line x1="845" y1="668" x2="885" y2="668" class="flow"/><text x="895" y="673" class="small">Order request / processing flow</text>
<line x1="845" y1="691" x2="885" y2="691" class="edge"/><text x="895" y="696" class="small">Other request, response or data access</text>
<rect x="845" y="706" width="18" height="15" rx="3" class="ticket"/><text x="872" y="719" class="small">Ticket focus: lib/invoice.js; lib/tax.js supports checkout GST</text>
</svg>