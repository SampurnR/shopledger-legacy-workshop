<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
<title id="title">ShopLedger architecture and order placement flow</title><desc id="desc">Architecture diagram showing the browser UI, Express server, each router and library, config, JSON data store, and numbered order placement flow.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#425466"/></marker><marker id="flowArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#147d64"/></marker><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172b4d}.title{font-size:32px;font-weight:700}.sub{font-size:16px;fill:#526579}.head{font-size:19px;font-weight:700}.label{font-size:15px;font-weight:600}.small{font-size:13px;fill:#526579}.box{fill:#fff;stroke:#9aabba;stroke-width:2}.ui{fill:#eef5ff;stroke:#4d7cba;stroke-width:2}.router{fill:#f3efff;stroke:#8064b5;stroke-width:2}.lib{fill:#edfaf5;stroke:#4e9b7e;stroke-width:2}.file{fill:#fff7e8;stroke:#ca9230;stroke-width:2}.flow{fill:none;stroke:#147d64;stroke-width:3;marker-end:url(#flowArrow)}.wire{fill:none;stroke:#718397;stroke-width:2;marker-end:url(#arrow)}.num{fill:#147d64;stroke:#fff;stroke-width:2}.numtext{font-size:14px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:central}</style></defs>
<rect width="1600" height="1100" fill="#f7f9fc"/><text x="64" y="62" class="title">ShopLedger — app architecture</text><text x="64" y="91" class="sub">Order placement flow is numbered 1–7; arrows show module connections.</text>
<!-- UI --> <rect x="55" y="140" width="310" height="255" rx="16" class="ui"/><text x="80" y="178" class="head">Browser UI</text><text x="80" y="207" class="small">public/</text><rect x="82" y="225" width="255" height="55" rx="9" class="box"/><text x="100" y="258" class="label">index.html · style.css</text><rect x="82" y="298" width="255" height="70" rx="9" class="box"/><text x="100" y="327" class="label">js/app.js</text><text x="100" y="350" class="small">POS cart → POST /api/orders</text>
<!-- server --> <rect x="440" y="140" width="1090" height="680" rx="18" fill="#fff" stroke="#9aabba" stroke-width="2"/><text x="470" y="178" class="head">Express app · server.js</text><text x="470" y="204" class="small">Serves public/ and mounts route handlers under /api</text>
<rect x="485" y="240" width="280" height="84" rx="10" class="router"/><text x="510" y="273" class="label">routes/orders.js</text><text x="510" y="299" class="small">POST /orders · GET · cancel</text>
<rect x="800" y="240" width="280" height="84" rx="10" class="router"/><text x="825" y="273" class="label">routes/products.js</text><text x="825" y="299" class="small">products · coupons</text>
<rect x="1115" y="240" width="280" height="84" rx="10" class="router"/><text x="1140" y="273" class="label">routes/customers.js</text><text x="1140" y="299" class="small">customers · settlements</text>
<rect x="800" y="355" width="280" height="84" rx="10" class="router"/><text x="825" y="388" class="label">routes/reports.js</text><text x="825" y="414" class="small">dashboard · pricing · GST</text>
<!-- libs -->
<rect x="485" y="490" width="280" height="80" rx="10" class="lib"/><text x="510" y="523" class="label">lib/orders.js</text><text x="510" y="548" class="small">create · lookup · cancel · list</text>
<rect x="800" y="490" width="280" height="80" rx="10" class="lib"/><text x="825" y="523" class="label">lib/inventory.js</text><text x="825" y="548" class="small">check · reserve · release</text>
<rect x="1115" y="490" width="280" height="80" rx="10" class="lib"/><text x="1140" y="523" class="label">lib/pricing.js · lib/tax.js</text><text x="1140" y="548" class="small">subtotal · tax · totals</text>
<rect x="485" y="610" width="280" height="80" rx="10" class="lib"/><text x="510" y="643" class="label">lib/coupons.js</text><text x="510" y="668" class="small">coupon validation and discounts</text>
<rect x="800" y="610" width="280" height="80" rx="10" class="lib"/><text x="825" y="643" class="label">lib/ledger.js</text><text x="825" y="668" class="small">khata credit · settlements</text>
<rect x="1115" y="610" width="280" height="80" rx="10" class="lib"/><text x="1140" y="643" class="label">lib/store.js</text><text x="1140" y="668" class="small">read · audit · write JSON store</text>
<rect x="485" y="725" width="220" height="66" rx="10" class="lib"/><text x="510" y="754" class="label">lib/reports.js</text><text x="510" y="778" class="small">report calculations</text>
<rect x="725" y="725" width="220" height="66" rx="10" class="lib"/><text x="750" y="754" class="label">lib/invoice.js</text><text x="750" y="778" class="small">printable HTML invoice</text>
<rect x="965" y="725" width="220" height="66" rx="10" class="lib"/><text x="990" y="754" class="label">lib/dates.js</text><text x="990" y="778" class="small">date helpers</text>
<rect x="1205" y="725" width="220" height="66" rx="10" class="file"/><text x="1230" y="754" class="label">config.js</text><text x="1230" y="778" class="small">port · shop · tax · inventory</text>
<!-- persistent file --> <rect x="1190" y="905" width="300" height="105" rx="14" class="file"/><text x="1220" y="947" class="head">data/db.json</text><text x="1220" y="977" class="small">products · orders · customers · audit</text>
<!-- order flow arrows -->
<path d="M365 330H485" class="flow"/><circle cx="420" cy="330" r="15" class="num"/><text x="420" y="330" class="numtext">1</text>
<path d="M625 324V490" class="flow"/><circle cx="625" cy="405" r="15" class="num"/><text x="625" y="405" class="numtext">2</text>
<path d="M765 282H800" class="flow"/><circle cx="782" cy="262" r="15" class="num"/><text x="782" y="262" class="numtext">3</text>
<path d="M940 324V490" class="flow"/><circle cx="940" cy="405" r="15" class="num"/><text x="940" y="405" class="numtext">4</text>
<path d="M1080 282H1115" class="flow"/><circle cx="1098" cy="262" r="15" class="num"/><text x="1098" y="262" class="numtext">5</text>
<path d="M625 570V610" class="flow"/><circle cx="650" cy="590" r="15" class="num"/><text x="650" y="590" class="numtext">6</text>
<path d="M940 690V725H1325V905" class="flow"/><circle cx="1120" cy="725" r="15" class="num"/><text x="1120" y="725" class="numtext">7</text>
<path d="M1260 570V610" class="wire"/><path d="M1260 324V490" class="wire"/><path d="M940 439V490" class="wire"/><path d="M940 439V725H835" class="wire"/><path d="M1055 397H1115" class="wire"/><path d="M1310 439V490" class="wire"/><path d="M1315 791V905" class="wire"/>
<!-- legend --> <rect x="55" y="455" width="310" height="300" rx="16" fill="#fff" stroke="#d3dce5"/><text x="80" y="493" class="head">Order flow</text><text x="80" y="530" class="small">1  UI sends items + order details</text><text x="80" y="566" class="small">2  Route resolves product IDs</text><text x="80" y="602" class="small">3  Check stock availability</text><text x="80" y="638" class="small">4  Calculate subtotal and tax</text><text x="80" y="674" class="small">5  Validate coupon</text><text x="80" y="710" class="small">6  Khata check (if selected)</text><text x="80" y="746" class="small">7  Reserve stock, add order, save JSON</text>
<text x="55" y="1050" class="small">ShopLedger · modules and filenames reflect the repository structure</text></svg>
