<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="desc">The browser UI calls Express routes, which coordinate order, pricing, coupon, tax, inventory, ledger and storage modules backed by config and a JSON data file.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <style>
      .bg{fill:#f8fafc}.title{font:700 34px Arial;fill:#0f172a}.sub{font:16px Arial;fill:#475569}.group{fill:#fff;stroke:#cbd5e1;stroke-width:2}.gh{font:700 20px Arial;fill:#0f172a}.card{fill:#eef2ff;stroke:#818cf8;stroke-width:2}.route{fill:#ecfdf5;stroke:#34d399;stroke-width:2}.data{fill:#fff7ed;stroke:#fb923c;stroke-width:2}.txt{font:700 15px Arial;fill:#172554}.small{font:13px Arial;fill:#334155}.flow{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}.num{fill:#0f766e}.numtxt{font:700 14px Arial;fill:white}.legend{font:14px Arial;fill:#334155}
    </style>
  </defs>
  <rect class="bg" width="1600" height="1000"/>
  <text class="title" x="60" y="62">ShopLedger: architecture and order placement</text>
  <text class="sub" x="60" y="92">Node/Express UI, routes, business modules, configuration and JSON persistence</text>

  <rect class="group" x="55" y="130" width="260" height="270" rx="18"/>
  <text class="gh" x="80" y="170">Browser UI</text>
  <rect class="card" x="80" y="195" width="210" height="75" rx="12"/><text class="txt" x="105" y="225">public/index.html</text><text class="small" x="105" y="248">Dashboard and POS shell</text>
  <rect class="card" x="80" y="290" width="210" height="75" rx="12"/><text class="txt" x="105" y="320">public/js/app.js</text><text class="small" x="105" y="343">Fetch, cart and rendering</text>

  <rect class="group" x="365" y="130" width="310" height="470" rx="18"/>
  <text class="gh" x="390" y="170">Express server and routes</text>
  <rect class="route" x="390" y="195" width="260" height="65" rx="12"/><text class="txt" x="415" y="223">server.js</text><text class="small" x="415" y="244">Mounts /api and invoice view</text>
  <rect class="route" x="390" y="280" width="260" height="58" rx="12"/><text class="txt" x="415" y="315">routes/products.js</text>
  <rect class="route" x="390" y="355" width="260" height="58" rx="12"/><text class="txt" x="415" y="390">routes/orders.js</text>
  <rect class="route" x="390" y="430" width="260" height="58" rx="12"/><text class="txt" x="415" y="465">routes/customers.js</text>
  <rect class="route" x="390" y="505" width="260" height="58" rx="12"/><text class="txt" x="415" y="540">routes/reports.js</text>

  <rect class="group" x="725" y="130" width="520" height="700" rx="18"/>
  <text class="gh" x="750" y="170">Business modules in lib/</text>
  <rect class="card" x="750" y="195" width="215" height="70" rx="12"/><text class="txt" x="775" y="225">orders.js</text><text class="small" x="775" y="246">Lifecycle and filtering</text>
  <rect class="card" x="1000" y="195" width="215" height="70" rx="12"/><text class="txt" x="1025" y="225">pricing.js</text><text class="small" x="1025" y="246">Canonical checkout totals</text>
  <rect class="card" x="750" y="290" width="215" height="70" rx="12"/><text class="txt" x="775" y="320">inventory.js</text><text class="small" x="775" y="341">Check, reserve, release</text>
  <rect class="card" x="1000" y="290" width="215" height="70" rx="12"/><text class="txt" x="1025" y="320">ledger.js</text><text class="small" x="1025" y="341">Khata balances</text>
  <rect class="card" x="750" y="385" width="215" height="70" rx="12"/><text class="txt" x="775" y="415">coupons.js</text><text class="small" x="775" y="436">Validation and discounts</text>
  <rect class="card" x="1000" y="385" width="215" height="70" rx="12"/><text class="txt" x="1025" y="415">tax.js</text><text class="small" x="1025" y="436">HSN slabs and tax split</text>
  <rect class="card" x="750" y="480" width="215" height="70" rx="12"/><text class="txt" x="775" y="510">invoice.js</text><text class="small" x="775" y="531">Figures and printable HTML</text>
  <rect class="card" x="1000" y="480" width="215" height="70" rx="12"/><text class="txt" x="1025" y="510">reports.js</text><text class="small" x="1025" y="531">Dashboard and GST audit</text>
  <rect class="card" x="750" y="575" width="215" height="70" rx="12"/><text class="txt" x="775" y="605">dates.js</text><text class="small" x="775" y="626">Dates and fiscal years</text>
  <rect class="card" x="1000" y="575" width="215" height="70" rx="12"/><text class="txt" x="1025" y="605">store.js</text><text class="small" x="1025" y="626">Read, write and audit</text>

  <rect class="group" x="1295" y="130" width="250" height="360" rx="18"/>
  <text class="gh" x="1320" y="170">Configuration and data</text>
  <rect class="data" x="1320" y="200" width="200" height="90" rx="12"/><text class="txt" x="1345" y="235">config.js</text><text class="small" x="1345" y="258">GST, coupons, shop, port</text>
  <rect class="data" x="1320" y="320" width="200" height="110" rx="12"/><text class="txt" x="1345" y="355">data/db.json</text><text class="small" x="1345" y="378">Products, orders, customers,</text><text class="small" x="1345" y="399">settlements and audit log</text>

  <path class="flow" d="M290 325 C335 325 340 385 390 385"/>
  <path class="flow" d="M650 385 L750 230"/>
  <path class="flow" d="M650 385 L1000 230"/>
  <path class="flow" d="M650 385 C700 385 710 325 750 325"/>
  <path class="flow" d="M650 385 C780 385 850 325 1000 325"/>
  <path class="flow" d="M1215 230 C1270 230 1270 245 1320 245"/>
  <path class="flow" d="M1215 610 C1280 610 1270 375 1320 375"/>

  <circle class="num" cx="335" cy="345" r="15"/><text class="numtxt" x="330" y="350">1</text>
  <circle class="num" cx="690" cy="340" r="15"/><text class="numtxt" x="685" y="345">2</text>
  <circle class="num" cx="880" cy="270" r="15"/><text class="numtxt" x="875" y="275">3</text>
  <circle class="num" cx="705" cy="375" r="15"/><text class="numtxt" x="700" y="380">4</text>
  <circle class="num" cx="900" cy="350" r="15"/><text class="numtxt" x="895" y="355">5</text>
  <circle class="num" cx="1270" cy="520" r="15"/><text class="numtxt" x="1265" y="525">6</text>

  <rect class="group" x="55" y="865" width="1490" height="95" rx="16"/>
  <text class="gh" x="80" y="900">Order flow</text>
  <text class="legend" x="80" y="930">1 UI posts cart → 2 route resolves products → 3 pricing applies coupon + HSN GST → 4 inventory validates/reserves → 5 ledger charges Khata when selected → 6 store persists the order and audit entry to data/db.json.</text>
</svg>
