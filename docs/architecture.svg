<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement</title>
  <desc id="desc">The browser, Express server, four routers, ten library modules, configuration and JSON store. A numbered panel traces order placement. The invoice module is highlighted as the ticket scope.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#52667d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #17283b; font-size: 14px; }
      .title { font-size: 32px; font-weight: bold; }
      .section { font-size: 18px; font-weight: bold; }
      .name { font-size: 15px; font-weight: bold; }
      .detail { font-size: 13px; fill: #354b62; }
      .card { fill: #fff; stroke: #a8bacc; stroke-width: 1.2; }
      .group { fill: #eaf1f8; stroke: #c2d0df; }
      .ticket { fill: #fff1d8; stroke: #976117; stroke-width: 1.5; }
      .edge { fill: none; stroke: #52667d; stroke-width: 1.5; }
      .arrow { marker-end: url(#arrow); }
      .number { fill: #245475; }
      .digit { fill: #fff; font-size: 14px; font-weight: bold; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1200" height="800" fill="#f6f8fb"/>
  <text class="title" x="32" y="50">ShopLedger architecture</text>
  <text class="detail" x="33" y="75">Point of sale, Khata credit ledger, and GST invoicing</text>
  <rect class="ticket" x="1029" y="35" width="19" height="15" rx="3"/>
  <text x="1058" y="48">Ticket scope</text>

  <g aria-label="Browser and Express server">
    <rect class="card" x="32" y="101" width="280" height="78" rx="9"/>
    <text class="section" x="48" y="128">Browser UI · public/</text>
    <text class="detail" x="48" y="150">index.html · js/app.js · css/style.css</text>
    <text class="detail" x="48" y="168">Cart, order register, Khata, and audit</text>
    <path class="edge arrow" d="M312 140H378"/>
    <text class="detail" x="328" y="130">HTTP</text>
    <rect class="card" x="380" y="101" width="390" height="78" rx="9"/>
    <text class="section" x="396" y="128">server.js</text>
    <text class="detail" x="396" y="150">Serves public/ and mounts routers under /api</text>
    <text class="detail" x="396" y="168">GET /orders/:id/invoice reads order → invoice.render()</text>
    <path class="edge arrow" d="M575 179V200"/>
  </g>

  <g aria-label="Express routers">
    <rect class="group" x="32" y="202" width="738" height="112" rx="10"/>
    <text class="section" x="48" y="227">routes/</text>
    <rect class="card" x="48" y="240" width="160" height="57" rx="6"/>
    <text class="name" x="59" y="262">products.js</text>
    <text class="detail" x="59" y="283">Catalog and coupons</text>
    <rect class="card" x="222" y="240" width="160" height="57" rx="6"/>
    <text class="name" x="233" y="262">orders.js</text>
    <text class="detail" x="233" y="283">Place, view, cancel</text>
    <rect class="card" x="396" y="240" width="160" height="57" rx="6"/>
    <text class="name" x="407" y="262">customers.js</text>
    <text class="detail" x="407" y="283">Customers and payments</text>
    <rect class="card" x="570" y="240" width="184" height="57" rx="6"/>
    <text class="name" x="581" y="262">reports.js</text>
    <text class="detail" x="581" y="283">Reports, preview, export</text>
    <path class="edge arrow" d="M401 314V331"/>
  </g>

  <g aria-label="Library modules">
    <rect class="group" x="32" y="333" width="738" height="339" rx="10"/>
    <text class="section" x="48" y="359">lib/</text>

    <rect class="card" x="48" y="371" width="226" height="61" rx="6"/>
    <text class="name" x="60" y="395">inventory.js</text>
    <text class="detail" x="60" y="415">Product lookup and stock changes</text>
    <rect class="card" x="288" y="371" width="226" height="61" rx="6"/>
    <text class="name" x="300" y="395">pricing.js</text>
    <text class="detail" x="300" y="415">Checkout totals via coupons and tax</text>
    <rect class="card" x="528" y="371" width="226" height="61" rx="6"/>
    <text class="name" x="540" y="395">coupons.js</text>
    <text class="detail" x="540" y="415">Code validation and discounts</text>

    <rect class="card" x="48" y="442" width="226" height="61" rx="6"/>
    <text class="name" x="60" y="466">ledger.js</text>
    <text class="detail" x="60" y="486">Khata balances and settlements</text>
    <rect class="card" x="288" y="442" width="226" height="61" rx="6"/>
    <text class="name" x="300" y="466">orders.js</text>
    <text class="detail" x="300" y="486">Order records and cancellation</text>
    <rect class="card" x="528" y="442" width="226" height="61" rx="6"/>
    <text class="name" x="540" y="466">tax.js</text>
    <text class="detail" x="540" y="486">HSN lookup and CGST/SGST split</text>

    <rect class="card" x="48" y="513" width="226" height="61" rx="6"/>
    <text class="name" x="60" y="537">reports.js</text>
    <text class="detail" x="60" y="557">Dashboard and GST reconciliation</text>
    <rect class="ticket" x="288" y="513" width="226" height="61" rx="6"/>
    <text class="name" x="300" y="537">invoice.js</text>
    <text class="detail" x="300" y="557">Recalculates and renders invoices</text>
    <rect class="card" x="528" y="513" width="226" height="61" rx="6"/>
    <text class="name" x="540" y="537">dates.js</text>
    <text class="detail" x="540" y="557">Date keys and fiscal year</text>

    <rect class="card" x="528" y="591" width="226" height="61" rx="6"/>
    <text class="name" x="540" y="615">store.js</text>
    <text class="detail" x="540" y="635">JSON read/write and audit log</text>
    <path class="edge arrow" d="M641 652V694"/>
    <text class="detail" x="653" y="689">read / write</text>
  </g>

  <g aria-label="Configuration and data">
    <rect class="card" x="32" y="696" width="474" height="74" rx="9"/>
    <text class="section" x="48" y="724">config.js</text>
    <text class="detail" x="48" y="748">Shop details, port, GST rules, coupons, inventory, export key</text>
    <rect class="card" x="528" y="696" width="242" height="74" rx="9"/>
    <text class="section" x="543" y="724">data/db.json</text>
    <text class="detail" x="543" y="746">Products, orders, customers,</text>
    <text class="detail" x="543" y="762">settlements, counters, and audit</text>
  </g>

  <g aria-label="Numbered order placement flow">
    <rect class="card" x="796" y="101" width="372" height="669" rx="12"/>
    <text class="section" x="819" y="132">Placing an order</text>
    <path class="edge" d="M831 172V692"/>

    <circle class="number" cx="831" cy="172" r="13"/>
    <text class="digit" x="831" y="177">1</text>
    <text class="name" x="854" y="169">Submit cart</text>
    <text class="detail" x="854" y="190">public/js/app.js → POST /api/orders</text>
    <text class="detail" x="854" y="208">server.js dispatches to routes/orders.js.</text>

    <circle class="number" cx="831" cy="251" r="13"/>
    <text class="digit" x="831" y="256">2</text>
    <text class="name" x="854" y="248">Load catalog and check stock</text>
    <text class="detail" x="854" y="269">store.read() loads data/db.json.</text>
    <text class="detail" x="854" y="287">inventory.find() resolves price and HSN.</text>
    <text class="detail" x="854" y="305">inventory.check() checks sellable stock.</text>

    <circle class="number" cx="831" cy="348" r="13"/>
    <text class="digit" x="831" y="353">3</text>
    <text class="name" x="854" y="345">Validate coupon and calculate total</text>
    <text class="detail" x="854" y="366">pricing.subtotal() → coupons.normalizeCode()</text>
    <text class="detail" x="854" y="384">→ coupons.validate() for a supplied code.</text>
    <text class="detail" x="854" y="402">pricing.computeTotals() apportions discounts.</text>
    <text class="detail" x="854" y="420">tax.getRateForItem() supplies each GST rate.</text>

    <circle class="number" cx="831" cy="461" r="13"/>
    <text class="digit" x="831" y="466">4</text>
    <text class="name" x="854" y="458">Resolve customer and charge Khata</text>
    <text class="detail" x="854" y="479">ledger.findCustomer() resolves the account.</text>
    <text class="detail" x="854" y="497">For Khata, ledger.chargeOrderToKhata()</text>
    <text class="detail" x="854" y="515">checks the credit limit and updates the balance.</text>

    <circle class="number" cx="831" cy="558" r="13"/>
    <text class="digit" x="831" y="563">5</text>
    <text class="name" x="854" y="555">Deduct stock and build order record</text>
    <text class="detail" x="854" y="576">inventory.reserve() deducts physical stock.</text>
    <text class="detail" x="854" y="594">orders.add() assigns an ID and records lines,</text>
    <text class="detail" x="854" y="612">customer, payment, status, coupon, and totals.</text>

    <circle class="number" cx="831" cy="654" r="13"/>
    <text class="digit" x="831" y="659">6</text>
    <text class="name" x="854" y="651">Persist and return the order</text>
    <text class="detail" x="854" y="672">store.appendAudit() records ORDER_CREATED.</text>
    <text class="detail" x="854" y="690">store.write() saves data/db.json.</text>
    <text class="detail" x="854" y="708">HTTP 201 returns the order to the browser.</text>
  </g>
</svg>