<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Architecture diagram of the ShopLedger browser UI, Express server, route modules, library modules, configuration, JSON data, and order placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172033}
      .title{font-size:34px;font-weight:750}.subtitle{font-size:16px;fill:#526176}
      .zone{font-size:17px;font-weight:700;letter-spacing:.5px;fill:#475569}
      .box{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:14}
      .blue{fill:#eff6ff;stroke:#93c5fd}.purple{fill:#f5f3ff;stroke:#c4b5fd}.green{fill:#ecfdf5;stroke:#6ee7b7}.amber{fill:#fffbeb;stroke:#fcd34d}.slate{fill:#f8fafc;stroke:#94a3b8}
      .head{font-size:18px;font-weight:700}.file{font-size:14px;fill:#475569}.small{font-size:13px;fill:#526176}
      .line{fill:none;stroke:#64748b;stroke-width:2.3;marker-end:url(#arrow)}
      .flow{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#arrowBlue)}
      .dataflow{fill:none;stroke:#059669;stroke-width:2.6;marker-end:url(#arrowGreen)}
      .flowbox{fill:#fff;stroke:#60a5fa;stroke-width:2;rx:12}
      .step{font-size:14px;font-weight:700;fill:#1d4ed8}.steptext{font-size:13px;fill:#334155}
      .legend{font-size:13px;fill:#475569}
    </style>
  </defs>
  <rect width="1800" height="1260" fill="#f8fafc"/>
  <text x="52" y="58" class="title">ShopLedger architecture</text>
  <text x="54" y="88" class="subtitle">Browser interface · Express API · JSON file storage</text>

  <!-- Browser UI -->
  <text x="55" y="135" class="zone">BROWSER UI</text>
  <rect x="55" y="153" width="330" height="150" class="box blue"/>
  <text x="78" y="184" class="head">ShopLedger interface</text>
  <text x="78" y="211" class="file">public/index.html</text>
  <text x="78" y="235" class="file">public/js/app.js</text>
  <text x="78" y="259" class="file">public/css/style.css</text>
  <text x="78" y="284" class="small">POS · Orders · Khata · Inventory &amp; GST Audit</text>

  <!-- Server -->
  <text x="465" y="135" class="zone">SERVER</text>
  <rect x="465" y="153" width="360" height="150" class="box purple"/>
  <text x="490" y="187" class="head">Express application</text>
  <text x="490" y="214" class="file">server.js</text>
  <text x="490" y="241" class="small">Serves public/ and mounts API routers at /api</text>
  <text x="490" y="269" class="small">Printable invoice: /orders/:id/invoice</text>

  <path d="M385 228 H455" class="flow"/>
  <text x="392" y="215" class="small">HTTP</text>

  <!-- Routers -->
  <text x="55" y="350" class="zone">ROUTERS · routes/</text>
  <rect x="55" y="369" width="370" height="116" class="box purple"/>
  <text x="78" y="402" class="head">products.js</text>
  <text x="78" y="428" class="small">GET /products · GET /coupons</text>
  <text x="78" y="458" class="small">Reads catalog and active promotions</text>
  <rect x="445" y="369" width="370" height="116" class="box purple"/>
  <text x="468" y="402" class="head">orders.js</text>
  <text x="468" y="428" class="small">GET /orders · GET /orders/:id</text>
  <text x="468" y="451" class="small">POST /orders · POST /orders/:id/cancel</text>
  <rect x="835" y="369" width="370" height="116" class="box purple"/>
  <text x="858" y="402" class="head">customers.js</text>
  <text x="858" y="428" class="small">GET /customers</text>
  <text x="858" y="458" class="small">POST /customers/:id/settle</text>
  <rect x="1225" y="369" width="500" height="116" class="box purple"/>
  <text x="1248" y="402" class="head">reports.js</text>
  <text x="1248" y="428" class="small">Dashboard · GST reconciliation · pricing preview</text>
  <text x="1248" y="458" class="small">GET /admin/export</text>

  <path d="M645 303 V333 H240 V360" class="line"/>
  <path d="M645 303 V360" class="line"/>
  <path d="M645 303 V333 H1020 V360" class="line"/>
  <path d="M645 303 V333 H1475 V360" class="line"/>

  <!-- Lib modules -->
  <text x="55" y="532" class="zone">BUSINESS MODULES · lib/</text>
  <rect x="55" y="550" width="1670" height="250" fill="#fff" stroke="#cbd5e1" stroke-width="2" rx="16"/>
  <rect x="75" y="570" width="300" height="92" class="box green"/>
  <text x="96" y="601" class="head">orders.js</text><text x="96" y="628" class="small">Order records · listing · cancellation</text>
  <rect x="395" y="570" width="300" height="92" class="box green"/>
  <text x="416" y="601" class="head">inventory.js</text><text x="416" y="628" class="small">Stock checks · quantity updates</text>
  <rect x="715" y="570" width="300" height="92" class="box green"/>
  <text x="736" y="601" class="head">pricing.js</text><text x="736" y="628" class="small">Subtotal · discount · GST totals</text>
  <rect x="1035" y="570" width="300" height="92" class="box green"/>
  <text x="1056" y="601" class="head">coupons.js</text><text x="1056" y="628" class="small">Coupon lookup · validation</text>
  <rect x="1355" y="570" width="340" height="92" class="box green"/>
  <text x="1376" y="601" class="head">ledger.js</text><text x="1376" y="628" class="small">Khata balances · settlements</text>

  <rect x="75" y="680" width="300" height="92" class="box green"/>
  <text x="96" y="711" class="head">tax.js</text><text x="96" y="738" class="small">HSN rate lookup · CGST / SGST split</text>
  <rect x="395" y="680" width="300" height="92" class="box green"/>
  <text x="416" y="711" class="head">store.js</text><text x="416" y="738" class="small">Read/write db.json · audit log</text>
  <rect x="715" y="680" width="300" height="92" class="box green"/>
  <text x="736" y="711" class="head">reports.js</text><text x="736" y="738" class="small">Dashboard · GST comparison</text>
  <rect x="1035" y="680" width="300" height="92" class="box green"/>
  <text x="1056" y="711" class="head">invoice.js</text><text x="1056" y="738" class="small">Invoice figures · printable HTML</text>
  <rect x="1355" y="680" width="340" height="92" class="box green"/>
  <text x="1376" y="711" class="head">dates.js</text><text x="1376" y="738" class="small">Date formatting · fiscal year</text>

  <!-- Router to library connections -->
  <path d="M240 485 V520 H545 V560" class="line"/>
  <path d="M240 485 V520 H225 V670" class="line"/>
  <path d="M630 485 V535 H545 V560" class="flow"/>
  <path d="M630 485 V535 H545 V670" class="dataflow"/>
  <path d="M630 485 V535 H865 V560" class="flow"/>
  <path d="M630 485 V535 H1185 V560" class="flow"/>
  <path d="M630 485 V535 H1525 V560" class="dataflow"/>
  <path d="M1020 485 V535 H1525 V560" class="line"/>
  <path d="M1475 485 V520 H865 V670" class="line"/>
  <path d="M1475 485 V520 H1185 V670" class="line"/>
  <path d="M1475 485 V520 H545 V670" class="line"/>

  <!-- Configuration and data -->
  <text x="55" y="850" class="zone">CONFIGURATION &amp; PERSISTENCE</text>
  <rect x="55" y="870" width="600" height="125" class="box amber"/>
  <text x="82" y="907" class="head">config.js</text>
  <text x="82" y="935" class="small">Port · shop details · GST slabs · inventory defaults · coupon definitions · admin key</text>
  <rect x="1145" y="870" width="580" height="125" class="box slate"/>
  <text x="1172" y="907" class="head">data/db.json</text>
  <text x="1172" y="935" class="small">Products · orders · customers · settlements · audit log · ID counters</text>
  <path d="M350 800 V860" class="line"/>
  <path d="M545 800 V850 H1435 V860" class="dataflow"/>
  <path d="M865 800 V840 H1435 V860" class="dataflow"/>
  <path d="M1185 800 V830 H1435 V860" class="line"/>
  <path d="M1525 800 V850 H1435 V860" class="line"/>
  <path d="M655 932 H1135" class="line"/>
  <text x="821" y="920" class="small">configuration read by server and modules</text>
  <text x="820" y="970" class="small">store.js persists application data</text>

  <!-- Order placement flow -->
  <text x="55" y="1050" class="zone">ORDER PLACEMENT FLOW · POST /api/orders</text>
  <rect x="55" y="1070" width="255" height="112" class="flowbox"/>
  <text x="76" y="1098" class="step">1 · Browser UI</text><text x="76" y="1124" class="steptext">Send items, customer,</text><text x="76" y="1145" class="steptext">payment mode, coupon</text>
  <rect x="350" y="1070" width="255" height="112" class="flowbox"/>
  <text x="371" y="1098" class="step">2 · routes/orders.js</text><text x="371" y="1124" class="steptext">Validate item IDs and</text><text x="371" y="1145" class="steptext">normalize quantities</text>
  <rect x="645" y="1070" width="255" height="112" class="flowbox"/>
  <text x="666" y="1098" class="step">3 · inventory.js</text><text x="666" y="1124" class="steptext">Check stock availability</text><text x="666" y="1145" class="steptext">before committing</text>
  <rect x="940" y="1070" width="255" height="112" class="flowbox"/>
  <text x="961" y="1098" class="step">4 · pricing.js</text><text x="961" y="1124" class="steptext">Compute subtotal, coupon</text><text x="961" y="1145" class="steptext">discount and GST (tax.js)</text>
  <rect x="1235" y="1070" width="255" height="112" class="flowbox"/>
  <text x="1256" y="1098" class="step">5 · ledger.js (Khata)</text><text x="1256" y="1124" class="steptext">Check credit and record</text><text x="1256" y="1145" class="steptext">customer debit if selected</text>
  <rect x="1530" y="1070" width="220" height="112" class="flowbox"/>
  <text x="1551" y="1098" class="step">6 · Save order</text><text x="1551" y="1124" class="steptext">orders.js + store.js</text><text x="1551" y="1145" class="steptext">write db.json</text>
  <path d="M310 1126 H340" class="flow"/><path d="M605 1126 H635" class="flow"/><path d="M900 1126 H930" class="flow"/><path d="M1195 1126 H1225" class="flow"/><path d="M1490 1126 H1520" class="flow"/>
  <text x="55" y="1225" class="legend">Solid arrows show code relationships and file access. Blue arrows show the order placement sequence.</text>
</svg>
