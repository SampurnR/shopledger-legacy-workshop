<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">ShopLedger architecture and order placement flow</title>
<desc id="desc">Architecture map of the ShopLedger browser interface, Express server, routers, library modules, config, and JSON database. A six-step flow traces placing an order. Inventory and the cancellation path in orders are highlighted.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60758a"/></marker>
  <marker id="arrowFocus" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/></marker>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#172b3a}
    .title{font-size:24px;font-weight:700}.subtitle{font-size:13px;fill:#52677a}
    .section{font-size:14px;font-weight:700;letter-spacing:.5px;fill:#3c5267}
    .node{fill:#fff;stroke:#9db1c1;stroke-width:1.5;rx:10}
    .nodeTitle{font-size:15px;font-weight:700}.body{font-size:12px;fill:#41586b}
    .small{font-size:12px;fill:#41586b}.focus{fill:#fff4ed;stroke:#e76f24;stroke-width:2.5;rx:10}
    .focusTitle{font-size:15px;font-weight:700;fill:#9a3412}.flow{fill:#f3f7fb;stroke:#6d879b;stroke-width:1.5;rx:10}
    .flowNum{fill:#1c5d83}.flowNumText{font-size:13px;font-weight:700;fill:#fff;text-anchor:middle}
    .flowTitle{font-size:13px;font-weight:700}.flowBody{font-size:12px;fill:#41586b}
    .line{fill:none;stroke:#60758a;stroke-width:1.7;marker-end:url(#arrow)}
    .focusLine{fill:none;stroke:#c2410c;stroke-width:2;marker-end:url(#arrowFocus)}
    .tag{font-size:12px;font-weight:700;fill:#9a3412}
  </style>
</defs>
<rect width="1200" height="800" fill="#f5f8fb"/>
<text x="30" y="38" class="title">ShopLedger | architecture &amp; order flow</text>
<text x="30" y="61" class="subtitle">Node / Express POS · Khata credit ledger · GST invoicing · file-backed JSON storage</text>

<!-- Application entry points -->
<rect x="30" y="82" width="250" height="100" class="node"/>
<text x="48" y="107" class="nodeTitle">Browser UI · public/</text>
<text x="48" y="130" class="body">index.html · js/app.js · css/style.css</text>
<text x="48" y="151" class="body">Catalog, cart, orders, Khata, reports</text>
<text x="48" y="170" class="body">Posts order JSON to /api/orders</text>

<rect x="350" y="82" width="430" height="100" class="node"/>
<text x="370" y="107" class="nodeTitle">server.js · Express entry point</text>
<text x="370" y="130" class="body">Parses JSON · serves public/ · mounts all four routers at /api</text>
<text x="370" y="151" class="body">Also serves GET /orders/:id/invoice via invoice.render()</text>
<text x="370" y="170" class="body">Starts listening when run directly</text>

<rect x="840" y="82" width="330" height="100" class="node"/>
<text x="860" y="107" class="nodeTitle">config.js</text>
<text x="860" y="130" class="body">Port · shop/GST details · HSN slabs · coupons</text>
<text x="860" y="151" class="body">Inventory defaults · admin export key</text>
<text x="860" y="170" class="body">Read by server and relevant lib modules</text>
<path d="M280 132 H350" class="line"/><text x="291" y="121" class="small">HTTP</text>
<path d="M840 155 H780" class="line"/><text x="786" y="145" class="small">settings</text>

<!-- Numbered order path -->
<text x="30" y="211" class="section">ORDER PLACEMENT · POST /api/orders</text>
<g>
 <rect x="30" y="224" width="174" height="91" class="flow"/><circle cx="49" cy="243" r="12" class="flowNum"/><text x="49" y="248" class="flowNumText">1</text>
 <text x="68" y="247" class="flowTitle">Submit</text><text x="44" y="272" class="flowBody">public/app.js sends</text><text x="44" y="291" class="flowBody">items + payment + coupon</text>
 <path d="M204 269 H219" class="line"/>
 <rect x="222" y="224" width="174" height="91" class="flow"/><circle cx="241" cy="243" r="12" class="flowNum"/><text x="241" y="248" class="flowNumText">2</text>
 <text x="260" y="247" class="flowTitle">Resolve request</text><text x="236" y="272" class="flowBody">routes/orders.js reads DB;</text><text x="236" y="291" class="flowBody">resolves product id + qty</text>
 <path d="M396 269 H411" class="line"/>
 <rect x="414" y="224" width="174" height="91" class="flow"/><circle cx="433" cy="243" r="12" class="flowNum"/><text x="433" y="248" class="flowNumText">3</text>
 <text x="452" y="247" class="flowTitle">Check + price</text><text x="428" y="272" class="flowBody">inventory.check(); pricing</text><text x="428" y="291" class="flowBody">tax + coupon calculations</text>
 <path d="M588 269 H603" class="line"/>
 <rect x="606" y="224" width="174" height="91" class="flow"/><circle cx="625" cy="243" r="12" class="flowNum"/><text x="625" y="248" class="flowNumText">4</text>
 <text x="644" y="247" class="flowTitle">Khata (optional)</text><text x="620" y="272" class="flowBody">ledger.chargeOrderToKhata()</text><text x="620" y="291" class="flowBody">checks limit + records debit</text>
 <path d="M780 269 H795" class="line"/>
 <rect x="798" y="224" width="174" height="91" class="flow"/><circle cx="817" cy="243" r="12" class="flowNum"/><text x="817" y="248" class="flowNumText">5</text>
 <text x="836" y="247" class="flowTitle">Commit order</text><text x="812" y="272" class="flowBody">inventory.reserve();</text><text x="812" y="291" class="flowBody">orders.add() builds record</text>
 <path d="M972 269 H987" class="line"/>
 <rect x="990" y="224" width="180" height="91" class="flow"/><circle cx="1009" cy="243" r="12" class="flowNum"/><text x="1009" y="248" class="flowNumText">6</text>
 <text x="1028" y="247" class="flowTitle">Persist + respond</text><text x="1004" y="272" class="flowBody">appendAudit() + write()</text><text x="1004" y="291" class="flowBody">data/db.json · HTTP 201</text>
</g>

<!-- Router and library map -->
<text x="30" y="347" class="section">ROUTES · mounted under /api</text>
<text x="330" y="347" class="section">LIBRARY MODULES · calls shown inside</text>
<rect x="30" y="360" width="260" height="80" class="node"/>
<text x="46" y="383" class="nodeTitle">routes/products.js</text><text x="46" y="406" class="body">GET /products, /coupons</text><text x="46" y="425" class="body">uses store · inventory · tax · coupons</text>
<rect x="30" y="449" width="260" height="90" class="node"/>
<text x="46" y="472" class="nodeTitle">routes/orders.js</text><text x="46" y="495" class="body">GET/POST /orders · POST cancel</text><text x="46" y="514" class="body">uses store · inventory · pricing</text><text x="46" y="532" class="body">coupons · orders · ledger</text>
<rect x="30" y="549" width="260" height="80" class="node"/>
<text x="46" y="572" class="nodeTitle">routes/customers.js</text><text x="46" y="595" class="body">GET /customers · POST settle</text><text x="46" y="614" class="body">uses store · ledger</text>
<rect x="30" y="638" width="260" height="80" class="node"/>
<text x="46" y="661" class="nodeTitle">routes/reports.js</text><text x="46" y="684" class="body">dashboard · GST recon · preview · export</text><text x="46" y="703" class="body">uses store · reports · pricing · coupons</text>
<path d="M490 182 V197 H18 V400 H30" class="line"/><text x="35" y="338" class="small">server mounts router handlers</text>

<!-- Libraries -->
<rect x="330" y="360" width="196" height="100" class="focus"/>
<text x="346" y="384" class="focusTitle">lib/inventory.js</text><text x="346" y="407" class="body">find() · getSellableStock()</text><text x="346" y="428" class="body">check() · reserve() · release()</text><text x="346" y="449" class="tag">TICKET FOCUS · stock</text>
<rect x="540" y="360" width="196" height="100" class="focus"/>
<text x="556" y="384" class="focusTitle">lib/orders.js</text><text x="556" y="407" class="body">add() · get() · list()</text><text x="556" y="428" class="body">cancel() -> release()</text><text x="556" y="447" class="body">Khata: reverseOrderDebit() · cancel only</text>
<rect x="750" y="360" width="196" height="100" class="node"/>
<text x="766" y="384" class="nodeTitle">lib/store.js</text><text x="766" y="407" class="body">read() · write() · appendAudit()</text><text x="766" y="430" class="body">sync JSON read / rewrite</text>
<rect x="960" y="360" width="196" height="100" class="node"/>
<text x="976" y="384" class="nodeTitle">lib/pricing.js</text><text x="976" y="407" class="body">subtotal() · computeTotals()</text><text x="976" y="430" class="body">uses tax + coupons</text>

<rect x="330" y="475" width="196" height="90" class="node"/>
<text x="346" y="499" class="nodeTitle">lib/tax.js</text><text x="346" y="522" class="body">getRateForItem() · GST split</text><text x="346" y="545" class="body">reads config HSN slabs</text>
<rect x="540" y="475" width="196" height="90" class="node"/>
<text x="556" y="499" class="nodeTitle">lib/coupons.js</text><text x="556" y="522" class="body">normalize · validate · discount</text><text x="556" y="545" class="body">reads config coupons</text>
<rect x="750" y="475" width="196" height="90" class="node"/>
<text x="766" y="499" class="nodeTitle">lib/ledger.js</text><text x="766" y="522" class="body">Khata charge / reverse</text><text x="766" y="545" class="body">customer settlements</text>
<rect x="960" y="475" width="196" height="90" class="node"/>
<text x="976" y="499" class="nodeTitle">lib/dates.js</text><text x="976" y="522" class="body">today() · date filtering</text><text x="976" y="545" class="body">used by orders + ledger</text>

<rect x="330" y="580" width="196" height="90" class="node"/>
<text x="346" y="604" class="nodeTitle">lib/reports.js</text><text x="346" y="627" class="body">dashboard + GST reconciliation</text><text x="346" y="650" class="body">uses inventory · ledger · invoice</text>
<rect x="540" y="580" width="196" height="90" class="node"/>
<text x="556" y="604" class="nodeTitle">lib/invoice.js</text><text x="556" y="627" class="body">computeInvoiceFigures() · render()</text><text x="556" y="650" class="body">printable HTML tax invoice</text>

<!-- Persistent data and note -->
<rect x="750" y="580" width="406" height="90" class="node"/>
<text x="770" y="605" class="nodeTitle">data/db.json</text><text x="770" y="628" class="body">products · customers · orders · settlements · auditLog</text><text x="770" y="650" class="body">store.read() loads it; store.write() rewrites it</text>
<path d="M946 410 H1184 V625 H1156" class="line"/>
<text x="1060" y="615" class="small">read / write</text>
<path d="M736 410 H750" class="line"/>

<!-- Ticket detail and legend -->
<rect x="30" y="720" width="760" height="56" fill="#fff4ed" stroke="#e76f24" stroke-width="1.5" rx="9"/>
<text x="46" y="742" class="tag">CANCEL DETAIL</text>
<text x="46" y="763" class="body">Order lines store id + qty; inventory.release() looks up productId and reduces reserved. It does not restore stock.</text>
<rect x="825" y="720" width="345" height="56" class="node"/>
<rect x="845" y="739" width="18" height="18" class="focus"/>
<text x="873" y="753" class="body">Ticket focus: inventory + orders.cancel() only</text>
</svg>