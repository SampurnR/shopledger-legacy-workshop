<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order flow</title>
  <desc id="desc">Browser and Express routes, library modules, configuration and JSON storage, with the order placement sequence.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#526982"/></marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #172b45; font-size: 14px; }
      .title { font-size: 26px; font-weight: 700; }
      .subtitle { font-size: 14px; fill: #50647a; }
      .section { font-size: 16px; font-weight: 700; fill: #334e68; }
      .name { font-size: 15px; font-weight: 700; }
      .small { font-size: 12px; fill: #50647a; }
      .panel { fill: #f4f7fb; stroke: #d5e0eb; stroke-width: 1.2; }
      .box { fill: #ffffff; stroke: #9aadc0; stroke-width: 1.2; }
      .highlight { fill: #fff2d9; stroke: #c47911; stroke-width: 2; }
      .flow { fill: none; stroke: #526982; stroke-width: 1.6; marker-end: url(#arrow); }
      .divider { stroke: #d5e0eb; stroke-width: 1; }
    </style>
  </defs>
  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="32" y="38" class="title">ShopLedger architecture</text>
  <text x="32" y="62" class="subtitle">Express point of sale · Khata ledger · GST invoicing</text>

  <rect x="28" y="82" width="285" height="411" rx="12" class="panel"/>
  <text x="46" y="109" class="section">Client and HTTP entry</text>
  <rect x="48" y="124" width="245" height="64" rx="8" class="box"/>
  <text x="62" y="148" class="name">Browser UI · public/</text>
  <text x="62" y="170" class="small">index.html · js/app.js · css/style.css</text>
  <path d="M170 189V208" class="flow"/>
  <rect x="48" y="211" width="245" height="63" rx="8" class="box"/>
  <text x="62" y="235" class="name">server.js</text>
  <text x="62" y="256" class="small">Static UI · /api · invoice route</text>
  <path d="M170 275V293" class="flow"/>
  <text x="49" y="310" class="section">routes/</text>
  <rect x="48" y="322" width="245" height="31" rx="6" class="box"/><text x="62" y="343">products.js</text>
  <rect x="48" y="360" width="245" height="31" rx="6" class="box"/><text x="62" y="381">orders.js · POST /orders</text>
  <rect x="48" y="398" width="245" height="31" rx="6" class="box"/><text x="62" y="419">customers.js</text>
  <rect x="48" y="436" width="245" height="31" rx="6" class="box"/><text x="62" y="457">reports.js</text>

  <rect x="337" y="82" width="530" height="411" rx="12" class="panel"/>
  <text x="356" y="109" class="section">lib/ · application logic</text>
  <text x="356" y="130" class="small">Modules are grouped by responsibility; the numbered flow below shows calls.</text>
  <rect x="355" y="147" width="238" height="55" rx="8" class="box"/>
  <text x="368" y="170" class="name">inventory.js</text><text x="368" y="189" class="small">find · check · reserve</text>
  <rect x="610" y="147" width="238" height="55" rx="8" class="box"/>
  <text x="623" y="170" class="name">coupons.js</text><text x="623" y="189" class="small">validate · calculateDiscount</text>
  <rect x="355" y="212" width="238" height="55" rx="8" class="box"/>
  <text x="368" y="235" class="name">pricing.js</text><text x="368" y="254" class="small">subtotal · computeTotals</text>
  <rect x="610" y="212" width="238" height="55" rx="8" class="box"/>
  <text x="623" y="235" class="name">tax.js</text><text x="623" y="254" class="small">getRateForItem · splitCgstSgst</text>
  <rect x="355" y="277" width="238" height="55" rx="8" class="box"/>
  <text x="368" y="300" class="name">ledger.js</text><text x="368" y="319" class="small">chargeOrderToKhata · recordSettlement</text>
  <rect x="610" y="277" width="238" height="55" rx="8" class="box"/>
  <text x="623" y="300" class="name">orders.js</text><text x="623" y="319" class="small">add · get · list · cancel</text>
  <rect x="355" y="342" width="238" height="55" rx="8" class="box"/>
  <text x="368" y="365" class="name">dates.js</text><text x="368" y="384" class="small">today · normalizeDateKey</text>
  <rect x="610" y="342" width="238" height="55" rx="8" class="box"/>
  <text x="623" y="365" class="name">reports.js</text><text x="623" y="384" class="small">Dashboard · GST reconciliation</text>
  <rect x="355" y="407" width="238" height="55" rx="8" class="highlight"/>
  <text x="368" y="430" class="name">invoice.js</text><text x="368" y="449" class="small">computeInvoiceFigures · render</text>
  <rect x="610" y="407" width="238" height="55" rx="8" class="box"/>
  <text x="623" y="430" class="name">store.js</text><text x="623" y="449" class="small">read · appendAudit · write</text>

  <rect x="891" y="82" width="281" height="411" rx="12" class="panel"/>
  <text x="910" y="109" class="section">Configuration and data</text>
  <rect x="910" y="147" width="243" height="72" rx="8" class="box"/>
  <text x="925" y="173" class="name">config.js</text><text x="925" y="194" class="small">Shop · GST slabs · coupons</text>
  <rect x="910" y="258" width="243" height="90" rx="8" class="box"/>
  <text x="925" y="284" class="name">data/db.json</text><text x="925" y="305" class="small">Products · customers · orders</text><text x="925" y="324" class="small">Settlements · audit log · IDs</text>
  <text x="910" y="389" class="section">Legend</text>
  <rect x="911" y="404" width="20" height="20" rx="4" class="highlight"/><text x="942" y="419">Requested highlight</text>
  <rect x="911" y="437" width="20" height="20" rx="4" class="box"/><text x="942" y="452">Other component</text>

  <rect x="28" y="512" width="1144" height="257" rx="12" class="panel"/>
  <text x="48" y="542" class="section">Placing an order · successful path</text>
  <text x="48" y="568" class="small">Each numbered item follows the route's execution order. Khata charging is conditional.</text>
  <line x1="600" y1="583" x2="600" y2="748" class="divider"/>
  <text x="50" y="603"><tspan font-weight="700">1</tspan>  Browser → server.js → routes/orders.js: POST /api/orders</text>
  <text x="50" y="633"><tspan font-weight="700">2</tspan>  store.read → inventory.find and inventory.check</text>
  <text x="50" y="663"><tspan font-weight="700">3</tspan>  pricing.subtotal → coupons.normalizeCode / validate</text>
  <text x="50" y="693"><tspan font-weight="700">4</tspan>  pricing.computeTotals → coupons and tax.getRateForItem</text>
  <text x="620" y="603"><tspan font-weight="700">5</tspan>  Khata only: ledger.chargeOrderToKhata</text>
  <text x="620" y="633"><tspan font-weight="700">6</tspan>  inventory.reserve → orders.add</text>
  <text x="620" y="663"><tspan font-weight="700">7</tspan>  store.appendAudit → store.write → data/db.json</text>
  <text x="620" y="693"><tspan font-weight="700">8</tspan>  HTTP 201 returns the saved order to the browser</text>
  <text x="50" y="735" class="small">Invoice is a separate GET /orders/:id/invoice handled by server.js using orders.get and invoice.render.</text>
</svg>
