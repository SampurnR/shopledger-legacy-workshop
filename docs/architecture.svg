<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="desc">A diagram showing the UI, Express server, routes, library modules, config file, JSON data file, and the order placement path.</desc>
  <defs>
    <style>
      .bg { fill:#f8fafc; } .title { font:700 30px Arial, sans-serif; fill:#0f172a; }
      .subtitle { font:400 15px Arial, sans-serif; fill:#475569; }
      .layer { fill:#ffffff; stroke:#cbd5e1; stroke-width:2; rx:16; }
      .route { fill:#eff6ff; stroke:#60a5fa; stroke-width:2; rx:10; }
      .module { fill:#f0fdf4; stroke:#4ade80; stroke-width:2; rx:10; }
      .data { fill:#fff7ed; stroke:#fb923c; stroke-width:2; rx:10; }
      .config { fill:#faf5ff; stroke:#c084fc; stroke-width:2; rx:10; }
      .server { fill:#ecfeff; stroke:#22d3ee; stroke-width:2; rx:12; }
      .ui { fill:#eef2ff; stroke:#818cf8; stroke-width:2; rx:12; }
      .head { font:700 17px Arial, sans-serif; fill:#0f172a; }
      .body { font:400 14px Arial, sans-serif; fill:#334155; }
      .small { font:400 12px Arial, sans-serif; fill:#475569; }
      .layerlabel { font:700 14px Arial, sans-serif; fill:#64748b; letter-spacing:1px; }
      .step { fill:#0f766e; } .steptext { font:700 13px Arial, sans-serif; fill:#ffffff; }
      .arrow { fill:none; stroke:#0f766e; stroke-width:3; marker-end:url(#arrowhead); }
      .thin { fill:none; stroke:#64748b; stroke-width:2; marker-end:url(#thinArrow); }
      .note { font:600 13px Arial, sans-serif; fill:#0f766e; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker>
    <marker id="thinArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
  </defs>

  <rect class="bg" width="1600" height="1120"/>
  <text class="title" x="800" y="48" text-anchor="middle">ShopLedger: architecture and order placement flow</text>
  <text class="subtitle" x="800" y="75" text-anchor="middle">Node.js + Express monolith with a Vanilla JavaScript frontend and JSON-file persistence</text>

  <text class="layerlabel" x="55" y="126">PRESENTATION</text>
  <rect class="ui" x="55" y="145" width="305" height="135"/>
  <text class="head" x="207" y="182" text-anchor="middle">Browser UI</text>
  <text class="body" x="207" y="210" text-anchor="middle">public/index.html</text>
  <text class="body" x="207" y="234" text-anchor="middle">public/js/app.js</text>
  <text class="small" x="207" y="258" text-anchor="middle">POS · orders · Khata · audit</text>

  <text class="layerlabel" x="485" y="126">APPLICATION</text>
  <rect class="server" x="485" y="145" width="285" height="135"/>
  <text class="head" x="627" y="182" text-anchor="middle">Express application</text>
  <text class="body" x="627" y="210" text-anchor="middle">server.js</text>
  <text class="small" x="627" y="234" text-anchor="middle">JSON middleware · static files</text>
  <text class="small" x="627" y="258" text-anchor="middle">route registration · invoice page</text>

  <text class="layerlabel" x="875" y="126">CONFIGURATION</text>
  <rect class="config" x="875" y="145" width="285" height="135"/>
  <text class="head" x="1017" y="182" text-anchor="middle">config.js</text>
  <text class="body" x="1017" y="210" text-anchor="middle">shop · port · tax slabs</text>
  <text class="body" x="1017" y="234" text-anchor="middle">inventory defaults · coupons</text>

  <text class="layerlabel" x="55" y="350">HTTP ROUTERS (routes/)</text>
  <rect class="route" x="55" y="370" width="310" height="90"/><text class="head" x="210" y="404" text-anchor="middle">products.js</text><text class="body" x="210" y="430" text-anchor="middle">products · coupons</text>
  <rect class="route" x="395" y="370" width="310" height="90"/><text class="head" x="550" y="404" text-anchor="middle">orders.js</text><text class="body" x="550" y="430" text-anchor="middle">create · list · cancel</text>
  <rect class="route" x="735" y="370" width="310" height="90"/><text class="head" x="890" y="404" text-anchor="middle">customers.js</text><text class="body" x="890" y="430" text-anchor="middle">customers · settlements</text>
  <rect class="route" x="1075" y="370" width="310" height="90"/><text class="head" x="1230" y="404" text-anchor="middle">reports.js</text><text class="body" x="1230" y="430" text-anchor="middle">dashboard · reconciliation · preview</text>

  <text class="layerlabel" x="55" y="530">DOMAIN MODULES (lib/)</text>
  <rect class="module" x="55" y="550" width="210" height="82"/><text class="head" x="160" y="582" text-anchor="middle">pricing.js</text><text class="small" x="160" y="608" text-anchor="middle">subtotal · totals</text>
  <rect class="module" x="285" y="550" width="210" height="82"/><text class="head" x="390" y="582" text-anchor="middle">tax.js</text><text class="small" x="390" y="608" text-anchor="middle">GST · CGST/SGST</text>
  <rect class="module" x="515" y="550" width="210" height="82"/><text class="head" x="620" y="582" text-anchor="middle">coupons.js</text><text class="small" x="620" y="608" text-anchor="middle">validation · discount</text>
  <rect class="module" x="745" y="550" width="210" height="82"/><text class="head" x="850" y="582" text-anchor="middle">inventory.js</text><text class="small" x="850" y="608" text-anchor="middle">stock · reserve · release</text>
  <rect class="module" x="975" y="550" width="210" height="82"/><text class="head" x="1080" y="582" text-anchor="middle">orders.js</text><text class="small" x="1080" y="608" text-anchor="middle">order lifecycle</text>
  <rect class="module" x="1205" y="550" width="210" height="82"/><text class="head" x="1310" y="582" text-anchor="middle">ledger.js</text><text class="small" x="1310" y="608" text-anchor="middle">Khata · settlements</text>
  <rect class="module" x="170" y="655" width="210" height="82"/><text class="head" x="275" y="687" text-anchor="middle">reports.js</text><text class="small" x="275" y="713" text-anchor="middle">dashboard · GST audit</text>
  <rect class="module" x="405" y="655" width="210" height="82"/><text class="head" x="510" y="687" text-anchor="middle">invoice.js</text><text class="small" x="510" y="713" text-anchor="middle">HTML invoice</text>
  <rect class="module" x="640" y="655" width="210" height="82"/><text class="head" x="745" y="687" text-anchor="middle">dates.js</text><text class="small" x="745" y="713" text-anchor="middle">date utilities</text>
  <rect class="module" x="875" y="655" width="210" height="82"/><text class="head" x="980" y="687" text-anchor="middle">store.js</text><text class="small" x="980" y="713" text-anchor="middle">read · write · audit log</text>

  <text class="layerlabel" x="1180" y="705">PERSISTENCE</text>
  <rect class="data" x="1160" y="725" width="270" height="100"/>
  <text class="head" x="1295" y="764" text-anchor="middle">data/db.json</text>
  <text class="body" x="1295" y="791" text-anchor="middle">products · orders · customers</text>
  <text class="body" x="1295" y="814" text-anchor="middle">settlements · auditLog</text>

  <path class="thin" d="M360 212 H485"/><text class="small" x="422" y="198" text-anchor="middle">/api</text>
  <path class="thin" d="M627 280 V340 H550 V370"/>
  <path class="thin" d="M770 212 H875"/>
  <path class="thin" d="M980 737 V775 H1160"/>
  <path class="thin" d="M1017 280 V510 H620 V550"/>

  <rect x="55" y="875" width="1375" height="185" rx="16" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
  <text class="head" x="85" y="910">Order placement flow</text>
  <circle class="step" cx="115" cy="965" r="19"/><text class="steptext" x="115" y="970" text-anchor="middle">1</text><text class="note" x="115" y="1005" text-anchor="middle">Select items</text>
  <circle class="step" cx="355" cy="965" r="19"/><text class="steptext" x="355" y="970" text-anchor="middle">2</text><text class="note" x="355" y="1005" text-anchor="middle">POST /api/pricing/preview</text>
  <circle class="step" cx="635" cy="965" r="19"/><text class="steptext" x="635" y="970" text-anchor="middle">3</text><text class="note" x="635" y="1005" text-anchor="middle">POST /api/orders</text>
  <circle class="step" cx="885" cy="965" r="19"/><text class="steptext" x="885" y="970" text-anchor="middle">4</text><text class="note" x="885" y="1005" text-anchor="middle">Validate and calculate</text>
  <circle class="step" cx="1130" cy="965" r="19"/><text class="steptext" x="1130" y="970" text-anchor="middle">5</text><text class="note" x="1130" y="1005" text-anchor="middle">Update stock / Khata / order</text>
  <circle class="step" cx="1360" cy="965" r="19"/><text class="steptext" x="1360" y="970" text-anchor="middle">6</text><text class="note" x="1360" y="1005" text-anchor="middle">store.write(db)</text>
  <path class="arrow" d="M140 965 H330"/><path class="arrow" d="M380 965 H610"/><path class="arrow" d="M660 965 H860"/><path class="arrow" d="M910 965 H1105"/><path class="arrow" d="M1155 965 H1335"/>
  <text class="small" x="800" y="1040" text-anchor="middle">The order route coordinates pricing, coupons, inventory, ledger, orders, store, and data/db.json.</text>
</svg>
