<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order flow</title>
  <desc id="desc">Browser, Express server, routers, business modules, configuration and JSON storage, with a numbered order placement flow and the invoice module highlighted.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#17243b;font-size:14px}.title{font-size:25px;font-weight:bold}.subtitle{font-size:14px;fill:#52637c}.heading{font-size:15px;font-weight:bold;fill:#34445d;letter-spacing:.5px}.name{font-size:15px;font-weight:bold}.small{font-size:12px;fill:#52637c}.flow{font-size:13px;fill:#24354e}.panel{fill:#f5f8fc;stroke:#d9e2ef;stroke-width:1.5}.box{fill:#fff;stroke:#9aadc4;stroke-width:1.4}.ticket{fill:#fff0db;stroke:#d78519;stroke-width:2}.line{fill:none;stroke:#64748b;stroke-width:1.7;marker-end:url(#arrow)}.link{fill:none;stroke:#a4b2c3;stroke-width:1.4;marker-end:url(#arrow)}.number{fill:#2356a0}.numtext{font-size:13px;font-weight:bold;fill:white;text-anchor:middle}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#fff"/>
  <text x="36" y="42" class="title">ShopLedger architecture</text>
  <text x="36" y="65" class="subtitle">Express POS, customer credit ledger, inventory and GST invoicing</text>

  <rect x="30" y="90" width="220" height="240" rx="12" class="panel"/>
  <text x="46" y="116" class="heading">BROWSER</text>
  <rect x="46" y="132" width="188" height="105" rx="8" class="box"/>
  <text x="60" y="156" class="name">public/</text>
  <text x="60" y="178" class="small">index.html · css/style.css</text>
  <text x="60" y="197" class="small">js/app.js</text>
  <text x="60" y="218" class="small">POS · orders · khata · audit</text>
  <text x="47" y="267" class="small">HTTP requests / HTML response</text>

  <rect x="280" y="90" width="205" height="240" rx="12" class="panel"/>
  <text x="296" y="116" class="heading">EXPRESS APP</text>
  <rect x="296" y="132" width="173" height="105" rx="8" class="box"/>
  <text x="310" y="156" class="name">server.js</text>
  <text x="310" y="178" class="small">Static UI + /api routers</text>
  <text x="310" y="197" class="small">GET /orders/:id/invoice</text>
  <text x="310" y="218" class="small">invoice.render(order)</text>
  <path d="M234 183 H296" class="line"/>

  <rect x="515" y="90" width="230" height="240" rx="12" class="panel"/>
  <text x="531" y="116" class="heading">ROUTERS · routes/</text>
  <rect x="531" y="132" width="198" height="35" rx="6" class="box"/><text x="544" y="154" class="name">products.js</text>
  <rect x="531" y="175" width="198" height="35" rx="6" class="box"/><text x="544" y="197" class="name">orders.js</text>
  <rect x="531" y="218" width="198" height="35" rx="6" class="box"/><text x="544" y="240" class="name">customers.js</text>
  <rect x="531" y="261" width="198" height="35" rx="6" class="box"/><text x="544" y="283" class="name">reports.js</text>
  <path d="M469 183 H503 V193 H531" class="line"/>
  <text x="473" y="160" class="small">/api</text>

  <rect x="775" y="90" width="395" height="365" rx="12" class="panel"/>
  <text x="791" y="116" class="heading">BUSINESS MODULES · lib/</text>
  <rect x="791" y="132" width="173" height="45" rx="6" class="box"/><text x="803" y="151" class="name">inventory.js</text><text x="803" y="168" class="small">stock checks / deduction</text>
  <rect x="978" y="132" width="175" height="45" rx="6" class="box"/><text x="990" y="151" class="name">ledger.js</text><text x="990" y="168" class="small">khata charges / payments</text>
  <rect x="791" y="185" width="173" height="45" rx="6" class="box"/><text x="803" y="204" class="name">pricing.js</text><text x="803" y="221" class="small">checkout totals</text>
  <rect x="978" y="185" width="175" height="45" rx="6" class="box"/><text x="990" y="204" class="name">coupons.js</text><text x="990" y="221" class="small">validation / discount</text>
  <rect x="791" y="238" width="173" height="45" rx="6" class="box"/><text x="803" y="257" class="name">tax.js</text><text x="803" y="274" class="small">GST slab / split</text>
  <rect x="978" y="238" width="175" height="45" rx="6" class="box"/><text x="990" y="257" class="name">orders.js</text><text x="990" y="274" class="small">add / list / cancel</text>
  <rect x="791" y="291" width="173" height="45" rx="6" class="box"/><text x="803" y="310" class="name">dates.js</text><text x="803" y="327" class="small">date helpers</text>
  <rect x="978" y="291" width="175" height="45" rx="6" class="box"/><text x="990" y="310" class="name">reports.js</text><text x="990" y="327" class="small">dashboard / reconciliation</text>
  <rect x="791" y="344" width="173" height="45" rx="6" class="box"/><text x="803" y="363" class="name">store.js</text><text x="803" y="380" class="small">read / write / audit</text>
  <rect x="978" y="344" width="175" height="45" rx="6" class="ticket"/><text x="990" y="363" class="name">invoice.js</text><text x="990" y="380" class="small">compute figures / render</text>
  <text x="791" y="422" class="small">Modules call one another as needed; see flow below.</text>
  <path d="M729 278 H758 V316 H791" class="link"/>
  <text x="735" y="265" class="small">calls</text>

  <rect x="30" y="360" width="325" height="95" rx="10" class="panel"/>
  <text x="46" y="386" class="heading">CONFIGURATION</text>
  <rect x="46" y="398" width="293" height="40" rx="6" class="box"/><text x="59" y="423" class="name">config.js</text><text x="140" y="423" class="small">shop · GST slabs · coupons</text>
  <rect x="380" y="360" width="365" height="95" rx="10" class="panel"/>
  <text x="396" y="386" class="heading">PERSISTENCE</text>
  <rect x="396" y="398" width="333" height="40" rx="6" class="box"/><text x="409" y="423" class="name">data/db.json</text><text x="516" y="423" class="small">orders · stock · khata · audit</text>
  <path d="M791 367 H760 V418 H729" class="link"/>
  <text x="656" y="390" class="small">store.read / write</text>

  <rect x="30" y="480" width="1140" height="245" rx="12" fill="#f5f8fc" stroke="#d9e2ef" stroke-width="1.5"/>
  <text x="48" y="508" class="heading">PLACING AN ORDER · POST /api/orders</text>
  <circle cx="59" cy="536" r="12" class="number"/><text x="59" y="541" class="numtext">1</text>
  <text x="81" y="541" class="flow">public/js/app.js collects cart and customer details; server.js passes the request to routes/orders.js.</text>
  <circle cx="59" cy="570" r="12" class="number"/><text x="59" y="575" class="numtext">2</text>
  <text x="81" y="575" class="flow">store.read() loads db.json; inventory.find() resolves product data; inventory.check() checks stock.</text>
  <circle cx="59" cy="604" r="12" class="number"/><text x="59" y="609" class="numtext">3</text>
  <text x="81" y="609" class="flow">coupons.validate() checks the code; pricing.computeTotals() uses coupons.js and tax.js for totals.</text>
  <circle cx="59" cy="638" r="12" class="number"/><text x="59" y="643" class="numtext">4</text>
  <text x="81" y="643" class="flow">For khata, ledger.chargeOrderToKhata() updates credit; inventory.reserve() deducts physical stock.</text>
  <circle cx="59" cy="672" r="12" class="number"/><text x="59" y="677" class="numtext">5</text>
  <text x="81" y="677" class="flow">orders.add() creates the order; store.appendAudit() and store.write() save changes; the route returns 201.</text>
  <text x="48" y="705" class="small">Invoice viewing is separate: server.js loads an order and calls invoice.render(), which recalculates invoice figures.</text>

  <rect x="38" y="751" width="18" height="18" rx="4" class="ticket"/><text x="65" y="765" class="small">Ticket focus</text>
  <rect x="165" y="751" width="18" height="18" rx="4" class="box"/><text x="192" y="765" class="small">Application component</text>
  <path d="M368 760 H410" class="line"/><text x="419" y="765" class="small">Request, call, or data access (selected connections)</text>
  <text x="1155" y="765" class="small" text-anchor="end">ShopLedger · repository view</text>
</svg>
