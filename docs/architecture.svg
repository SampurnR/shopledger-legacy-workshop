<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
<title id="title">ShopLedger app architecture and order flow</title>
<desc id="desc">Architecture diagram showing the browser UI, Express routes, library modules, config, JSON data store, and order placement flow.</desc>
<defs>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
 <marker id="flowArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker>
 <style>
  text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:750}.subtitle{font-size:14px;fill:#64748b}.head{font-size:17px;font-weight:700}.label{font-size:14px;font-weight:650}.small{font-size:12px;fill:#536176}.tiny{font-size:11px;fill:#536176}.box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.group{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}.route{fill:#eef6ff;stroke:#93c5fd}.module{fill:#fff;stroke:#cbd5e1}.flow{fill:#eff6ff;stroke:#93c5fd}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.flowline{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#flowArrow)}.dash{stroke-dasharray:6 5}
 </style>
</defs>
<rect width="1600" height="1120" fill="#f1f5f9"/>
<text x="56" y="54" class="title">ShopLedger — app architecture</text>
<text x="57" y="81" class="subtitle">Browser POS · Express API · CommonJS modules · JSON file persistence</text>

<!-- UI -->
<rect x="55" y="115" width="300" height="180" rx="14" class="group"/>
<text x="78" y="148" class="head">Browser UI</text>
<rect x="78" y="166" width="254" height="45" rx="8" class="box"/><text x="96" y="194" class="label">public/index.html</text>
<rect x="78" y="224" width="254" height="45" rx="8" class="box"/><text x="96" y="252" class="label">public/js/app.js</text>
<text x="78" y="283" class="small">public/css/style.css</text>

<!-- server -->
<rect x="410" y="115" width="275" height="180" rx="14" class="group"/>
<text x="433" y="148" class="head">Express app</text>
<rect x="433" y="166" width="229" height="74" rx="8" class="box"/><text x="450" y="194" class="label">server.js</text><text x="450" y="217" class="small">static files · mounts /api routes</text>
<text x="433" y="272" class="small">GET /orders/:id/invoice</text>
<path d="M355 205H405" class="line"/><text x="360" y="193" class="tiny">HTTP</text>

<!-- routes -->
<rect x="750" y="105" width="345" height="340" rx="14" class="group"/>
<text x="775" y="140" class="head">routes/</text>
<rect x="775" y="160" width="295" height="54" rx="8" class="route"/><text x="793" y="184" class="label">orders.js</text><text x="793" y="203" class="tiny">list · create · cancel</text>
<rect x="775" y="226" width="295" height="48" rx="8" class="route"/><text x="793" y="256" class="label">products.js</text>
<rect x="775" y="286" width="295" height="48" rx="8" class="route"/><text x="793" y="316" class="label">customers.js</text>
<rect x="775" y="346" width="295" height="65" rx="8" class="route"/><text x="793" y="372" class="label">reports.js</text><text x="793" y="394" class="tiny">dashboard · GST reconciliation · preview · export</text>
<path d="M685 205H744" class="line"/>

<!-- lib -->
<rect x="1150" y="105" width="395" height="665" rx="14" class="group"/>
<text x="1175" y="140" class="head">lib/</text>
<rect x="1175" y="160" width="160" height="55" rx="8" class="module"/><text x="1191" y="193" class="label">orders.js</text>
<rect x="1360" y="160" width="160" height="55" rx="8" class="module"/><text x="1376" y="193" class="label">inventory.js</text>
<rect x="1175" y="230" width="160" height="55" rx="8" class="module"/><text x="1191" y="263" class="label">pricing.js</text>
<rect x="1360" y="230" width="160" height="55" rx="8" class="module"/><text x="1376" y="263" class="label">coupons.js</text>
<rect x="1175" y="300" width="160" height="55" rx="8" class="module"/><text x="1191" y="333" class="label">tax.js</text>
<rect x="1360" y="300" width="160" height="55" rx="8" class="module"/><text x="1376" y="333" class="label">ledger.js</text>
<rect x="1175" y="370" width="160" height="55" rx="8" class="module"/><text x="1191" y="403" class="label">reports.js</text>
<rect x="1360" y="370" width="160" height="55" rx="8" class="module"/><text x="1376" y="403" class="label">invoice.js</text>
<rect x="1175" y="440" width="160" height="55" rx="8" class="module"/><text x="1191" y="473" class="label">dates.js</text>
<rect x="1360" y="440" width="160" height="55" rx="8" class="module"/><text x="1376" y="473" class="label">store.js</text>
<text x="1177" y="535" class="small">Order route uses inventory, pricing,</text><text x="1177" y="555" class="small">coupons, orders, and ledger.</text>
<text x="1177" y="588" class="small">pricing → coupons + tax</text><text x="1177" y="612" class="small">orders → inventory + ledger + dates</text><text x="1177" y="636" class="small">reports → inventory + ledger + invoice</text><text x="1177" y="660" class="small">invoice → config</text><text x="1177" y="684" class="small">store ↔ data/db.json</text>
<path d="M1095 270H1144" class="line"/>

<!-- config and database -->
<rect x="750" y="500" width="345" height="90" rx="12" class="box"/><text x="775" y="535" class="head">config.js</text><text x="775" y="562" class="small">shop · tax slabs · coupons · inventory settings · admin key</text>
<rect x="750" y="630" width="345" height="100" rx="12" class="box"/><text x="775" y="668" class="head">data/db.json</text><text x="775" y="696" class="small">products · orders · customers · settlements · audit log</text>
<path d="M1095 543H1145" class="line"/><path d="M1095 680H1145" class="line"/>

<!-- order flow band -->
<rect x="55" y="815" width="1490" height="250" rx="16" fill="#fff" stroke="#bfdbfe" stroke-width="2"/>
<text x="82" y="855" class="head" fill="#1d4ed8">Order placement flow · POST /api/orders</text>
<g>
 <rect x="82" y="890" width="195" height="100" rx="10" class="flow"/><text x="101" y="923" class="label">1 · UI gathers cart</text><text x="101" y="949" class="small">items · customer · mode</text><text x="101" y="969" class="small">status · coupon</text>
 <rect x="315" y="890" width="195" height="100" rx="10" class="flow"/><text x="334" y="923" class="label">2 · orders route</text><text x="334" y="949" class="small">resolve product IDs</text><text x="334" y="969" class="small">normalize quantities</text>
 <rect x="548" y="890" width="195" height="100" rx="10" class="flow"/><text x="567" y="923" class="label">3 · inventory check</text><text x="567" y="949" class="small">check sellable stock</text>
 <rect x="781" y="890" width="195" height="100" rx="10" class="flow"/><text x="800" y="923" class="label">4 · pricing</text><text x="800" y="949" class="small">coupon · HSN GST</text><text x="800" y="969" class="small">compute totals</text>
 <rect x="1014" y="890" width="195" height="100" rx="10" class="flow"/><text x="1033" y="923" class="label">5 · Khata (if used)</text><text x="1033" y="949" class="small">credit limit · billed</text>
 <rect x="1247" y="890" width="250" height="100" rx="10" class="flow"/><text x="1266" y="923" class="label">6 · commit and save</text><text x="1266" y="949" class="small">deduct stock · add order</text><text x="1266" y="969" class="small">audit · write JSON file</text>
 <path d="M277 940H309" class="flowline"/><path d="M510 940H542" class="flowline"/><path d="M743 940H775" class="flowline"/><path d="M976 940H1008" class="flowline"/><path d="M1209 940H1241" class="flowline"/>
</g>
<text x="82" y="1032" class="tiny">After success, the UI refreshes products, dashboard summary, and customer balances.</text>
</svg>
