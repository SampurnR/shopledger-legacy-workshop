<rect x="60" y="740" width="420" height="141" rx="16" fill="#e8f0ed" stroke="#a8c2b9"/>
<text x="86" y="778" class="heading">Baseline fault</text><text x="86" y="814" class="body">Invoice duplicates old pricing rules.</text><text x="86" y="845" class="body">Checkout already has HSN + caps.</text>
<rect x="1060" y="255" width="680" height="193" rx="16" class="box"/>
<text x="1086" y="291" class="heading">Checkout money rules</text>
<text x="1086" y="329" class="file">lib/pricing.js</text><text x="1325" y="329" class="body">discount → taxable → GST</text>
<text x="1086" y="367" class="file">lib/tax.js</text><text x="1325" y="367" class="body">HSN slab · CGST / SGST</text>
<text x="1086" y="405" class="file">lib/coupons.js</text><text x="1325" y="405" class="body">normalize · eligibility · cap</text>
<text x="1086" y="434" class="small">pricing → tax + coupons; tax + coupons → config.js</text>
<rect x="1060" y="469" width="680" height="187" rx="16" class="box"/>
<text x="1086" y="505" class="heading">Business operations</text>
<text x="1086" y="544" class="file">lib/inventory.js</text><text x="1410" y="544" class="body">check · reserve · release</text>
<text x="1086" y="581" class="file">lib/orders.js</text><text x="1410" y="581" class="body">add · get · list · cancel</text>
<text x="1086" y="618" class="file">lib/ledger.js</text><text x="1410" y="618" class="body">charge · reverse · settle</text>
<text x="1086" y="645" class="small">orders → inventory + ledger + dates; ledger → dates</text>
<rect x="1060" y="677" width="680" height="105" rx="16" fill="#fff6e4" stroke="#b68332" stroke-width="2"/>
<text x="1086" y="716" class="file">lib/invoice.js</text><text x="1350" y="716" class="body">figures + HTML rendering</text>
<text x="1086" y="753" class="body">Ticket #1: replace duplicate arithmetic with pricing.computeTotals</text>
<rect x="1060" y="803" width="680" height="111" rx="16" class="box"/>
<text x="1086" y="842" class="file">lib/reports.js</text><text x="1350" y="842" class="body">dashboard · reconciliation</text><text x="1086" y="879" class="small">reports → inventory + ledger + invoice</text>
