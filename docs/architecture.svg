<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="desc">A diagram of the ShopLedger browser UI, Express server, routers, library modules, configuration and JSON data store. The order placement path is highlighted and numbered.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="flowArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,3 L0,6 Z" fill="#dc2626"/></marker>
    <style>
      .bg { fill:#f8fafc; } .title { font:700 30px Arial,sans-serif; fill:#0f172a; } .subtitle { font:14px Arial,sans-serif; fill:#475569; }
      .section { font:700 16px Arial,sans-serif; fill:#334155; letter-spacing:1px; } .box { stroke-width:2; rx:12; }
      .boxTitle { font:700 16px Arial,sans-serif; fill:#0f172a; } .body { font:13px Arial,sans-serif; fill:#334155; } .small { font:12px Arial,sans-serif; fill:#475569; }
      .route { fill:#eff6ff; stroke:#3b82f6; } .lib { fill:#f0fdf4; stroke:#22c55e; } .core { fill:#f5f3ff; stroke:#8b5cf6; } .data { fill:#fff7ed; stroke:#f97316; } .ui { fill:#ecfeff; stroke:#06b6d4; }
      .link { fill:none; stroke:#64748b; stroke-width:2; marker-end:url(#arrow); } .flow { fill:none; stroke:#dc2626; stroke-width:4; marker-end:url(#flowArrow); }
      .flowLabel { font:700 12px Arial,sans-serif; fill:#b91c1c; } .legend { font:12px Arial,sans-serif; fill:#334155; }
    </style>
  </defs>
  <rect class="bg" width="1800" height="1320"/>
  <text x="60" y="56" class="title">ShopLedger — application architecture</text>
  <text x="60" y="82" class="subtitle">Actual repository modules and the server-side order-placement path</text>

  <!-- Browser UI -->
  <text x="60" y="132" class="section">BROWSER</text>
  <rect x="60" y="150" width="330" height="225" class="box ui"/>
  <text x="85" y="182" class="boxTitle">public/index.html</text>
  <text x="85" y="208" class="body">Single-page POS interface</text>
  <text x="85" y="234" class="small">New Order (POS)</text>
  <text x="85" y="254" class="small">Order History / Invoice links</text>
  <text x="85" y="274" class="small">Customer Khata / Settlement</text>
  <text x="85" y="294" class="small">Inventory &amp; GST Audit</text>
  <text x="85" y="332" class="body">public/js/app.js</text>
  <text x="85" y="353" class="small">XHR GET/POST client and rendering</text>

  <!-- Server -->
  <text x="510" y="132" class="section">EXPRESS APPLICATION</text>
  <rect x="510" y="150" width="350" height="225" class="box core"/>
  <text x="535" y="182" class="boxTitle">server.js</text>
  <text x="535" y="208" class="body">Express + body-parser</text>
  <text x="535" y="234" class="small">Serves public/ static files</text>
  <text x="535" y="254" class="small">Mounts all routers at /api</text>
  <text x="535" y="274" class="small">GET /orders/:id/invoice</text>
  <text x="535" y="315" class="body">config.js</text>
  <text x="535" y="337" class="small">Port, shop details, GST slabs, coupons</text>
  <text x="535" y="356" class="small">inventory settings, admin key</text>

  <!-- Routes -->
  <text x="980" y="132" class="section">ROUTERS (routes/)</text>
  <rect x="980" y="150" width="330" height="95" class="box route"/>
  <text x="1005" y="180" class="boxTitle">products.js</text><text x="1005" y="205" class="small">GET /products · GET /coupons</text>
  <rect x="1360" y="150" width="330" height="95" class="box route"/>
  <text x="1385" y="180" class="boxTitle">orders.js</text><text x="1385" y="205" class="small">GET/POST /orders · POST /orders/:id/cancel</text>
  <rect x="980" y="280" width="330" height="95" class="box route"/>
  <text x="1005" y="310" class="boxTitle">customers.js</text><text x="1005" y="335" class="small">GET /customers · POST /customers/:id/settle</text>
  <rect x="1360" y="280" width="330" height="95" class="box route"/>
  <text x="1385" y="310" class="boxTitle">reports.js</text><text x="1385" y="335" class="small">Dashboard · GST reconciliation · pricing preview · export</text>

  <!-- Libraries -->
  <text x="60" y="455" class="section">DOMAIN &amp; PERSISTENCE MODULES (lib/)</text>
  <rect x="60" y="480" width="250" height="115" class="box lib"/>
  <text x="84" y="512" class="boxTitle">store.js</text><text x="84" y="538" class="small">Read/write db.json</text><text x="84" y="558" class="small">Audit log append</text>
  <rect x="345" y="480" width="250" height="115" class="box lib"/>
  <text x="369" y="512" class="boxTitle">inventory.js</text><text x="369" y="538" class="small">Find/check/reserve/release</text><text x="369" y="558" class="small">Stock summary</text>
  <rect x="630" y="480" width="250" height="115" class="box lib"/>
  <text x="654" y="512" class="boxTitle">pricing.js</text><text x="654" y="538" class="small">Subtotal, discount, totals</text><text x="654" y="558" class="small">Line tax calculation</text>
  <rect x="915" y="480" width="250" height="115" class="box lib"/>
  <text x="939" y="512" class="boxTitle">coupons.js</text><text x="939" y="538" class="small">Normalize/validate codes</text><text x="939" y="558" class="small">Calculate discount</text>
  <rect x="1200" y="480" width="250" height="115" class="box lib"/>
  <text x="1224" y="512" class="boxTitle">orders.js</text><text x="1224" y="538" class="small">Add/get/list/cancel</text><text x="1224" y="558" class="small">Order status lifecycle</text>
  <rect x="1485" y="480" width="250" height="115" class="box lib"/>
  <text x="1509" y="512" class="boxTitle">ledger.js</text><text x="1509" y="538" class="small">Khata credit/settlements</text><text x="1509" y="558" class="small">Customer balances</text>

  <rect x="220" y="650" width="250" height="115" class="box lib"/>
  <text x="244" y="682" class="boxTitle">tax.js</text><text x="244" y="708" class="small">HSN slab lookup</text><text x="244" y="728" class="small">CGST/SGST split</text>
  <rect x="505" y="650" width="250" height="115" class="box lib"/>
  <text x="529" y="682" class="boxTitle">dates.js</text><text x="529" y="708" class="small">Today/date normalization</text><text x="529" y="728" class="small">Fiscal year</text>
  <rect x="790" y="650" width="250" height="115" class="box lib"/>
  <text x="814" y="682" class="boxTitle">reports.js</text><text x="814" y="708" class="small">Dashboard summary</text><text x="814" y="728" class="small">GST reconciliation</text>
  <rect x="1075" y="650" width="250" height="115" class="box lib"/>
  <text x="1099" y="682" class="boxTitle">invoice.js</text><text x="1099" y="708" class="small">Invoice figures</text><text x="1099" y="728" class="small">Printable HTML</text>

  <!-- Data -->
  <text x="1390" y="665" class="section">DATA</text>
  <rect x="1390" y="685" width="345" height="130" class="box data"/>
  <text x="1415" y="718" class="boxTitle">data/db.json</text>
  <text x="1415" y="744" class="small">products · customers · orders</text>
  <text x="1415" y="764" class="small">settlements · auditLog</text>
  <text x="1415" y="784" class="small">nextOrderId · nextSettlementId</text>

  <!-- Existing architecture links -->
  <path d="M390 262 H505" class="link"/><text x="420" y="250" class="small">/api + invoice</text>
  <path d="M860 205 H970" class="link"/>
  <path d="M860 245 C920 245 920 327 970 327" class="link"/>
  <path d="M860 225 C1110 225 1120 198 1350 198" class="link"/>
  <path d="M860 265 C1100 265 1130 327 1350 327" class="link"/>
  <path d="M185 480 V405 H1510 V470" class="link"/>
  <path d="M185 595 V750 H1380" class="link"/>
  <path d="M1450 595 V680" class="link"/>
  <path d="M1315 375 V640" class="link"/>
  <path d="M1165 707 H1380" class="link"/>

  <!-- Order flow -->
  <text x="60" y="895" class="section">ORDER PLACEMENT FLOW (POST /api/orders)</text>
  <rect x="60" y="925" width="220" height="120" class="box ui"/><text x="82" y="958" class="boxTitle">1. POS UI</text><text x="82" y="984" class="small">app.js posts items,</text><text x="82" y="1003" class="small">customer, mode, status, coupon</text>
  <rect x="355" y="925" width="220" height="120" class="box route"/><text x="377" y="958" class="boxTitle">2. orders.js route</text><text x="377" y="984" class="small">Loads db and resolves</text><text x="377" y="1003" class="small">products and integer quantities</text>
  <rect x="650" y="925" width="270" height="120" class="box lib"/><text x="672" y="958" class="boxTitle">3. Validate &amp; calculate</text><text x="672" y="984" class="small">inventory.check · coupons.validate</text><text x="672" y="1003" class="small">pricing.computeTotals · tax.js</text>
  <rect x="995" y="925" width="270" height="120" class="box lib"/><text x="1017" y="958" class="boxTitle">4. Commit domain changes</text><text x="1017" y="984" class="small">Khata: ledger.chargeOrderToKhata</text><text x="1017" y="1003" class="small">inventory.reserve · orders.add</text>
  <rect x="1340" y="925" width="240" height="120" class="box data"/><text x="1362" y="958" class="boxTitle">5. Persist</text><text x="1362" y="984" class="small">appendAudit</text><text x="1362" y="1003" class="small">store.write(db.json)</text>
  <path d="M280 985 H345" class="flow"/><path d="M575 985 H640" class="flow"/><path d="M920 985 H985" class="flow"/><path d="M1265 985 H1330" class="flow"/>
  <text x="294" y="973" class="flowLabel">POST</text><text x="589" y="973" class="flowLabel">check</text><text x="933" y="973" class="flowLabel">mutate</text><text x="1279" y="973" class="flowLabel">write</text>
  <path d="M1460 1045 V1110 H170 C120 1110 120 1060 120 1055" class="flow"/>
  <text x="700" y="1100" class="flowLabel">201 Created order response; UI refreshes products, dashboard, and customer data</text>

  <rect x="60" y="1170" width="1680" height="90" fill="#fff" stroke="#cbd5e1" stroke-width="1" rx="10"/>
  <circle cx="95" cy="1202" r="8" fill="#06b6d4"/><text x="112" y="1207" class="legend">Browser UI</text>
  <circle cx="280" cy="1202" r="8" fill="#8b5cf6"/><text x="297" y="1207" class="legend">App/config</text>
  <circle cx="455" cy="1202" r="8" fill="#3b82f6"/><text x="472" y="1207" class="legend">Router</text>
  <circle cx="590" cy="1202" r="8" fill="#22c55e"/><text x="607" y="1207" class="legend">lib/ module</text>
  <circle cx="750" cy="1202" r="8" fill="#f97316"/><text x="767" y="1207" class="legend">Persistent JSON data</text>
  <line x1="1000" y1="1202" x2="1045" y2="1202" stroke="#dc2626" stroke-width="4" marker-end="url(#flowArrow)"/><text x="1060" y="1207" class="legend">Order placement flow</text>
  <text x="85" y="1242" class="small">Invoice path: server.js reads db.json through store.js, gets the order through lib/orders.js, and renders it with lib/invoice.js.</text>
</svg>
