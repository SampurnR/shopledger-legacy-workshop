<!-- Order sequence strip -->
<rect x="40" y="788" width="1520" height="250" rx="18" fill="#f5faf9" stroke="#d4e9e4" stroke-width="1.5"/>
<text x="64" y="824" class="section" fill="#147d72">ORDER PLACEMENT · REQUEST AND PERSISTENCE</text>
<rect x="64" y="850" width="245" height="135" rx="13" class="flowbox"/>
<circle cx="91" cy="879" r="15" class="num"/><text x="86" y="884" font-size="13" font-weight="700" fill="#fff">1</text><text x="117" y="884" class="name">Browser</text><text x="84" y="914" class="small">Builds selected items</text><text x="84" y="937" class="small">and billing payload</text><text x="84" y="963" class="tiny">public/js/app.js</text>
<rect x="347" y="850" width="245" height="135" rx="13" class="flowbox"/>
<circle cx="374" cy="879" r="15" class="num"/><text x="369" y="884" font-size="13" font-weight="700" fill="#fff">2</text><text x="400" y="884" class="name">routes/orders.js</text><text x="367" y="914" class="small">Resolve product IDs; check</text><text x="367" y="937" class="small">stock, coupon, Khata</text><text x="367" y="963" class="tiny">Rejects invalid requests</text>
<rect x="630" y="850" width="245" height="135" rx="13" class="flowbox"/>
<circle cx="657" cy="879" r="15" class="num"/><text x="652" y="884" font-size="13" font-weight="700" fill="#fff">3</text><text x="683" y="884" class="name">Compute and commit</text><text x="650" y="914" class="small">pricing + tax + coupons</text><text x="650" y="937" class="small">inventory.reserve + orders.add</text><text x="650" y="963" class="tiny">Khata charge via ledger if selected</text>
<rect x="913" y="850" width="245" height="135" rx="13" class="flowbox"/>
<circle cx="940" cy="879" r="15" class="num"/><text x="935" y="884" font-size="13" font-weight="700" fill="#fff">4</text><text x="966" y="884" class="name">Persist</text><text x="933" y="914" class="small">store.appendAudit</text><text x="933" y="937" class="small">store.write(db)</text><text x="933" y="963" class="tiny">lib/store.js → data/db.json</text>
<rect x="1196" y="850" width="340" height="135" rx="13" class="flowbox"/>
<circle cx="1223" cy="879" r="15" class="num"/><text x="1218" y="884" font-size="13" font-weight="700" fill="#fff">5</text><text x="1249" y="884" class="name">Respond</text><text x="1216" y="914" class="small">HTTP 201 with order JSON</text><text x="1216" y="937" class="small">Browser shows order ID and total;</text><text x="1216" y="960" class="small">refreshes product and dashboard data</text>
<path d="M309 918 H343" class="flow"/><path d="M592 918 H626" class="flow"/><path d="M875 918 H909" class="flow"/><path d="M1158 918 H1192" class="flow"/>
</svg>
