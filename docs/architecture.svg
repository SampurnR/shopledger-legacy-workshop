<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Architecture map of the ShopLedger browser UI, Express server, routers, library modules, configuration and JSON data store. Numbered arrows trace order placement.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#52657a"/></marker>
    <marker id="flowArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#087e8b"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172b4d;font-size:13px}
      .title{font-size:24px;font-weight:700}.subtitle{font-size:13px;fill:#52657a}
      .head{font-size:15px;font-weight:700}.small{font-size:12px;fill:#52657a}
      .box{fill:#f7f9fc;stroke:#9aabc0;stroke-width:1.5;rx:9}
      .router{fill:#eef5ff;stroke:#7195c1;stroke-width:1.4;rx:7}
      .lib{fill:#f5f7fa;stroke:#9aabc0;stroke-width:1.2;rx:7}
      .highlight{fill:#fff1dc;stroke:#db851b;stroke-width:2;rx:8}
      .line{fill:none;stroke:#52657a;stroke-width:1.7;marker-end:url(#arrow)}
      .flow{fill:none;stroke:#087e8b;stroke-width:2.4;marker-end:url(#flowArrow)}
      .dashed{stroke-dasharray:5 4}
      .num{fill:#087e8b;stroke:#fff;stroke-width:2}
      .numtext{fill:#fff;font-size:12px;font-weight:700;text-anchor:middle}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#ffffff"/>
  <text class="title" x="28" y="38">ShopLedger — application architecture</text>
  <text class="subtitle" x="28" y="60">Express POS, Khata ledger and GST invoicing · solid teal arrows show the order placement flow</text>

  <!-- Browser -->
  <rect class="box" x="28" y="100" width="220" height="150"/>
  <text class="head" x="44" y="126">Browser UI · public/</text>
  <text x="44" y="153">index.html</text><text x="44" y="176">js/app.js</text><text x="44" y="199">css/style.css</text>
  <text class="small" x="44" y="230">Catalog · cart · order register · Khata</text>

  <!-- Server -->
  <rect class="box" x="300" y="100" width="220" height="150"/>
  <text class="head" x="318" y="126">server.js · Express app</text>
  <text x="318" y="153">JSON request parsing</text><text x="318" y="176">serves public/ assets</text>
  <text x="318" y="199">mounts routers at /api</text><text x="318" y="222">GET invoice HTML route</text>

  <!-- Routers -->
  <rect class="box" x="570" y="88" width="258" height="192"/>
  <text class="head" x="588" y="114">routes/ · API routers</text>
  <rect class="router" x="588" y="128" width="222" height="30"/><text x="600" y="148">products.js</text>
  <rect class="router" x="588" y="164" width="222" height="30"/><text x="600" y="184">orders.js · POST /orders</text>
  <rect class="router" x="588" y="200" width="222" height="30"/><text x="600" y="220">customers.js</text>
  <rect class="router" x="588" y="236" width="222" height="30"/><text x="600" y="256">reports.js · pricing preview</text>

  <!-- config -->
  <rect class="box" x="890" y="100" width="270" height="150"/>
  <text class="head" x="908" y="126">config.js</text>
  <text x="908" y="153">shop details · port · admin key</text>
  <text x="908" y="176">HSN GST slabs + default rate</text>
  <text x="908" y="199">coupon definitions · inventory options</text>

  <!-- libs grid -->
  <rect class="box" x="28" y="320" width="800" height="420"/>
  <text class="head" x="48" y="348">lib/ · application logic</text>
  <rect class="lib" x="48" y="370" width="230" height="78"/><text class="head" x="62" y="394">pricing.js</text><text x="62" y="419">subtotal · computeTotals</text><text class="small" x="62" y="439">coupon after-tax value allocation</text>
  <rect class="lib" x="298" y="370" width="230" height="78"/><text class="head" x="312" y="394">tax.js</text><text x="312" y="419">getRateForItem · split CGST/SGST</text><text class="small" x="312" y="439">HSN lookup / default rate</text>
  <rect class="lib" x="548" y="370" width="230" height="78"/><text class="head" x="562" y="394">coupons.js</text><text x="562" y="419">normalize · validate · discount</text><text class="small" x="562" y="439">uses config coupon rules</text>

  <rect class="lib" x="48" y="468" width="230" height="78"/><text class="head" x="62" y="492">inventory.js</text><text x="62" y="517">find · check · reserve · release</text><text class="small" x="62" y="537">stock availability and summaries</text>
  <rect class="lib" x="298" y="468" width="230" height="78"/><text class="head" x="312" y="492">orders.js</text><text x="312" y="517">add · get · list · cancel</text><text class="small" x="312" y="537">order record lifecycle</text>
  <rect class="lib" x="548" y="468" width="230" height="78"/><text class="head" x="562" y="492">ledger.js</text><text x="562" y="517">chargeOrderToKhata · settlement</text><text class="small" x="562" y="537">customer credit balances</text>

  <rect class="lib" x="48" y="566" width="230" height="70"/><text class="head" x="62" y="590">store.js</text><text x="62" y="615">read · appendAudit · write</text>
  <rect class="lib" x="298" y="566" width="230" height="70"/><text class="head" x="312" y="590">reports.js</text><text x="312" y="615">dashboard · GST reconciliation</text>
  <rect class="highlight" x="548" y="566" width="230" height="70"/><text class="head" x="562" y="590">invoice.js</text><text x="562" y="615">computeInvoiceFigures · render</text>
  <rect class="lib" x="48" y="654" width="230" height="62"/><text class="head" x="62" y="679">dates.js</text><text x="62" y="702">today · normalizeDateKey · fiscal year</text>

  <!-- Data -->
  <rect class="box" x="890" y="330" width="270" height="144"/>
  <text class="head" x="908" y="357">data/db.json</text>
  <text x="908" y="384">products · customers · orders</text>
  <text x="908" y="407">settlements · auditLog · counters</text>
  <text class="small" x="908" y="444">read/write via lib/store.js</text>

  <!-- Order path labels -->
  <path class="flow" d="M248 174 L300 174"/><circle class="num" cx="273" cy="160" r="12"/><text class="numtext" x="273" y="164">1</text>
  <path class="flow" d="M520 174 L570 174"/><circle class="num" cx="544" cy="160" r="12"/><text class="numtext" x="544" y="164">2</text>
  <path class="flow" d="M699 194 L699 306 L163 306 L163 370"/><circle class="num" cx="681" cy="299" r="12"/><text class="numtext" x="681" y="303">3</text>
  <path class="flow" d="M278 409 L298 409"/><circle class="num" cx="288" cy="395" r="12"/><text class="numtext" x="288" y="399">4</text>
  <path class="flow" d="M528 409 L548 409"/><circle class="num" cx="538" cy="395" r="12"/><text class="numtext" x="538" y="399">5</text>
  <path class="flow" d="M163 448 L163 468"/><circle class="num" cx="180" cy="458" r="12"/><text class="numtext" x="180" y="462">6</text>
  <path class="flow" d="M413 448 L413 468"/><circle class="num" cx="430" cy="458" r="12"/><text class="numtext" x="430" y="462">7</text>
  <path class="flow" d="M663 448 L663 468"/><circle class="num" cx="680" cy="458" r="12"/><text class="numtext" x="680" y="462">8</text>
  <path class="flow" d="M413 546 L413 566"/><circle class="num" cx="430" cy="556" r="12"/><text class="numtext" x="430" y="560">9</text>
  <path class="flow" d="M278 601 C545 601 760 403 890 403"/><circle class="num" cx="800" cy="462" r="12"/><text class="numtext" x="800" y="466">10</text>

  <!-- Relationships -->
  <path class="line" d="M828 132 L890 132"/><text class="small" x="837" y="122">settings</text>
  <path class="line" d="M778 409 C840 409 840 430 890 430"/>
  <path class="line" d="M778 601 C835 601 838 455 890 455"/>
  <path class="line dashed" d="M828 252 C866 252 863 600 890 600"/>
  <rect class="highlight" x="890" y="520" width="270" height="116"/>
  <text class="head" x="908" y="547">Printable invoice</text>
  <text x="908" y="574">server.js → orders.get →</text>
  <text x="908" y="597">invoice.render(order)</text>
  <text class="small" x="908" y="620">uses config.js shop details</text>
  <path class="line" d="M520 174 C850 174 850 567 890 567"/>
  <path class="line dashed" d="M778 601 C830 601 842 592 890 592"/>
  <path class="line dashed" d="M528 409 C825 409 835 612 890 612"/>

  <!-- Legend and flow key -->
  <rect x="890" y="665" width="270" height="96" rx="8" fill="#f7f9fc" stroke="#9aabc0"/>
  <text class="head" x="908" y="689">Legend</text>
  <line x1="910" y1="710" x2="954" y2="710" class="flow"/><text x="966" y="715">Numbered order flow</text>
  <rect x="910" y="726" width="22" height="16" class="highlight"/><text x="944" y="739">Ticket focus: invoice.js</text>
  <text class="small" x="28" y="780">Order flow: browser POST → routes/orders.js → pricing/tax/coupons + inventory/ledger/orders → store.js → db.json</text>
</svg>
