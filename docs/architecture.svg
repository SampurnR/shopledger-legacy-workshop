<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="desc">Architecture diagram showing the browser UI, Express routers, library modules, configuration, JSON data store, and numbered order placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <marker id="flowArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.subtitle{font-size:14px;fill:#526176}.section{font-size:16px;font-weight:700;letter-spacing:.7px;fill:#40516a}.label{font-size:16px;font-weight:650}.small{font-size:13px;fill:#526176}.tiny{font-size:12px;fill:#526176}.box{stroke-width:1.5;rx:14}.ui{fill:#e8f3ff;stroke:#83baf3}.router{fill:#f0eaff;stroke:#b9a2ed}.lib{fill:#e8f7ef;stroke:#84c49b}.data{fill:#fff5dd;stroke:#e4bb62}.cfg{fill:#fff0ed;stroke:#eaa59a}.subbox{fill:#fff;stroke:#cbd5e1;stroke-width:1.2;rx:9}.arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.flow{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#flowArrow)}.flowlabel{font-size:12px;font-weight:700;fill:#1d4ed8}.pill{fill:#dbeafe;stroke:#93c5fd;rx:11}
    </style>
  </defs>
  <rect width="1600" height="1100" fill="#f8fafc"/>
  <text x="56" y="55" class="title">ShopLedger · App architecture</text>
  <text x="56" y="81" class="subtitle">Express app · browser POS · JSON file persistence · order placement path highlighted in blue</text>

  <!-- Browser UI -->
  <rect x="48" y="120" width="270" height="895" class="box ui"/>
  <text x="72" y="156" class="section">BROWSER UI</text>
  <rect x="72" y="178" width="222" height="72" class="subbox"/>
  <text x="90" y="207" class="label">public/index.html</text><text x="90" y="229" class="small">Page structure</text>
  <rect x="72" y="264" width="222" height="98" class="subbox"/>
  <text x="90" y="293" class="label">public/js/app.js</text><text x="90" y="316" class="small">Catalog · cart · preview</text><text x="90" y="338" class="small">Orders · Khata · reports</text>
  <rect x="72" y="376" width="222" height="72" class="subbox"/>
  <text x="90" y="405" class="label">public/css/style.css</text><text x="90" y="427" class="small">Presentation</text>
  <rect x="72" y="480" width="222" height="395" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5" rx="14"/>
  <text x="91" y="514" class="section" fill="#1d4ed8">ORDER PLACEMENT</text>
  <g>
    <circle cx="96" cy="550" r="13" fill="#2563eb"/><text x="92" y="555" font-size="13" font-weight="700" fill="#fff">1</text><text x="119" y="555" class="small">Choose products and quantities</text>
    <circle cx="96" cy="590" r="13" fill="#2563eb"/><text x="92" y="595" font-size="13" font-weight="700" fill="#fff">2</text><text x="119" y="595" class="small">Preview price and coupon</text>
    <circle cx="96" cy="630" r="13" fill="#2563eb"/><text x="92" y="635" font-size="13" font-weight="700" fill="#fff">3</text><text x="119" y="635" class="small">POST /api/orders</text>
    <circle cx="96" cy="670" r="13" fill="#2563eb"/><text x="92" y="675" font-size="13" font-weight="700" fill="#fff">4</text><text x="119" y="675" class="small">Resolve items and check stock</text>
    <circle cx="96" cy="710" r="13" fill="#2563eb"/><text x="92" y="715" font-size="13" font-weight="700" fill="#fff">5</text><text x="119" y="715" class="small">Calculate discount and GST</text>
    <circle cx="96" cy="750" r="13" fill="#2563eb"/><text x="92" y="755" font-size="13" font-weight="700" fill="#fff">6</text><text x="119" y="755" class="small">Khata debit when selected</text>
    <circle cx="96" cy="790" r="13" fill="#2563eb"/><text x="92" y="795" font-size="13" font-weight="700" fill="#fff">7</text><text x="119" y="795" class="small">Save order, stock, audit log</text>
    <circle cx="96" cy="830" r="13" fill="#2563eb"/><text x="92" y="835" font-size="13" font-weight="700" fill="#fff">8</text><text x="119" y="835" class="small">Return order; refresh UI</text>
  </g>
  <text x="72" y="922" class="small">Invoice link → /orders/:id/invoice</text>
  <text x="72" y="946" class="small">Printable HTML rendered by lib/invoice.js</text>
  <text x="72" y="984" class="tiny">Served as static files by server.js</text>

  <!-- Express and routers -->
  <rect x="356" y="120" width="282" height="895" class="box router"/>
  <text x="380" y="156" class="section">EXPRESS · server.js</text>
  <text x="380" y="180" class="small">JSON body parser · static UI</text>
  <rect x="380" y="210" width="234" height="660" fill="#f7f3ff" stroke="#c4b5fd" stroke-width="1.3" rx="12"/>
  <text x="399" y="243" class="section">routes/</text>
  <rect x="399" y="263" width="196" height="102" class="subbox"/><text x="416" y="292" class="label">products.js</text><text x="416" y="316" class="small">GET products, coupons</text>
  <rect x="399" y="382" width="196" height="142" fill="#dbeafe" stroke="#60a5fa" stroke-width="2" rx="10"/><text x="416" y="411" class="label">orders.js</text><text x="416" y="435" class="small">GET/list orders</text><text x="416" y="457" class="small">POST create / cancel</text><text x="416" y="489" class="flowlabel">ORDER FLOW ENTRY</text>
  <rect x="399" y="541" width="196" height="102" class="subbox"/><text x="416" y="570" class="label">customers.js</text><text x="416" y="594" class="small">Customers, settlements</text>
  <rect x="399" y="660" width="196" height="150" class="subbox"/><text x="416" y="689" class="label">reports.js</text><text x="416" y="713" class="small">Dashboard, GST report</text><text x="416" y="735" class="small">Pricing preview</text><text x="416" y="757" class="small">Admin export</text>
  <text x="380" y="914" class="small">GET /orders/:id/invoice</text><text x="380" y="937" class="small">handled in server.js</text>

  <!-- Libraries -->
  <rect x="676" y="120" width="578" height="895" class="box lib"/>
  <text x="700" y="156" class="section">BUSINESS LOGIC · lib/</text>
  <rect x="702" y="190" width="250" height="125" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.8" rx="12"/>
  <text x="722" y="220" class="label">orders.js</text><text x="722" y="245" class="small">Create · fetch · cancel · list</text><text x="722" y="271" class="flowlabel">ORDER FLOW</text>
  <rect x="978" y="190" width="245" height="125" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.8" rx="12"/>
  <text x="998" y="220" class="label">inventory.js</text><text x="998" y="245" class="small">Find · sellable · check</text><text x="998" y="269" class="small">Reserve / release / summary</text>
  <rect x="702" y="340" width="250" height="125" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.8" rx="12"/>
  <text x="722" y="370" class="label">pricing.js</text><text x="722" y="395" class="small">Subtotal · coupon discount</text><text x="722" y="419" class="small">Post-discount item GST totals</text>
  <rect x="978" y="340" width="245" height="125" class="subbox"/><text x="998" y="370" class="label">tax.js</text><text x="998" y="395" class="small">HSN rate · CGST / SGST split</text>
  <rect x="702" y="490" width="250" height="125" class="subbox"/><text x="722" y="520" class="label">coupons.js</text><text x="722" y="545" class="small">Normalize · validate · calculate</text>
  <rect x="978" y="490" width="245" height="125" class="subbox"/><text x="998" y="520" class="label">ledger.js</text><text x="998" y="545" class="small">Customers · Khata · settlements</text>
  <rect x="702" y="640" width="250" height="125" class="subbox"/><text x="722" y="670" class="label">store.js</text><text x="722" y="695" class="small">Read / write JSON · audit log</text>
  <rect x="978" y="640" width="245" height="125" class="subbox"/><text x="998" y="670" class="label">reports.js</text><text x="998" y="695" class="small">Dashboard · GST reconciliation</text>
  <rect x="702" y="790" width="250" height="125" class="subbox"/><text x="722" y="820" class="label">invoice.js</text><text x="722" y="845" class="small">Compute and render HTML invoice</text>
  <rect x="978" y="790" width="245" height="125" class="subbox"/><text x="998" y="820" class="label">dates.js</text><text x="998" y="845" class="small">Today · date normalization · FY</text>
  <text x="702" y="956" class="tiny">Arrows show primary request/data dependencies; blue arrows show order creation and persistence.</text>

  <!-- Config and persistent data -->
  <rect x="1292" y="120" width="260" height="330" class="box cfg"/>
  <text x="1316" y="156" class="section">CONFIGURATION</text>
  <rect x="1316" y="182" width="212" height="220" class="subbox"/><text x="1334" y="214" class="label">config.js</text><text x="1334" y="244" class="small">Port · shop details</text><text x="1334" y="270" class="small">Admin key</text><text x="1334" y="296" class="small">GST fallback and HSN slabs</text><text x="1334" y="322" class="small">Inventory defaults</text><text x="1334" y="348" class="small">Coupon definitions</text>
  <rect x="1292" y="510" width="260" height="340" class="box data"/>
  <text x="1316" y="546" class="section">PERSISTENT DATA</text>
  <rect x="1316" y="573" width="212" height="235" class="subbox"/><text x="1334" y="605" class="label">data/db.json</text><text x="1334" y="638" class="small">products</text><text x="1334" y="664" class="small">orders</text><text x="1334" y="690" class="small">customers</text><text x="1334" y="716" class="small">settlements</text><text x="1334" y="742" class="small">auditLog · next IDs</text>
  <text x="1316" y="895" class="tiny">Whole file read and rewritten</text><text x="1316" y="915" class="tiny">by lib/store.js</text>

  <!-- General module dependencies -->
  <path d="M318 300H356" class="arrow"/><text x="321" y="289" class="tiny">HTTP / static</text>
  <path d="M638 316H676" class="arrow"/><path d="M638 453H676" class="flow"/><path d="M638 592H676" class="arrow"/><path d="M638 731H676" class="arrow"/>
  <path d="M952 402H978" class="arrow"/><path d="M827 465V490" class="arrow"/>
  <path d="M952 552H978" class="arrow"/>
  <path d="M1100 615V640" class="arrow"/><path d="M827 765V790" class="arrow"/>
  <path d="M1223 255H1292" class="arrow"/><text x="1230" y="244" class="tiny">settings</text>
  <path d="M952 702H1292" class="flow"/><text x="1090" y="690" class="flowlabel">read / write</text>
  <path d="M1223 702H1292" class="arrow"/>
  <path d="M1223 852H1292" class="arrow"/>
  <!-- Order flow numbered route/module/data links -->
  <path d="M294 630H399" class="flow"/><text x="321" y="618" class="flowlabel">3 POST</text>
  <path d="M595 445H702" class="flow"/><text x="603" y="434" class="flowlabel">4–6</text>
  <path d="M952 251H978" class="flow"/><text x="954" y="240" class="flowlabel">4 stock</text>
  <path d="M827 315V340" class="flow"/><text x="835" y="333" class="flowlabel">5 totals</text>
  <path d="M952 402H978" class="flow"/><text x="954" y="392" class="flowlabel">GST</text>
  <path d="M1100 465V490" class="flow"/><text x="1108" y="483" class="flowlabel">6 Khata</text>
  <path d="M702 251H660V702H702" class="flow"/><text x="664" y="576" class="flowlabel">7 save</text>
  <path d="M952 702H1292" class="flow"/><text x="1092" y="719" class="flowlabel">8 persist order + stock + audit</text>
  <path d="M399 453H318" class="flow"/><text x="320" y="475" class="flowlabel">8 response</text>

  <!-- Legend -->
  <line x1="62" y1="1060" x2="102" y2="1060" class="flow"/><text x="112" y="1065" class="small">Order placement path</text>
  <line x1="300" y1="1060" x2="340" y2="1060" class="arrow"/><text x="350" y="1065" class="small">Other module dependency / data access</text>
  <rect x="700" y="1048" width="18" height="18" class="ui"/><text x="727" y="1065" class="small">UI</text><rect x="780" y="1048" width="18" height="18" class="router"/><text x="807" y="1065" class="small">Routes</text><rect x="885" y="1048" width="18" height="18" class="lib"/><text x="912" y="1065" class="small">lib</text><rect x="970" y="1048" width="18" height="18" class="cfg"/><text x="997" y="1065" class="small">Config</text><rect x="1080" y="1048" width="18" height="18" class="data"/><text x="1107" y="1065" class="small">Data</text>
</svg>
