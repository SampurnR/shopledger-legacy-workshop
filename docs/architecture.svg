<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">ShopLedger architecture and order placement</title>
<desc id="desc">Verified source modules, router dependencies, eight order placement steps, and inventory cancellation behavior. Orange highlights inventory.js and only cancel in orders.js.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;font-size:12px;fill:#243449}.heading{font-size:24px;font-weight:bold}.label{font-size:15px;font-weight:bold}.small{font-size:12px}.edge{fill:none;stroke:#64748b;stroke-width:1.5;marker-end:url(#arrow)}.box{fill:#fff;stroke:#cbd5e1}.ticket{fill:#fff2df;stroke:#c66a0a}</style><rect width="1200" height="800" fill="#f3f6fa"/>
<text x="24" y="32" class="heading">ShopLedger architecture</text>
<text x="24" y="53" class="small">Source-verified module map • numbered order flow below • router dependencies listed inside each box</text>
