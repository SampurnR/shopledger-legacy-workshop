<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">ShopLedger architecture and order flow</title><desc id="desc">The browser calls the Express server and its routes. The order path checks inventory, uses shared pricing with tax and coupons, saves orders and ledger entries to the JSON store. Invoice rendering also uses shared pricing.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b6b50"/></marker><style>text{font-family:Arial,sans-serif;fill:#12352c}.box{fill:#f0f8f4;stroke:#14835f;stroke-width:2;rx:12}.head{font-size:22px;font-weight:bold}.small{font-size:16px}.line{stroke:#0b6b50;stroke-width:2;marker-end:url(#arrow);fill:none}.band{fill:#f9fbfa;stroke:#afc9bd;stroke-width:2;rx:18}</style></defs>
<rect width="1440" height="900" fill="#fff"/><text x="720" y="48" text-anchor="middle" class="head">ShopLedger architecture and order flow</text>
<rect class="box" x="55" y="105" width="265" height="112"/><text x="187" y="144" text-anchor="middle" class="head">Browser UI</text><text x="187" y="180" text-anchor="middle" class="small">public HTML / CSS / JavaScript</text>
<rect class="box" x="390" y="105" width="250" height="112"/><text x="515" y="148" text-anchor="middle" class="head">Express server</text><text x="515" y="183" text-anchor="middle" class="small">server.js</text>
<rect class="band" x="710" y="82" width="670" height="158"/><text x="1045" y="112" text-anchor="middle" class="head">HTTP routes</text><text x="755" y="157" class="small">orders</text><text x="905" y="157" class="small">products</text><text x="1055" y="157" class="small">customers</text><text x="1210" y="157" class="small">reports</text><text x="1045" y="205" text-anchor="middle" class="small">Each router is in routes/ and is mounted by server.js</text>
<path class="line" d="M320 161 L380 161"/><path class="line" d="M640 161 L700 161"/>
<text x="720" y="305" class="head">Order placement</text>
<rect class="box" x="55" y="350" width="205" height="112"/><text x="157" y="390" text-anchor="middle" class="head">Order route</text><text x="157" y="427" text-anchor="middle" class="small">routes/orders.js</text>
<rect class="box" x="300" y="350" width="205" height="112"/><text x="402" y="390" text-anchor="middle" class="head">Inventory</text><text x="402" y="427" text-anchor="middle" class="small">check / reserve stock</text>
<rect class="box" x="545" y="350" width="255" height="112"/><text x="672" y="390" text-anchor="middle" class="head">Shared pricing</text><text x="672" y="427" text-anchor="middle" class="small">lib/pricing.js</text>
<rect class="box" x="840" y="350" width="230" height="112"/><text x="955" y="390" text-anchor="middle" class="head">Order + ledger</text><text x="955" y="427" text-anchor="middle" class="small">orders / Khata</text>
<rect class="box" x="1110" y="350" width="200" height="112"/><text x="1210" y="390" text-anchor="middle" class="head">JSON store</text><text x="1210" y="427" text-anchor="middle" class="small">lib/store.js</text>
<path class="line" d="M260 406 L290 406"/><path class="line" d="M505 406 L535 406"/><path class="line" d="M800 406 L830 406"/><path class="line" d="M1070 406 L1100 406"/>
<rect class="box" x="545" y="505" width="255" height="92"/><text x="672" y="540" text-anchor="middle" class="head">Coupons + tax</text><text x="672" y="572" text-anchor="middle" class="small">lib/coupons.js / lib/tax.js</text>
<rect class="box" x="1110" y="505" width="200" height="92"/><text x="1210" y="540" text-anchor="middle" class="head">config.js</text><text x="1210" y="572" text-anchor="middle" class="small">HSN slabs / coupons</text>
<rect class="box" x="1110" y="650" width="200" height="92"/><text x="1210" y="685" text-anchor="middle" class="head">data/db.json</text><text x="1210" y="717" text-anchor="middle" class="small">products / orders / customers</text>
<path class="line" d="M672 462 L672 495"/><path class="line" d="M1110 550 L810 550"/><path class="line" d="M1210 462 L1210 640"/>
<rect class="band" x="55" y="650" width="970" height="150"/><text x="540" y="687" text-anchor="middle" class="head">Invoice rendering path</text>
<text x="100" y="737" class="small">GET /orders/:id/invoice in server.js</text><path class="line" d="M350 732 L440 732"/><rect class="box" x="450" y="704" width="220" height="65"/><text x="560" y="744" text-anchor="middle" class="small">lib/invoice.js</text><path class="line" d="M670 732 L760 732"/><text x="780" y="738" class="small">reuses lib/pricing.js</text>
<text x="720" y="850" text-anchor="middle" class="head">The same pricing rules drive checkout and the printed invoice.</text>
</svg>
