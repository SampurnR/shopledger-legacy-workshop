<rect x="800" y="315" width="372" height="116" rx="10" fill="#FFFFFF" stroke="#D0DDE6"/>
<text x="816" y="341" class="card-title" text-anchor="start">Reports and storage</text>
<text x="816" y="364" class="mono" text-anchor="start">lib/reports.js</text>
