<text x="965" y="706" class="body" text-anchor="start">Reverse Khata if applicable</text>
<text x="965" y="723" class="body" text-anchor="start">Write order and audit entry</text>
<text x="965" y="740" class="body" text-anchor="start">Return cancelled order</text>
