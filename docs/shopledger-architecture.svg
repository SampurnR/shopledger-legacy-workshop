<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1250" viewBox="0 0 1800 1250" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Architecture of the ShopLedger browser UI, Express server and routes, library modules, configuration, JSON data store, and the order placement flow.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#15966b"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172b3a} .title{font-size:34px;font-weight:750;letter-spacing:-.5px}.subtitle{font-size:15px;fill:#5d7180}
      .section{font-size:14px;font-weight:800;letter-spacing:1.3px;fill:#466071}.heading{font-size:20px;font-weight:700}.body{font-size:14px;fill:#465c6b}.small{font-size:12px;fill:#5d7180}.tiny{font-size:11px;fill:#64748b}
      .card{fill:#fff;stroke:#cbd8df;stroke-width:1.5}.soft{fill:#f3f7f9;stroke:#cfdae0;stroke-width:1.3}.blue{fill:#eff6ff;stroke:#93c5fd;stroke-width:1.5}.green{fill:#ecfdf5;stroke:#86d6b1;stroke-width:1.5}.amber{fill:#fff8e8;stroke:#f2ca73;stroke-width:1.5}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
      .lineBlue{fill:none;stroke:#2563eb;stroke-width:2.5;marker-end:url(#arrowBlue)}.lineGreen{fill:none;stroke:#15966b;stroke-width:2.5;marker-end:url(#arrowGreen)}
      .step{fill:#fff;stroke:#b9cad2;stroke-width:1.5}.stepNum{fill:#176b89}.stepText{font-size:13px;fill:#465c6b}.stepTitle{font-size:15px;font-weight:750}
    </style>
  </defs>
  <rect width="1800" height="1250" fill="#f7fafb"/>

  <text x="54" y="61" class="title">ShopLedger · Application Architecture</text>
  <text x="54" y="88" class="subtitle">Current repository wiring · Browser POS, Express routes, business logic, local JSON persistence</text>

  <!-- Main architecture areas -->
  <text x="54" y="133" class="section">BROWSER</text>
  <text x="418" y="133" class="section">HTTP SERVER</text>
  <text x="804" y="133" class="section">ROUTES</text>
  <text x="1123" y="133" class="section">LIBRARY MODULES</text>
  <text x="1580" y="133" class="section">SETTINGS &amp; DATA</text>

  <!-- UI -->
  <rect x="54" y="154" width="300" height="360" rx="16" class="blue"/>
  <text x="78" y="190" class="heading">ShopLedger UI</text>
  <text x="78" y="218" class="body">public/index.html</text>
  <text x="78" y="241" class="body">public/js/app.js</text>
  <text x="78" y="264" class="body">public/css/style.css</text>
  <line x1="78" y1="282" x2="330" y2="282" stroke="#c6d9ed"/>
  <text x="78" y="308" class="small" font-weight="700">Screens</text>
  <text x="90" y="332" class="body">• New order / POS</text>
  <text x="90" y="356" class="body">• Order history &amp; cancellation</text>
  <text x="90" y="380" class="body">• Customer khata &amp; settlements</text>
  <text x="90" y="404" class="body">• Inventory &amp; GST audit</text>
  <rect x="78" y="431" width="252" height="57" rx="9" fill="#dbeafe" stroke="#a9c8ee"/>
  <text x="93" y="454" class="small" font-weight="700">Order action</text>
  <text x="93" y="475" class="small">POST /api/orders · JSON</text>

  <!-- Server -->
  <rect x="418" y="154" width="300" height="152" rx="16" class="card"/>
  <text x="442" y="190" class="heading">Express app</text>
  <text x="442" y="219" class="body">server.js</text>
  <text x="442" y="244" class="small">Serves public/ static files</text>
  <text x="442" y="265" class="small">Mounts routers under /api</text>
  <text x="442" y="286" class="small">Invoice: /orders/:id/invoice</text>

  <rect x="418" y="332" width="300" height="182" rx="16" class="soft"/>
  <text x="442" y="368" class="heading">Request / response</text>
  <text x="442" y="397" class="body">Browser sends HTTP requests</text>
  <text x="442" y="422" class="body">API returns JSON responses</text>
  <text x="442" y="459" class="small">Configured port: config.port</text>
  <text x="442" y="482" class="small">Default: 3000</text>

  <!-- Routes -->
  <rect x="804" y="154" width="276" height="83" rx="12" class="card"/>
  <text x="826" y="184" class="heading">products.js</text>
  <text x="826" y="208" class="small">GET products, coupons</text>
  <rect x="804" y="250" width="276" height="107" rx="12" class="amber"/>
  <text x="826" y="280" class="heading">orders.js</text>
  <text x="826" y="304" class="small">List / read / create / cancel</text>
  <text x="826" y="327" class="small">POST /orders · GET /orders</text>
  <rect x="804" y="370" width="276" height="83" rx="12" class="card"/>
  <text x="826" y="400" class="heading">customers.js</text>
  <text x="826" y="424" class="small">Customer list &amp; settlement</text>
  <rect x="804" y="466" width="276" height="107" rx="12" class="card"/>
  <text x="826" y="496" class="heading">reports.js</text>
  <text x="826" y="520" class="small">Dashboard, GST recon, preview</text>
  <text x="826" y="543" class="small">Admin data export</text>

  <!-- Libraries -->
  <rect x="1123" y="154" width="420" height="419" rx="16" class="card"/>
  <text x="1146" y="184" class="small" font-weight="700">lib/ · business logic and helpers</text>
  <rect x="1146" y="204" width="178" height="62" rx="9" class="soft"/>
  <text x="1160" y="230" class="body" font-weight="700">orders.js</text><text x="1160" y="250" class="tiny">add, get, list, cancel</text>
  <rect x="1340" y="204" width="178" height="62" rx="9" class="soft"/>
  <text x="1354" y="230" class="body" font-weight="700">inventory.js</text><text x="1354" y="250" class="tiny">stock checks &amp; updates</text>
  <rect x="1146" y="278" width="178" height="62" rx="9" class="soft"/>
  <text x="1160" y="304" class="body" font-weight="700">pricing.js</text><text x="1160" y="324" class="tiny">totals &amp; line breakdowns</text>
  <rect x="1340" y="278" width="178" height="62" rx="9" class="soft"/>
  <text x="1354" y="304" class="body" font-weight="700">coupons.js</text><text x="1354" y="324" class="tiny">validation &amp; discounts</text>
  <rect x="1146" y="352" width="178" height="62" rx="9" class="soft"/>
  <text x="1160" y="378" class="body" font-weight="700">tax.js</text><text x="1160" y="398" class="tiny">HSN GST rates &amp; split</text>
  <rect x="1340" y="352" width="178" height="62" rx="9" class="soft"/>
  <text x="1354" y="378" class="body" font-weight="700">ledger.js</text><text x="1354" y="398" class="tiny">khata &amp; settlements</text>
  <rect x="1146" y="426" width="178" height="62" rx="9" class="soft"/>
  <text x="1160" y="452" class="body" font-weight="700">reports.js</text><text x="1160" y="472" class="tiny">dashboard &amp; reconciliation</text>
  <rect x="1340" y="426" width="178" height="62" rx="9" class="soft"/>
  <text x="1354" y="452" class="body" font-weight="700">invoice.js</text><text x="1354" y="472" class="tiny">figures &amp; printable HTML</text>
  <rect x="1146" y="500" width="178" height="52" rx="9" class="soft"/>
  <text x="1160" y="532" class="body" font-weight="700">store.js</text>
  <rect x="1340" y="500" width="178" height="52" rx="9" class="soft"/>
  <text x="1354" y="532" class="body" font-weight="700">dates.js</text>

  <!-- Settings and data -->
  <rect x="1580" y="154" width="174" height="184" rx="14" class="amber"/>
  <text x="1600" y="188" class="heading">config.js</text>
  <text x="1600" y="217" class="small">Port &amp; admin key</text>
  <text x="1600" y="240" class="small">Shop details</text>
  <text x="1600" y="263" class="small">HSN / GST rates</text>
  <text x="1600" y="286" class="small">Coupons &amp; inventory</text>
  <rect x="1580" y="365" width="174" height="208" rx="14" class="green"/>
  <text x="1600" y="400" class="heading">data/db.json</text>
  <text x="1600" y="430" class="small">Products</text>
  <text x="1600" y="453" class="small">Customers</text>
  <text x="1600" y="476" class="small">Orders</text>
  <text x="1600" y="499" class="small">Settlements</text>
  <text x="1600" y="522" class="small">Audit log</text>

  <!-- Main architecture connectors -->
  <path d="M354 335 H390 V230 H418" class="lineBlue"/>
  <text x="358" y="321" class="tiny">UI / HTTP</text>
  <path d="M718 230 H760 V196 H804" class="line"/>
  <path d="M760 230 V303 H804" class="line"/>
  <path d="M760 303 V412 H804" class="line"/>
  <path d="M760 412 V519 H804" class="line"/>
  <text x="726" y="215" class="tiny">mounts</text>
  <path d="M1080 196 H1100 V234 H1123" class="line"/>
  <path d="M1080 303 H1100 V308 H1123" class="lineBlue"/>
  <path d="M1080 412 H1100 V383 H1123" class="line"/>
  <path d="M1080 519 H1100 V461 H1123" class="line"/>
  <path d="M1543 258 H1561 V255 H1580" class="line"/>
  <text x="1547" y="244" class="tiny">reads</text>
  <path d="M1543 526 H1561 V470 H1580" class="lineGreen"/>
  <text x="1544" y="515" class="tiny">read / write</text>

  <!-- Order placement flow -->
  <rect x="54" y="619" width="1700" height="575" rx="18" fill="#eef4f6" stroke="#c6d4db" stroke-width="1.5"/>
  <text x="82" y="661" class="section">ORDER PLACEMENT FLOW</text>
  <text x="82" y="690" class="subtitle">The browser preview is separate; this is the POST /api/orders commit path.</text>

  <!-- First row steps -->
  <rect x="82" y="726" width="292" height="148" rx="14" class="step"/>
  <circle cx="111" cy="758" r="17" class="stepNum"/><text x="106" y="763" fill="#fff" font-size="14" font-weight="800">1</text>
  <text x="139" y="763" class="stepTitle">POS submits cart</text>
  <text x="104" y="798" class="stepText">app.js sends item IDs, quantities,</text><text x="104" y="820" class="stepText">customer, payment mode, status,</text><text x="104" y="842" class="stepText">and coupon as JSON.</text>

  <rect x="421" y="726" width="292" height="148" rx="14" class="step"/>
  <circle cx="450" cy="758" r="17" class="stepNum"/><text x="445" y="763" fill="#fff" font-size="14" font-weight="800">2</text>
  <text x="478" y="763" class="stepTitle">Route validates</text>
  <text x="443" y="798" class="stepText">orders.js resolves products from</text><text x="443" y="820" class="stepText">db.json, checks quantities/stock,</text><text x="443" y="842" class="stepText">and validates the coupon.</text>

  <rect x="760" y="726" width="292" height="148" rx="14" class="step"/>
  <circle cx="789" cy="758" r="17" class="stepNum"/><text x="784" y="763" fill="#fff" font-size="14" font-weight="800">3</text>
  <text x="817" y="763" class="stepTitle">Totals are calculated</text>
  <text x="782" y="798" class="stepText">pricing.js applies coupons.js;</text><text x="782" y="820" class="stepText">tax.js resolves GST by HSN and</text><text x="782" y="842" class="stepText">computes the final order amount.</text>

  <rect x="1099" y="726" width="292" height="148" rx="14" class="step"/>
  <circle cx="1128" cy="758" r="17" class="stepNum"/><text x="1123" y="763" fill="#fff" font-size="14" font-weight="800">4</text>
  <text x="1156" y="763" class="stepTitle">Credit &amp; stock update</text>
  <text x="1121" y="798" class="stepText">For khata, ledger.js checks limit</text><text x="1121" y="820" class="stepText">and bills the customer. inventory.js</text><text x="1121" y="842" class="stepText">deducts the ordered quantities.</text>

  <rect x="1438" y="726" width="288" height="148" rx="14" class="step"/>
  <circle cx="1467" cy="758" r="17" class="stepNum"/><text x="1462" y="763" fill="#fff" font-size="14" font-weight="800">5</text>
  <text x="1495" y="763" class="stepTitle">Save and respond</text>
  <text x="1460" y="798" class="stepText">orders.js adds the order;</text><text x="1460" y="820" class="stepText">store.js logs and writes db.json.</text><text x="1460" y="842" class="stepText">Route returns HTTP 201 + order JSON.</text>

  <path d="M374 800 H417" class="lineBlue"/>
  <path d="M713 800 H756" class="lineBlue"/>
  <path d="M1052 800 H1095" class="lineBlue"/>
  <path d="M1391 800 H1434" class="lineBlue"/>

  <rect x="82" y="924" width="1644" height="216" rx="14" fill="#fff" stroke="#cbd8df" stroke-width="1.3"/>
  <text x="108" y="963" class="heading">Related code paths</text>
  <text x="108" y="999" class="body"><tspan font-weight="700">Preview before commit:</tspan> POST /api/pricing/preview → routes/reports.js → products from db.json → pricing.js / coupons.js / tax.js → preview JSON.</text>
  <text x="108" y="1035" class="body"><tspan font-weight="700">After successful order:</tspan> browser clears cart and reloads products, dashboard, and customer data; invoice opens at /orders/:id/invoice.</text>
  <text x="108" y="1071" class="body"><tspan font-weight="700">Persistence:</tspan> lib/store.js synchronously reads and writes data/db.json; there is no separate database service in this repository.</text>
  <text x="108" y="1110" class="small">Source labels match files and routes present in this repository.</text>
</svg>
