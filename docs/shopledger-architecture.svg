<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
<title id="title">ShopLedger application architecture</title>
<desc id="desc">Architecture map of the ShopLedger UI, Express server, four route modules, ten library modules, configuration, JSON data store, and order placement flow.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526579"/></marker>
  <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#07835e"/></marker>
  <style>
    text{font-family:Segoe UI,Arial,sans-serif;fill:#152536}.title{font-size:34px;font-weight:700}.sub{font-size:16px;fill:#506274}.head{font-size:19px;font-weight:700}.node{font-size:17px;font-weight:650}.small{font-size:14px;fill:#405469}.tiny{font-size:13px;fill:#526579}.step{font-size:16px;font-weight:650}.box{fill:#fff;stroke:#cbd7e2;stroke-width:2}.group{fill:#f3f7fa;stroke:#cad6e1;stroke-width:2}.ui{fill:#e7f1ff;stroke:#4b82c3;stroke-width:2}.server{fill:#eaf6f1;stroke:#07835e;stroke-width:2}.router{fill:#fff;stroke:#7d8da0;stroke-width:2}.lib{fill:#fff;stroke:#8aa0b5;stroke-width:1.6}.data{fill:#fff3d8;stroke:#bc8d26;stroke-width:2}.config{fill:#f4ebff;stroke:#9065b5;stroke-width:2}.line{fill:none;stroke:#526579;stroke-width:2.2;marker-end:url(#arrow)}.flow{fill:none;stroke:#07835e;stroke-width:3;marker-end:url(#greenArrow)}
  </style>
</defs>
<rect width="1600" height="1120" fill="#f7fafc"/>
<text x="48" y="58" class="title">ShopLedger · application architecture</text>
<text x="48" y="88" class="sub">Express app · browser UI · JSON file persistence · order placement path</text>

<!-- Runtime architecture -->
<rect x="48" y="116" width="1504" height="434" rx="16" class="group"/>
<text x="72" y="151" class="head">Application modules</text>
<rect x="78" y="180" width="240" height="106" rx="12" class="ui"/>
<text x="98" y="211" class="node">Browser UI</text><text x="98" y="238" class="small">public/index.html</text><text x="98" y="260" class="small">public/js/app.js · style.css</text>
<rect x="385" y="180" width="250" height="106" rx="12" class="server"/>
<text x="408" y="211" class="node">Express application</text><text x="408" y="238" class="small">server.js</text><text x="408" y="260" class="small">serves UI · mounts /api</text>
<path d="M318 233H382" class="line"/><text x="324" y="218" class="tiny">HTTP</text>

<rect x="695" y="169" width="410" height="302" rx="12" fill="#fff" stroke="#aebdca" stroke-width="2"/>
<text x="718" y="200" class="head">routes/ · API routers</text>
<rect x="718" y="216" width="164" height="68" rx="9" class="router"/><text x="735" y="244" class="node">orders.js</text><text x="735" y="266" class="tiny">/orders · cancellation</text>
<rect x="903" y="216" width="178" height="68" rx="9" class="router"/><text x="920" y="244" class="node">products.js</text><text x="920" y="266" class="tiny">/products · /coupons</text>
<rect x="718" y="304" width="164" height="68" rx="9" class="router"/><text x="735" y="332" class="node">customers.js</text><text x="735" y="354" class="tiny">/customers · settle</text>
<rect x="903" y="304" width="178" height="68" rx="9" class="router"/><text x="920" y="332" class="node">reports.js</text><text x="920" y="354" class="tiny">reports · preview · export</text>
<text x="718" y="420" class="tiny">server.js mounts all four at /api</text>
<path d="M635 233H685V249H715" class="line"/>

<rect x="1150" y="169" width="370" height="116" rx="12" class="config"/>
<text x="1174" y="201" class="node">config.js</text><text x="1174" y="228" class="small">port · shop details · GST slabs</text><text x="1174" y="251" class="small">inventory defaults · coupons</text>
<path d="M635 205H1128V223H1147" class="line"/>
<rect x="1150" y="321" width="370" height="120" rx="12" class="data"/>
<text x="1174" y="354" class="node">data/db.json</text><text x="1174" y="381" class="small">products · customers · orders</text><text x="1174" y="404" class="small">settlements · audit log · IDs</text>
<text x="1174" y="427" class="tiny">read/write through lib/store.js</text>

<rect x="78" y="312" width="550" height="210" rx="12" fill="#edf3f7" stroke="#b9c8d4" stroke-width="1.5"/>
<text x="100" y="343" class="head">lib/ · business logic</text>
<text x="100" y="376" class="small">orders.js · inventory.js · ledger.js · store.js</text>
<text x="100" y="405" class="small">pricing.js · coupons.js · tax.js · dates.js</text>
<text x="100" y="434" class="small">invoice.js · reports.js</text>
<text x="100" y="478" class="tiny">Routers call these modules; store.js persists to data/db.json.</text>
<path d="M785 473V500H630" class="line"/>
<path d="M628 502H1133V381H1147" class="line"/>
<text x="822" y="494" class="tiny">router → lib/store → JSON</text>

<!-- Order flow -->
<text x="48" y="603" class="head">Order placement · POST /api/orders</text>
<text x="48" y="629" class="sub">The browser sends item IDs and quantities; the server resolves product details and calculates the saved order.</text>

<g>
  <rect x="48" y="665" width="220" height="115" rx="12" class="ui"/><circle cx="73" cy="690" r="16" fill="#4b82c3"/><text x="68" y="696" fill="#fff" style="font:700 16px Segoe UI,Arial">1</text><text x="98" y="697" class="step">Cart submitted</text><text x="68" y="729" class="small">Items, customer,</text><text x="68" y="751" class="small">payment, coupon</text>
  <rect x="312" y="665" width="220" height="115" rx="12" class="box"/><circle cx="337" cy="690" r="16" fill="#07835e"/><text x="332" y="696" fill="#fff" style="font:700 16px Segoe UI,Arial">2</text><text x="362" y="697" class="step">Resolve &amp; validate</text><text x="332" y="729" class="small">orders route + inventory</text><text x="332" y="751" class="small">product lookup · stock</text>
  <rect x="576" y="665" width="220" height="115" rx="12" class="box"/><circle cx="601" cy="690" r="16" fill="#07835e"/><text x="596" y="696" fill="#fff" style="font:700 16px Segoe UI,Arial">3</text><text x="626" y="697" class="step">Calculate totals</text><text x="596" y="729" class="small">pricing + coupons + tax</text><text x="596" y="751" class="small">discount · GST · total</text>
  <rect x="840" y="665" width="220" height="115" rx="12" class="box"/><circle cx="865" cy="690" r="16" fill="#07835e"/><text x="860" y="696" fill="#fff" style="font:700 16px Segoe UI,Arial">4</text><text x="890" y="697" class="step">Khata check</text><text x="860" y="729" class="small">ledger checks customer</text><text x="860" y="751" class="small">and credit limit if needed</text>
  <rect x="1104" y="665" width="220" height="115" rx="12" class="box"/><circle cx="1129" cy="690" r="16" fill="#07835e"/><text x="1124" y="696" fill="#fff" style="font:700 16px Segoe UI,Arial">5</text><text x="1154" y="697" class="step">Record order</text><text x="1124" y="729" class="small">orders + inventory</text><text x="1124" y="751" class="small">stock · ID · audit entry</text>
  <rect x="1368" y="665" width="184" height="115" rx="12" class="data"/><circle cx="1393" cy="690" r="16" fill="#bc8d26"/><text x="1388" y="696" fill="#fff" style="font:700 16px Segoe UI,Arial">6</text><text x="1418" y="697" class="step">Persist</text><text x="1388" y="729" class="small">store.js writes</text><text x="1388" y="751" class="small">data/db.json</text>
  <path d="M268 722H309" class="flow"/><path d="M532 722H573" class="flow"/><path d="M796 722H837" class="flow"/><path d="M1060 722H1101" class="flow"/><path d="M1324 722H1365" class="flow"/>
</g>
<rect x="48" y="817" width="1504" height="225" rx="16" class="group"/>
<text x="74" y="855" class="head">Related paths shown in the code</text>
<text x="74" y="891" class="small">GET /orders/:id/invoice → lib/orders.js + lib/invoice.js → printable HTML response</text>
<text x="74" y="924" class="small">GET /api/reports/* → routes/reports.js → lib/reports.js → inventory.js, ledger.js, invoice.js</text>
<text x="74" y="957" class="small">GET /api/customers · POST /api/customers/:id/settle → routes/customers.js → lib/ledger.js → store.js</text>
<text x="74" y="990" class="small">GET /api/products · GET /api/coupons → routes/products.js → inventory.js, tax.js, coupons.js → store.js</text>
<text x="48" y="1080" class="tiny">Source map reflects modules present in this repository.</text>
</svg>

