<text x="272" y="706" class="mono-small" text-anchor="start">POST /api/orders/:id/cancel</text>
<text x="272" y="723" class="body" text-anchor="start">Read the JSON store</text>
<path d="M480 711H489" class="arrow flow" marker-end="url(#flow-head)"/>
<rect x="490" y="658" width="220" height="108" rx="10" fill="#FFFFFF" stroke="#D0DDE6"/>
<text x="503" y="683" class="card-title" text-anchor="start">Update order state</text>
<text x="503" y="706" class="body" text-anchor="start">Guard repeat cancellation</text>
<text x="503" y="723" class="body" text-anchor="start">Set status to cancelled</text>
<path d="M711 711H720" class="arrow flow" marker-end="url(#flow-head)"/>
<rect x="721" y="658" width="220" height="108" rx="10" fill="#FFF2E5" stroke="#E9BC9B"/>
<text x="734" y="683" class="warn-title" text-anchor="start">Inventory release</text>
<text x="734" y="706" class="warn-text" text-anchor="start">Looks up productId</text>
<text x="734" y="723" class="warn-text" text-anchor="start">Order lines carry id</text>
<text x="734" y="740" class="warn-text" text-anchor="start">Physical stock stays unchanged</text>
<text x="734" y="752" class="warn-tag" text-anchor="start">TICKET 2 BUG</text>
<path d="M942 711H951" class="arrow flow" marker-end="url(#flow-head)"/>
