<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1240" viewBox="0 0 1800 1240" role="img" aria-labelledby="title desc">
<title id="title">ShopLedger architecture</title>
<desc id="desc">Architecture map of ShopLedger UI, Express server, route modules, library modules, JSON data file, and order placement flow.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker>
  <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1d4ed8"/></marker>
  <style>
    text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172554}
    .title{font-size:34px;font-weight:700}.subtitle{font-size:15px;fill:#64748b}
    .group{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.head{font-size:19px;font-weight:700;fill:#fff}
    .box{fill:#fff;stroke:#94a3b8;stroke-width:1.5;rx:9}.label{font-size:15px;font-family:Consolas,monospace;font-weight:600}
    .hint{font-size:13px;fill:#475569}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
    .flowEdge{fill:none;stroke:#1d4ed8;stroke-width:3;marker-end:url(#blueArrow)}
    .flowCard{fill:#eff6ff;stroke:#93c5fd;stroke-width:1.5;rx:12}.flowText{font-size:14px;fill:#1e3a8a}.num{fill:#1d4ed8}
    .numText{font-size:14px;font-weight:700;fill:#fff}.flowHead{font-size:21px;font-weight:700}.tag{font-size:12px;font-weight:700;fill:#1d4ed8}
  </style>
</defs>
<rect width="1800" height="1240" fill="#ffffff"/>
<text x="40" y="54" class="title">ShopLedger Architecture</text>
<text x="40" y="82" class="subtitle">Express app structure and the order placement path</text>

<!-- Architecture groups -->
<rect x="35" y="112" width="270" height="380" rx="14" class="group"/><rect x="35" y="112" width="270" height="44" rx="14" fill="#0f4c81"/><rect x="35" y="140" width="270" height="16" fill="#0f4c81"/>
<text x="58" y="141" class="head">UI</text>
<rect x="55" y="178" width="230" height="58" class="box"/><text x="70" y="213" class="label">public/index.html</text>
<rect x="55" y="254" width="230" height="58" class="box"/><text x="70" y="289" class="label">public/js/app.js</text>
<rect x="55" y="330" width="230" height="58" class="box"/><text x="70" y="365" class="label">public/css/style.css</text>
<text x="57" y="433" class="hint">Served as static files by server.js</text>

<rect x="335" y="112" width="225" height="380" rx="14" class="group"/><rect x="335" y="112" width="225" height="44" rx="14" fill="#0f4c81"/><rect x="335" y="140" width="225" height="16" fill="#0f4c81"/>
<text x="358" y="141" class="head">Server</text>
<rect x="355" y="196" width="185" height="64" class="box"/><text x="376" y="234" class="label">server.js</text>
<rect x="355" y="292" width="185" height="64" class="box"/><text x="376" y="330" class="label">config.js</text>
<text x="357" y="407" class="hint">Express setup, JSON parsing,</text><text x="357" y="428" class="hint">static UI, routes, invoice view</text>

<rect x="600" y="112" width="330" height="380" rx="14" class="group"/><rect x="600" y="112" width="330" height="44" rx="14" fill="#0f4c81"/><rect x="600" y="140" width="330" height="16" fill="#0f4c81"/>
<text x="623" y="141" class="head">Routes</text>
<rect x="620" y="174" width="290" height="54" class="box"/><text x="638" y="207" class="label">routes/products.js</text>
<rect x="620" y="244" width="290" height="54" fill="#eff6ff" stroke="#60a5fa" stroke-width="2" rx="9"/><text x="638" y="277" class="label">routes/orders.js</text>
<rect x="620" y="314" width="290" height="54" class="box"/><text x="638" y="347" class="label">routes/customers.js</text>
<rect x="620" y="384" width="290" height="54" class="box"/><text x="638" y="417" class="label">routes/reports.js</text>

<rect x="970" y="112" width="390" height="640" rx="14" class="group"/><rect x="970" y="112" width="390" height="44" rx="14" fill="#0f4c81"/><rect x="970" y="140" width="390" height="16" fill="#0f4c81"/>
<text x="993" y="141" class="head">Library modules</text>
<rect x="990" y="171" width="350" height="46" class="box"/><text x="1008" y="200" class="label">lib/coupons.js</text>
<rect x="990" y="226" width="350" height="46" class="box"/><text x="1008" y="255" class="label">lib/dates.js</text>
<rect x="990" y="281" width="350" height="46" class="box"/><text x="1008" y="310" class="label">lib/inventory.js</text>
<rect x="990" y="336" width="350" height="46" class="box"/><text x="1008" y="365" class="label">lib/invoice.js</text>
<rect x="990" y="391" width="350" height="46" class="box"/><text x="1008" y="420" class="label">lib/ledger.js</text>
<rect x="990" y="446" width="350" height="46" fill="#eff6ff" stroke="#60a5fa" stroke-width="2" rx="9"/><text x="1008" y="475" class="label">lib/orders.js</text>
<rect x="990" y="501" width="350" height="46" fill="#eff6ff" stroke="#60a5fa" stroke-width="2" rx="9"/><text x="1008" y="530" class="label">lib/pricing.js</text>
<rect x="990" y="556" width="350" height="46" class="box"/><text x="1008" y="585" class="label">lib/reports.js</text>
<rect x="990" y="611" width="350" height="46" fill="#eff6ff" stroke="#60a5fa" stroke-width="2" rx="9"/><text x="1008" y="640" class="label">lib/store.js</text>
<rect x="990" y="666" width="350" height="46" class="box"/><text x="1008" y="695" class="label">lib/tax.js</text>

<rect x="1400" y="112" width="365" height="270" rx="14" class="group"/><rect x="1400" y="112" width="365" height="44" rx="14" fill="#0f4c81"/><rect x="1400" y="140" width="365" height="16" fill="#0f4c81"/>
<text x="1423" y="141" class="head">Data</text>
<rect x="1425" y="194" width="315" height="66" class="box"/><text x="1450" y="234" class="label">data/db.json</text>
<text x="1427" y="301" class="hint">Products, orders, customers,</text><text x="1427" y="322" class="hint">settlements and audit entries</text>

<!-- High-level architecture connectors -->
<path d="M305 286 H335" class="edge"/><text x="307" y="273" class="tag">UI files</text>
<path d="M560 230 H600" class="edge"/><text x="561" y="217" class="tag">mounts</text>
<path d="M930 300 H970" class="edge"/><text x="931" y="286" class="tag">uses</text>
<path d="M1360 634 H1380 V227 H1425" class="edge"/><text x="1385" y="415" class="tag" transform="rotate(-90 1385 415)">reads / writes</text>
<path d="M447 260 V292" class="edge"/><text x="456" y="282" class="tag">settings</text>

<!-- Order flow -->
<text x="40" y="808" class="flowHead">Order placement flow</text>
<text x="282" y="808" class="subtitle">POST /api/orders → validation → totals → optional Khata update → stock and order write → response</text>

<!-- Flow connectors behind cards -->
<path d="M245 910 H260" class="flowEdge"/><path d="M460 910 H475" class="flowEdge"/><path d="M675 910 H690" class="flowEdge"/><path d="M890 910 H905" class="flowEdge"/><path d="M1105 910 H1120" class="flowEdge"/><path d="M1320 910 H1335" class="flowEdge"/><path d="M1535 910 H1550" class="flowEdge"/>

<!-- Eight flow cards -->
<g><rect x="40" y="840" width="205" height="180" class="flowCard"/><circle cx="64" cy="866" r="15" class="num"/><text x="60" y="871" class="numText">1</text><text x="86" y="871" class="tag">UI</text><text x="58" y="911" class="flowText"><tspan x="58">Submits</tspan><tspan x="58" dy="23">POST /api/orders</tspan></text></g>
<g><rect x="260" y="840" width="200" height="180" class="flowCard"/><circle cx="284" cy="866" r="15" class="num"/><text x="280" y="871" class="numText">2</text><text x="306" y="871" class="tag">routes/orders.js</text><text x="278" y="911" class="flowText"><tspan x="278">Checks products,</tspan><tspan x="278" dy="23">quantity and stock</tspan></text></g>
<g><rect x="475" y="840" width="200" height="180" class="flowCard"/><circle cx="499" cy="866" r="15" class="num"/><text x="495" y="871" class="numText">3</text><text x="521" y="871" class="tag">lib/pricing.js</text><text x="493" y="911" class="flowText"><tspan x="493">Computes subtotal,</tspan><tspan x="493" dy="23">coupon and tax</tspan></text></g>
<g><rect x="690" y="840" width="200" height="180" class="flowCard"/><circle cx="714" cy="866" r="15" class="num"/><text x="710" y="871" class="numText">4</text><text x="736" y="871" class="tag">lib/ledger.js</text><text x="708" y="911" class="flowText"><tspan x="708">Updates Khata</tspan><tspan x="708" dy="23">for Khata payment</tspan></text></g>
<g><rect x="905" y="840" width="200" height="180" class="flowCard"/><circle cx="929" cy="866" r="15" class="num"/><text x="925" y="871" class="numText">5</text><text x="951" y="871" class="tag">lib/inventory.js</text><text x="923" y="911" class="flowText"><tspan x="923">Reserves stock</tspan><tspan x="923" dy="23">by deducting units</tspan></text></g>
<g><rect x="1120" y="840" width="200" height="180" class="flowCard"/><circle cx="1144" cy="866" r="15" class="num"/><text x="1140" y="871" class="numText">6</text><text x="1166" y="871" class="tag">lib/orders.js</text><text x="1138" y="911" class="flowText"><tspan x="1138">Creates and adds</tspan><tspan x="1138" dy="23">the order</tspan></text></g>
<g><rect x="1335" y="840" width="200" height="180" class="flowCard"/><circle cx="1359" cy="866" r="15" class="num"/><text x="1355" y="871" class="numText">7</text><text x="1381" y="871" class="tag">lib/store.js</text><text x="1353" y="911" class="flowText"><tspan x="1353">Writes</tspan><tspan x="1353" dy="23">data/db.json</tspan></text></g>
<g><rect x="1550" y="840" width="210" height="180" class="flowCard"/><circle cx="1574" cy="866" r="15" class="num"/><text x="1570" y="871" class="numText">8</text><text x="1596" y="871" class="tag">UI</text><text x="1568" y="911" class="flowText"><tspan x="1568">Receives the</tspan><tspan x="1568" dy="23">order response</tspan></text></g>

<text x="40" y="1092" class="subtitle">Other code paths: product and customer routes use library modules; reports route serves dashboard and GST reconciliation; server.js renders invoice pages.</text>
</svg>
