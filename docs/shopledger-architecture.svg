<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="812" viewBox="0 0 1200 812" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">ShopLedger architecture and Ticket 2 inventory flow</title>
<desc id="diagram-description">The browser UI goes through Express routers, business modules, and a JSON store. The checkout path highlights an exact-quantity rejection. The cancellation path highlights an incorrect line-item field and missing physical stock restoration.</desc>
<defs>
  <marker id="normal-head" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto"><path d="M0 0L6 3.5L0 7Z" fill="#305E8C"/></marker>
  <marker id="flow-head" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0 0L4.5 2.5L0 5Z" fill="#146A63"/></marker>
</defs>
<style>
  text {font-family: "Segoe UI", Arial, sans-serif; fill: #14293A}
  .hero {font-size: 34px; font-weight: 700; fill: #FFFFFF}
  .header-tag {font-size: 12px; font-weight: 700; letter-spacing: 1.65px; fill: #A7E4D6}
  .header-note {font-size: 15px; fill: #D2E4EE}
  .section {font-size: 20px; font-weight: 700}
  .card-title, .warn-title {font-size: 15px; font-weight: 700}
  .flow-title {font-size: 16px; font-weight: 700; fill: #146A63}
  .warn-title, .warn-text, .warn-tag {fill: #853B17}
  .body, .warn-text {font-size: 13px}
  .detail, .footer {font-size: 12px; fill: #465E70}
  .mono, .mono-small {font-family: Consolas, "Courier New", monospace; font-size: 13px}
  .mono-small {font-size: 11.5px}
  .warn-tag {font-size: 10px; font-weight: 700; letter-spacing: 1px}
  .arrow {stroke-width: 1.6; fill: none}
  .normal {stroke: #305E8C}
  .flow {stroke: #146A63; stroke-width: 1.3}
</style>
<rect width="1200" height="812" fill="#F3F7FA"/>
<rect x="26" y="22" width="1148" height="81" rx="14" fill="#14293A" stroke="none"/>
<text x="48" y="46" class="header-tag" text-anchor="start">CP2  /  SHOPLEDGER</text>
<text x="48" y="83" class="hero" text-anchor="start">Architecture and inventory flow</text>
<text x="1150" y="65" class="header-note" text-anchor="end">Ticket 2 · Baseline before fix</text>
<text x="28" y="132" class="section" text-anchor="start">Request and data path</text>
