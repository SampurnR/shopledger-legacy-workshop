<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="desc">Existing UI, Express routes, library modules, config, and JSON data file with order placement flow highlighted.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <marker id="flow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Arial,sans-serif;fill:#0f172a}.title{font-size:28px;font-weight:700}.section{font-size:17px;font-weight:700}.box{fill:#fff;stroke:#64748b;stroke-width:2;rx:10}.sub{font-size:14px}.small{font-size:12px;fill:#475569}.flowline{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#flow)}.line{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1280" height="850" fill="#f8fafc"/>
  <text x="40" y="48" class="title">ShopLedger — architecture &amp; order flow</text>
  <text x="40" y="82" class="small">Only modules and routes present in the repository are shown.</text>

  <rect x="40" y="120" width="220" height="170" class="box"/>
  <text x="60" y="150" class="section">UI</text>
  <text x="60" y="180" class="sub">public/index.html</text>
  <text x="60" y="207" class="sub">public/js/app.js</text>
  <text x="60" y="234" class="sub">public/css/style.css</text>

  <rect x="340" y="105" width="470" height="365" class="box"/>
  <text x="360" y="136" class="section">Express server (server.js)</text>
  <rect x="365" y="158" width="420" height="284" fill="#eff6ff" stroke="#93c5fd" rx="8"/>
  <text x="385" y="187" class="section">routes/</text>
  <rect x="385" y="207" width="175" height="60" class="box"/><text x="400" y="243" class="sub">products.js</text>
  <rect x="580" y="207" width="175" height="60" fill="#dbeafe" stroke="#2563eb" stroke-width="2" rx="10"/><text x="595" y="243" class="sub">orders.js</text>
  <rect x="385" y="290" width="175" height="60" class="box"/><text x="400" y="326" class="sub">customers.js</text>
  <rect x="580" y="290" width="175" height="60" class="box"/><text x="595" y="326" class="sub">reports.js</text>
  <text x="385" y="400" class="small">GET /orders/:id/invoice → lib/invoice.render()</text>

  <rect x="880" y="105" width="350" height="510" class="box"/>
  <text x="900" y="136" class="section">lib/ modules</text>
  <rect x="905" y="160" width="300" height="53" fill="#dbeafe" stroke="#2563eb" stroke-width="2" rx="10"/><text x="925" y="192" class="sub">orders.js</text>
  <rect x="905" y="229" width="300" height="53" fill="#dbeafe" stroke="#2563eb" stroke-width="2" rx="10"/><text x="925" y="261" class="sub">inventory.js</text>
  <rect x="905" y="298" width="300" height="53" fill="#dbeafe" stroke="#2563eb" stroke-width="2" rx="10"/><text x="925" y="330" class="sub">pricing.js → tax.js + coupons.js</text>
  <rect x="905" y="367" width="300" height="53" class="box"/><text x="925" y="399" class="sub">ledger.js</text>
  <rect x="905" y="436" width="300" height="53" class="box"/><text x="925" y="468" class="sub">reports.js</text>
  <rect x="905" y="505" width="300" height="53" class="box"/><text x="925" y="537" class="sub">invoice.js</text>
  <rect x="905" y="574" width="300" height="28" fill="#f1f5f9" stroke="#64748b" rx="7"/><text x="925" y="594" class="small">store.js reads and writes database data</text>

  <rect x="340" y="535" width="240" height="95" class="box"/>
  <text x="360" y="570" class="section">config.js</text>
  <text x="360" y="600" class="small">shop, tax slabs, coupons, port</text>
  <rect x="635" y="535" width="190" height="95" class="box"/>
  <text x="655" y="570" class="section">data/db.json</text>
  <text x="655" y="600" class="small">persisted application data</text>

  <path d="M260 205 H340" class="flowline"/><text x="273" y="192" class="small">HTTP</text>
  <path d="M810 240 H905" class="flowline"/>
  <path d="M755 235 C830 235 835 325 905 325" class="flowline"/>
  <path d="M755 237 C830 237 835 255 905 255" class="flowline"/>
  <path d="M755 240 C820 240 850 395 905 395" class="flowline"/>
  <path d="M755 242 C820 242 850 530 905 530" class="line"/>
  <path d="M1055 282 V298" class="flowline"/>
  <path d="M1055 351 V367" class="flowline"/>
  <path d="M1055 420 V505" class="line"/>
  <path d="M1055 558 V574" class="line"/>
  <path d="M580 582 H635" class="line"/>
  <path d="M825 582 H905" class="line"/>
  <path d="M460 535 V470" class="line"/>

  <rect x="40" y="690" width="1190" height="112" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" rx="10"/>
  <text x="65" y="722" class="section">Order placement (POST /api/orders)</text>
  <text x="65" y="755" class="sub">UI → routes/orders.js → inventory check → pricing.computeTotals (coupon + HSN tax) → optional ledger charge → inventory reserve</text>
  <text x="65" y="782" class="sub">→ lib/orders.add → store append audit + write data/db.json → response to UI</text>
  <path d="M450 442 C450 620 425 644 425 690" class="flowline"/>
</svg>
