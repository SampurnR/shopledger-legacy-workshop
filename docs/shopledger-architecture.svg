<text x="816" y="414" class="detail" text-anchor="start">Printable invoices are served by server.js.</text>
<text x="28" y="466" class="section" text-anchor="start">Ticket 2 execution paths</text>
<text x="28" y="491" class="flow-title" text-anchor="start">Place an order</text>
<rect x="28" y="500" width="220" height="108" rx="10" fill="#FFFFFF" stroke="#D0DDE6"/>
<text x="41" y="525" class="card-title" text-anchor="start">POS checkout</text>
<text x="41" y="548" class="mono-small" text-anchor="start">POST /api/orders</text>
<text x="41" y="565" class="body" text-anchor="start">Send the selected cart</text>
<path d="M249 553H258" class="arrow flow" marker-end="url(#flow-head)"/>
<rect x="259" y="500" width="220" height="108" rx="10" fill="#FFFFFF" stroke="#D0DDE6"/>
<text x="272" y="525" class="card-title" text-anchor="start">Order route</text>
<text x="272" y="548" class="body" text-anchor="start">Read the JSON store</text>
<text x="272" y="565" class="body" text-anchor="start">Normalize product IDs</text>
<text x="272" y="582" class="body" text-anchor="start">and quantities</text>
<path d="M480 553H489" class="arrow flow" marker-end="url(#flow-head)"/>
<rect x="490" y="500" width="220" height="108" rx="10" fill="#FFF2E5" stroke="#E9BC9B"/>
