<text x="734" y="582" class="body" text-anchor="start">Add the order</text>
<path d="M942 553H951" class="arrow flow" marker-end="url(#flow-head)"/>
<rect x="952" y="500" width="220" height="108" rx="10" fill="#FFFFFF" stroke="#D0DDE6"/>
<text x="965" y="525" class="card-title" text-anchor="start">Save and respond</text>
<text x="965" y="548" class="body" text-anchor="start">Write order and audit entry</text>
<text x="965" y="565" class="body" text-anchor="start">Return HTTP 201</text>
<text x="28" y="649" class="flow-title" text-anchor="start">Cancel a pending order</text>
