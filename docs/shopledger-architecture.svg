<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1440" viewBox="0 0 1600 1440" role="img" aria-labelledby="title desc">
<title id="title">ShopLedger | Legacy System Architecture</title><desc id="desc">As-is components, verified dependencies, and numbered order placement and subsequent invoice flows.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#47677f"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#193246}.title{font-size:32px;font-weight:700}.sub{font-size:16px;fill:#536d7c}.head{font-size:18px;font-weight:700;fill:#184e64}.name{font-size:16px;font-weight:700}.body{font-size:14px}.small{font-size:13px;fill:#425e6d}.box{fill:#fff;stroke:#cbdce2;stroke-width:1.3}.layer{fill:#f3f8f9;stroke:#d6e5e8}.flow{fill:#fff;stroke:#b8d5dd}.line{fill:none;stroke:#47677f;stroke-width:2;marker-end:url(#a)}.http{stroke:#287999}.data{stroke:#ad7930;stroke-dasharray:6 4}.num{fill:#17647d}.ntext{fill:#fff;font-size:14px;font-weight:700}</style></defs>
<rect width="1600" height="1440" fill="#f8fbfc"/>
<rect x="0" y="0" width="1600" height="94" fill="#102b45"/>
<style>
.title{fill:#f5fbff}.sub{fill:#b9d5e2}
rect.layer[y="105"]{fill:#eaf4ff;stroke:#b6d2ef}
rect.layer[y="282"]{fill:#edf2ff;stroke:#c4ceee}
rect.layer[y="544"]{fill:#edf8f4;stroke:#b9dfd0}
rect.layer[y="814"]{fill:#fff7e9;stroke:#e8d2aa}
rect.layer[y="925"]{fill:#f1f5fb;stroke:#cbd8ea}
rect.box[y="150"]{fill:#ffffff;stroke:#82b7e2;stroke-width:2}
rect.box[y="328"]{fill:#ffffff;stroke:#9daee0;stroke-width:2}
rect.box[y="610"],rect.box[y="696"]{fill:#ffffff;stroke:#9dceb9;stroke-width:1.5}
rect.box[x="700"][y="328"]{fill:#e9efff;stroke:#526dc4;stroke-width:2.5}
rect.box[x="1230"][y="696"]{fill:#fff8eb;stroke:#d6ad65;stroke-width:2}
text.head{fill:#174c73} text.name{fill:#163d5e}
</style>
<text x="50" y="52" class="title">ShopLedger | Legacy System Architecture</text><text x="51" y="79" class="sub">Node.js · Express · browser JavaScript · synchronous JSON-file persistence</text>
<rect x="50" y="105" width="1500" height="145" rx="12" class="layer"/><text x="70" y="134" class="head">01  BROWSER / FRONTEND</text>
<rect x="70" y="150" width="430" height="78" rx="8" class="box"/><text x="88" y="176" class="name">public/index.html + public/css/style.css</text><text x="88" y="199" class="body">POS, order history, Khata and audit views</text>
<rect x="530" y="150" width="575" height="78" rx="8" class="box"/><text x="548" y="176" class="name">public/js/app.js</text><text x="548" y="199" class="body">Cart quantities · preview · submit · history · settlement</text>
<path d="M500 188H525" class="line"/><text x="1130" y="177" class="small">XMLHttpRequest: JSON API</text><text x="1130" y="199" class="small">Invoice link opens HTML</text>
<path d="M800 250V278" class="line http"/>
<rect x="50" y="282" width="1500" height="230" rx="12" class="layer"/><text x="70" y="311" class="head">02  EXPRESS SERVER &amp; ROUTING</text>
<rect x="70" y="328" width="320" height="150" rx="8" class="box"/><text x="88" y="356" class="name">server.js</text><text x="88" y="381" class="body">JSON parser · static public/</text><text x="88" y="403" class="body">Mounts routers at /api</text><text x="88" y="429" class="body">GET /orders/:id/invoice</text><text x="88" y="453" class="small">store.read → orders.get → invoice.render</text>
<text x="70" y="498" class="small">server.js mounts all four routers under /api</text>
<rect x="430" y="328" width="255" height="150" rx="8" class="box"/><text x="447" y="355" class="name">routes/products.js</text><text x="447" y="381" class="body">GET /api/products</text><text x="447" y="404" class="body">GET /api/coupons</text><text x="447" y="448" class="small">Catalog and sellable stock</text>
<rect x="700" y="328" width="255" height="150" rx="8" class="box"/><text x="717" y="355" class="name">routes/orders.js</text><text x="717" y="381" class="body">GET /api/orders[/:id]</text><text x="717" y="404" class="body">POST /api/orders</text><text x="717" y="427" class="body">POST /api/orders/:id/cancel</text><text x="717" y="453" class="small">Order orchestration</text>
<rect x="970" y="328" width="255" height="150" rx="8" class="box"/><text x="987" y="355" class="name">routes/customers.js</text><text x="987" y="381" class="body">GET /api/customers</text><text x="987" y="404" class="body">POST /api/customers/</text><text x="987" y="424" class="body">:id/settle</text><text x="987" y="453" class="small">Accounts and settlements</text>
<rect x="1240" y="328" width="290" height="150" rx="8" class="box"/><text x="1257" y="355" class="name">routes/reports.js</text><text x="1257" y="381" class="body">GET /api/reports/dashboard</text><text x="1257" y="404" class="body">GET /api/reports/gst-reconciliation</text><text x="1257" y="427" class="body">POST /api/pricing/preview</text><text x="1257" y="450" class="body">GET /api/admin/export</text>
<rect x="50" y="526" width="1500" height="98" rx="10" fill="#fff" stroke="#c4ceee"/>
<text x="70" y="550" class="head">DIRECT ROUTE → MODULE USE</text>
<text x="70" y="574" class="small">products → store, inventory, tax, coupons</text>
<text x="480" y="574" class="small">orders → store, inventory, pricing, coupons, orders, ledger</text>
<text x="70" y="600" class="small">customers → store, ledger</text>
<text x="480" y="600" class="small">reports → store, reports, pricing, coupons; reads config</text>
<text x="1090" y="574" class="small">Invoice GET → store, orders, invoice</text>
<text x="1090" y="600" class="small">Names refer to lib/ modules unless noted</text>
<g transform="translate(0 120)">
<rect x="50" y="544" width="1500" height="254" rx="12" class="layer"/><text x="70" y="573" class="head">03  BUSINESS LOGIC &amp; DATA ACCESS</text>
<text x="70" y="596" class="small">Verified direct module dependencies are listed inside each card; arrows indicate direction of use.</text>
<rect x="70" y="610" width="275" height="72" rx="7" class="box"/><text x="84" y="634" class="name">inventory.js</text><text x="84" y="657" class="small">check · reserve · release; uses config</text>
<rect x="360" y="610" width="275" height="72" rx="7" class="box"/><text x="374" y="634" class="name">pricing.js</text><text x="374" y="657" class="small">computeTotals → tax, coupons</text>
<rect x="650" y="610" width="275" height="72" rx="7" class="box"/><text x="664" y="634" class="name">tax.js</text><text x="664" y="657" class="small">getRateForItem → config</text>
<rect x="940" y="610" width="275" height="72" rx="7" class="box"/><text x="954" y="634" class="name">coupons.js</text><text x="954" y="657" class="small">validate · calculateDiscount → config</text>
<rect x="1230" y="610" width="300" height="72" rx="7" class="box"/><text x="1244" y="634" class="name">orders.js</text><text x="1244" y="657" class="small">add · list · cancel → dates, inventory, ledger</text>
<rect x="70" y="696" width="275" height="72" rx="7" class="box"/><text x="84" y="720" class="name">ledger.js</text><text x="84" y="743" class="small">Khata · settlement → dates</text>
<rect x="360" y="696" width="275" height="72" rx="7" class="box"/><text x="374" y="720" class="name">invoice.js</text><text x="374" y="743" class="small">render · computeInvoiceFigures → config</text>
<rect x="650" y="696" width="275" height="72" rx="7" class="box"/><text x="664" y="720" class="name">reports.js</text><text x="664" y="743" class="small">→ inventory, ledger, invoice</text>
<rect x="940" y="696" width="275" height="72" rx="7" class="box"/><text x="954" y="720" class="name">dates.js</text><text x="954" y="743" class="small">today · normalizeDateKey</text>
<rect x="1230" y="696" width="300" height="72" rx="7" class="box"/><text x="1244" y="720" class="name">store.js</text><text x="1244" y="743" class="small">read / write → data/db.json; appendAudit</text>
<rect x="50" y="814" width="1500" height="95" rx="12" class="layer"/><text x="70" y="840" class="head">04  CONFIGURATION &amp; PERSISTENCE</text>
<rect x="70" y="850" width="680" height="43" rx="6" fill="#fff" stroke="#d6ad65"/><text x="84" y="868" class="name">config.js</text><text x="84" y="885" class="small">Read by server, reports route, inventory, tax, coupons and invoice</text>
<rect x="770" y="850" width="760" height="43" rx="6" fill="#fff" stroke="#d6ad65"/><text x="784" y="868" class="name">data/db.json</text><text x="784" y="885" class="small">lib/store.js reads and writes products, customers, orders, settlements, audit and IDs</text>
<rect x="50" y="925" width="1500" height="275" rx="12" class="layer"/><text x="70" y="955" class="head">05  ORDER PLACEMENT  /  numbered execution sequence</text>
<text x="70" y="981" class="small">POST /api/orders: the route orchestrates these calls on an in-memory database object.</text>
<g class="body"><text x="88" y="1014">① Browser submits cart, customer, payment, status and coupon</text><text x="88" y="1042">② orders route: store.read; inventory.find resolves product and price</text><text x="88" y="1070">③ inventory.check validates each line against sellable stock</text><text x="88" y="1098">④ coupons.validate; pricing.computeTotals → coupons + tax</text><text x="88" y="1126">⑤ If Khata: ledger.chargeOrderToKhata checks and debits credit</text><text x="835" y="1014">⑥ inventory.reserve deducts physical stock</text><text x="835" y="1042">⑦ orders.add; store.appendAudit; store.write persists JSON</text><text x="835" y="1070">⑧ HTTP 201 returns order to browser</text><text x="835" y="1104">⑨ Later, invoice link: GET /orders/:id/invoice</text><text x="855" y="1128">server → store.read → orders.get → invoice.render → HTML</text></g>
<text x="70" y="1180" class="small">Steps ①–⑧ are order creation; ⑨ is a separate subsequent request. Pending orders also follow this placement path.</text>
<rect x="50" y="1215" width="1120" height="63" rx="8" fill="#fff8e9" stroke="#ead5ad"/><text x="68" y="1241" class="name">Engineering note · observed current design</text><text x="68" y="1263" class="body">invoice.computeInvoiceFigures recomputes tax and discounts independently from pricing.computeTotals; totals can differ.</text>
<text x="1200" y="1235" class="small">Legend</text><path d="M1200 1250h35" class="line http"/><text x="1242" y="1255" class="small">HTTP</text><path d="M1304 1250h35" class="line"/><text x="1346" y="1255" class="small">internal / use</text><path d="M1450 1250h35" class="line data"/><text x="1492" y="1255" class="small">data</text>
<text x="50" y="1304" class="small">As-is architecture | Verified from repository | CP2</text>
</g>
</svg>
