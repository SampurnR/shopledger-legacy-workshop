<text x="503" y="565" class="warn-text" text-anchor="start">Rejects exact quantity</text>
<text x="503" y="594" class="warn-tag" text-anchor="start">TICKET 2 BUG</text>
<path d="M711 553H720" class="arrow flow" marker-end="url(#flow-head)"/>
