<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc">
<title id="title">ShopLedger architecture at the Ticket 1 baseline</title>
<desc id="desc">Browser and server entry points, API route dependencies, library dependencies, and the checkout, invoice and reconciliation call paths before the fix.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="#087e83"/></marker></defs>
<style>
text{font-family:Segoe UI,Arial,sans-serif;fill:#102638}.title{font-size:38px;font-weight:700}.sub{font-size:18px;fill:#415d70}.section{font-size:17px;font-weight:700;fill:#08777b}.heading{font-size:19px;font-weight:700}.body{font-size:16px;fill:#385468}.flow{font-size:17px;font-weight:600}.card{fill:white;stroke:#c8d9e3}.line{stroke:#087e83;stroke-width:2;marker-end:url(#arrow)}
</style><rect width="1440" height="1040" fill="#f1f6f8"/>
<text x="40" y="60" class="title">ShopLedger architecture</text>
<text x="40" y="92" class="sub">Ticket 1 baseline  /  Express, browser JavaScript and a JSON file</text>
<rect x="40" y="117" width="618" height="90" rx="10" class="card"/>
<text x="56" y="146" class="heading">Browser  /  public/index.html + public/js/app.js</text>
