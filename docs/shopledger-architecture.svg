<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title description">
  <title id="title">ShopLedger 0.8.4 architecture</title>
  <desc id="description">A browser exchanges HTTP requests and responses with the Express server. The server serves static files, mounts four API routers, and renders printable invoices. Route handlers call business functions and the JSON store. Order placement validates stock, computes GST, charges Khata when selected, deducts stock, and writes the updated database before replying.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#415b76"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #14283d; }
      .title { font-size: 36px; font-weight: 730; letter-spacing: -.8px; }
      .subtitle { font-size: 15px; fill: #486079; }
      .layer { font-size: 15px; font-weight: 750; letter-spacing: 1px; }
      .file { font-family: Consolas, "Liberation Mono", monospace; font-size: 15px; font-weight: 700; }
      .label { font-size: 14px; }
      .flow { font-size: 13px; font-weight: 600; fill: #415b76; }
      .panel { stroke-width: 1.2; }
      .card { fill: #fff; stroke: #c1ccd9; stroke-width: 1; }
      .arrow { fill: none; stroke: #415b76; stroke-width: 1.7; marker-end: url(#arrow); }
      .both { marker-start: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="1040" fill="#f8fafc"/>
  <text x="40" y="48" class="title">ShopLedger 0.8.4 architecture</text>
  <text x="42" y="77" class="subtitle">GeeksforGeeks × OpenAI · Build with Codex · Checkpoint 2</text>

  <rect x="40" y="98" width="1120" height="110" rx="12" fill="#eaf4ff" stroke="#a7c6e7" class="panel"/>
  <text x="60" y="126" class="layer">PRESENTATION · BROWSER</text>
  <text x="60" y="153" class="file">public/index.html    public/css/style.css    public/js/app.js</text>
  <text x="60" y="181" class="label">POS interface  ·  Order register  ·  Khata desk  ·  Dashboard and audit</text>

  <path d="M390 209 V259" class="arrow"/>
  <text x="375" y="239" text-anchor="end" class="flow">HTTP request</text>
  <path d="M800 259 V209" class="arrow"/>
  <text x="815" y="239" class="flow">Static assets, API JSON or invoice HTML</text>

  <rect x="40" y="260" width="1120" height="126" rx="12" fill="#e9f6f3" stroke="#a0cfc3" class="panel"/>
  <text x="60" y="288" class="layer">APPLICATION · NODE.JS / EXPRESS.JS</text>
  <text x="60" y="317" class="file">server.js</text>
  <text x="60" y="342" class="label">bodyParser.json() parses JSON · express.static() serves public/ · Express mounts four routers under /api</text>
  <text x="60" y="365" class="label">GET /orders/:id/invoice reads the stored order and calls invoice.render() directly</text>

  <path d="M290 387 V428" class="arrow both"/>
  <text x="305" y="413" class="flow">/api dispatch and JSON response</text>

  <rect x="40" y="429" width="1120" height="112" rx="12" fill="#f0edff" stroke="#c2b5ea" class="panel"/>
  <text x="60" y="457" class="layer">REST API · EXPRESS ROUTERS</text>
  <g>
    <rect x="60" y="473" width="256" height="52" rx="7" class="card"/>
    <text x="73" y="494" class="file">routes/products.js</text>
    <text x="73" y="514" class="label">Catalog · active coupons</text>
    <rect x="334" y="473" width="256" height="52" rx="7" class="card"/>
    <text x="347" y="494" class="file">routes/orders.js</text>
    <text x="347" y="514" class="label">List · detail · place · cancel</text>
    <rect x="608" y="473" width="256" height="52" rx="7" class="card"/>
    <text x="621" y="494" class="file">routes/customers.js</text>
    <text x="621" y="514" class="label">Customer balances · settlements</text>
    <rect x="882" y="473" width="258" height="52" rx="7" class="card"/>
    <text x="895" y="494" class="file">routes/reports.js</text>
    <text x="895" y="514" class="label">Dashboard · GST · preview · export</text>
  </g>

  <path d="M290 542 V597" class="arrow both"/>
  <text x="305" y="573" class="flow">Business calls and results</text>
  <path d="M1047 542 V597" class="arrow both"/>
  <text x="1032" y="573" text-anchor="end" class="flow">Store reads and writes</text>

  <rect x="40" y="598" width="880" height="273" rx="12" fill="#edf4fb" stroke="#acc1d9" class="panel"/>
  <text x="60" y="626" class="layer">BUSINESS LOGIC · LIB/</text>
  <g>
    <rect x="60" y="639" width="266" height="57" rx="7" class="card"/>
    <text x="72" y="662" class="file">lib/orders.js</text>
    <text x="72" y="682" class="label">Add, look up, filter and cancel</text>
    <rect x="60" y="706" width="266" height="57" rx="7" class="card"/>
    <text x="72" y="729" class="file">lib/inventory.js</text>
    <text x="72" y="749" class="label">Sellable stock, check, deduct, release</text>
    <rect x="60" y="773" width="266" height="57" rx="7" class="card"/>
    <text x="72" y="796" class="file">lib/ledger.js</text>
    <text x="72" y="816" class="label">Credit checks, charges, settlements</text>

    <rect x="346" y="639" width="266" height="57" rx="7" class="card"/>
    <text x="358" y="662" class="file">lib/pricing.js</text>
    <text x="358" y="682" class="label">Subtotal, discount, GST and total</text>
    <rect x="346" y="706" width="266" height="57" rx="7" class="card"/>
    <text x="358" y="729" class="file">lib/tax.js</text>
    <text x="358" y="749" class="label">HSN rates, CGST and SGST split</text>
    <rect x="346" y="773" width="266" height="57" rx="7" class="card"/>
    <text x="358" y="796" class="file">lib/coupons.js</text>
    <text x="358" y="816" class="label">Normalize, validate and discount</text>

    <rect x="632" y="639" width="268" height="57" rx="7" class="card"/>
    <text x="644" y="662" class="file">lib/invoice.js</text>
    <text x="644" y="682" class="label">Recompute totals and render HTML</text>
    <rect x="632" y="706" width="268" height="57" rx="7" class="card"/>
    <text x="644" y="729" class="file">lib/reports.js</text>
    <text x="644" y="749" class="label">Dashboard and GST reconciliation</text>
    <rect x="632" y="773" width="268" height="57" rx="7" class="card"/>
    <text x="644" y="796" class="file">lib/dates.js</text>
    <text x="644" y="816" class="label">Local dates and filter keys</text>
  </g>
  <text x="60" y="853" class="flow">Pricing uses tax and coupons · Reports use inventory, ledger and invoice</text>

  <rect x="936" y="598" width="224" height="273" rx="12" fill="#fff5e5" stroke="#d9be90" class="panel"/>
  <text x="949" y="626" class="layer" style="font-size:12px">CONFIGURATION &amp; PERSISTENCE</text>
  <text x="950" y="651" class="file">lib/store.js</text>
  <text x="950" y="672" class="label">Read, write and append audit</text>
  <path d="M950 687 H1146" stroke="#d9be90"/>
  <path d="M958 701 V731" class="arrow both"/>
  <text x="973" y="721" class="flow">Synchronous file I/O</text>
  <text x="950" y="752" class="file">data/db.json</text>
  <text x="950" y="773" class="label">Products, customers, orders,</text>
  <text x="950" y="793" class="label">settlements, audit, ID counters</text>
  <path d="M950 804 H1146" stroke="#d9be90"/>
  <text x="950" y="827" class="file">config.js</text>
  <text x="950" y="848" class="label">Port, shop, GST, stock, coupons</text>

  <path d="M914 387 H1180 V589 H773 V639" class="arrow" stroke-dasharray="5 4"/>
  <text x="900" y="581" text-anchor="end" class="flow">Invoice handler</text>

  <rect x="40" y="898" width="1120" height="112" rx="12" fill="#edf2f7" stroke="#bdcad8" class="panel"/>
  <text x="60" y="927" class="layer">ORDER PLACEMENT · SUCCESS PATH</text>
  <text x="60" y="955" class="label">Browser POST /api/orders  →  Read JSON and resolve catalog lines  →  Check stock  →  Validate coupon and compute GST</text>
  <text x="60" y="982" class="label">→  Charge Khata if selected  →  Deduct stock  →  Add order and audit entry  →  Write JSON  →  Return 201 and order JSON</text>
</svg>
